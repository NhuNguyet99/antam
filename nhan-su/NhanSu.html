<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhân sự An Tâm</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f8fafb; --text:#1d2733; --muted:#5f6b7a; --line:#dde3ea;
  --brand:#b4261e; --brand2:#8f1d17; --brand-soft:#fbeceb;
  --ok:#1f7a45; --ok-soft:#e5f4ea; --warn:#9a5b00; --warn-soft:#fdf2dc; --bad:#b42318; --bad-soft:#fde8e6;
  --info:#1f5fa8; --info-soft:#e6effa; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161b; --panel:#1b2129; --panel2:#212833; --text:#e6ebf1; --muted:#9aa6b4; --line:#2e3742;
    --brand:#e0574d; --brand2:#f07a70; --brand-soft:#3a1f1d;
    --ok:#5cc489; --ok-soft:#183325; --warn:#e9b04f; --warn-soft:#3a2d14; --bad:#f07067; --bad-soft:#3d1c1a;
    --info:#73a7e8; --info-soft:#18283c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#1b2129; --panel2:#212833; --text:#e6ebf1; --muted:#9aa6b4; --line:#2e3742;
  --brand:#e0574d; --brand2:#f07a70; --brand-soft:#3a1f1d;
  --ok:#5cc489; --ok-soft:#183325; --warn:#e9b04f; --warn-soft:#3a2d14; --bad:#f07067; --bad-soft:#3d1c1a;
  --info:#73a7e8; --info-soft:#18283c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;}
a{color:var(--info)}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25}
h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand b{display:block;color:var(--brand);font-size:16px;letter-spacing:.2px}
.brand small{color:var(--muted)}
.nav{padding:8px 0 24px}
.nav .grp{padding:14px 16px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 16px;color:var(--text);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--brand-soft);border-left-color:var(--brand);color:var(--brand);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.main{flex:1;min-width:0;padding:20px 24px 60px}
.topbar{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.toolbar .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card > h3:first-child{margin-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:default}
.kpi[data-go]{cursor:pointer}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--info-soft);border-color:var(--info)}
.toolbar input,.toolbar select{width:auto;min-width:150px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:3px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.form .full{grid-column:1/-1}
.form .two{grid-column:span 2}
table{border-collapse:collapse;width:100%}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;white-space:nowrap}
tr:hover td{background:var(--panel2)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--panel2)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:1px 7px;border-radius:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.req{font-weight:700}
.chip .x{cursor:pointer;margin-left:4px;opacity:.6}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:700}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line);min-width:60px}
.bar > i{display:block;height:100%;background:var(--brand)}
.bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)}
.hbars .row{display:grid;grid-template-columns:180px 1fr 90px;gap:10px;align-items:center;margin:6px 0}
.hbars .row .bar{height:14px}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:12px;border:1px solid transparent}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-weight:600}
.tabs a.on{border-bottom-color:var(--brand);color:var(--brand)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow:auto;padding-bottom:8px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.col h4{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;margin:2px 4px 8px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kc:hover{border-color:var(--brand)}
.kc .nm{font-weight:600}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal{background:var(--panel);border-radius:12px;width:min(980px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.sm{width:min(560px,100%)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;flex:1}
.modal .body{padding:16px 18px;max-height:calc(100vh - 190px);overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:420px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel2)}
.drop.over{border-color:var(--brand);color:var(--brand)}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;padding:5px 6px;border-radius:6px;font-weight:600}
.tree summary:hover{background:var(--panel2)}
.tree .lv2{margin-left:18px}
.tree .file{display:flex;gap:8px;align-items:center;margin-left:36px;padding:4px 6px;border-bottom:1px dashed var(--line)}
.score{font-weight:800;font-size:18px}
.score.hi{color:var(--ok)} .score.mid{color:var(--warn)} .score.lo{color:var(--bad)}
.stars{display:flex;gap:4px}
.stars label{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.stars input{display:none}
.stars input:checked + span{color:#fff}
.stars label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.grid-edit input{padding:3px 5px;min-width:64px;text-align:right;border-radius:5px}
.sticky-l{position:sticky;left:0;background:var(--panel);z-index:2;min-width:190px}
th.sticky-l{z-index:3;background:var(--panel2)}
.print-only{display:none}
.doc{background:#fff;color:#000;padding:28px 34px;border:1px solid var(--line);border-radius:6px;font-family:"Times New Roman",serif;font-size:14px}
.doc table td,.doc table th{border:1px solid #444;color:#000;background:#fff;padding:5px 7px}
.doc th{position:static;color:#000;font-size:13px}
.doc h2,.doc h3{text-align:center}
.doc .hdr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-top:30px;min-height:110px}
.rep h3{border-bottom:2px solid var(--brand);padding-bottom:4px;margin-top:22px;color:var(--brand)}
.rep table td,.rep table th{border:1px solid var(--line)}
@media (max-width:900px){
  .app{display:block}
  .side{position:fixed;left:-260px;top:0;z-index:60;transition:left .2s;height:100vh;box-shadow:0 0 30px rgba(0,0,0,.2)}
  .side.open{left:0}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .main{padding:14px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .form .two{grid-column:auto}
  .hbars .row{grid-template-columns:110px 1fr 70px}
  .toolbar input,.toolbar select{min-width:0;flex:1 1 140px}
}
@media print{
  body{background:#fff;color:#000}
  .side,.topbar,.toolbar,.no-print,.modal footer,.modal header,.nav{display:none !important}
  .main{padding:0}
  .card{border:none;box-shadow:none;padding:0}
  .modal-bg{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;border:none;width:100%}
  .modal .body{max-height:none;overflow:visible;padding:0}
  .print-only{display:block}
  body.printing-modal .app{display:none}
  .doc{border:none;padding:0}
  .tw{overflow:visible;border:none}
  th{position:static}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div class="topbar"><button class="btn" onclick="UI.toggleNav()">☰</button><b style="color:var(--brand)">Nhân sự An Tâm</b></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>NHÂN SỰ AN TÂM</b><small>Quản lý tuyển dụng &amp; nhân sự</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"><div class="empty">Đang tải dữ liệu…</div></main>
</div>
<div id="modals"></div>
<script>
'use strict';
/* =====================================================================
 *  NHÂN SỰ AN TÂM – web quản lý tuyển dụng & nhân sự
 *  Chạy trên Google Apps Script (dữ liệu ở Google Sheet, CV ở Google Drive)
 *  hoặc mở trực tiếp file HTML (dữ liệu lưu trong trình duyệt).
 * ===================================================================== */

/* ---------- Tiện ích ---------- */
const U = {
  esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  num(v){ if (v == null || v === '') return 0; if (typeof v === 'number') return isFinite(v) ? v : 0; const n = Number(String(v).replace(/[^\d,.\-]/g, '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; },
  money(v){ const n = Math.round(Number(v) || 0); return n.toLocaleString('vi-VN'); },
  mil(v){ return (Math.round((Number(v) || 0) / 100000) / 10).toLocaleString('vi-VN') + ' tr'; },
  pct(v, d = 0){ return (Number(v) || 0).toFixed(d) + '%'; },
  today(){ const d = new Date(); return U.iso(d); },
  iso(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  pd(s){ if (!s) return null; if (s instanceof Date) return s; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; },
  fd(s){ const d = U.pd(s); return d ? String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() : ''; },
  addDays(s, n){ const d = U.pd(s); if (!d) return ''; d.setDate(d.getDate() + n); return U.iso(d); },
  addMonths(s, n){ const d = U.pd(s); if (!d) return ''; const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return U.iso(d); },
  /** Cộng n ngày làm việc (bỏ Chủ nhật), tính cả ngày bắt đầu */
  addWorkDays(s, n){ const d = U.pd(s); if (!d) return ''; let c = 0; while (true){ if (d.getDay() !== 0){ c++; if (c >= n) break; } d.setDate(d.getDate() + 1); } return U.iso(d); },
  diff(a, b){ const x = U.pd(a), y = U.pd(b); if (!x || !y) return null; return Math.round((y - x) / 86400000); },
  age(dob, at){ const d = U.pd(dob), t = U.pd(at || U.today()); if (!d) return null; let a = t.getFullYear() - d.getFullYear(); if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--; return a; },
  ym(s){ return (s || '').slice(0, 7); },
  ymLabel(ym){ return ym ? 'Tháng ' + (+ym.slice(5, 7)) + '/' + ym.slice(0, 4) : ''; },
  /** Chuẩn hoá chuỗi để so khớp: bỏ dấu, chữ thường, gộp khoảng trắng */
  norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase().replace(/[^a-z0-9+#&/.\- ]+/g, ' ').replace(/\s+/g, ' ').trim(); },
  /** Đọc ngày dạng dd/mm/yyyy, yyyy-mm-dd, Date hoặc số serial Excel */
  parseAnyDate(v){
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return U.iso(v);
    if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return U.iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
    const s = String(v).trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/.exec(s); if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    return '';
  },
  sum(arr, f){ return arr.reduce((a, x) => a + (Number(f ? f(x) : x) || 0), 0); },
  groupBy(arr, f){ const m = new Map(); arr.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; },
  by(f, desc){ return (a, b) => { const x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * (desc ? -1 : 1); }; },
  dl(name, content, mime){ const b = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  readAsArrayBuffer(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(f); }); },
  readAsText(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); }); },
  readAsBase64(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); }); },
  val(root, sel){ const e = root.querySelector(sel); return e ? e.value.trim() : ''; },
  /** Lấy dữ liệu từ các ô có thuộc tính name trong 1 vùng */
  formData(root){ const o = {}; root.querySelectorAll('[name]').forEach(e => { if (e.type === 'checkbox') o[e.name] = e.checked; else if (e.type === 'radio'){ if (e.checked) o[e.name] = e.value; } else o[e.name] = e.value.trim(); }); return o; },
  opts(list, cur, empty){ return (empty != null ? '<option value="">' + U.esc(empty) + '</option>' : '') + list.map(x => { const v = typeof x === 'object' ? x.v : x, t = typeof x === 'object' ? x.t : x; return '<option value="' + U.esc(v) + '"' + (String(v) === String(cur == null ? '' : cur) ? ' selected' : '') + '>' + U.esc(t) + '</option>'; }).join(''); },
  nextCode(list, prefix, width){ let max = 0; list.forEach(x => { const m = new RegExp('^' + prefix + '(\\d+)$').exec(x.code || ''); if (m) max = Math.max(max, +m[1]); }); return prefix + String(max + 1).padStart(width || 4, '0'); }
};

/* ---------- Danh mục cố định ---------- */
const STAGES = [
  { v: 'moi', t: 'Mới nhận CV', c: '' },
  { v: 'sang_loc', t: 'Đạt sàng lọc', c: 'info' },
  { v: 'hen_pv', t: 'Hẹn phỏng vấn', c: 'info' },
  { v: 'da_pv', t: 'Đã PV – chờ KQ', c: 'warn' },
  { v: 'dat_pv', t: 'Đạt PV – mời nhận việc', c: 'warn' },
  { v: 'nhan_viec', t: 'Nhận việc – thử việc', c: 'brand' },
  { v: 'dat_tv', t: 'Đạt thử việc', c: 'ok' }
];
const STAGES_OUT = [
  { v: 'loai', t: 'Loại hồ sơ', c: 'bad' },
  { v: 'khong_dat_pv', t: 'Không đạt PV', c: 'bad' },
  { v: 'tu_choi', t: 'UV từ chối / không đến', c: 'bad' },
  { v: 'khong_dat_tv', t: 'Không đạt thử việc', c: 'bad' },
  { v: 'nghi_tv', t: 'Nghỉ trong thử việc', c: 'bad' }

    let raw = {};
    if (IS_GAS) raw = JSON.parse(await gs('getAll'));
    else { try { raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { raw = {}; } }
    COLLECTIONS.forEach(c => this.data[c] = Array.isArray(raw[c]) ? raw[c] : []);
    this.data.payrolls.forEach(d => Pay.attach(d));
    await this.seed();
  },
  all(c){ return this.data[c] || (this.data[c] = []); },
  get(c, id){ return this.all(c).find(x => x.id === id); },
  _local(){ try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) { UI.toast('Bộ nhớ trình duyệt đầy – hãy sao lưu và dùng bản Google Apps Script'); } },
  _put(c, doc){ const a = this.all(c), i = a.findIndex(x => x.id === doc.id); if (i >= 0) a[i] = doc; else a.push(doc); if (c === 'payrolls' && typeof Pay !== 'undefined') Pay.attach(doc); },
  /** Lưu 1 bản ghi (cập nhật giao diện ngay, ghi xuống Sheet ở nền) */
  /** Bảng lương đã khoá: không cho sửa / xoá (máy chủ Apps Script cũng chặn) */
  lockedPayroll(c, id){ if (c !== 'payrolls') return false; const d = this.get(c, id); return !!(d && d.locked); },
  async save(c, doc, opt){
    if (!(opt && opt.force) && doc.id && this.lockedPayroll(c, doc.id)) throw new Error('Bảng lương ' + doc.id + ' đã khoá – không thể sửa');
    if (!doc.id) doc.id = U.id();
    doc.updatedAt = new Date().toISOString();
    this._put(c, doc);
    if (!IS_GAS){ this._local(); return doc; }
    const body = Object.assign({}, doc); delete body.id;
    this.pending++;
    try { await gs('setDoc', c, doc.id, JSON.stringify(body)); }
    catch (e) { UI.toast('Lỗi lưu lên Google Sheet: ' + (e.message || e)); throw e; }
    finally { this.pending--; }
    return doc;
  },
  async saveMany(list){
    const lk = list.find(([c, d]) => d.id && this.lockedPayroll(c, d.id));
    if (lk) throw new Error('Bảng lương ' + lk[1].id + ' đã khoá – không thể ghi đè');
    const now = new Date().toISOString();
    list.forEach(([c, d]) => { if (!d.id) d.id = U.id(); d.updatedAt = now; this._put(c, d); });
    if (!IS_GAS){ this._local(); return; }
    for (let i = 0; i < list.length; i += 200){
      const chunk = list.slice(i, i + 200).map(([c, d]) => { const b = Object.assign({}, d); delete b.id; return [c, d.id, JSON.stringify(b)]; });
      this.pending++;
      try { await gs('setDocs', JSON.stringify(chunk)); } finally { this.pending--; }
    }
  },
  async remove(c, id){
    if (this.lockedPayroll(c, id)) throw new Error('Bảng lương ' + id + ' đã khoá – không thể xoá');
    this.data[c] = this.all(c).filter(x => x.id !== id);
    if (!IS_GAS){ this._local(); return; }
    await gs('deleteDoc', c, id);
  },
  settings(){ return this.get('settings', 'main') || DEFAULT_SETTINGS; },
  async seed(){
    const list = [];
    if (!this.get('settings', 'main')) list.push(['settings', JSON.parse(JSON.stringify(DEFAULT_SETTINGS))]);
    if (!this.all('requisitions').length && !this.get('settings', 'seeded_reqs')){
      let n = 0;
      SEED_JD.forEach(j => list.push(['requisitions', {
        id: U.id(), code: 'YCTD-' + String(++n).padStart(3, '0'), dept: j.dept, position: j.position, qty: 1,
        reason: 'Bổ sung nhân sự', requester: 'Phòng HCNS', requestDate: '2026-10-05', needBy: '', status: 'cho_duyet',
        salary: j.salary, workTime: j.time, probLevel: j.prob, edu: j.edu, minYears: j.minYears,
        jd: jdText(j), must: j.must, nice: j.nice, note: (j.note ? j.note + ' ' : '') + 'Tạo tự động từ poster tuyển dụng – xác nhận số lượng rồi chuyển "Đang tuyển".'
      }]));
      list.push(['settings', { id: 'seeded_reqs', at: U.today() }]);
    }
    if (!this.all('legal_tasks').length && !this.get('settings', 'seeded_legal')){
      SEED_LEGAL.forEach(t => list.push(['legal_tasks', Object.assign({ id: U.id(), done: {} }, t)]));
      list.push(['settings', { id: 'seeded_legal', at: U.today() }]);
    }
    if (list.length) await this.saveMany(list);
  }
};

/* ---------- Lưu file CV: Google Drive (Apps Script) hoặc IndexedDB (trình duyệt) ---------- */
const Files = {
  _db: null,
  idb(){
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => { const r = indexedDB.open('antam_nhansu_files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this._db;
  },
  async upload(file, meta){
    const rec = { id: U.id(), name: file.name, size: file.size, mime: file.type || 'application/octet-stream', dept: meta.dept || 'Chưa phân loại', position: meta.position || 'Chưa phân loại', candidateId: meta.candidateId || '', uploadedAt: new Date().toISOString() };
    if (IS_GAS){
      if (file.size > 20 * 1024 * 1024) throw new Error('File lớn hơn 20MB');
      const b64 = await U.readAsBase64(file);
      const r = JSON.parse(await gs('uploadFile', b64, (meta.prefix ? meta.prefix + ' - ' : '') + file.name, rec.mime, rec.dept, rec.position));
      rec.driveId = r.id; rec.url = r.url;
    } else {
      const db = await this.idb();
      await new Promise((res, rej) => { const tx = db.transaction('f', 'readwrite'); tx.objectStore('f').put(file, rec.id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      rec.local = true;
    }
    await DB.save('cv_files', rec);
    return rec;
  },
  async open(rec){
    if (!rec) return;
    if (rec.url){ window.open(rec.url, '_blank'); return; }
    const db = await this.idb();
    const blob = await new Promise((res, rej) => { const r = db.transaction('f').objectStore('f').get(rec.id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (!blob){ UI.toast('Không tìm thấy file trong trình duyệt này'); return; }
    window.open(URL.createObjectURL(blob), '_blank');
  },
  async move(rec, dept, position){
    rec.dept = dept; rec.position = position;
    if (IS_GAS && rec.driveId){ try { await gs('moveFile', rec.driveId, dept, position); } catch (e) { UI.toast('Không chuyển được thư mục Drive: ' + e.message); } }
    await DB.save('cv_files', rec);
  }
};

/* ---------- Đọc nội dung CV / MTCV (PDF, Word, TXT) ---------- */
const TextX = {
  async fromFile(file){
    const n = file.name.toLowerCase();
    try {
      if (n.endsWith('.pdf') && window.pdfjsLib){
        if (!pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await U.readAsArrayBuffer(file)) }).promise;
        let out = '';
        for (let p = 1; p <= Math.min(pdf.numPages, 15); p++){
          const page = await pdf.getPage(p), tc = await page.getTextContent();
          let lastY = null;
          tc.items.forEach(it => { const y = it.transform ? Math.round(it.transform[5]) : null; out += (lastY !== null && y !== lastY ? '\n' : (out && !out.endsWith(' ') ? ' ' : '')) + it.str; lastY = y; });
          out += '\n';
        }
        return out;
      }
      if (n.endsWith('.docx') && window.mammoth){ const r = await mammoth.extractRawText({ arrayBuffer: await U.readAsArrayBuffer(file) }); return r.value || ''; }
      if (/\.(txt|md|csv)$/.test(n)) return await U.readAsText(file);
    } catch (e) { console.warn('Không đọc được', file.name, e); }
    return '';
  }
};

/* ---------- Giao diện chung ---------- */
const UI = {
  toast(msg, ms){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3200); },
  toggleNav(){ document.getElementById('side').classList.toggle('open'); },
  tag(o){ return '<span class="tag ' + (o.c || '') + '">' + U.esc(o.t) + '</span>'; },
  /** Mở hộp thoại; trả về phần tử .modal-bg */
  modal(title, body, buttons, opt){
    opt = opt || {};
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = '<div class="modal ' + (opt.size || '') + '"><header><h3>' + U.esc(title) + '</h3>' + (opt.print ? '<button class="btn sm" data-print>In</button>' : '') + '<button class="btn sm ghost" data-close>✕</button></header><div class="body">' + body + '</div>' + (buttons && buttons.length ? '<footer></footer>' : '') + '</div>';
    const close = () => { wrap.remove(); document.body.classList.remove('printing-modal'); if (opt.onClose) opt.onClose(); };
    wrap.querySelector('[data-close]').onclick = close;
    if (opt.print) wrap.querySelector('[data-print]').onclick = () => UI.printModal();
    wrap.addEventListener('mousedown', e => { if (e.target === wrap && !opt.sticky) close(); });
    (buttons || []).forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || ''); el.textContent = b.t;
      el.onclick = async () => { if (b.fn){ el.disabled = true; try { const r = await b.fn(wrap); if (r !== false) close(); } catch (e) { UI.toast(e.message || String(e)); } finally { el.disabled = false; } } else close(); };
      wrap.querySelector('footer').appendChild(el);
    });
    wrap.close = close;
    document.getElementById('modals').appendChild(wrap);
    return wrap;
  },
  printModal(){ document.body.classList.add('printing-modal'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing-modal'), 300); }, 50); },
  confirm(msg){ return new Promise(res => { UI.modal('Xác nhận', '<p>' + U.esc(msg) + '</p>', [{ t: 'Huỷ', fn: () => res(false) }, { t: 'Đồng ý', cls: 'pri', fn: () => res(true) }], { size: 'sm', onClose: () => res(false) }); }); },
  bar(p, cls){ p = Math.max(0, Math.min(100, p || 0)); return '<div class="bar ' + (cls || '') + '"><i style="width:' + p.toFixed(1) + '%"></i></div>'; },
  hbars(rows, fmt){ const max = Math.max(1, ...rows.map(r => r[1])); return '<div class="hbars">' + rows.map(r => '<div class="row"><div class="small">' + U.esc(r[0]) + '</div>' + UI.bar(r[1] / max * 100, r[2]) + '<div class="small n b">' + (fmt ? fmt(r[1]) : r[1]) + '</div></div>').join('') + '</div>'; },
  table(cols, rows, opt){
    opt = opt || {};
    if (!rows.length) return '<div class="empty">' + (opt.empty || 'Chưa có dữ liệu') + '</div>';
    return '<div class="tw"' + (opt.maxH ? ' style="max-height:' + opt.maxH + 'px"' : '') + '><table><thead><tr>' + cols.map(c => '<th' + (c.n ? ' class="n"' : '') + '>' + c.t + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map(r => '<tr' + (opt.rowAttr ? ' ' + opt.rowAttr(r) : '') + '>' + cols.map(c => '<td' + (c.n ? ' class="n"' : '') + '>' + c.f(r) + '</td>').join('') + '</tr>').join('') + '</tbody>' + (opt.foot ? '<tfoot><tr>' + opt.foot + '</tr></tfoot>' : '') + '</table></div>';
  },
  fileDrop(el, multiple, accept, onFiles){
    el.innerHTML = '<div class="drop">Kéo thả file vào đây hoặc <u>bấm để chọn</u><br><small>' + U.esc(accept) + '</small></div><input type="file" hidden ' + (multiple ? 'multiple' : '') + ' accept="' + U.esc(accept) + '">';
    const d = el.querySelector('.drop'), inp = el.querySelector('input');
    d.onclick = () => inp.click();
    inp.onchange = () => { if (inp.files.length) onFiles([...inp.files]); inp.value = ''; };
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); };
  }
};

        if (r._jdFile){ const rec = await Files.upload(r._jdFile, { dept: r.dept, position: r.position, prefix: 'MTCV' }); r.jdFile = { id: rec.id, name: rec.name }; delete r._jdFile; }

    });
    const jo = m.querySelector('#jdopen'); if (jo) jo.onclick = () => Files.open(DB.get('cv_files', r.jdFile.id));
  }
};

/* ---------- Lọc CV theo MTCV ---------- */
const STOP = new Set('va cua cac cho voi tai trong theo nhung mot nhu tren duoi duoc khong co la de khi tu den nay neu thi hoac cung nhieu tot kha nang ky nang lam viec cong viec yeu cau uu tien loi the trinh do tot nghiep tro len nam kinh nghiem vi tri nhan vien cong ty quy dinh lien quan nganh chuyen nganh the and or the of to in for with on at by from a an is are be as'.split(' '));
const Screen = {
  items: [], reqId: '', crit: null,
  dict(){ return SKILL_DICT.map(([label, al]) => ({ label, al })); },
  aliases(label){ const d = SKILL_DICT.find(x => x[0] === label); return d ? d[1] : [U.norm(label)]; },
  has(normText, alias){ const a = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return new RegExp('(^|[^a-z0-9])' + a + '($|[^a-z0-9])').test(normText); },
  hit(normText, label){ return this.aliases(label).some(a => this.has(normText, a)); },
  /** Tách từ khoá từ MTCV: mục YÊU CẦU → bắt buộc (trừ dòng "ưu tiên/lợi thế"), mục mô tả → ưu tiên */
  extractKeywords(jd){
    const must = new Set(), nice = new Set();
    let sec = 'desc';
    String(jd || '').split(/\n+/).forEach(line => {
      const n = U.norm(line);
      if (/^yeu cau|^requirement|^tieu chuan/.test(n)) sec = 'req';
      else if (/^mo ta|^cong viec|^quyen loi|^thu nhap|^thoi gian/.test(n)) sec = /^mo ta|^cong viec/.test(n) ? 'desc' : 'other';
      if (sec === 'other') return;
      SKILL_DICT.forEach(([label, al]) => {
        if (!al.some(a => this.has(n, a))) return;
        if (sec === 'req' && !/uu tien|loi the|neu co/.test(n)) must.add(label); else nice.add(label);
      });
    });
    must.forEach(k => nice.delete(k));
    return { must: [...must], nice: [...nice] };
  },
  years(raw){
    const t = U.norm(raw);
    let explicit = 0, m;
    const re1 = /(\d{1,2}(?:[.,]\d)?)\s*\+?\s*(?:nam|years?)\s*(?:kinh nghiem|experience|kn)/g;
    while ((m = re1.exec(t))) explicit = Math.max(explicit, parseFloat(m[1].replace(',', '.')));
    const re2 = /kinh nghiem[^0-9]{0,15}(\d{1,2})\s*nam/g;
    while ((m = re2.exec(t))) explicit = Math.max(explicit, +m[1]);
    const now = new Date(), ranges = [];
    // Xét từng dòng: bỏ qua mốc thời gian nằm trên dòng học vấn (VD "2016 - 2020 Đại học …")
    String(raw || '').split(/\n/).forEach(line => {
      const l = U.norm(line.replace(/[–—~]/g, '-'));
      if (/dai hoc|cao dang|trung cap|truong|university|college|hoc vien|thpt|pho thong|sinh vien|student|khoa hoc|tot nghiep/.test(l)) return;
      const re3 = /(?:(\d{1,2})\s*[\/.\-]\s*)?((?:19|20)\d{2})\s*(?:-|–|—|den|to|~)\s*(?:(\d{1,2})\s*[\/.\-]\s*)?((?:19|20)\d{2}|nay|hien tai|hien nay|present|now|current)/g;
      while ((m = re3.exec(l))){
        const s = (+m[2]) * 12 + ((+m[1] || 1) - 1);
        const e = /^\d/.test(m[4]) ? (+m[4]) * 12 + ((+m[3] || 12) - 1) : now.getFullYear() * 12 + now.getMonth();
        if (e >= s && e - s < 480 && m[2] >= 1975) ranges.push([s, e]);
      }
    });
    ranges.sort((a, b) => a[0] - b[0]);
    let months = 0, cur = null;
    ranges.forEach(r => { if (!cur || r[0] > cur[1]){ if (cur) months += cur[1] - cur[0] + 1; cur = r.slice(); } else cur[1] = Math.max(cur[1], r[1]); });
    if (cur) months += cur[1] - cur[0] + 1;
    return Math.round(Math.max(explicit, months / 12) * 10) / 10;
  },
  edu(raw){
    const t = U.norm(raw);
    if (/thac si|master|mba|tien si|phd/.test(t)) return 5;
    if (/dai hoc|university|cu nhan|ky su|bachelor|engineer/.test(t)) return 4;
    if (/cao dang|college/.test(t)) return 3;
    if (/trung cap|so cap nghe|vocational/.test(t)) return 2;
    if (/thpt|12\/12|pho thong|high school|bo tuc/.test(t)) return 1;
    return 0;
  },
  /** Bóc thông tin ứng viên từ nội dung CV */
  info(raw, fileName){
    const o = {}, lines = String(raw || '').split(/\n/).map(s => s.trim()).filter(Boolean);
    const em = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/.exec(raw); if (em) o.email = em[0];
    const ph = /(?:\+?84|0)(?:[\s.\-]?\d){9}(?!\d)/.exec(raw); if (ph){ let d = ph[0].replace(/\D/g, ''); if (d.startsWith('84')) d = '0' + d.slice(2); o.phone = d; }
    const lab = (re) => { for (const l of lines){ const m = re.exec(l); if (m && m[1] && m[1].trim()) return m[1].trim(); } return ''; };
    let name = lab(/^(?:họ và tên|họ tên|họ & tên|full ?name|name)\s*[:：\-]\s*(.+)$/i);
    if (!name){
      for (const l of lines.slice(0, 12)){
        if (/\d|@|cv|curriculum|resume|sơ yếu|lý lịch|thông tin|profile|hồ sơ|ứng tuyển|vị trí|mục tiêu/i.test(l)) continue;
        const w = l.split(/\s+/);
        if (w.length >= 2 && w.length <= 5 && w.every(x => /^[A-ZÀ-Ỹ][a-zà-ỹ]*$|^[A-ZÀ-Ỹ]+$/.test(x))){ name = l; break; }
      }
    }
    if (name) o.fullName = name.replace(/\s+/g, ' ').split(' ').map(x => x.charAt(0).toUpperCase() + x.slice(1).toLowerCase()).join(' ');
    else o.fullName = fileName.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').replace(/\bcv\b/ig, '').trim();
    const dobL = lab(/(?:ngày sinh|năm sinh|sinh ngày|date of birth|dob|birthday)\s*[:：\-]?\s*(.+)$/i);
    if (dobL){ const d = U.parseAnyDate(dobL.match(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4}|\d{4}-\d{2}-\d{2}/)?.[0] || ''); if (d) o.dob = d; else { const y = /(19|20)\d{2}/.exec(dobL); if (y) o.birthYear = +y[0]; } }
    const g = U.norm(lab(/giới tính\s*[:：\-]?\s*(.+)$/i)); if (g) o.gender = /^nu|female/.test(g) ? 'Nữ' : /^nam|male/.test(g) ? 'Nam' : '';
    const ad = lab(/^(?:địa chỉ|address|chỗ ở|nơi ở)\s*[:：\-]?\s*(.+)$/i); if (ad) o.address = ad.slice(0, 160);
    const mj = lab(/(?:chuyên ngành|major|ngành học)\s*[:：\-]?\s*(.+)$/i); if (mj) o.major = mj.slice(0, 100);
    o.edu = this.edu(raw);
    o.years = this.years(raw);
    return o;
  },
  tokens(raw){ const m = new Map(); U.norm(raw).split(' ').forEach(w => { if (w.length > 2 && !STOP.has(w) && !/^\d+$/.test(w)) m.set(w, (m.get(w) || 0) + 1); }); return m; },
  cosine(a, b){ let dot = 0, na = 0, nb = 0; a.forEach((v, k) => { na += v * v; if (b.has(k)) dot += v * b.get(k); }); b.forEach(v => nb += v * v); return na && nb ? dot / Math.sqrt(na * nb) : 0; },
  /** Chấm điểm 1 CV theo tiêu chí. Trả về null nếu không đọc được chữ. */
  score(raw, crit){
    if (!raw || raw.replace(/\s/g, '').length < 40) return null;
    const t = U.norm(raw), inf = this.info(raw, '');
    const must = crit.must || [], nice = crit.nice || [];
    const mHit = must.filter(k => this.hit(t, k)), nHit = nice.filter(k => this.hit(t, k));
    const M = must.length ? mHit.length / must.length : (nice.length ? nHit.length / nice.length : 1);
    const N = nice.length ? nHit.length / nice.length : M;
    const E = +crit.minYears > 0 ? Math.min(1, inf.years / +crit.minYears) : 1;
    const req = +crit.edu || 0, D = !req ? 1 : inf.edu >= req ? 1 : inf.edu === req - 1 ? 0.5 : inf.edu === 0 ? 0.3 : 0;
    const S = Math.min(1, this.cosine(this.tokens(crit.jd || ''), this.tokens(raw)) * 3);
    const total = Math.round(100 * (0.45 * M + 0.15 * N + 0.2 * E + 0.1 * D + 0.1 * S));
    return { total, mHit, mMiss: must.filter(k => !mHit.includes(k)), nHit, years: inf.years, edu: inf.edu, parts: { M, N, E, D, S } };
  },
  critFromReq(r){ return r ? { jd: r.jd || '', must: (r.must || []).slice(), nice: (r.nice || []).slice(), minYears: r.minYears || 0, edu: r.edu || 0 } : { jd: '', must: [], nice: [], minYears: 0, edu: 0 }; }
};

Pages.screen = {
  render(el, p){
    if (p.req && p.req !== Screen.reqId){ Screen.reqId = p.req; Screen.crit = Screen.critFromReq(DB.get('requisitions', p.req)); Screen.items = []; }
    if (!Screen.crit) Screen.crit = Screen.critFromReq(null);
    const r = DB.get('requisitions', Screen.reqId), c = Screen.crit;
    const reqOpts = Rec.reqs().filter(x => x.status !== 'huy').sort(U.by(x => x.code)).map(x => ({ v: x.id, t: Rec.reqLabel(x) + ' – ' + reqStatusOf(x.status).t }));
    const chips = (arr, kind) => arr.map((k, i) => '<span class="chip ' + (kind === 'must' ? 'req' : '') + '" title="Bấm để chuyển ' + (kind === 'must' ? 'sang ưu tiên' : 'sang bắt buộc') + '" data-sw="' + kind + ':' + i + '">' + U.esc(k) + '<span class="x" data-rm="' + kind + ':' + i + '">✕</span></span>').join('') || '<span class="muted small">(chưa có)</span>';
    el.innerHTML = '<h2>Lọc CV theo mô tả công việc</h2>' +
      '<div class="card"><div class="toolbar"><select id="sreq" style="min-width:320px">' + U.opts(reqOpts, Screen.reqId, '— MTCV tự nhập (không gắn yêu cầu) —') + '</select>' +
      (r ? '<button class="btn" id="sedit">Sửa yêu cầu / MTCV</button>' : '') + '<span class="grow"></span>' +
      (r ? '<button class="btn" id="srescore">Chấm lại ' + Rec.cands().filter(x => x.reqId === r.id).length + ' ứng viên đã có</button>' : '') + '</div>' +
      '<details' + (r ? '' : ' open') + '><summary class="b" style="cursor:pointer">Mô tả công việc (căn cứ đánh giá)</summary><textarea id="sjd" style="min-height:180px;margin-top:8px">' + U.esc(c.jd) + '</textarea>' +
      '<div class="toolbar" style="margin-top:8px"><div id="sjdfile" style="flex:1"></div><button class="btn" id="sextract">Tự tách từ khoá từ MTCV</button></div></details>' +
      '<div class="grid g2" style="margin-top:10px"><div><h4>Từ khoá bắt buộc <span class="muted small">(45% điểm)</span></h4><div>' + chips(c.must, 'must') + '</div></div>' +
      '<div><h4>Từ khoá ưu tiên <span class="muted small">(15% điểm)</span></h4><div>' + chips(c.nice, 'nice') + '</div></div></div>' +
      '<div class="toolbar" style="margin-top:10px"><input id="skw" list="skwl" placeholder="Thêm từ khoá (VD: HACCP, Excel…)"><datalist id="skwl">' + SKILL_DICT.map(d => '<option value="' + U.esc(d[0]) + '">').join('') + '</datalist>' +
      '<button class="btn" data-add="must">+ Bắt buộc</button><button class="btn" data-add="nice">+ Ưu tiên</button>' +
      '<label class="small muted">Kinh nghiệm tối thiểu (năm) <input id="syears" type="number" min="0" step="0.5" style="width:80px;min-width:0" value="' + (c.minYears || 0) + '"></label>' +
      '<label class="small muted">Trình độ <select id="sedu" style="min-width:0">' + U.opts(EDU, c.edu) + '</select></label>' +
      (r ? '<button class="btn pri" id="ssavecrit">Lưu tiêu chí vào ' + U.esc(r.code) + '</button>' : '') + '</div>' +
      '<p class="small muted" style="margin:6px 0 0">Điểm = 45% từ khoá bắt buộc + 15% từ khoá ưu tiên + 20% số năm kinh nghiệm + 10% trình độ + 10% độ tương đồng nội dung với MTCV. Giới tính / độ tuổi KHÔNG được tính điểm (Điều 8 BLLĐ cấm phân biệt đối xử).</p></div>' +
      '<div class="card"><h3>Tải CV ứng viên lên để chấm điểm</h3><div id="scvs"></div><p class="small muted">Hỗ trợ PDF có chữ, Word (.docx), .txt. CV dạng ảnh chụp / PDF scan không đọc được chữ – vẫn lưu được và đánh giá thủ công.</p></div>' +
      '<div class="card"><div class="toolbar"><h3 style="margin:0">Kết quả xếp hạng (' + Screen.items.length + ' CV)</h3><span class="grow"></span>' +
      (Screen.items.length ? '<label class="small muted">Lưu tất cả CV từ <input id="sthr" type="number" value="60" style="width:70px;min-width:0"> điểm</label><button class="btn pri" id="ssaveall">Lưu thành ứng viên</button><button class="btn" id="sclear">Xoá danh sách</button>' : '') + '</div><div id="sres"></div></div>';
    this.renderResults(el);
    const reload = () => this.render(el, Object.assign({}, App.params, { req: Screen.reqId }));
    el.querySelector('#sreq').onchange = e => { Screen.reqId = e.target.value; Screen.crit = Screen.critFromReq(DB.get('requisitions', Screen.reqId)); Screen.rescoreItems(); App.go('screen', Screen.reqId ? { req: Screen.reqId } : null); if (!Screen.reqId) reload(); };
    const se = el.querySelector('#sedit'); if (se) se.onclick = () => Pages.reqs.edit(r);
    el.querySelector('#sjd').onchange = e => { c.jd = e.target.value; Screen.rescoreItems(); };
    el.querySelector('#sextract').onclick = () => { c.jd = el.querySelector('#sjd').value; const k = Screen.extractKeywords(c.jd); c.must = k.must; c.nice = k.nice; Screen.rescoreItems(); reload(); };
    UI.fileDrop(el.querySelector('#sjdfile'), false, '.pdf,.docx,.txt', async f => { const t = await TextX.fromFile(f[0]); if (!t){ UI.toast('Không đọc được chữ trong file MTCV'); return; } c.jd = t.trim(); const k = Screen.extractKeywords(c.jd); c.must = k.must; c.nice = k.nice; Screen.rescoreItems(); reload(); });
    el.querySelectorAll('[data-rm]').forEach(x => x.onclick = ev => { ev.stopPropagation(); const [k, i] = x.dataset.rm.split(':'); c[k].splice(+i, 1); Screen.rescoreItems(); reload(); });
    el.querySelectorAll('[data-sw]').forEach(x => x.onclick = () => { const [k, i] = x.dataset.sw.split(':'); const v = c[k].splice(+i, 1)[0]; c[k === 'must' ? 'nice' : 'must'].push(v); Screen.rescoreItems(); reload(); });
    el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const v = el.querySelector('#skw').value.trim(); if (!v) return; if (!c.must.includes(v) && !c.nice.includes(v)) c[b.dataset.add].push(v); Screen.rescoreItems(); reload(); });
    el.querySelector('#syears').onchange = e => { c.minYears = +e.target.value || 0; Screen.rescoreItems(); reload(); };
    el.querySelector('#sedu').onchange = e => { c.edu = +e.target.value || 0; Screen.rescoreItems(); reload(); };
    const sc = el.querySelector('#ssavecrit'); if (sc) sc.onclick = async () => { Object.assign(r, { jd: c.jd, must: c.must, nice: c.nice, minYears: c.minYears, edu: c.edu }); await DB.save('requisitions', r); UI.toast('Đã lưu tiêu chí vào ' + r.code); };
    const rs = el.querySelector('#srescore'); if (rs) rs.onclick = async () => {
      const list = Rec.cands().filter(x => x.reqId === r.id); let n = 0;
      list.forEach(x => { const s = Screen.score(x.cvText || '', c); if (s){ x.score = s.total; x.scoreDetail = { mHit: s.mHit, mMiss: s.mMiss, nHit: s.nHit }; n++; } });
      await DB.saveMany(list.map(x => ['candidates', x])); UI.toast('Đã chấm lại ' + n + '/' + list.length + ' ứng viên có nội dung CV'); App.go('cands', { req: r.id });
    };
    UI.fileDrop(el.querySelector('#scvs'), true, '.pdf,.docx,.txt,.doc,.jpg,.jpeg,.png', files => this.addFiles(files, el));
    const sa = el.querySelector('#ssaveall'); if (sa) sa.onclick = async () => {
      const thr = +el.querySelector('#sthr').value || 0;
      const pick = Screen.items.filter(it => !it.saved && it.s && it.s.total >= thr);
      if (!pick.length){ UI.toast('Không có CV nào đạt từ ' + thr + ' điểm'); return; }
      if (!await UI.confirm('Lưu ' + pick.length + ' CV thành ứng viên (giai đoạn "Đạt sàng lọc")?')) return;
      for (const it of pick) await this.saveItem(it, 'sang_loc');
      UI.toast('Đã lưu ' + pick.length + ' ứng viên'); reload();
    };
    const cl = el.querySelector('#sclear'); if (cl) cl.onclick = () => { Screen.items = []; reload(); };
  },
  async addFiles(files, el){
    const box = el.querySelector('#sres');
    for (const f of files){
      box.insertAdjacentHTML('afterbegin', '<div class="small muted" data-tmp>Đang đọc ' + U.esc(f.name) + '…</div>');
      const text = await TextX.fromFile(f);
      const info = Screen.info(text, f.name);
      const dup = Rec.cands().find(c => (info.phone && c.phone === info.phone) || (info.email && c.email && c.email.toLowerCase() === info.email.toLowerCase()));
      Screen.items.push({ id: U.id(), file: f, text, info, s: Screen.score(text, Screen.crit), dup: dup ? dup.id : '' });
    }
    this.render(el, App.params);
  },
  renderResults(el){
    const box = el.querySelector('#sres');
    const items = Screen.items.slice().sort((a, b) => (b.s ? b.s.total : -1) - (a.s ? a.s.total : -1));

/* ---------- Phiếu đánh giá phỏng vấn ---------- */
const Eval = {
  concl(v){ return { dat: 'Đạt', can_nhac: 'Cân nhắc', khong_dat: 'Không đạt' }[v] || '—'; },
  edit(e, candidateId){
    const isNew = !e, s = DB.settings();
    e = e ? JSON.parse(JSON.stringify(e)) : { candidateId, round: DB.all('evaluations').filter(x => x.candidateId === candidateId).length + 1, date: U.today(), criteria: s.evalCriteria.map(x => ({ name: x.name, w: x.w, score: 0, note: '' })), conclusion: '' };
    const c = DB.get('candidates', e.candidateId) || {};
    if (isNew && c.ivBy) e.interviewer = c.ivBy;
    const total = cr => { const w = U.sum(cr, x => x.w) || 1; return Math.round(U.sum(cr, x => x.w * (x.score || 0) / 5) / w * 100); };
    const body = '<div class="doc"><div class="hdr"><div><b>' + U.esc(s.company) + '</b><br>' + U.esc(s.address) + '</div><div>Mã UV: <b>' + U.esc(c.code || '') + '</b></div></div>' +
      '<h2>PHIẾU ĐÁNH GIÁ PHỎNG VẤN</h2><table><tr><th>Họ tên ứng viên</th><td>' + U.esc(c.fullName || '') + '</td><th>Vị trí</th><td>' + U.esc(c.position || '') + '</td></tr>' +
      '<tr><th>Phòng ban</th><td>' + U.esc(c.dept || '') + '</td><th>Điểm lọc CV</th><td>' + (c.score != null ? c.score + '/100' : '—') + '</td></tr>' +
      '<tr><th>Vòng</th><td><input name="round" type="number" min="1" value="' + e.round + '" style="width:70px"></td><th>Ngày PV</th><td><input type="date" name="date" value="' + U.esc(e.date) + '"></td></tr>' +
      '<tr><th>Người phỏng vấn</th><td colspan="3"><input name="interviewer" value="' + U.esc(e.interviewer || '') + '"></td></tr></table><br>' +
      '<table><thead><tr><th>Tiêu chí</th><th>Trọng số</th><th>Điểm (1 – 5)</th><th>Nhận xét</th></tr></thead><tbody>' +
      e.criteria.map((x, i) => '<tr><td>' + U.esc(x.name) + '</td><td class="n">' + x.w + '%</td><td><div class="stars">' + [1, 2, 3, 4, 5].map(v => '<label><input type="radio" name="sc' + i + '" value="' + v + '"' + (x.score === v ? ' checked' : '') + '><span>' + v + '</span></label>').join('') + '</div></td><td><input name="nt' + i + '" value="' + U.esc(x.note || '') + '"></td></tr>').join('') +
      '</tbody><tfoot><tr><td colspan="2">TỔNG ĐIỂM QUY ĐỔI</td><td colspan="2"><b id="evt">' + total(e.criteria) + '%</b> <span class="small">(≥ 70%: nên tuyển · 50 – 69%: cân nhắc · &lt; 50%: không đạt)</span></td></tr></tfoot></table><br>' +
      '<table><tr><th>Kết luận</th><td colspan="3">' + [['dat', 'Đạt'], ['can_nhac', 'Cân nhắc / PV vòng sau'], ['khong_dat', 'Không đạt']].map(([v, t]) => '<label style="margin-right:16px"><input type="radio" name="conclusion" value="' + v + '"' + (e.conclusion === v ? ' checked' : '') + '> ' + t + '</label>').join('') + '</td></tr>' +
      '<tr><th>Lương đề xuất</th><td><input name="proposedSalary" value="' + U.esc(e.proposedSalary || '') + '"></td><th>Ngày có thể nhận việc</th><td><input type="date" name="proposedStart" value="' + U.esc(e.proposedStart || '') + '"></td></tr>' +
      '<tr><th>Nhận xét chung</th><td colspan="3"><textarea name="comment">' + U.esc(e.comment || '') + '</textarea></td></tr></table>' +
      '<div class="sig"><div><b>Người phỏng vấn</b><br><br><br><br>' + U.esc(e.interviewer || '') + '</div><div><b>Trưởng bộ phận</b></div><div><b>Phê duyệt</b></div></div></div>' +
      '<label class="no-print" style="display:block;margin-top:10px"><input type="checkbox" name="_sync" checked> Cập nhật giai đoạn ứng viên theo kết luận</label>';
    const read = w => { e.criteria.forEach((x, i) => { const r = w.querySelector('[name=sc' + i + ']:checked'); x.score = r ? +r.value : 0; x.note = U.val(w, '[name=nt' + i + ']'); }); ['round', 'date', 'interviewer', 'proposedSalary', 'proposedStart', 'comment'].forEach(k => e[k] = U.val(w, '[name=' + k + ']')); const cc = w.querySelector('[name=conclusion]:checked'); e.conclusion = cc ? cc.value : ''; e.round = +e.round || 1; e.total = total(e.criteria); };
    const m = UI.modal('Phiếu đánh giá phỏng vấn', body, [
      ...(isNew ? [] : [{ t: 'Xoá phiếu', cls: 'danger', fn: async () => { if (!await UI.confirm('Xoá phiếu đánh giá này?')) return false; await DB.remove('evaluations', e.id); App.refresh(); } }]),
      { t: 'Đóng' },
      { t: 'Lưu', cls: 'pri', fn: async w => {
        read(w);
        if (!e.criteria.every(x => x.score)) throw new Error('Chấm đủ điểm cho tất cả tiêu chí');
        await DB.save('evaluations', e);
        if (w.querySelector('[name=_sync]').checked && c.id){
          const map = { dat: 'dat_pv', can_nhac: 'da_pv', khong_dat: 'khong_dat_pv' };
          const to = map[e.conclusion];
          if (to && c.stage !== to && !(to === 'dat_pv' && stageIdx(c.stage) > stageIdx('dat_pv'))){
            if (e.proposedSalary && !c.offerSalary) c.offerSalary = e.proposedSalary;
            if (e.proposedStart && !c.startDate) c.startDate = e.proposedStart;
            Cand.pushStage(c, to, 'Phiếu đánh giá vòng ' + e.round + ': ' + e.total + '% – ' + Eval.concl(e.conclusion));
            await DB.save('candidates', c);
          }
        }
        App.refresh();
      } }
    ], { print: true, sticky: true });
    m.addEventListener('change', () => { read(m); m.querySelector('#evt').textContent = e.total + '%'; });
  }
};

const Prob = {
  /** Đánh giá kết thúc thử việc (Điều 27 BLLĐ: thông báo kết quả khi kết thúc thời gian thử việc) */

      '<div class="no-print"><h4 style="margin-top:14px">Nếu ĐẠT – hợp đồng chính thức</h4><div class="form"><label class="f">Loại HĐ<select name="ctype">' + U.opts(CONTRACT_TYPES.filter(x => x.v !== 'thu_viec'), 'xdth') + '</select></label>' +
      '<label class="f">Thời hạn (tháng, HĐ xác định thời hạn ≤ 36)<input type="number" name="months" value="12" min="1" max="36"></label><label class="f">Số HĐ<input name="cno"></label></div>' +
      '<p class="small muted">Thử việc đạt mà vẫn tiếp tục làm việc thì phải giao kết / tiếp tục HĐLĐ (Điều 27). Phải đăng ký tham gia BHXH bắt buộc khi có HĐLĐ từ đủ 1 tháng.</p></div>';
    UI.modal('Đánh giá thử việc – ' + e.fullName, body, [{ t: 'Đóng' }, { t: 'Lưu kết quả', cls: 'pri', fn: async w => {
      ev.scores = s.probCriteria.map((t, i) => { const r = w.querySelector('[name=p' + i + ']:checked'); return r ? +r.value : 0; });
      const rr = w.querySelector('[name=result]:checked'); ev.result = rr ? rr.value : '';
      ev.comment = U.val(w, '[name=comment]'); ev.evaluator = U.val(w, '[name=evaluator]'); ev.date = U.val(w, '[name=date]');
      if (!ev.result) throw new Error('Chọn kết quả Đạt / Không đạt');
      p.eval = ev; p.result = ev.result; e.probation = p;
      const c = e.candidateId && DB.get('candidates', e.candidateId);

        e.tax = Object.assign({ dependents: 0 }, e.tax, { method: 'luy_tien' });
      } else {

        if (c) Cand.pushStage(c, 'khong_dat_tv', 'Không đạt thử việc ' + U.fd(ev.date));
      }
      await DB.save('employees', e);
      if (c){ await DB.save('candidates', c); if (c.reqId) await Rec.syncReq(c.reqId); }
      App.refresh();
    } }], { print: true, sticky: true });
  }
};

    const s = DB.settings(), today = U.today();
    const emps = DB.all('employees');
    const act = emps.filter(e => e.status === 'thu_viec').map(e => { const p = e.probation || {}; const end = p.end || e.probationEnd || probationEnd(e.startDate, p.level || 'cd'); return { e, p, end, left: U.diff(today, end), max: probationEnd(e.startDate || p.start, p.level || 'cd') }; }).sort(U.by(x => x.end || '9'));
    const done = emps.filter(e => e.probation && e.probation.result).sort(U.by(e => e.probation.eval ? e.probation.eval.date : '', true));
    const failed = Rec.cands().filter(c => ['khong_dat_tv', 'nghi_tv'].includes(c.stage));
    el.innerHTML = '<h2>Theo dõi thử việc</h2><div class="kpis">' +
      '<div class="kpi"><div class="v">' + act.length + '</div><div class="l">Đang thử việc</div></div>' +
      '<div class="kpi warn"><div class="v">' + act.filter(x => x.left != null && x.left >= 0 && x.left <= s.alertProbation).length + '</div><div class="l">Kết thúc trong ' + s.alertProbation + ' ngày</div></div>' +
      '<div class="kpi bad"><div class="v">' + act.filter(x => x.left != null && x.left < 0).length + '</div><div class="l">Quá hạn chưa đánh giá</div></div>' +
      '<div class="kpi ok"><div class="v">' + done.filter(e => e.probation.result === 'dat').length + '</div><div class="l">Đã đạt thử việc</div></div>' +
      '<div class="kpi"><div class="v">' + (done.filter(e => e.probation.result === 'khong_dat').length + failed.filter(c => !c.employeeId).length) + '</div><div class="l">Không đạt / nghỉ</div></div></div>' +
      '<div class="card"><h3>Đang thử việc</h3>' + UI.table([
        { t: 'Nhân viên', f: x => '<a href="javascript:void 0" data-e="' + x.e.id + '">' + U.esc(x.e.fullName) + '</a><div class="small muted">' + U.esc(x.e.code) + ' · ' + U.esc(x.e.title || '') + '</div>' },
        { t: 'Bộ phận', f: x => U.esc(x.e.dept || '') },
        { t: 'Bắt đầu', f: x => U.fd(x.e.startDate || x.p.start) },
        { t: 'Kết thúc', f: x => U.fd(x.end) + (x.max && x.end > x.max ? '<div><span class="tag bad">Vượt mức Điều 25 (tối đa ' + U.fd(x.max) + ')</span></div>' : '') },
        { t: 'Còn lại', f: x => x.left == null ? '—' : x.left < 0 ? '<span class="tag bad">Quá ' + (-x.left) + ' ngày</span>' : x.left <= s.alertProbation ? '<span class="tag warn">' + x.left + ' ngày</span>' : x.left + ' ngày' },
        { t: 'BHXH', f: x => x.e.bhxh && x.e.bhxh.joined ? '<span class="tag ok">Đã tham gia</span>' : '<span class="tag">Chưa</span>' },
        { t: '', f: x => '<button class="btn sm pri" data-ev="' + x.e.id + '">Đánh giá thử việc</button>' }
      ], act, { empty: 'Không có nhân viên đang thử việc' }) + '</div>' +
      '<div class="card"><h3>Kết quả thử việc</h3>' + UI.table([
        { t: 'Nhân viên', f: e => U.esc(e.fullName) + '<div class="small muted">' + U.esc(e.title || '') + '</div>' },
        { t: 'Thời gian', f: e => U.fd(e.probation.start) + ' – ' + U.fd(e.probation.end) },
        { t: 'Điểm TB', n: 1, f: e => { const sc = (e.probation.eval || {}).scores || []; return sc.length ? (U.sum(sc) / sc.length).toFixed(1) + '/5' : '—'; } },
        { t: 'Kết quả', f: e => UI.tag(e.probation.result === 'dat' ? { t: 'Đạt', c: 'ok' } : { t: 'Không đạt', c: 'bad' }) },
        { t: 'Người đánh giá', f: e => U.esc((e.probation.eval || {}).evaluator || '') + ' ' + U.fd((e.probation.eval || {}).date) },
        { t: '', f: e => '<button class="btn sm" data-ev="' + e.id + '">Xem / In</button>' }
      ], done) + '</div>';
    el.querySelectorAll('[data-e]').forEach(x => x.onclick = () => Emp.edit(DB.get('employees', x.dataset.e)));
    el.querySelectorAll('[data-ev]').forEach(x => x.onclick = () => Prob.evaluate(DB.get('employees', x.dataset.ev)));
  }
};

/* ---------- Kho CV ---------- */
Pages.cvstore = {
  render(el, p){
    const q = U.norm(p.q || '');
    let files = DB.all('cv_files').slice();
    if (q) files = files.filter(f => { const c = DB.get('candidates', f.candidateId) || {}; return U.norm([f.name, f.dept, f.position, c.fullName, c.phone].join(' ')).includes(q); });
    const tree = U.groupBy(files.sort(U.by(f => f.uploadedAt, true)), f => f.dept || 'Chưa phân loại');
    el.innerHTML = '<h2>Kho CV ứng viên</h2><div class="toolbar"><input id="kq" placeholder="Tìm tên file, ứng viên…" value="' + U.esc(p.q || '') + '"><span class="grow"></span>' +
      (IS_GAS ? '<button class="btn" id="kdrive">Mở thư mục Google Drive</button>' : '') + '<button class="btn pri" id="kup">+ Lưu CV vào kho</button></div>' +
      '<p class="muted small">' + files.length + ' file · CV được lưu theo <b>Phòng ban → Vị trí</b>' + (IS_GAS ? ' trong thư mục Google Drive "An Tâm – Kho CV".' : ' trong trình duyệt này (bản Google Apps Script lưu lên Google Drive).') + '</p>' +
      '<div class="card tree">' + ([...tree.keys()].sort().map(d => { const byPos = U.groupBy(tree.get(d), f => f.position || 'Chưa phân loại'); return '<details open><summary>' + U.esc(d) + ' <span class="muted">(' + tree.get(d).length + ')</span></summary>' +
        [...byPos.keys()].sort().map(pos => '<details class="lv2" open><summary>' + U.esc(pos) + ' <span class="muted">(' + byPos.get(pos).length + ')</span></summary>' + byPos.get(pos).map(f => { const c = DB.get('candidates', f.candidateId); return '<div class="file"><a href="javascript:void 0" data-open="' + f.id + '">' + U.esc(f.name) + '</a><span class="small muted">' + U.fd(f.uploadedAt.slice(0, 10)) + ' · ' + Math.max(1, Math.round((f.size || 0) / 1024)) + ' KB</span>' + (c ? ' <a href="javascript:void 0" data-c="' + c.id + '">' + U.esc(c.fullName) + '</a> ' + UI.tag(stageOf(c.stage)) : '') + '<span class="grow" style="flex:1"></span><button class="btn sm ghost" data-mv="' + f.id + '">Phân loại lại</button></div>'; }).join('') + '</details>').join('') + '</details>'; }).join('') || '<div class="empty">Kho CV trống</div>') + '</div>';
    el.querySelector('#kq').onchange = e => App.go('cvstore', { q: e.target.value });
    el.querySelectorAll('[data-open]').forEach(a => a.onclick = () => Files.open(DB.get('cv_files', a.dataset.open)));
    el.querySelectorAll('[data-c]').forEach(a => a.onclick = () => Cand.edit(DB.get('candidates', a.dataset.c)));
    const kd = el.querySelector('#kdrive'); if (kd) kd.onclick = async () => window.open(await gs('rootFolderUrl'), '_blank');
    el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const f = DB.get('cv_files', b.dataset.mv);
      UI.modal('Phân loại lại CV', '<div class="form"><label class="f">Phòng ban<select name="dept">' + U.opts(Rec.depts(), f.dept) + '</select></label><label class="f two">Vị trí<input name="position" list="kpl" value="' + U.esc(f.position) + '"><datalist id="kpl">' + [...new Set(Rec.reqs().map(r => r.position))].map(x => '<option value="' + U.esc(x) + '">').join('') + '</datalist></label></div>', [{ t: 'Huỷ' }, { t: 'Lưu', cls: 'pri', fn: async w => { const d = U.formData(w); await Files.move(f, d.dept, d.position); App.refresh(); } }], { size: 'sm' });
    });
    el.querySelector('#kup').onclick = () => {
      const m = UI.modal('Lưu CV vào kho', '<div class="form"><label class="f">Phòng ban<select name="dept">' + U.opts(Rec.depts()) + '</select></label><label class="f two">Vị trí<input name="position" list="kpl2"><datalist id="kpl2">' + [...new Set(Rec.reqs().map(r => r.position))].map(x => '<option value="' + U.esc(x) + '">').join('') + '</datalist></label></div><label><input type="checkbox" name="mk" checked> Tạo luôn ứng viên (giai đoạn "Mới nhận CV") cho mỗi file</label><div id="kdrop" style="margin-top:10px"></div><div id="klog" class="small"></div>', [{ t: 'Đóng', fn: () => App.refresh() }], { sticky: true });
      UI.fileDrop(m.querySelector('#kdrop'), true, '.pdf,.docx,.doc,.txt,.jpg,.jpeg,.png', async fs => {
        const d = U.formData(m); if (!d.position){ UI.toast('Nhập vị trí trước'); return; }
        const req = Rec.reqs().find(r => r.position === d.position && r.dept === d.dept);
        for (const file of fs){
          m.querySelector('#klog').insertAdjacentHTML('beforeend', '<div>Đang lưu ' + U.esc(file.name) + '…</div>');
          if (d.mk){
            const text = await TextX.fromFile(file), info = Screen.info(text, file.name);
            const c = Object.assign({ id: U.id(), code: U.nextCode(Rec.cands(), 'UV-', 4), reqId: req ? req.id : '', dept: d.dept, position: d.position, receivedDate: U.today(), history: [] }, Cand.fromInfo(info));
            const s = req ? Screen.score(text, Screen.critFromReq(req)) : null;
            Cand.applyScore(c, { text, s });
            await Cand.attachFile(c, file); Cand.pushStage(c, 'moi', 'Lưu vào kho CV'); await DB.save('candidates', c);
          } else await Files.upload(file, { dept: d.dept, position: d.position });
        }
        m.querySelector('#klog').insertAdjacentHTML('beforeend', '<div class="b">Xong ' + fs.length + ' file.</div>');
      });
    };
  }
};
</script>
<script>
/* =====================================================================
 *  NHÂN SỰ
 * ===================================================================== */
const Emp = {
  all(){ return DB.all('employees'); },
  active(){ return this.all().filter(e => e.status !== 'nghi_viec'); },
  curContract(e){ const cs = (e.contracts || []).filter(c => c.type !== 'dich_vu').slice().sort(U.by(c => c.start || '')); return cs[cs.length - 1] || null; },
  xdthCount(e){ return (e.contracts || []).filter(c => c.type === 'xdth').length; },
  calcOf(e){ const d = DB.settings().depts.find(x => x.name === e.dept); return d ? d.calc : 'vp'; },
  docsPct(e){ const d = e.docs || {}; return Math.round(DOC_LIST.filter(x => d[x.k]).length / DOC_LIST.length * 100); },
  missingReq(e){ const d = e.docs || {}; return DOC_LIST.filter(x => REQUIRED_DOCS.includes(x.k) && !d[x.k]).map(x => x.t); },
  /** Phép năm: 12 ngày + 1 ngày mỗi đủ 5 năm (Điều 113, 114); làm chưa đủ năm tính theo tỷ lệ */
  leaveDays(e, year){
    year = year || new Date().getFullYear();
    const st = U.pd(e.startDate); if (!st) return 12;
    const seniority = Math.floor(Math.max(0, U.diff(e.startDate, year + '-12-31')) / 365.25);
    const base = 12 + Math.floor(seniority / 5);
    if (st.getFullYear() < year) return base;
    if (st.getFullYear() > year) return 0;
    const months = 12 - st.getMonth() - (st.getDate() > 15 ? 1 : 0);
    return Math.round(base * months / 12);
  },
  edit(e){
    const isNew = !e, s = DB.settings();
    e = e ? JSON.parse(JSON.stringify(e)) : { code: U.nextCode(this.all(), 'AT', 5), status: 'chinh_thuc', startDate: U.today(), docs: {}, contracts: [], salary: {}, bhxh: {}, tax: { method: 'luy_tien', dependents: 0 }, bank: {} };
    e.salary = e.salary || {}; e.bhxh = e.bhxh || {}; e.tax = e.tax || {}; e.bank = e.bank || {}; e.docs = e.docs || {}; e.leave = e.leave || {};
    const yr = new Date().getFullYear();
    const issues = isNew ? [] : Legal.issues().filter(i => i.emp && i.emp.id === e.id);
    const body =
      (issues.length ? issues.map(i => '<div class="alert ' + (i.sev === 'bad' ? 'bad' : i.sev === 'warn' ? 'warn' : 'info') + '"><b>' + U.esc(i.title) + '</b> – ' + U.esc(i.msg) + ' <span class="small">(' + U.esc(i.basis) + ')</span></div>').join('') : '') +
      '<div class="tabs" id="etabs"><a class="on" data-t="1">Thông tin chung</a><a data-t="2">Hợp đồng (' + (e.contracts || []).length + ')</a><a data-t="3">Lương – BHXH – Thuế</a><a data-t="4">Hồ sơ giấy tờ & phép năm</a></div>' +
      '<div data-p="1"><div class="form">' +
      '<label class="f">Mã NV<input name="code" value="' + U.esc(e.code) + '"></label>' +
      '<label class="f">Họ và tên *<input name="fullName" value="' + U.esc(e.fullName || '') + '"></label>' +
      '<label class="f">Trạng thái<select name="status">' + U.opts(EMP_STATUS, e.status) + '</select></label>' +
      '<label class="f">Bộ phận / khối<select name="dept">' + U.opts(Rec.depts(), e.dept, '— chọn —') + '</select></label>' +
      '<label class="f">Chức danh<input name="title" value="' + U.esc(e.title || '') + '"></label>' +
      '<label class="f">Cấp – bậc (thang lương)<input name="grade" value="' + U.esc(e.grade || '') + '"></label>' +
      '<label class="f">Ngày vào làm<input type="date" name="startDate" value="' + U.esc(e.startDate || '') + '"></label>' +
      '<label class="f">Ngày nghỉ việc<input type="date" name="endDate" value="' + U.esc(e.endDate || '') + '"></label>' +
      '<label class="f">Lý do nghỉ<input name="leaveReason" value="' + U.esc(e.leaveReason || '') + '"></label>' +
      '<label class="f">Giới tính<select name="gender">' + U.opts(['Nam', 'Nữ', 'Khác'], e.gender, '—') + '</select></label>' +
      '<label class="f">Ngày sinh<input type="date" name="dob" value="' + U.esc(e.dob || '') + '"></label>' +
      '<label class="f">Số CCCD<input name="cccd" value="' + U.esc(e.cccd || '') + '"></label>' +
      '<label class="f">Điện thoại<input name="phone" value="' + U.esc(e.phone || '') + '"></label>' +
      '<label class="f">Email<input name="email" value="' + U.esc(e.email || '') + '"></label>' +
      '<label class="f">Trình độ<select name="edu">' + U.opts(EDU, e.edu) + '</select></label>' +
      '<label class="f full">Địa chỉ<input name="address" value="' + U.esc(e.address || '') + '"></label>' +
      '<label class="f two">Mức thử việc (Điều 25)<select name="probLevel">' + U.opts(PROBATION_LEVELS.map(x => ({ v: x.v, t: x.t })), (e.probation || {}).level || 'cd') + '</select></label>' +
      '<label class="f">Hạn thử việc<input type="date" name="probEnd" value="' + U.esc((e.probation || {}).end || '') + '"></label>' +
      '<label class="f"><input type="checkbox" name="partTime"' + (e.partTime ? ' checked' : '') + '> Làm việc không trọn thời gian (lương theo giờ làm)</label>' +
      '<label class="f"><input type="checkbox" name="settled"' + (e.settled ? ' checked' : '') + '> Đã thanh toán quyền lợi & chốt sổ BHXH khi nghỉ</label>' +
      '<label class="f full">Ghi chú<textarea name="note">' + U.esc(e.note || '') + '</textarea></label></div></div>' +
      '<div data-p="2" hidden><div id="ectr"></div><button class="btn" id="eaddc">+ Thêm hợp đồng</button><p class="small muted">HĐLĐ xác định thời hạn tối đa 36 tháng; chỉ được ký thêm 1 lần, sau đó phải ký HĐ không xác định thời hạn (Điều 20). Hết hạn mà vẫn làm việc: trong 30 ngày phải ký HĐ mới.</p></div>' +
      '<div data-p="3" hidden><div class="form">' +
      '<label class="f">Lương thoả thuận (tổng/tháng)<input name="s_agreed" value="' + U.esc(e.salary.agreed || '') + '"></label>' +
      '<label class="f">Lương cơ bản (LCB)<input name="s_base" value="' + U.esc(e.salary.base || '') + '"></label>' +
      '<label class="f">Phụ cấp trách nhiệm / chức vụ<input name="s_allowance" value="' + U.esc(e.salary.allowance || '') + '"></label>' +
      '<label class="f">Hỗ trợ cơm (tháng, cơ cấu từ T9)<input name="s_meal" value="' + U.esc(e.salary.meal != null ? e.salary.meal : '') + '"></label>' +
      '<label class="f">Công chuẩn riêng (để trống = ' + s.stdDays + ')<input name="s_std" value="' + U.esc(e.salary.std || '') + '"></label>' +
      '<label class="f"><input type="checkbox" name="b_joined"' + (e.bhxh.joined ? ' checked' : '') + '> Đã tham gia BHXH bắt buộc</label>' +
      '<label class="f">Lương đóng BHXH<input name="s_insured" value="' + U.esc(e.salary.insured || '') + '"></label>' +
      '<label class="f">Tham gia BHXH từ<input type="date" name="b_from" value="' + U.esc(e.bhxh.from || '') + '"></label>' +
      '<label class="f">Mã số BHXH<input name="b_no" value="' + U.esc(e.bhxh.no || '') + '"></label>' +
      '<label class="f"><input type="checkbox" name="extra168"' + (e.extra168 ? ' checked' : '') + '> Trả thêm ' + s.extraRate + '% (LCB+PC) thay BHXH – Điều 168</label>' +
      '<label class="f">Cách tính thuế TNCN<select name="t_method">' + U.opts([{ v: 'luy_tien', t: 'Luỹ tiến (HĐ từ 3 tháng, có giảm trừ)' }, { v: 'flat10', t: 'Khấu trừ ' + s.flatTaxRate + '% (thử việc / HĐ dưới 3 tháng)' }, { v: 'none', t: 'Không khấu trừ (có cam kết 08/CK-TNCN)' }], e.tax.method) + '</select></label>' +
      '<label class="f">Số người phụ thuộc<input type="number" min="0" name="t_dep" value="' + U.esc(e.tax.dependents || 0) + '"></label>' +
      '<label class="f">MST cá nhân<input name="t_mst" value="' + U.esc(e.tax.mst || '') + '"></label>' +
      '<label class="f">Ngân hàng<input name="k_name" value="' + U.esc(e.bank.name || '') + '"></label>' +
      '<label class="f">Số tài khoản<input name="k_acc" value="' + U.esc(e.bank.account || '') + '"></label></div>' +
      (e.payNote ? '<p class="small muted"><b>Ghi chú từ bảng lương:</b> ' + U.esc(e.payNote) + '</p>' : '') + '</div>' +
      '<div data-p="4" hidden><div class="grid g2"><div><h4>Hồ sơ giấy tờ (' + this.docsPct(e) + '%)</h4>' + DOC_LIST.map(d => '<label style="display:block;margin:4px 0"><input type="checkbox" name="d_' + d.k + '"' + (e.docs[d.k] ? ' checked' : '') + '> ' + U.esc(d.t) + (REQUIRED_DOCS.includes(d.k) ? ' <span class="tag warn">bắt buộc</span>' : '') + '</label>').join('') + '</div>' +
      '<div><h4>Phép năm ' + yr + '</h4><p>Được nghỉ: <b>' + this.leaveDays(e, yr) + '</b> ngày (12 ngày + thâm niên, tính theo tỷ lệ nếu vào làm trong năm – Điều 113, 114)</p><label class="f">Số ngày phép đã nghỉ năm ' + yr + '<input type="number" step="0.5" name="leaveUsed" value="' + U.esc(e.leave[yr] || 0) + '"></label></div></div></div>';
    const m = UI.modal(isNew ? 'Thêm nhân viên' : 'Hồ sơ nhân viên – ' + e.fullName, body, [
      ...(isNew ? [] : [{ t: 'Xoá', cls: 'danger', fn: async () => { if (!await UI.confirm('Xoá hẳn hồ sơ ' + e.fullName + '? (Nên chuyển trạng thái "Đã nghỉ việc" để giữ lịch sử)')) return false; await DB.remove('employees', e.id); App.refresh(); } }]),
      { t: 'Đóng' },
      { t: 'Lưu', cls: 'pri', fn: async w => {
        const f = U.formData(w);
        if (!f.fullName) throw new Error('Nhập họ tên');
        ['code', 'fullName', 'status', 'dept', 'title', 'grade', 'startDate', 'endDate', 'leaveReason', 'gender', 'dob', 'cccd', 'phone', 'email', 'address', 'note'].forEach(k => e[k] = f[k]);
        e.edu = +f.edu || 0; e.settled = f.settled; e.extra168 = f.extra168; e.partTime = f.partTime;
        e.salary = { agreed: U.num(f.s_agreed), base: U.num(f.s_base), allowance: U.num(f.s_allowance), meal: f.s_meal === '' ? '' : U.num(f.s_meal), insured: U.num(f.s_insured), std: U.num(f.s_std) || '' };
        e.bhxh = { joined: f.b_joined, from: f.b_from, no: f.b_no };
        e.tax = { method: f.t_method, dependents: +f.t_dep || 0, mst: f.t_mst };
        e.bank = { name: f.k_name, account: f.k_acc };
        DOC_LIST.forEach(d => e.docs[d.k] = f['d_' + d.k]);
        e.leave[yr] = +f.leaveUsed || 0;
        if (e.status === 'thu_viec' || f.probEnd){ e.probation = Object.assign({}, e.probation, { level: f.probLevel, start: (e.probation || {}).start || e.startDate, end: f.probEnd || probationEnd(e.startDate, f.probLevel) }); }
        if (e.status === 'nghi_viec' && !e.endDate) e.endDate = U.today();
        await DB.save('employees', e); App.refresh();
      } }
    ], { sticky: true });
    m.querySelectorAll('#etabs a').forEach(a => a.onclick = () => { m.querySelectorAll('#etabs a').forEach(x => x.classList.toggle('on', x === a)); m.querySelectorAll('[data-p]').forEach(p => p.hidden = p.dataset.p !== a.dataset.t); });
    const drawC = () => {
      m.querySelector('#ectr').innerHTML = UI.table([
        { t: 'Số HĐ', f: c => U.esc(c.no || '') },
        { t: 'Loại', f: c => ctOf(c.type) },
        { t: 'Ngày ký', f: c => U.fd(c.sign) },

      ], (e.contracts || []).slice().sort(U.by(c => c.start || '')), { empty: 'Chưa có hợp đồng' });
      m.querySelectorAll('[data-ce]').forEach(b => b.onclick = () => Contracts.editOne(e, e.contracts.find(c => c.id === b.dataset.ce), drawC));

  }
};

/* ---------- Hợp đồng ---------- */
const Contracts = {
  editOne(e, c, after){
    const isNew = !c, prev = Emp.curContract(e), x2 = Emp.xdthCount(e) >= 2;
    c = c ? Object.assign({}, c) : { id: U.id(), type: x2 ? 'kxdth' : 'xdth', start: prev && prev.end ? U.addDays(prev.end, 1) : (e.startDate || U.today()), salary: (e.salary || {}).agreed || '' };
    c.sign = c.sign || c.start;
    const body = (x2 && isNew ? '<div class="alert warn">Nhân viên đã ký 2 HĐ xác định thời hạn – theo Điều 20 khoản 2 điểm c BLLĐ, lần này phải ký HĐ không xác định thời hạn (trừ một số trường hợp đặc biệt như người cao tuổi, lao động nước ngoài…).</div>' : '') +
      '<div class="form"><label class="f">Số hợp đồng<input name="no" value="' + U.esc(c.no || '') + '"></label><label class="f two">Loại hợp đồng<select name="type">' + U.opts(CONTRACT_TYPES, c.type) + '</select></label>' +
      '<label class="f">Ngày ký<input type="date" name="sign" value="' + U.esc(c.sign || '') + '"></label><label class="f">Bắt đầu<input type="date" name="start" value="' + U.esc(c.start || '') + '"></label><label class="f">Thời hạn (tháng)<input type="number" name="months" min="1" max="36" value="' + (c.end && c.start ? Math.round(U.diff(c.start, c.end) / 30.4) : 12) + '"></label>' +
      '<label class="f">Ngày hết hạn<input type="date" name="end" value="' + U.esc(c.end || '') + '"></label><label class="f">Mức lương ghi trên HĐ<input name="salary" value="' + U.esc(c.salary || '') + '"></label><label class="f">Ghi chú<input name="note" value="' + U.esc(c.note || '') + '"></label></div>';
    const m = UI.modal((isNew ? 'Thêm' : 'Sửa') + ' hợp đồng – ' + e.fullName, body, [{ t: 'Huỷ' }, { t: 'Lưu hợp đồng', cls: 'pri', fn: async w => {
      const f = U.formData(w);
      if (f.type === 'xdth' && f.start && f.end && U.diff(f.start, f.end) > 36 * 31) throw new Error('HĐ xác định thời hạn không quá 36 tháng (Điều 20)');
      Object.assign(c, { no: f.no, type: f.type, sign: f.sign, start: f.start, end: f.type === 'kxdth' ? '' : f.end, salary: U.num(f.salary), note: f.note });
      e.contracts = e.contracts || [];
      const i = e.contracts.findIndex(x => x.id === c.id); if (i >= 0) e.contracts[i] = c; else e.contracts.push(c);
      if (f.type !== 'thu_viec' && e.status === 'thu_viec' && !after) e.status = 'chinh_thuc';
      if (after) after(); else { await DB.save('employees', e); App.refresh(); }
    } }], { size: 'sm' });
    const recalc = () => { const t = m.querySelector('[name=type]').value, st = m.querySelector('[name=start]').value, mo = +m.querySelector('[name=months]').value; if (t === 'kxdth') m.querySelector('[name=end]').value = ''; else if (st && mo) m.querySelector('[name=end]').value = U.addDays(U.addMonths(st, mo), -1); };
    ['type', 'start', 'months'].forEach(n => m.querySelector('[name=' + n + ']').addEventListener('change', recalc));
    if (isNew) recalc();
  }
};

        { t: 'Số lần HĐ XĐTH', n: 1, f: r => r.x + (r.x >= 2 ? ' <span class="tag warn">lần sau: KXĐTH</span>' : '') },
        { t: 'Gợi ý xử lý', f: r => !r.c ? 'Ký HĐLĐ bằng văn bản (Điều 14)' : r.left != null && r.left < 0 ? (r.left >= -30 ? 'Ký HĐ mới trong 30 ngày kể từ ngày hết hạn' : 'Quá 30 ngày: HĐ đã trở thành không xác định thời hạn – lập phụ lục/HĐ KXĐTH') : r.left != null && r.left <= s.alertContract ? (r.x >= 2 ? 'Chuẩn bị HĐ không xác định thời hạn' : 'Đánh giá, quyết định gia hạn / ký mới hoặc thông báo chấm dứt (Điều 45)') : '' },
        { t: '', f: r => '<button class="btn sm pri" data-n="' + r.e.id + '">' + (r.c ? 'Ký HĐ mới' : 'Thêm HĐ') + '</button>' }
