/* ---------- Tuân thủ pháp luật ---------- */
const Legal = {
  issues(){
    const s = DB.settings(), today = U.today(), out = [];
    const add = (emp, sev, type, title, msg, basis) => out.push({ emp, sev, type, title, msg, basis });
    Emp.all().forEach(e => {
      const active = e.status !== 'nghi_viec';
      if (!active){
        if (e.endDate && !e.settled){ const d = U.diff(e.endDate, today); if (d != null && d >= 0 && d <= 45) add(e, d > 14 ? 'bad' : 'warn', 'quit', 'Nghỉ việc – thanh toán & chốt sổ', 'Nghỉ từ ' + U.fd(e.endDate) + ': thanh toán đủ lương, quyền lợi trong 14 ngày làm việc (tối đa 30 ngày), xác nhận thời gian đóng BHXH và trả lại giấy tờ', 'Điều 48 BLLĐ 2019'); }
        return;
      }
      const p = e.probation || {};
      if (e.status === 'thu_viec'){
        const end = p.end || probationEnd(e.startDate, p.level || 'cd');
        const max = probationEnd(p.start || e.startDate, p.level || 'cd');
        if (end && end < today) add(e, 'bad', 'prob_over', 'Hết thử việc chưa có kết quả', 'Thử việc kết thúc ' + U.fd(end) + ' (' + U.diff(end, today) + ' ngày trước) – phải thông báo kết quả, ký HĐLĐ nếu đạt', 'Điều 27 BLLĐ 2019');
        else if (end && U.diff(today, end) <= s.alertProbation) add(e, 'warn', 'prob_soon', 'Sắp hết thử việc', 'Kết thúc ' + U.fd(end) + ' – chuẩn bị phiếu đánh giá thử việc', 'Điều 27 BLLĐ 2019');
        if (end && max && end > max) add(e, 'warn', 'prob_law', 'Thời gian thử việc vượt mức luật', 'Thử việc đến ' + U.fd(end) + ' vượt mức tối đa (' + probLevelOf(p.level).t.split('–')[1].trim() + ', tức đến ' + U.fd(max) + '). Kiểm tra lại mức thử việc của vị trí trong hồ sơ', 'Điều 25 BLLĐ 2019');
        if (p.salary && e.salary && e.salary.agreed && p.salary < e.salary.agreed * 0.85) add(e, 'bad', 'prob_pay', 'Lương thử việc dưới 85%', 'Lương thử việc ' + U.money(p.salary) + ' < 85% lương chính thức ' + U.money(e.salary.agreed), 'Điều 26 BLLĐ 2019');
      }
      const c = Emp.curContract(e);
      if (e.status === 'chinh_thuc' && !c) add(e, 'warn', 'no_contract', 'Chưa nhập hợp đồng vào hồ sơ', 'Cập nhật số HĐ, loại HĐ, ngày hết hạn để theo dõi hạn hợp đồng – HĐLĐ từ 1 tháng trở lên phải giao kết bằng văn bản', 'Điều 13, 14 BLLĐ 2019');
      else if (e.status === 'chinh_thuc' && c.type === 'thu_viec') add(e, 'bad', 'no_contract', 'Hết thử việc nhưng chưa ký HĐLĐ', 'Chỉ có HĐ thử việc – thử việc đạt thì phải giao kết HĐLĐ', 'Điều 27 BLLĐ 2019');
      if (c && c.end && c.type !== 'thu_viec'){
        const left = U.diff(today, c.end);
        if (left < 0) add(e, 'bad', 'ct_expired', 'HĐLĐ đã hết hạn', 'Hết hạn ' + U.fd(c.end) + ' – NLĐ vẫn làm việc thì trong 30 ngày phải ký HĐ mới; quá hạn HĐ XĐTH trở thành HĐ không xác định thời hạn', 'Điều 20 khoản 2 BLLĐ 2019');
        else if (left <= s.alertContract) add(e, 'warn', 'ct_soon', 'HĐLĐ sắp hết hạn', 'Hết hạn ' + U.fd(c.end) + ' (còn ' + left + ' ngày)' + (Emp.xdthCount(e) >= 2 ? ' – đã 2 lần HĐ XĐTH, lần tới phải ký HĐ không xác định thời hạn' : ''), 'Điều 20, 45 BLLĐ 2019');
        if (c.type === 'xdth' && c.start && U.diff(c.start, c.end) > 36 * 31) add(e, 'bad', 'ct_36', 'HĐ XĐTH quá 36 tháng', 'Thời hạn từ ' + U.fd(c.start) + ' đến ' + U.fd(c.end), 'Điều 20 khoản 1 BLLĐ 2019');
      }
      if (Emp.xdthCount(e) >= 3) add(e, 'bad', 'ct_3', 'Ký HĐ XĐTH lần thứ 3', 'Đã ghi nhận ' + Emp.xdthCount(e) + ' HĐ xác định thời hạn', 'Điều 20 khoản 2 điểm c BLLĐ 2019');
      if (e.status === 'chinh_thuc' && !(e.bhxh && e.bhxh.joined)) add(e, 'bad', 'bhxh', 'Chưa tham gia BHXH bắt buộc', 'NLĐ làm việc theo HĐLĐ từ đủ 1 tháng phải tham gia BHXH, BHYT, BHTN; đăng ký trong 30 ngày kể từ ngày giao kết HĐ' + (e.extra168 ? ' (đang trả thêm khoản Điều 168 – chỉ áp dụng cho NLĐ không thuộc diện bắt buộc)' : ''), 'Luật BHXH 2024; Luật BHYT; Luật Việc làm');
      const sal = e.salary || {};
      if (sal.base && sal.base < s.regionWage && !e.partTime) add(e, 'bad', 'minwage', 'Lương cơ bản dưới lương tối thiểu vùng', U.money(sal.base) + ' < ' + U.money(s.regionWage) + ' (vùng I)', 'Điều 90, 91 BLLĐ 2019; NĐ lương tối thiểu vùng');
      if (e.bhxh && e.bhxh.joined && sal.insured && sal.insured < s.regionWage) add(e, 'bad', 'insured', 'Lương đóng BHXH thấp hơn lương tối thiểu vùng', U.money(sal.insured), 'Luật BHXH 2024');
      const age = U.age(e.dob);
      if (age != null && age < 15) add(e, 'bad', 'minor', 'Người dưới 15 tuổi', 'Chỉ được làm công việc nhẹ theo danh mục, phải có HĐ với người đại diện theo pháp luật', 'Điều 143, 145 BLLĐ 2019');
      else if ((age != null && age < 18) || /chua du tuoi/.test(U.norm(e.note))) add(e, 'warn', 'minor', 'Lao động chưa thành niên', 'Lập sổ theo dõi riêng; không quá 8 giờ/ngày, 40 giờ/tuần; hạn chế làm thêm giờ, làm đêm; không làm công việc cấm', 'Điều 143 – 147 BLLĐ 2019');
      if (e.tax && e.tax.method === 'flat10' && e.status === 'chinh_thuc' && c && c.type !== 'thu_viec' && c.type !== 'dich_vu' && (!c.end || U.diff(c.start, c.end) >= 89)) add(e, 'warn', 'tax', 'Thuế TNCN đang khấu trừ 10%', 'Đã có HĐLĐ từ 3 tháng trở lên – phải tính thuế theo biểu luỹ tiến, có giảm trừ gia cảnh', 'Luật Thuế TNCN; TT 111/2013/TT-BTC');
      const miss = Emp.missingReq(e);
      if (miss.length) add(e, 'info', 'docs', 'Thiếu hồ sơ bắt buộc', miss.join(', '), 'Quy định hồ sơ nhân sự nội bộ');
      if (!e.dob || !e.cccd) add(e, 'info', 'info', 'Thiếu thông tin cá nhân', [!e.dob && 'ngày sinh', !e.cccd && 'số CCCD'].filter(Boolean).join(', ') + ' – cần để kê khai BHXH, thuế và kiểm tra độ tuổi', 'Luật BHXH 2024; Luật Quản lý thuế');
    });
    if (Emp.active().length >= 10 && !DB.all('legal_tasks').some(t => t.freq === 'once' && /noi quy/.test(U.norm(t.title)) && t.done && t.done.once)) out.push({ emp: null, sev: 'warn', type: 'company', title: 'Nội quy lao động', msg: 'Công ty có từ 10 lao động – phải có nội quy bằng văn bản và đăng ký tại cơ quan lao động cấp tỉnh', basis: 'Điều 118, 119 BLLĐ 2019' });
    return out;
  },
  /** Kỳ và hạn của công việc định kỳ */
  periods(t){
    const now = new Date(), y = now.getFullYear(), today = U.today();
    const clamp = (yy, mm, dd) => { const last = new Date(yy, mm, 0).getDate(); return yy + '-' + String(mm).padStart(2, '0') + '-' + String(Math.min(dd, last)).padStart(2, '0'); };
    const list = [];
    if (t.freq === 'monthly'){
      for (let k = -3; k <= 1; k++){ const d = new Date(y, now.getMonth() + k, 1); const key = U.ym(U.iso(d)); const due = new Date(d.getFullYear(), d.getMonth() + (t.lag || 0), 1); list.push({ key, label: U.ymLabel(key), due: clamp(due.getFullYear(), due.getMonth() + 1, t.day) }); }
    } else if (t.freq === 'yearly'){
      [y - 1, y, y + 1].forEach(yy => list.push({ key: String(yy), label: 'Năm ' + yy, due: clamp(yy, t.month, t.day) }));
    } else list.push({ key: 'once', label: 'Một lần', due: clamp(y, t.month || 12, t.day || 31) });
    const done = t.done || {};
    const open = list.filter(x => !done[x.key]);
    const overdue = open.filter(x => x.due < today && U.diff(x.due, today) <= 120);
    const next = overdue[0] || open.find(x => x.due >= today) || null;
    return { next, overdue, list };
  }
};

/* ---------- Chấm công & bảng lương ---------- */
const Pay = {
  progressive(z, br){ let tax = 0, prev = 0; for (const [cap, rate] of br){ const top = cap == null ? Infinity : cap; if (z > prev){ tax += (Math.min(z, top) - prev) * rate / 100; } prev = top; if (z <= top) break; } return tax; },
  /** Tính 1 dòng lương. Công thức theo file "Lương T8 mới.xlsx":
   *  Khối sản xuất: trong chuẩn = Lương TT × MIN(công, công chuẩn)/(công chuẩn/26×31); P1 = MIN((LCB+PC)×công tính/công chuẩn, trong chuẩn); P2 = trong chuẩn − P1; P3 = Lương TT × (MIN(công,31) − công chuẩn)/31
   *  Khối văn phòng: P1 = (LCB+PC)×công tính/công chuẩn; P2 = Lương TT×công tính/công chuẩn − P1 */
  /** Cơ cấu áp dụng cho tháng: 'v1' = P1/P2/P3 (đến T8/2026), 'v2' = theo ngày công/giờ (từ T9/2026) */
  V2_DEFAULT: { std: 26, hours: 8, holidayRate: 4, otNormal: 1.5, otOff: 2, otHoliday: 3, night: 0.3, nightHoliday: 0.9, minDaysBhxh: 14, unionRate: 2, taxMin: 5000000 },
  structures(){ const st = DB.settings().structures || {}; return { v1: Object.assign({}, DEFAULT_SETTINGS.structures.v1, st.v1), v2: Object.assign({}, DEFAULT_SETTINGS.structures.v2, st.v2, { params: Object.assign({}, this.V2_DEFAULT, (st.v2 || {}).params) }) }; },
  v2Params(){ return JSON.parse(JSON.stringify(this.structures().v2.params)); },
  schemeFor(ym){ return ym >= (this.structures().v2.from || '2026-09') ? 'v2' : 'v1'; },
  /** Gắn tham số cơ cấu (đã lưu cùng bảng lương) vào từng dòng – thuộc tính ẩn, không ghi xuống Sheet */
  attach(doc){ if (!doc || doc.scheme !== 'v2' || !Array.isArray(doc.rows)) return doc; const P = Object.assign({}, this.V2_DEFAULT, doc.params); doc.rows.forEach(r => Object.defineProperty(r, '_p', { value: P, configurable: true, enumerable: false, writable: true })); return doc; },
  deptMax(dept){ const d = DB.settings().depts.find(x => x.name === dept); return d && +d.maxWork ? +d.maxWork : ''; },
  /** Cơ cấu lương từ T9/2026 – đúng công thức file "AT_BL_T9_2026_TongHopCong":
   *  đơn giá ngày = (LCB + PC chức vụ)/công chuẩn; đơn giá giờ = đơn giá ngày/giờ chuẩn
   *  lương ngày thường, phép, nghỉ lễ = đơn giá ngày × số ngày; đi làm lễ = giờ × 400%; OT 150% / 200% (ngày off) / 300% (lễ)
   *  ca đêm +30%, đêm lễ +90%; hỗ trợ cơm & hỗ trợ khác (= thoả thuận − LCB − PC − cơm) chia theo công (+1 ngày nếu làm lễ); trừ đi trễ theo giờ
   *  BHXH: chỉ HĐ chính thức (CT) có công thường + giờ làm lễ ≥ 14, đóng trên LCB + PC; KPCĐ 2% công ty
   *  Thuế: CT luỹ tiến trên (gross − OT − cơm − ca đêm − đêm lễ − BHXH − giảm trừ); thử việc (TV) 10% gross; dưới 5 triệu không khấu trừ */
  calc2(r, s, P){
    P = P || r._p || this.v2Params();
    const rd = Math.round, mv = r.manual || {};
    const N = +r.std || P.std, O = +r.hours || P.hours, H = +r.agreed || 0, I = +r.base || 0, J = +r.allowance || 0, K = +r.meal || 0;
    const L = r.other !== undefined && r.other !== '' && r.other !== null ? +r.other : H - I - J - K;
    let Pw = +r.work || 0; if (+r.maxWork) Pw = Math.min(+r.maxWork, Pw);
    const Q = +r.leave || 0, R = +r.holiday || 0, Sh = +r.holidayHours || 0, V = +r.nightNormal || 0, W = +r.nightOff || 0, X = +r.nightHoliday || 0;
    const Z = +r.late || 0, AA = +r.otNormal || 0, AB = +r.otOff || 0, AC = +r.otHoliday || 0;
    const day = (I + J) / N, hr = day / O, plus = Sh > 0 ? 1 : 0;
    const parts = { AD: rd(day * Pw), AE: rd(day * Q), AF: rd(day * R), AG: rd(hr * Sh * P.holidayRate), AH: rd(hr * AA * P.otNormal + hr * AB * P.otOff + hr * AC * P.otHoliday),
      AI: rd(K / N * (Pw + plus)), AJ: rd(hr * (V + W) * P.night), AK: rd(hr * X * P.nightHoliday), AL: rd(L / N * (Pw + plus)), AM: rd((I + J + L) / N / O * Z) };
    const bonus = +r.bonus || 0;
    const gross = parts.AD + parts.AE + parts.AF + parts.AG + parts.AH + parts.AI + parts.AJ + parts.AK + parts.AL - parts.AM + bonus + (+mv.grossAdj || 0);
    const CT = r.contract === 'CT';
    const ins = mv.insured != null ? mv.insured : (CT && (Pw + Sh) >= P.minDaysBhxh ? I + J : 0);
    const bhEmp = mv.bhEmp != null ? mv.bhEmp : ins * s.rateEmp / 100, bhCo = ins * s.rateCo / 100, union = ins * P.unionRate / 100;
    const deduct = CT ? s.selfDeduct + (+r.deps || 0) * s.depDeduct : 0;
    const AX = rd(CT ? gross - parts.AH - parts.AI - parts.AJ - parts.AK : gross);
    const AY = rd(AX < P.taxMin ? 0 : CT ? Math.max(0, AX - bhEmp - deduct) : AX);
    let tax = rd(CT ? this.progressive(AY, s.brackets) : AY * s.flatTaxRate / 100);
    if (mv.tax != null) tax = mv.tax;
    const net = gross - bhEmp - (+r.unionFee || 0) - tax - (+r.advance || 0) - (+r.otherDeduct || 0);
    return { v2: true, F: N, H: Pw, workUsed: Pw, other: L, parts, P1: 0, P2: 0, P3: 0, extra: 0, bonus, gross, ins, bhEmp, bhCo, union, back: 0, taxable: AY, deduct, tax, net };
  },
  rowFromEmp2(e){ const sal = e.salary || {}; return { v2: true, empId: e.id, code: e.code, name: e.fullName, dept: e.dept, title: e.title, contract: e.status === 'chinh_thuc' ? 'CT' : 'TV', std: this.v2Params().std, hours: this.v2Params().hours, maxWork: this.deptMax(e.dept),
    agreed: sal.agreed || 0, base: sal.base || 0, allowance: sal.allowance || 0, meal: sal.meal != null && sal.meal !== '' ? +sal.meal : 700000, work: this.v2Params().std, leave: 0, holiday: 0, holidayHours: 0, sick: 0, unpaid: 0, nightNormal: 0, nightOff: 0, nightHoliday: 0, late: 0, otNormal: 0, otOff: 0, otHoliday: 0,
    deps: (e.tax || {}).dependents || 0, bonus: 0, unionFee: 0, advance: 0, otherDeduct: 0, status: e.status }; },
  calc(r, s){
    if (r.v2) return this.calc2(r, s);
    const F = +r.std || s.stdDays, work = +r.work || 0, TT = +r.agreed || 0, LP = (+r.base || 0) + (+r.allowance || 0);
    const H = Math.min(work, F);
    let P1, P2 = 0, P3 = 0;
    if (r.calc === 'sx'){
      const denom = F / 26 * s.monthDays, I = Math.max(0, Math.min(work, s.monthDays) - F);
      const inStd = TT ? Math.round(TT * H / denom) : 0;
      P1 = !r.base ? 0 : TT ? Math.min(Math.round(LP * H / F), inStd) : Math.round(LP * H / F);
      P2 = TT && work > 0 ? inStd - P1 : 0;
      P3 = TT && I > 0 ? Math.round(TT * I / denom) : 0;
    } else {
      P1 = !r.base ? 0 : Math.round(LP * H / F);
      P2 = TT && work > 0 ? Math.round(TT * H / F) - P1 : 0;
    }
    const mv = r.manual || {};
    if (mv.P1 != null) P1 = mv.P1; if (mv.P2 != null) P2 = mv.P2; if (mv.P3 != null) P3 = mv.P3;
    const extra = mv.extra != null ? mv.extra : r.extra168 ? Math.round(LP * s.extraRate / 100) : 0;
    const bonus = +r.bonus || 0;
    const gross = P1 + P2 + P3 + extra + bonus;
    const ins = Math.min(+r.insured || 0, s.bhxhCap || Infinity);
    const bhEmp = Math.round(ins * s.rateEmp / 100), bhCo = Math.round(ins * s.rateCo / 100);
    const back = +r.bhytBack || 0;
    const taxable = gross - bhEmp - back;
    let deduct = 0, tax = 0;
    if (r.method === 'luy_tien'){ deduct = s.selfDeduct + (+r.deps || 0) * s.depDeduct; tax = Math.round(this.progressive(Math.max(0, taxable - deduct), s.brackets)); }
    else if (r.method === 'flat10'){ tax = taxable >= s.flatTaxMin ? Math.round(taxable * s.flatTaxRate / 100) : 0; }
    if (mv.tax != null) tax = mv.tax;
    const net = gross - bhEmp - tax - (+r.advance || 0) - back - (+r.otherDeduct || 0);

/* ---------- Tự nhập file lương có sẵn trong dự án Apps Script (chỉ chạy 1 lần mỗi file) ---------- */
const AutoSeed = {
  async run(){
    if (!IS_GAS) return;
    let list = [];
    try { list = JSON.parse(await gs('pendingImports')) || []; } catch (e) { return; }
    for (const it of list){
      const flag = 'seed_' + it.id;
      if (DB.get('settings', flag)) continue;
      if (DB.get('payrolls', it.month)){ await DB.save('settings', { id: flag, at: U.today(), skipped: 'Đã có bảng lương ' + it.month }); continue; }
      try {
        const bin = atob(it.b64), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        const file = new File([buf], it.name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const res = await Imp.parse(file);
        const r = await Imp.apply(res, { overwriteStatus: false });
        await DB.save('settings', { id: flag, at: new Date().toISOString(), file: it.name, added: r.added, updated: r.updated });
        UI.toast('Đã tự nhập bảng lương ' + U.ymLabel(it.month) + ' từ file ' + it.name + ' (' + r.added + ' người mới, ' + r.updated + ' cập nhật)', 8000);
      } catch (e) { UI.toast('Không tự nhập được ' + it.name + ': ' + (e.message || e), 8000); }
    }
  }
};

/* ---------- Khoá bảng lương (mật khẩu quản lý lương) ---------- */
const PayLock = {
  async hasPin(){ return IS_GAS ? !!(await gs('hasPayrollPin')) : !!DB.get('settings', 'pay_pin'); },
  async hash(salt, pin){
    const data = new TextEncoder().encode(salt + '|' + pin);
    if (window.crypto && crypto.subtle){ const d = await crypto.subtle.digest('SHA-256', data); return btoa(String.fromCharCode(...new Uint8Array(d))); }
    let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return String(h);
  },
  async checkLocal(pin){ const p = DB.get('settings', 'pay_pin'); if (!p) throw new Error('Chưa đặt mật khẩu quản lý lương'); if (await this.hash(p.salt, pin) !== p.hash) throw new Error('Sai mật khẩu quản lý lương'); },
  async setPin(oldPin, newPin){
    if (String(newPin || '').length < 6) throw new Error('Mật khẩu tối thiểu 6 ký tự');
    if (IS_GAS) return gs('setPayrollPin', oldPin, newPin);
    if (DB.get('settings', 'pay_pin')) await this.checkLocal(oldPin);
    const salt = U.id();
    await DB.save('settings', { id: 'pay_pin', salt, hash: await this.hash(salt, newPin) });
  },
  async setPinDialog(after){
    const has = await this.hasPin();
    UI.modal(has ? 'Đổi mật khẩu quản lý lương' : 'Đặt mật khẩu quản lý lương',
      (has ? '' : '<p>Cần đặt mật khẩu trước khi khoá bảng lương. Chỉ người biết mật khẩu mới mở khoá được.</p>') +
      '<div class="form" style="grid-template-columns:1fr">' + (has ? '<label class="f">Mật khẩu hiện tại<input type="password" id="pin_old" autocomplete="current-password"></label>' : '') +
      '<label class="f">Mật khẩu mới (tối thiểu 6 ký tự)<input type="password" id="pin_new" autocomplete="new-password"></label><label class="f">Nhập lại mật khẩu mới<input type="password" id="pin_new2" autocomplete="new-password"></label></div>',
      [{ t: 'Huỷ' }, { t: 'Lưu mật khẩu', cls: 'pri', fn: async w => {
        const o = has ? w.querySelector('#pin_old').value : '', n = w.querySelector('#pin_new').value, n2 = w.querySelector('#pin_new2').value;
        if (n !== n2) throw new Error('Hai lần nhập mật khẩu mới không khớp');
        await this.setPin(o, n); UI.toast('Đã lưu mật khẩu quản lý lương');
        if (after) setTimeout(after, 50);
      } }], { size: 'sm' });
  },
  async lock(doc){
    if (!await this.hasPin()){ this.setPinDialog(() => this.lock(doc)); return; }
    const s = DB.settings(), net = U.sum(doc.rows, r => Pay.calc(r, s).net);
    UI.modal('Khoá bảng lương ' + U.ymLabel(doc.month), '<p>Bảng lương có <b>' + doc.rows.length + '</b> người, tổng thực lãnh <b>' + U.money(net) + 'đ</b>.</p><p>Sau khi khoá, <b>không ai sửa, xoá hay nhập đè</b> được bảng lương này. Vẫn xem, in phiếu lương và xuất Excel được. Chỉ mở khoá được bằng mật khẩu quản lý lương.</p>',
      [{ t: 'Huỷ' }, { t: '🔒 Khoá bảng lương', cls: 'pri', fn: async () => {
        const body = Object.assign({}, doc); delete body.id; body.lockedNet = net;
        let res;
        if (IS_GAS) res = Object.assign(JSON.parse(await gs('lockPayroll', doc.id, JSON.stringify(body))), { id: doc.id });
        else { res = Object.assign(body, { id: doc.id, locked: true, lockedAt: new Date().toISOString(), lockedBy: '' }); await DB.save('payrolls', res, { force: true }); }
        DB._put('payrolls', res); UI.toast('Đã khoá bảng lương ' + U.ymLabel(doc.month)); App.refresh();
      } }], { size: 'sm' });
  },
  unlock(doc){
    UI.modal('Mở khoá bảng lương ' + U.ymLabel(doc.month), '<label class="f">Mật khẩu quản lý lương<input type="password" id="pin_un" autocomplete="current-password"></label><p class="small muted">Sau khi sửa xong, nhớ khoá lại.</p>',
      [{ t: 'Huỷ' }, { t: 'Mở khoá', cls: 'pri', fn: async w => {
        const pin = w.querySelector('#pin_un').value;
        let res;
        if (IS_GAS) res = Object.assign(JSON.parse(await gs('unlockPayroll', doc.id, pin)), { id: doc.id });
        else { await this.checkLocal(pin); res = Object.assign({}, doc, { locked: false, unlockedAt: new Date().toISOString() }); await DB.save('payrolls', res, { force: true }); }
        DB._put('payrolls', res); UI.toast('Đã mở khoá bảng lương ' + U.ymLabel(doc.month)); App.refresh();
      } }], { size: 'sm' });
  }
};

        { t: 'Bình quân', n: 1, f: d => { const l = byDept.get(d).filter(e => (e.salary || {}).agreed); return l.length ? U.money(U.sum(l, e => e.salary.agreed) / l.length) : ''; } },

        { t: '% quỹ lương', n: 1, f: d => fund ? U.pct(U.sum(byDept.get(d), e => (e.salary || {}).agreed) / fund * 100, 1) : '' },
        ...(lastPay ? [{ t: 'Thực chi ' + U.ymLabel(lastPay.month), n: 1, f: d => U.money(U.sum(payRes.filter(x => x[0].dept === d), x => x[1].gross)) }] : [])
      ], [...byDept.keys()].sort((a, b) => Rec.depts().indexOf(a) - Rec.depts().indexOf(b)), { foot: '<td>Tổng</td><td class="n">' + act.length + '</td><td class="n">' + act.filter(e => e.status === 'thu_viec').length + '</td><td class="n">' + act.filter(e => e.bhxh && e.bhxh.joined).length + '</td><td class="n">' + U.money(fund) + '</td><td></td><td></td><td class="n">100%</td>' + (lastPay ? '<td class="n">' + U.money(U.sum(payRes, x => x[1].gross)) + '</td>' : '') }) + '</div>' +
      '<div class="grid g2"><div class="card"><h3>Số người theo bộ phận</h3>' + UI.hbars([...byDept.entries()].map(([k, v]) => [k, v.length]).sort((a, b) => b[1] - a[1])) + '</div>' +
      '<div class="card"><h3>Quỹ lương thoả thuận theo bộ phận</h3>' + UI.hbars([...byDept.entries()].map(([k, v]) => [k, U.sum(v, e => (e.salary || {}).agreed)]).sort((a, b) => b[1] - a[1]), U.mil) + '</div>' +
      '<div class="card"><h3>Thâm niên</h3>' + UI.hbars(['Dưới 6 tháng', '6 – 12 tháng', '1 – 3 năm', 'Trên 3 năm', 'Chưa rõ'].filter(k => sen.has(k)).map(k => [k, sen.get(k).length])) + '</div>' +
      '<div class="card"><h3>Cấp bậc theo thang lương</h3>' + (grade.size ? UI.table([{ t: 'Cấp', f: g => U.esc(g) }, { t: 'Số người', n: 1, f: g => grade.get(g).length }, { t: 'LCB bình quân', n: 1, f: g => U.money(U.sum(grade.get(g), e => (e.salary || {}).base) / grade.get(g).length) }, { t: 'Lương TT bình quân', n: 1, f: g => U.money(U.sum(grade.get(g), e => (e.salary || {}).agreed) / grade.get(g).length) }], [...grade.keys()].sort()) : '<div class="empty">Chưa khai báo cấp – bậc trong hồ sơ</div>') + '</div></div>' +
      '<div class="card"><h3>Biến động nhân sự 12 tháng</h3>' + UI.table([{ t: 'Tháng', f: m => U.ymLabel(m) }, { t: 'Vào làm', n: 1, f: m => all.filter(e => U.ym(e.startDate) === m).length }, { t: 'Nghỉ việc', n: 1, f: m => all.filter(e => U.ym(e.endDate) === m).length }, { t: 'Cuối tháng', n: 1, f: m => { const last = U.iso(new Date(+m.slice(0, 4), +m.slice(5, 7), 0)); return all.filter(e => (!e.startDate || e.startDate <= last) && (!e.endDate || e.endDate > last)).length; } }, { t: 'Quỹ lương thực chi', n: 1, f: m => { const d = DB.get('payrolls', m); return d ? U.money(U.sum(d.rows, r => Pay.calc(r, s).gross)) : ''; } }], last12) + '</div>';
  }
};

/* ---------- Báo cáo Giám đốc ---------- */
const Report = {
  build(from, to, extra){
    const s = DB.settings(), today = U.today();
    const inR = d => d && d >= from && d <= to;
    const reqs = Rec.reqs().filter(r => r.status !== 'huy'), cands = Rec.cands(), emps = Emp.all();
    const recv = cands.filter(c => inR(c.receivedDate));
    const reached = (c, st) => (c.history || []).some(h => h.stage === st && inR(h.date));
    const funnel = [['CV nhận được', recv.length], ['Đạt sàng lọc', cands.filter(c => reached(c, 'sang_loc')).length], ['Được hẹn phỏng vấn', cands.filter(c => reached(c, 'hen_pv')).length], ['Đạt phỏng vấn', cands.filter(c => reached(c, 'dat_pv')).length], ['Nhận việc', cands.filter(c => reached(c, 'nhan_viec')).length], ['Đạt thử việc', cands.filter(c => reached(c, 'dat_tv')).length]];
    const src = U.groupBy(recv, c => c.source || 'Không rõ');

    const joined = emps.filter(e => inR(e.startDate)), left = emps.filter(e => inR(e.endDate));
    const head0 = emps.filter(e => (!e.startDate || e.startDate < from) && (!e.endDate || e.endDate >= from)).length;
    const turnover = head0 ? left.length / ((head0 + act.length) / 2) * 100 : 0;
    const iss = Legal.issues();
    const ctrSoon = act.map(e => ({ e, c: Emp.curContract(e) })).filter(x => x.c && x.c.end && x.c.type !== 'thu_viec' && x.c.end <= U.addDays(today, s.alertContract));
    const probs = emps.filter(e => e.probation && e.probation.eval && inR(e.probation.eval.date));
    const pm = DB.all('payrolls').map(x => x.id).filter(m => m <= U.ym(to)).sort().pop();

    const byDept = U.groupBy(act, e => e.dept || '—');

/* ---------- Nhập dữ liệu từ file lương Excel (mẫu "Lương T8 mới.xlsx") ---------- */
const Imp = {
  deptFromBlock(txt){
    const n = U.norm(txt.replace(/^KHỐI\s*:\s*/i, '').replace(/\(.*$/, ''));
    const s = DB.settings();
    const hit = s.depts.find(d => U.norm(d.name) === n) || s.depts.find(d => n && (U.norm(d.name).includes(n) || n.includes(U.norm(d.name))));
    if (hit) return hit.name;
    const name = txt.replace(/^KHỐI\s*:\s*/i, '').replace(/\(.*$/, '').trim().toLowerCase().replace(/(^|\s|\/)\S/g, x => x.toUpperCase());
    s.depts.push({ name, calc: /van phong/.test(n) ? 'vp' : 'sx' });
    return name;
  },
  async parse(file){
    if (!Xls.ok()) throw new Error('Thiếu thư viện đọc Excel');
    const wb = XLSX.read(await U.readAsArrayBuffer(file), { type: 'array', cellDates: true });
    for (const n of wb.SheetNames){

      '<label class="f">Giảm trừ bản thân<input name="selfDeduct" value="' + s.selfDeduct + '"></label><label class="f">Giảm trừ người phụ thuộc<input name="depDeduct" value="' + s.depDeduct + '"></label><label class="f">Số ngày quy đổi lương tháng (khối SX)<input name="monthDays" value="' + s.monthDays + '"></label>' +
      '<label class="f">Thuế khấu trừ cố định (%)<input name="flatTaxRate" value="' + s.flatTaxRate + '"></label><label class="f">Ngưỡng khấu trừ cố định (đ/lần)<input name="flatTaxMin" value="' + s.flatTaxMin + '"></label>' +
      '<label class="f">Biểu thuế luỹ tiến (mức trần:thuế suất, cách nhau dấu ;)<input name="brackets" value="' + U.esc(s.brackets.map(b => (b[0] == null ? '*' : b[0]) + ':' + b[1]).join('; ')) + '"></label>' +
      '<label class="f">Cảnh báo HĐ trước (ngày)<input name="alertContract" value="' + s.alertContract + '"></label><label class="f">Cảnh báo thử việc trước (ngày)<input name="alertProbation" value="' + s.alertProbation + '"></label></div></div>' +
      '<div class="card"><h3>Bộ phận / khối</h3><p class="small muted">Cách tính lương: <b>sx</b> = khối sản xuất (tách P3 khi vượt công chuẩn, quy đổi 31 ngày); <b>vp</b> = khối văn phòng. Từ T9/2026 dùng cơ cấu mới cho mọi bộ phận; ô "Công thường tối đa" giới hạn số công thường được tính lương (file T9: Kho vận & Giao hàng, Sản xuất = 28).</p><div id="sdepts"></div><button class="btn sm" id="sadd">+ Thêm bộ phận</button></div>' +
      '<div class="card"><h3>Tiêu chí phiếu đánh giá</h3><div class="grid g2"><label class="f">Phỏng vấn (mỗi dòng: tên tiêu chí | trọng số %)<textarea name="evalCriteria" style="min-height:150px">' + U.esc(s.evalCriteria.map(c => c.name + ' | ' + c.w).join('\n')) + '</textarea></label><label class="f">Thử việc (mỗi dòng 1 tiêu chí)<textarea name="probCriteria" style="min-height:150px">' + U.esc(s.probCriteria.join('\n')) + '</textarea></label></div></div>' +
      '<div class="toolbar"><button class="btn pri" id="ssave">Lưu cài đặt</button></div>' +
      '<div class="card"><h3>Mật khẩu quản lý lương</h3><p class="small muted">Dùng để mở khoá bảng lương đã khoá. ' + (IS_GAS ? 'Lưu dạng mã hoá trong cài đặt của dự án Apps Script, không nằm trong Google Sheet.' : 'Chế độ trình duyệt: chỉ bảo vệ trên máy này.') + ' Quên mật khẩu: người sở hữu dự án vào Apps Script → Cài đặt dự án → Thuộc tính tập lệnh, xoá dòng PAY_PIN rồi đặt lại.</p><button class="btn" id="spin">Đặt / đổi mật khẩu</button></div>' +
      '<div class="card"><h3>Sao lưu & khôi phục</h3><div class="toolbar"><button class="btn" id="bk">Tải bản sao lưu (.json)</button><div id="rs" style="flex:1"></div>' + (IS_GAS ? '' : '<button class="btn danger" id="wipe">Xoá toàn bộ dữ liệu trên trình duyệt này</button>') + '</div>' +
      '<p class="small muted">Chế độ hiện tại: <b>' + (IS_GAS ? 'Google Apps Script – dữ liệu ở Google Sheet, CV ở Google Drive' : 'trình duyệt (localStorage + IndexedDB)') + '</b>. Bản sao lưu chứa lương, số tài khoản ngân hàng – chỉ lưu ở nơi an toàn, không đưa lên kho mã công khai.</p></div>';
    const drawD = () => { el.querySelector('#sdepts').innerHTML = s.depts.map((d, i) => '<div class="toolbar"><input data-dn="' + i + '" value="' + U.esc(d.name) + '" style="min-width:260px"><select data-dc="' + i + '" style="min-width:0">' + U.opts([{ v: 'sx', t: 'sx – sản xuất' }, { v: 'vp', t: 'vp – văn phòng' }], d.calc) + '</select><label class="small muted">Công thường tối đa (T9+) <input data-dm="' + i + '" type="number" value="' + U.esc(d.maxWork || '') + '" style="width:70px;min-width:0"></label><button class="btn sm ghost danger" data-dx="' + i + '">Xoá</button></div>').join('');
      el.querySelectorAll('[data-dm]').forEach(x => x.onchange = () => s.depts[+x.dataset.dm].maxWork = +x.value || '');
      el.querySelectorAll('[data-dn]').forEach(x => x.onchange = () => s.depts[+x.dataset.dn].name = x.value.trim());
      el.querySelectorAll('[data-dc]').forEach(x => x.onchange = () => s.depts[+x.dataset.dc].calc = x.value);
      el.querySelectorAll('[data-dx]').forEach(x => x.onclick = () => { s.depts.splice(+x.dataset.dx, 1); drawD(); }); };
    drawD();
    el.querySelector('#sadd').onclick = () => { s.depts.push({ name: 'Bộ phận mới', calc: 'vp' }); drawD(); };
    el.querySelector('#ssave').onclick = async () => {
      const f = U.formData(el.querySelector('#main') || el);
      ['company', 'address', 'hrEmail', 'hrPhone', 'directorName', 'directorEmail'].forEach(k => s[k] = f[k]);
      ['regionWage', 'bhxhCap', 'stdDays', 'rateEmp', 'rateCo', 'extraRate', 'selfDeduct', 'depDeduct', 'monthDays', 'flatTaxRate', 'flatTaxMin', 'alertContract', 'alertProbation'].forEach(k => s[k] = Number(String(f[k]).replace(/[^\d.]/g, '')) || 0);
      s.brackets = f.brackets.split(';').map(x => x.split(':').map(y => y.trim())).filter(x => x.length === 2).map(([a, b]) => [a === '*' ? null : Number(a.replace(/\D/g, '')), Number(b)]);
      if (!s.brackets.length || s.brackets[s.brackets.length - 1][0] != null) s.brackets.push([null, 35]);
      s.evalCriteria = f.evalCriteria.split('\n').map(l => l.split('|')).filter(x => x[0].trim()).map(x => ({ name: x[0].trim(), w: Number(x[1]) || 10 }));
      s.probCriteria = f.probCriteria.split('\n').map(x => x.trim()).filter(Boolean);
      s.depts = s.depts.filter(d => d.name);
      await DB.save('settings', s); UI.toast('Đã lưu cài đặt'); App.refresh();
    };
    UI.fileDrop(el.querySelector('#impx'), false, '.xlsx,.xls', async files => {
      const box = el.querySelector('#impres');
      try {
        box.innerHTML = '<p>Đang đọc…</p>';
        const res = await Imp.parse(files[0]);
        const exist = new Set(Emp.all().map(e => e.code));
        const byD = U.groupBy(res.rows, r => r.dept);
        box.innerHTML = '<div class="alert info">Sheet <b>' + U.esc(res.sheet) + '</b> – ' + (res.month ? U.ymLabel(res.month) : 'không xác định tháng') + ': <b>' + res.rows.length + '</b> nhân viên (' + res.rows.filter(r => !exist.has(r.code)).length + ' mới, ' + res.rows.filter(r => exist.has(r.code)).length + ' cập nhật). ' + [...byD.entries()].map(([k, v]) => U.esc(k) + ': ' + v.length).join(' · ') + '</div>' +
          UI.table([{ t: 'Mã', f: r => U.esc(r.code) + (r.newCode ? ' <span class="tag warn">mã mới</span>' : '') }, { t: 'Họ tên', f: r => U.esc(r.name) }, { t: 'Khối', f: r => U.esc(r.dept) }, { t: 'Chức danh', f: r => U.esc(r.title) }, { t: 'Trạng thái', f: r => UI.tag(empStatusOf(r.status)) }, { t: 'Vào làm', f: r => U.fd(r.startDate) }, { t: 'Lương TT', n: 1, f: r => U.money(r.agreed) }, { t: 'BHXH', f: r => r.insured ? U.money(r.insured) : '' }, { t: 'Thực lãnh', n: 1, f: r => U.money(r.net) }], res.rows, { maxH: 360 }) +
          '<div class="toolbar" style="margin-top:10px"><label><input type="checkbox" id="impst"> Ghi đè trạng thái/ngày nghỉ của nhân viên đã có</label><span class="grow"></span><button class="btn pri" id="impgo">Nhập ' + res.rows.length + ' nhân viên' + (res.month ? ' + bảng lương ' + U.ymLabel(res.month) : '') + '</button></div>';
        box.querySelector('#impgo').onclick = async () => {
          const r = await Imp.apply(res, { overwriteStatus: box.querySelector('#impst').checked });
          box.innerHTML = '<div class="alert ok">Đã nhập: ' + r.added + ' nhân viên mới, ' + r.updated + ' cập nhật.' + (r.payLocked ? ' Bảng lương ' + U.ymLabel(res.month) + ' đang khoá nên KHÔNG bị ghi đè.' : res.month ? ' Bảng lương ' + U.ymLabel(res.month) + ' đã tạo' + (res.scheme === 'v2' ? ' theo cơ cấu mới (ngày công/giờ, OT, ca đêm, lễ)' : '') + (r.manual ? ' (' + r.manual + ' dòng giữ nguyên một số khoản từ file vì khác công thức chuẩn)' : ' – khớp 100% công thức') + '.' : '') + ' <a href="#/emps">Xem hồ sơ nhân sự</a> · <a href="#/legal">Xem cảnh báo pháp lý</a></div>';
          App.renderNav();
        };
      } catch (e) { box.innerHTML = '<div class="alert bad">' + U.esc(e.message) + '</div>'; }
    });
    el.querySelector('#spin').onclick = () => PayLock.setPinDialog();
    el.querySelector('#bk').onclick = () => U.dl('nhan-su-an-tam_sao-luu_' + U.today() + '.json', JSON.stringify({ app: 'nhan-su-an-tam', at: new Date().toISOString(), data: DB.data }, null, 1), 'application/json');
    UI.fileDrop(el.querySelector('#rs'), false, '.json', async files => {
      try {
        const j = JSON.parse(await U.readAsText(files[0])), d = j.data || j;
        const list = []; COLLECTIONS.forEach(c => (d[c] || []).forEach(x => x && x.id && !DB.lockedPayroll(c, x.id) && list.push([c, x])));
        if (!await UI.confirm('Khôi phục ' + list.length + ' bản ghi từ file? Bản ghi trùng mã sẽ bị ghi đè.')) return;
        await DB.saveMany(list); UI.toast('Đã khôi phục ' + list.length + ' bản ghi'); App.refresh();
      } catch (e) { UI.toast('File không hợp lệ: ' + e.message); }
    });
    const w = el.querySelector('#wipe'); if (w) w.onclick = async () => { if (!await UI.confirm('Xoá toàn bộ dữ liệu nhân sự trên trình duyệt này?')) return; localStorage.removeItem(LS_KEY); location.reload(); };
  }
};

/* ---------- Khởi động ---------- */
(async function init(){
  try {
    await DB.load();
    await AutoSeed.run();
    if (!location.hash) history.replaceState(null, '', '#/dashboard');
    App.route();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="alert bad">Không tải được dữ liệu: ' + U.esc(e.message || e) + '</div>';
  }
})();
</script>
</body>
</html>
