<title>Kho vận An Tâm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gom dữ liệu Đóng hàng, Kho và Giao hàng An Tâm – có Trợ lý AI hỏi đáp số liệu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bố cục: thanh trên (tên + độ mới dữ liệu) → tab → nội dung từng tab; điện thoại xếp 1 cột */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #18232b; --muted: #5d6b73; --line: #dbe2e0;
  --accent: #0f6b5c; --accent-ink: #ffffff; --accent-soft: #e2f1ed;
  --amber: #b45309; --amber-soft: #fdf1e1; --bad: #b42318; --bad-soft: #fde8e6; --ok: #137a3f; --ok-soft: #e3f4ea;
  --chat-me: #e2f1ed; --chat-ai: #ffffff; --shadow: 0 12px 32px rgba(16, 35, 43, .18);
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181c; --panel: #182226; --ink: #e5ecea; --muted: #9aa9ae; --line: #2a3a40;
  --accent: #3fb59d; --accent-ink: #0c1512; --accent-soft: #173a33;
  --amber: #f0a64b; --amber-soft: #3a2a15; --bad: #f2867b; --bad-soft: #3d1f1c; --ok: #6fd39a; --ok-soft: #173525;
  --chat-me: #173a33; --chat-ai: #1d292e; --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11181c; --panel: #182226; --ink: #e5ecea; --muted: #9aa9ae; --line: #2a3a40;
  --accent: #3fb59d; --accent-ink: #0c1512; --accent-soft: #173a33;
  --amber: #f0a64b; --amber-soft: #3a2a15; --bad: #f2867b; --bad-soft: #3d1f1c; --ok: #6fd39a; --ok-soft: #173525;
  --chat-me: #173a33; --chat-ai: #1d292e; --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 18px/1.5 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .55; cursor: default; }
.muted { color: var(--muted); } .small { font-size: 15.5px; }
.mono { font-family: var(--f-mono); font-size: 15px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type=text], input[type=password], input[type=search], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; min-width: 0; }

/* đăng nhập */
.login { max-width: 380px; margin: 8vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: grid; gap: 12px; }
.login .mark { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; letter-spacing: .5px; }
.login label { display: grid; gap: 4px; font-size: 15.5px; color: var(--muted); }
.err { color: var(--bad); font-size: 16px; min-height: 1em; margin: 0; }

/* khung chính */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 15.5px; }
.brand h1 { font-size: 23px; }
.fresh { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
@media (max-width: 600px) { .fresh { order: 3; flex-basis: 100%; } .brand { flex: 1; } .brand h1, .brand .small { white-space: nowrap; } .top .btn { padding: 6px 10px; } }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 15px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { border: 0; background: none; padding: 10px 14px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar .grow { flex: 1; min-width: 160px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-size: 29px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 15px; color: var(--muted); }
.kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--amber); } .kpi.ok b { color: var(--ok); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h3 { font-size: 18px; margin-bottom: 8px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap; }
tr.sum td { font-weight: 700; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.qty { display: flex; flex-wrap: wrap; gap: 4px; }
.qty span { background: var(--bg); border-radius: 6px; padding: 0 6px; font-size: 15px; white-space: nowrap; }

/* báo cáo tổng quan các bộ phận – đầu mỗi tab */
.rep { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
.rep-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.rep-h b { font-size: 19px; }
.rep-h .sub { flex: 1; min-width: 200px; font-size: 15px; color: var(--muted); }
.rep-h button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; font-size: 15.5px; }
.rep-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(270px, 100%), 1fr)); gap: 10px; margin-top: 10px; }
.dept { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; background: var(--bg); min-width: 0; }
.dept.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel); }
.dept-h { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.dept-h span { flex: 1; }
.dept-h button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 15.5px; padding: 2px 4px; }
.dept .big { font-size: 15.5px; color: var(--muted); }
.dept .big b { font-size: 31px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.dept .big b.bad { color: var(--bad); } .dept .big b.ok { color: var(--ok); } .dept .big b.warn { color: var(--amber); }
.dept table { font-size: 15px; }
.dept th, .dept td { padding: 3px 6px; }
.dept td.num b { font-size: 16px; }
.pbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.pbar i { display: block; height: 100%; } .pbar .ok { background: var(--ok); } .pbar .bad { background: var(--bad); }
.rep-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* trợ lý AI */
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; }
.msgs { display: grid; gap: 10px; align-content: start; min-height: 240px; }
.msg { max-width: min(760px, 100%); border-radius: 14px; padding: 10px 14px; border: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.msg.me { background: var(--chat-me); justify-self: end; border-color: transparent; }
.msg.ai { background: var(--chat-ai); }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin: 0; }
.msg.ai ul, .msg.ai ol { margin: 0 0 8px; padding-left: 20px; }
.msg .tool { font-size: 14.5px; color: var(--muted); margin-top: 6px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 15.5px; }
.ask { display: flex; gap: 8px; align-items: flex-end; }
.ask textarea { flex: 1; resize: vertical; min-height: 46px; max-height: 200px; }
/* cửa sổ trợ lý nhỏ ở góc – hỏi ngay tại tab đang xem */
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 19;
  border: 0; border-radius: 999px; padding: 12px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: var(--shadow); }
.dock { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  width: min(400px, calc(100vw - 32px)); height: min(600px, calc(100vh - 96px)); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.dock-h { display: flex; align-items: center; gap: 8px; }
.dock-h b { flex: 1; min-width: 0; font-size: 18px; }
.dock-h .ctx { display: block; font-weight: 400; font-size: 14.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-h button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 9px; font-size: 15.5px; }
.dock .msgs { overflow-y: auto; min-height: 0; padding-right: 2px; }
.dock .msg { max-width: 100%; font-size: 17px; padding: 8px 11px; }
.dock .suggest button { font-size: 15px; padding: 4px 10px; }
.dock .ask textarea { min-height: 42px; max-height: 120px; }
.dock .empty { padding: 16px; font-size: 16px; }
@media (max-width: 600px) {
  .dock { right: 0; left: 0; bottom: 0; width: auto; height: min(78vh, calc(100vh - 40px)); border-radius: 16px 16px 0 0;
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
}
/* ảnh giao hàng */
.ph { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ph button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: 64px; height: 64px; background: var(--bg); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .wait { font-size: 13px; color: var(--muted); display: grid; place-items: center; height: 100%; padding: 4px; text-align: center; }
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 18, .88); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); color: #fff; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; border-radius: 8px; }
.lb .lb-bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.lb button { background: rgba(255, 255, 255, .14); color: #fff; border: 0; border-radius: 9px; padding: 8px 14px; }
@media (prefers-reduced-motion: no-preference) { .dots::after { content: "…"; animation: blink 1s steps(3) infinite; } @keyframes blink { 50% { opacity: .3; } } }
</style>
<style>
/* chữ to hơn 15% trên máy tính */
@media (min-width: 1024px) {

<div class="wrap">
  <section class="login" id="login" hidden>
    <div class="mark">KV</div>
    <div><h2 style="font-size:20px">Kho vận An Tâm</h2><p class="muted small" style="margin:4px 0 0">Đơn hàng · Tồn kho · Giao hàng · Trợ lý AI</p></div>
    <form id="lg" autocomplete="on" style="display:grid;gap:10px">
      <label>Tài khoản<input type="text" id="lg-u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Mật khẩu<input type="password" id="lg-p" name="password" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit" id="lg-b">Đăng nhập</button>
      <p class="err" id="lg-e"></p>
    </form>
  </section>

  <section id="main" hidden>
    <div class="top">
      <div class="brand"><div class="mark">KV</div><div><h1>Kho vận An Tâm</h1><div class="small muted" id="who"></div></div></div>
      <div class="fresh" id="fresh"></div>
      <button class="btn" id="reload" title="Tải lại dữ liệu">↻ Tải lại</button>
      <button class="btn" id="logout">Đăng xuất</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="tq">Tổng quan</button><button data-tab="don">Đơn hàng</button><button data-tab="ton">Tồn kho</button>
      <button data-tab="giao">Giao hàng</button><button data-tab="ai">🤖 Trợ lý AI</button>
    </nav>
    <div id="rep"></div>
    <div id="view"></div>
    <button class="fab" id="fab" type="button" aria-controls="dock">🤖 Hỏi trợ lý</button>
    <section class="dock" id="dock" hidden aria-label="Trợ lý AI">
      <div class="dock-h"><b>🤖 Trợ lý AI<span class="ctx" id="dock-ctx"></span></b><button type="button" id="dock-big" title="Mở tab Trợ lý AI">⤢</button><button type="button" id="dock-x" aria-label="Thu nhỏ">✕</button></div>
      <div id="dock-body" style="display:contents"></div>
    </section>
  </section>
  <p id="boot" class="muted">Đang kết nối dữ liệu…</p>

<script>
'use strict';
/* Kho vận An Tâm – gói dữ liệu của 3 web (Đóng hàng, Kho, Giao hàng An Tâm) trong kho dữ liệu của trang này:
     goi/kho          gói tồn kho hôm nay (web Kho ghi "khovan/kho", tác vụ định kỳ chép sang)
     goi/dh-<mã>      đơn hàng ngày / tuyến kebab 123 đã chia tuyến (web Đóng hàng "khoout/<mã>")
     goi/giao-<ngày>  kết quả giao hàng (web Giao hàng "kho/TP/giao/<ngày>")
     goi/nv           danh sách người giao (không có mã PIN)
     goi/index        {s: {khóa: stamp/version}, at} – tác vụ ghi để biết đã chép gì
     auth/main        {u, salt, iter, hash} – tài khoản đăng nhập trang (PBKDF2-SHA256)
   Trợ lý AI dùng Claude của người đang xem (capability sample) với các công cụ đọc gói dữ liệu này – chỉ đọc, không sửa 3 web. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const noAcc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const norm = s => noAcc(s).toUpperCase().replace(/\s+/g, ' ').trim();
const like = (q, hay) => { const h = noAcc(hay).toLowerCase(); return noAcc(q).toLowerCase().split(/\s+/).filter(Boolean).every(t => h.includes(t)); };
const fmt = n => (n == null || n === '' ? '' : Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 3 }));
const z = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const vn = iso => (iso ? iso.slice(0, 10).split('-').reverse().join('/') : '');
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('kv.' + k)); if (v === null) localStorage.removeItem('kv.' + k); else localStorage.setItem('kv.' + k, JSON.stringify(v)); } catch (e) { return null; } return undefined; };
const S = { db: null, auth: null, goi: {}, tab: 'tq', date: '', wh: 'TP', q: '', route: '', kind: '', warnOnly: false, chat: [], ctl: null, repOpen: true };
const KIND = { don: '📦 Đơn hàng ngày', t123: '🥙 Tuyến kebab 123' };
// số khách từng loại đơn của ngày (đơn hàng ngày / tuyến kebab 123) – 0 = web Đóng hàng chưa gửi / chưa chép sang
const kindCount = rows => ({ don: rows.filter(r => r.kind !== 't123').length, t123: rows.filter(r => r.kind === 't123').length });
const kindChips = rows => { const c = kindCount(rows); return Object.entries(KIND).map(([k, n]) => `<span class="chip ${c[k] ? '' : 'warn'}">${n}: ${c[k] ? c[k] + ' khách' : 'chưa có'}</span>`).join(' '); };

/* ---------------------------------------------------------- đăng nhập */
async function pbkdf2(pw, salt, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: iter || 100000 }, key, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function loadAuth() {
  const snap = await S.db.doc('auth/main').get();
  S.auth = snap.exists ? snap.data() : null;
}
function signedIn() {
  const s = store('sess');
  return !!(S.auth && s && s.u === S.auth.u && s.k === String(S.auth.hash || '').slice(0, 24));
}
function showLogin(msg) {
  $('#main').hidden = true; $('#login').hidden = false; $('#boot').hidden = true;
  $('#lg-e').textContent = msg || (S.auth ? '' : 'Trang chưa có tài khoản đăng nhập – nhờ Claude tạo tài khoản.');
  ($('#lg-u').value ? $('#lg-p') : $('#lg-u')).focus();
}
$('#lg').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#lg-b'); b.disabled = true; $('#lg-e').textContent = '';
  try {
    await loadAuth();
    if (!S.auth) throw new Error('Trang chưa có tài khoản đăng nhập.');
    const u = $('#lg-u').value.trim().toLowerCase(), h = await pbkdf2($('#lg-p').value, S.auth.salt, S.auth.iter);
    if (u !== S.auth.u || h !== S.auth.hash) { await new Promise(r => setTimeout(r, 600)); throw new Error('Sai tài khoản hoặc mật khẩu.'); }

function parseOrders(pkg) {
  const lines = String(pkg.tsv || '').split('\n').map(l => l.split('\t'));
  const head = lines[0] || [], H = head.map(norm);
  const at = f => H.findIndex(f);
  const c = { q: at(h => h === 'QUAN'), route: at(h => h === 'TUYEN'), crm: at(h => h === 'CRM'), cust: at(h => h === 'KHACH HANG' || h.startsWith('TEN KHACH')),
    phone: at(h => h.startsWith('SDT')), note: at(h => h.startsWith('GHI CHU')), driver: at(h => h === 'TAI XE'), st: at(h => h === 'TRANG THAI'), pay: at(h => h === 'TINH TRANG') };
  if (c.st < 0) c.st = c.pay, c.pay = -1; // tuyến 123: cột TÌNH TRẠNG là HOẠT ĐỘNG / NGHỈ
  const start = Math.max(c.st, c.pay) + 1, end = c.note > start ? c.note : head.length;
  const cols = []; for (let i = start; i < end; i++) if (H[i]) cols.push([i, head[i].trim()]);
  const g = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
  const out = []; let route = '';
  for (const r of lines.slice(1)) {
    if (g(r, c.route)) route = g(r, c.route);
    const cust = g(r, c.cust);
    if (!cust) continue;
    if (c.st >= 0 && !norm(g(r, c.st)).includes('HOAT DONG')) continue;
    const qty = {};
    cols.forEach(([i, name]) => { const n = num(g(r, i).replace(/\s*kg$/i, '')); if (n) qty[name] = n; });
    const code = (/^(k\s?h?\s?\d+[a-z]?)\s*[-–:]/i.exec(cust) || [])[1] || '';
    const crm = g(r, c.crm).replace(/\s+/g, '').toUpperCase();
    out.push({ kind: pkg.kind, route, crm, code: code.replace(/\s/g, '').toUpperCase(), cust, phone: g(r, c.phone), note: g(r, c.note), pay: g(r, c.pay), driver: g(r, c.driver), q: g(r, c.q), qty });
  }
  return { rows: out, cols: cols.map(x => x[1]) };
}

    const r = parseOrders(p), asg = (p.kind === 't123' ? p.assignG : p.assign) || {};

}

function num(v) {

  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');

}

async function enter() {
  $('#login').hidden = true; $('#boot').hidden = false; $('#boot').textContent = 'Đang tải dữ liệu…';
  await loadGoi();
  $('#boot').hidden = true; $('#main').hidden = false;
  $('#who').textContent = 'Đăng nhập: ' + S.auth.u;
  S.tab = 'tq'; S.repOpen = true; // mở trang: thấy báo cáo tổng quan đầu tiên
  freshness(); draw(); window.scrollTo(0, 0);
  clearInterval(enter.t);
  enter.t = setInterval(async () => { if (document.hidden || S.ctl || !signedIn()) return; try { await loadGoi(); freshness(); if (S.tab !== 'ai') draw(); } catch (e) { /* lần sau */ } }, 300000);
}
(async () => {
  try {
    S.db = await claude.use('db');
    if (!S.db) { $('#boot').textContent = 'Không mở được dữ liệu – hãy mở trang trên claude.ai (đã đăng nhập).'; return; }
    await loadAuth();
    if (signedIn()) await enter(); else showLogin();
  } catch (e) { $('#boot').textContent = 'Không tải được dữ liệu: ' + (e && e.message || e); }
})();
</script>
