<script id="antam-errlog">
/* Ghi lỗi trang vào kho dữ liệu của web: errlog/<ngày> {e: {mã: {at, web, bo_phan, who, msg, src, view}}}.
   Agent "Báo cáo lỗi An Tâm" đọc 2 lần mỗi ngày. Chỉ ghi lỗi chưa bắt được, promise bị từ chối và lỗi kho dữ liệu; tối đa 15 lỗi mỗi lần mở trang. */
(function () {
  'use strict';
  const WEB = (window.ANTAM_ERRLOG || {}).web || document.title;
  const seen = new Set(); let n = 0, dbp = null;
  const p2 = x => String(x).padStart(2, '0');
  const stamp = () => { const d = new Date(); return { day: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`, at: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}` }; };
  const DB_CODES = ['unavailable', 'resource_exhausted', 'quota_exceeded', 'revoked', 'capability_disabled', 'transform_error'];
  function who() {
    try {
      const n1 = window.ANTAM_NICK && window.ANTAM_NICK.name; if (n1) return n1;
      const keys = ['dh_me', 'kho.user', 'user']; for (const k of keys) { const v = localStorage.getItem(k); if (v) return String(JSON.parse(v) || '').slice(0, 60); }
    } catch (e) { /* bỏ qua */ }
    return '';
  }
  async function log(msg, src) {
    msg = String(msg || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (!msg || seen.has(msg) || n >= 15) return;
    seen.add(msg); n++;
    try {
      dbp = dbp || (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
      const db = await dbp; if (!db) return;
      const { day, at } = stamp(), id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      let bo = ''; try { bo = localStorage.getItem('antam.app') || ''; } catch (e) { /* bỏ qua */ }
      const rec = { at, web: WEB, bo_phan: bo, who: who(), msg, src: String(src || '').trim().slice(0, 160), view: String(location.hash || '').slice(0, 60) };
      const ref = db.doc('errlog/' + day);
      try { await ref.update({ e: { [id]: rec } }); }
      catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (s.exists) await ref.update({ e: { [id]: rec } }); else await ref.set({ day, e: { [id]: rec } }); } }
    } catch (e) { /* không ghi được lỗi thì thôi, không làm phiền người dùng */ }
  }
  const isDbErr = e => e && typeof e === 'object' && DB_CODES.includes(e.code);
  window.addEventListener('error', ev => {
    if (!ev || !ev.message || /^Script error\.?$/.test(ev.message) || /ResizeObserver loop/.test(ev.message)) return;
    log(ev.message, (ev.filename ? ev.filename.split('/').pop() : '') + (ev.lineno ? ':' + ev.lineno + ':' + (ev.colno || 0) : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev && ev.reason; if (!r) return;
    if (r && r.code === 'declined') return; // người dùng bấm Không khi tải file
    log((r.code ? '[' + r.code + '] ' : '') + (r.message || String(r)), r.stack ? String(r.stack).split('\n')[1] || '' : '');
  });
  const ce = console.error.bind(console);
  console.error = function () {
    ce.apply(console, arguments);
    const a = Array.from(arguments), e = a.find(x => x instanceof Error || isDbErr(x));
    if (e && (isDbErr(e) || e instanceof TypeError || e instanceof ReferenceError || e instanceof SyntaxError)) log((e.code ? '[' + e.code + '] ' : '') + (e.message || String(e)), e.stack ? String(e.stack).split('\n')[1] || '' : 'console.error');
  };
  window.antamLogError = log; // web gọi thêm khi muốn ghi một lỗi đã bắt
})();
</script>

  const KEY = 'ng-' + SITE + '-sess', DAYS = 30, root = document.documentElement;
  root.classList.add('ng-locked');
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/[^a-z0-9._-]/g, '');
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  // mật khẩu băm PBKDF2 (ai được mời vào trang cũng đọc được danh sách tài khoản – không lưu mật khẩu gốc)
  async function hash(salt, pw) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
  }
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sess = { get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }, set(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) { /* trình duyệt chặn lưu */ } } };
  const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const G = { db: null, user: null, owner: false, admin: false, acc: {}, ep: 0, loaded: false, nodb: false, me: null };
  window.ANTAM_NICK = null;

  const gate = document.createElement('div'); gate.id = 'ng-gate'; document.body.appendChild(gate);
  const panel = document.createElement('div'); panel.id = 'ng-panel'; panel.hidden = true; document.body.appendChild(panel);

  function current() {
    const s = sess.get(), a = s && G.acc[s.id];
    return a && a.active !== false && a.pw && s.sig === a.pw.slice(0, 24) && s.exp > Date.now() && (s.iat || 0) >= (G.ep || 0) ? Object.assign({ id: s.id }, a) : null;

  function apply() {
    if (!G.loaded) { drawGate(); return; }

    if (sess.get() && !me) sess.set(null);

    window.ANTAM_NICK = me ? { id: me.id, user: me.user, name: me.name || me.user } : G.owner ? { id: 'owner', user: '', name: 'Chủ trang' } : null;
    const open = !!(me || G.owner);

  }
  function drawGate() {
    const hasAcc = Object.values(G.acc).some(a => a && a.active !== false);
    const state = G.nodb ? 'nodb' : !G.loaded ? 'loading' : hasAcc ? 'form' : 'empty';
    if (gate.dataset.state === state && state === 'form') return; // đang gõ: giữ nguyên ô đăng nhập
    gate.dataset.state = state;
    const body = state === 'nodb' ? '<p>Trang cần mở trên claude.ai khi đã đăng nhập, bằng link chủ trang gửi.</p>'
      : state === 'loading' ? '<p>Đang tải…</p>'
      : state === 'empty' ? '<p>Trang chưa có tài khoản nào. Chủ trang mở trang để tạo tài khoản đăng nhập cho nhân viên.</p>'

        <label class="ng-f">Mật khẩu<input id="ng-pw" type="password" autocomplete="current-password"></label>

      const hit = Object.entries(G.acc).find(([, a]) => a && a.active !== false && norm(a.user) === norm(u.value));
      const ok = hit && (await hash(hit[1].salt, pw.value)) === hit[1].pw;
      if (!ok) { await new Promise(r => setTimeout(r, 600)); err.textContent = 'Sai nick hoặc mật khẩu.'; btn.disabled = false; btn.textContent = 'Đăng nhập'; pw.select(); return; }
      sess.set({ id: hit[0], sig: hit[1].pw.slice(0, 24), iat: Date.now(), exp: Date.now() + DAYS * 864e5 });
      try { localStorage.setItem('ng-' + SITE + '-last', hit[1].user); } catch (x) { /* trình duyệt chặn lưu */ }

    host.innerHTML = who ? `<button type="button" class="ng-me" title="Tài khoản đăng nhập">👤 ${esc(who.name)}</button>` : '';

  // ---------- tài khoản của tôi / quản lý tài khoản ----------

  function closePanel() { panel.hidden = true; panel.innerHTML = ''; edit = null; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });
  panel.addEventListener('mousedown', e => { if (e.target === panel) closePanel(); });
  function openPanel() { panel.hidden = false; drawPanel(); }
  function drawPanel() {
    if (panel.hidden) return;
    const me = G.me, list = Object.entries(G.acc).filter(([, a]) => a).sort((x, y) => norm(x[1].user) < norm(y[1].user) ? -1 : 1);

    };

        const dup = Object.entries(G.acc).some(([id, a]) => a && id !== edit.id && norm(a.user) === norm(user));
        const bad = !norm(user) ? 'Nhập nick (chữ, số, dấu chấm, gạch dưới).' : dup ? 'Nick này đã có người dùng.' : (!edit.id || pw) && pw.length < 4 ? 'Mật khẩu cần ít nhất 4 ký tự.' : '';
        if (bad) { err.textContent = bad; return; }
        const id = edit.id || rid('a'), old = G.acc[id] || {};
        const rec = { user: norm(user), name, active: on, at: nowStr(), salt: old.salt || '', pw: old.pw || '' };
        if (pw) { rec.salt = rid('s'); rec.pw = await hash(rec.salt, pw); }
        try { await save(id, rec); edit = null; drawPanel(); } catch (x) { err.textContent = 'Không lưu được: ' + (x.message || x.code) + (x.code === 'invalid_argument' ? ' (chỉ chủ trang / Editor sửa được tài khoản)' : ''); }
      };
    }
  }

    const next = { a: Object.assign({}, cur.a || {}), ep: cur.ep || 0 };
    if (id) next.a[id] = rec;
    if (ep) next.ep = ep;
    await ref.set(next);
  }

  // ---------- khởi động ----------
  (async function boot() {

    const c = window.claude;

      const d = s.exists ? s.data() : {};

      apply(); drawPanel();
    }, () => { G.loaded = true; apply(); });
  })();
})();

/* ============ Đơn hàng ============ */
function orderStatus(s, D) {

  if (c && c.close != null) { const u = D.unpaid[s.n] || 0; st.push(u > 0.5 ? (u < s.t - 0.5 ? '<span class="pill yellow">Còn ' + N(u) + '</span>' : '<span class="pill yellow">Chưa thu</span>') : '<span class="pill green">Đã thu</span>'); }
  if (!s.i) st.push('<span class="pill red">Chưa có HĐ</span>'); else if (s.id && s.id > s.d) st.push('<span class="pill red">HĐ trễ ' + diff(s.d, s.id) + ' ngày</span>');

function vOrders(D) {

function vInvoices(D) {

  const bar = rangeBar([monthStart(D.asOf), D.asOf]);

  const byDay = {};
  list.forEach(s => { const x = byDay[s.d] = byDay[s.d] || { n: 0, ok: 0, late: 0, no: 0, amt: 0, v: 0 }; x.n++; x.amt += s.a - s.k; x.v += s.v; if (!s.i) x.no++; else if (s.id && s.id > s.d) x.late++; else x.ok++; });

    s.l.forEach(l => { const k = l[0] || l[1]; const it = byItem[k] = byItem[k] || { code: l[0], name: l[1], q: 0, a: 0 }; it.q += l[2]; it.a += l[3]; byAcc[l[4]] = (byAcc[l[4]] || 0) + l[3]; });

    '<div class="kpis">' + kpi('Doanh thu thuần', M(rev - disc), N(rev - disc) + ' đ') + kpi('Chiết khấu', M(disc), N(disc) + ' đ') + kpi('Thuế GTGT', M(vat), N(vat) + ' đ') + kpi('Số đơn', N(list.length), N(new Set(list.map(s => s.c)).size) + ' khách mua') + kpi('Bình quân một đơn', M(list.length ? (rev - disc) / list.length : 0), '') + '</div>' +

      '<div class="legend">' + Object.entries(byAcc).sort().map(([k, v]) => '<span>TK ' + esc(k) + ' ' + esc(accName[k] || '') + ': <b>' + M(v) + '</b></span>').join('') + '</div></div>' +
    '<div class="card"><h2>Theo khách hàng</h2><div class="tbl tall"><table><thead><tr><th>Khách</th><th class="n">Đơn</th><th class="n">Doanh thu</th><th class="n">Công nợ</th></tr></thead><tbody>' +
      custs.slice(0, 200).map(([c, v]) => '<tr class="click" data-act="cust" data-arg="' + esc(c) + '"><td class="w">' + custLabel(c, D) + '</td><td class="n">' + v.n + '</td><td class="n">' + N(v.a) + '</td><td class="n">' + (D.C[c] && D.C[c].close ? N(D.C[c].close) : '') + '</td></tr>').join('') + '</tbody></table></div></div></div>';

function barChart(days, map) {
  if (!days.length) return '';
  const W = 760, H = 230, L = 46, B = 30, T = 28, R = 8; const vals = days.map(d => map[d] || 0); const max = Math.max(1, ...vals);
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = [1, 2, 2.5, 5, 10].map(x => x * step).find(x => max / x <= 5) || step * 10;
  const top = Math.ceil(max / nice) * nice; const bw = (W - L - R) / days.length;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1; v += nice) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + (v / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '</text>';
  const every = Math.ceil(days.length / 16);
  days.forEach((d, i) => { const v = vals[i], x = L + i * bw; const sun = parseISO(d).getDay() === 0;
    g += '<rect x="' + (x + bw * 0.15) + '" y="' + y(v) + '" width="' + (bw * 0.7) + '" height="' + Math.max(0, y(0) - y(v)) + '" rx="2" fill="' + (sun ? 'var(--muted)' : 'var(--accent)') + '"><title>' + dmy(d) + ': ' + N(v) + ' đ</title></rect>';
    if (i % every === 0) g += '<text x="' + (x + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + d.slice(8, 10) + '</text>'; });
  return '<svg class="bars" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Doanh thu theo ngày, đơn vị triệu đồng">' + g + '<text x="4" y="12" font-size="11" fill="var(--muted)">triệu đồng</text></svg><div class="legend"><span><i style="background:var(--accent)"></i>Ngày thường</span><span><i style="background:var(--muted)"></i>Chủ nhật</span><span>Rê chuột lên cột để xem số tiền</span></div>';
}

async function handleFile(file) {
  if (!file) return;
  if (!window.XLSX) { S.f.importMsg = 'Chưa tải xong bộ đọc Excel. Đợi vài giây rồi thử lại.'; render(); return; }
  S.f.importMsg = 'Đang đọc ' + esc(file.name) + '…'; S.f.preview = null; render();
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    S.f.preview = parseMisa(rows, file.name); S.f.importMsg = '';
  } catch (e) { S.f.importMsg = '<span style="color:var(--crit)">' + esc(e.message || String(e)) + '</span>'; }
  render();
}
async function saveImport() {
  const p = S.f.preview; if (!p || S.f.saving) return;
  const byDay = {};
  const day = d => byDay[d] || (byDay[d] = { s: [], p: [], o: [] });
  p.sales.forEach(s => day(s.d).s.push(s)); p.pays.forEach(x => day(x.d).p.push(x)); p.others.forEach(x => day(x.d).o.push(x));
  const dates = []; for (let d = p.minD || p.from; d && d <= p.maxD; d = addDays(d, 1)) dates.push(d);
  const at = Date.now(), by = S.uid || '';
  try {
    let i = 0;
    for (const d of dates) {
      i++; S.f.saving = i + '/' + (dates.length + 2); render();
      const x = byDay[d] || { s: [], p: [], o: [] };
      await S.db.doc('days/' + d).set({ m: d.slice(0, 7), d, s: x.s, p: x.p, o: x.o, at, by, src: p.file });
    }
    const mk = p.to.slice(0, 7);
    const custOut = {}; for (const code in p.cust) { const c = p.cust[code]; custOut[code] = { n: c.n, o: Math.round(c.o), z: Math.round(c.z) }; }
    let from = p.from;
    if (from.slice(8) !== '01') {
      const old = await S.db.doc('months/' + mk).get();
      if (old.exists) { const od = old.data(); if (od.from && od.from < from) { from = od.from; for (const code in custOut) if (od.cust && od.cust[code]) custOut[code].o = od.cust[code].o; } }
    }
    S.f.saving = (dates.length + 1) + '/' + (dates.length + 2); render();
    await S.db.doc('months/' + mk).set({ m: mk, from, to: p.to, cust: custOut, at, by, file: p.file });
    await upsert('meta/index', { last: { at, by, file: p.file, from, to: p.to, m: mk }, months: { [mk]: { at, by, file: p.file, from, to: p.to } } });
    S.f.preview = null; S.f.saving = ''; S.f.importMsg = 'Đã lưu dữ liệu ' + dm(from) + ' – ' + dmy(p.to) + ': ' + p.sales.length + ' đơn, ' + p.pays.length + ' khoản thu.';
    toast('Đã nhập dữ liệu MISA đến ' + dmy(p.to) + '.');
    autoTick('t02');
  } catch (e) { S.f.saving = ''; writeFail(e); }
  render();
}

  }
  else if (a === 'saveContact') {
    const res = ($('#ctRes').value || '').trim(), pd = $('#ctPd').value, pa = parseFloat($('#ctPa').value) || 0;
    if (!res && !pd) { toast('Ghi kết quả liên hệ hoặc ngày hẹn trả.'); return; }
    try { await S.db.collection('contacts').add({ c: arg, by: S.uid || '', at: Date.now(), d: today(), ch: $('#ctCh').value, res, pd: pd || '', pa, ok: false }); toast('Đã lưu lần liên hệ.'); $('#ctRes').value = ''; $('#ctPd').value = ''; $('#ctPa').value = ''; } catch (err) { writeFail(err); }
  }
  else if (a === 'promiseOk') { try { await S.db.doc('contacts/' + arg).update({ ok: true, okAt: Date.now(), okBy: S.uid || '' }); toast('Đã đánh dấu khách trả theo hẹn.'); } catch (err) { writeFail(err); } }
  else if (a === 'copy') {
    const box = document.getElementById(arg); if (!box) return; const text = box.textContent;
    try { await navigator.clipboard.writeText(text); toast('Đã copy, dán vào Zalo để gửi.'); }
    catch (err) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Đã chọn sẵn nội dung, bấm Ctrl+C để copy.'); }
  }
  else if (a === 'export') exportXlsx(arg);
  else if (a === 'saveImport') saveImport();
  else if (a === 'cancelImport') { S.f.preview = null; S.f.importMsg = ''; render(); }
  else if (a === 'saveShifts') { const sh = readShifts(); await saveSettings({ shifts: sh }, 'Đã lưu ca làm việc.'); S.f.editShifts = null; render(); }
  else if (a === 'addShift') { const sh = readShifts(); sh.push({ id: 'ca' + Date.now().toString(36), name: 'Ca mới', from: '08:00', to: '12:00' }); S.f.editShifts = sh; render(); }
  else if (a === 'delShift') { const sh = readShifts(); const s = sh[+arg]; if (cfg().tasks.some(t => t.s === s.id)) { toast('Ca “' + s.name + '” còn việc trong danh sách. Chuyển hoặc xóa các việc đó trước, rồi xóa ca.'); return; } sh.splice(+arg, 1); S.f.editShifts = sh; render(); }
  else if (a === 'saveTerms') { const v = id => parseFloat($(id).value); const tm = { days: v('#tDays') || 7, stopAfter: isNaN(v('#tStop')) ? 3 : v('#tStop'), limit: v('#tLimit') || 0, red: v('#tRed') || 0, yellow: v('#tYellow') || 0 }; saveSettings({ terms: tm, bank: $('#tBank').value.trim() || DEF.bank }, 'Đã lưu hạn thanh toán.'); }
  else if (a === 'addTask') { const t = readTasks(); t.push({ id: 't' + Date.now().toString(36), t: '10:00', title: 'Việc mới', note: '', s: cfg().shifts[0].id, r: 'd', go: '' }); S.f.editTasks = t; render(); }
  else if (a === 'delTask') { const t = readTasks(); t.splice(+arg, 1); S.f.editTasks = t; render(); }
  else if (a === 'saveTasks') { const t = readTasks(); await saveSettings({ tasks: t }, 'Đã lưu danh sách việc.'); S.f.editTasks = null; }
  else if (a === 'calendar') addCalendar();
  else if (a === 'notify') {
    try { if (!('Notification' in window)) throw 0; const p = await Notification.requestPermission(); S.f.calMsg = p === 'granted' ? 'Đã bật thông báo trình duyệt cho lần mở này.' : 'Trình duyệt không cho phép thông báo trong khung trang. Web vẫn hiện nhắc việc và âm báo khi đang mở.'; }
    catch (err) { S.f.calMsg = 'Trình duyệt không cho phép thông báo trong khung trang. Web vẫn hiện nhắc việc và âm báo khi đang mở.'; }
    render();
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'file') handleFile(el.files[0]);
  else if (el.id === 'fFrom' || el.id === 'fTo') { S.f[el.id === 'fFrom' ? 'from' : 'to'] = el.value; if (S.f.from > S.f.to) S.f.to = S.f.from; render(); }
  else if (el.id === 'ckDate') { S.f.date = el.value || S.today; render(); }
  else if (el.dataset.act === 'owner') {
    const code = el.dataset.arg, v = el.value;
    try { await upsert('assign/owners', { owners: { [code]: v } }); } catch (err) { writeFail(err); }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'fQ') { S.f.q = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer) { S.drawer = null; renderDrawer(); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handleFile(e.dataTransfer.files[0]); } });
init();
</script>
