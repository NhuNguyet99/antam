<title>Quỹ tiền mặt An Tâm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Phiếu thu – phiếu chi, sổ quỹ tiền mặt, báo cáo chi tiêu và kiểm quỹ của Công ty An Tâm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Bố cục: thanh trên cố định (số dư + Thu/Chi), dưới là 5 màn: Tổng quan · Sổ quỹ · Báo cáo · Kiểm quỹ · Cài đặt */
:root {
  --bg: #eef3f1; --surface: #ffffff; --sunk: #f6f9f8; --ink: #14201e; --muted: #566763;
  --line: #d6e0dd; --accent: #0b6b62; --accent-soft: #dcefeb; --accent-ink: #ffffff;
  --thu: #17773a; --thu-soft: #e2f3e7; --chi: #b2351e; --chi-soft: #fbe7e2; --warn: #9a5f00; --warn-soft: #fff1d6;
  --shadow: 0 1px 2px rgba(16, 40, 36, .06), 0 6px 24px rgba(16, 40, 36, .06);
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1715; --surface: #15211e; --sunk: #111b19; --ink: #e3ecea; --muted: #97a9a5; --line: #2a3a37;
  --accent: #3dbfac; --accent-soft: #173733; --accent-ink: #052019;
  --thu: #5cc683; --thu-soft: #15301f; --chi: #f08066; --chi-soft: #3a1b14; --warn: #f0b552; --warn-soft: #3a2b0f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1715; --surface: #15211e; --sunk: #111b19; --ink: #e3ecea; --muted: #97a9a5; --line: #2a3a37;
  --accent: #3dbfac; --accent-soft: #173733; --accent-ink: #052019;
  --thu: #5cc683; --thu-soft: #15301f; --chi: #f08066; --chi-soft: #3a1b14; --warn: #f0b552; --warn-soft: #3a2b0f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25 }
h2 { font-size: 1.15rem; font-weight: 600 }
h3 { font-size: .98rem; font-weight: 600 }
.num, .money { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.muted { color: var(--muted) }
.small { font-size: .85rem }
.lbl { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* thanh trên */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand svg { flex: none }
.brand b { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em }
.brand span { display: block; font-size: .76rem; color: var(--muted) }
.bal { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; align-items: center }
.bal div { text-align: right }
.bal .money { font-size: 1.05rem; font-weight: 600 }
.acts { display: flex; gap: 8px }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line) }
nav.tabs::-webkit-scrollbar { display: none }
nav.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs a:hover { color: var(--ink) }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.thu { background: var(--thu); border-color: var(--thu); color: var(--surface) }
.btn.chi { background: var(--chi); border-color: var(--chi); color: var(--surface) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent) }
.btn.danger { color: var(--chi); border-color: var(--chi) }
.btn.sm { padding: 5px 10px; font-size: .88rem }
.btn:disabled { opacity: .5; cursor: not-allowed }

main { padding-block: 20px 60px; display: grid; gap: 18px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
.card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px }
.grid { display: grid; gap: 14px }
.g-tiles { grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)) }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)) }
.tile { display: grid; gap: 4px }
.tile .money { font-size: 1.55rem; font-weight: 600; line-height: 1.15 }
.tile.big { background: var(--accent-soft); border-color: transparent }
.c-thu { color: var(--thu) } .c-chi { color: var(--chi) } .c-warn { color: var(--warn) }

.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line) }
.empty { padding: 26px 12px; text-align: center; color: var(--muted) }

/* bảng */
.tw { overflow-x: auto; margin: 0 -16px; padding: 0 16px }
table { border-collapse: collapse; width: 100%; font-size: .92rem }
th, td { padding: 8px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--surface); position: sticky; top: 0 }
td.r, th.r { text-align: right }
td.money { white-space: nowrap; text-align: right }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--sunk) }
tr.huy td { color: var(--muted); text-decoration: line-through }
tr.huy td.keep { text-decoration: none }
tr.sum td { font-weight: 600; background: var(--sunk); border-bottom: 0 }
.so { font-family: var(--f-num); font-size: .86rem; white-space: nowrap }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .74rem; font-weight: 600; white-space: nowrap }
.p-thu { background: var(--thu-soft); color: var(--thu) }
.p-chi { background: var(--chi-soft); color: var(--chi) }
.p-wait { background: var(--warn-soft); color: var(--warn) }
.p-ok { background: var(--accent-soft); color: var(--accent) }
.p-huy { background: var(--sunk); color: var(--muted); border: 1px solid var(--line) }

/* bộ lọc */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end }
.field { display: grid; gap: 4px; min-width: 0 }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 500 }
input[type=text], input[type=date], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 64px }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; padding-bottom: 8px }

/* biểu đồ cột ngang */
.bars { display: grid; gap: 9px }
.bar { display: grid; grid-template-columns: minmax(0, 11rem) 1fr auto; gap: 10px; align-items: center; font-size: .9rem }
.bar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.bar .track { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; border: 1px solid var(--line) }
.bar .fill { height: 100%; background: var(--chi); border-radius: 99px }
.bar.thu .fill { background: var(--thu) }
.bar .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: .86rem; white-space: nowrap }
.months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; padding-top: 8px }
.months .m { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 4px; min-width: 0 }
.months .cols { display: flex; gap: 3px; align-items: end; justify-content: center; height: 100%; border-bottom: 1px solid var(--line) }
.months .cols i { display: block; width: min(16px, 40%); border-radius: 3px 3px 0 0 }
.months .cols i.t { background: var(--thu) } .months .cols i.c { background: var(--chi) }
.months .m span { text-align: center; font-size: .76rem; color: var(--muted) }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--muted) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }

/* danh sách phiếu gọn */
.list { display: grid }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center }
.row:last-child { border-bottom: 0 }
.row .d { min-width: 0 }
.row .d b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .money { font-weight: 600; text-align: right }

/* hộp thoại */
.ov { position: fixed; inset: 0; background: rgba(8, 20, 18, .45); z-index: 20; display: grid; place-items: start center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)) }
.dlg { background: var(--surface); border-radius: 14px; width: min(640px, 100%); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid }
.dlg > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.dlg > .body { padding: 16px 18px; display: grid; gap: 12px }
.dlg > footer { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line) }
.dlg.thu > header { border-top: 4px solid var(--thu); border-radius: 14px 14px 0 0 }
.dlg.chi > header { border-top: 4px solid var(--chi); border-radius: 14px 14px 0 0 }
.f2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px }
.amount input { font-family: var(--f-num); font-size: 1.35rem; font-weight: 600; text-align: right }
.words { font-size: .85rem; color: var(--muted); font-style: italic; min-height: 1.3em }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-weight: 500 }
.seg button[aria-pressed="true"].t { background: var(--thu); color: var(--surface) }
.seg button[aria-pressed="true"].c { background: var(--chi); color: var(--surface) }
.err { color: var(--chi); font-size: .88rem }
fieldset.grp { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0 }
fieldset.grp legend { padding: 0 6px; font-size: .8rem; font-weight: 600; color: var(--muted) }
.seg.hd button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.seg.bp button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
[hidden] { display: none !important }
.bpsw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.acts { flex-wrap: wrap }
.mrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: .9rem; margin-top: 4px }
.mrow .lbl { display: block; font-size: .66rem; margin: 0 }
.mrow .money { font-size: .92rem }
.bpsw .lbl { margin: 0 }
.btn.bcbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.pill.p-nb { background: var(--raise, #eef1ee); color: var(--muted); border: 1px solid var(--line) }
tr.grp td { font-weight: 600; background: var(--raise, #f3f5f3) }
tr.tot td { font-weight: 700; border-top: 2px solid var(--ink) }
.p-hd { background: var(--accent-soft); color: var(--accent) }
.kv { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr); gap: 6px 14px; font-size: .93rem }
.kv dt { color: var(--muted) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap }
.thumbs button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: 84px; height: 84px; background: var(--sunk); cursor: zoom-in; position: relative }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block }
.thumbs .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--surface); color: var(--chi); font-weight: 700; cursor: pointer; line-height: 1 }
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 20px; cursor: zoom-out }
.lb img { max-height: 90vh; max-width: 100%; border-radius: 6px }
.confirm { background: var(--chi-soft); border-radius: 8px; padding: 12px; display: grid; gap: 8px }

/* kiểm quỹ */
.denoms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(310px, 100%), 1fr)); gap: 8px 24px }
.denom { display: grid; grid-template-columns: 5.2rem 5rem minmax(0, 1fr); gap: 10px; align-items: center }
.denom .money { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.denom .money { text-align: right; font-size: .92rem }
.denom input { text-align: right; font-family: var(--f-num) }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.toast.bad { background: var(--chi); color: var(--surface) }

@media (max-width: 640px) {
  .bal { width: 100%; margin-left: 0; justify-content: space-between }
  .bal div { text-align: left }
  .acts { width: 100%; } .acts .btn { flex: 1 1 auto }
  .tile .money { font-size: 1.3rem }
  .bar { grid-template-columns: minmax(0, 7rem) 1fr auto }
  .hide-sm { display: none }
}
@media (prefers-reduced-motion: no-preference) { .btn, nav.tabs a { transition: border-color .15s, color .15s, background .15s } }
</style>

<script>window.ANTAM_ERRLOG = {"web": "Quỹ tiền mặt"};</script>
<script id="antam-errlog">
/* Ghi lỗi trang vào kho dữ liệu của web: errlog/<ngày> {e: {mã: {at, web, bo_phan, who, msg, src, view}}}.
   Agent "Báo cáo lỗi An Tâm" đọc 2 lần mỗi ngày. Chỉ ghi lỗi chưa bắt được, promise bị từ chối và lỗi kho dữ liệu; tối đa 15 lỗi mỗi lần mở trang. */
(function () {
  'use strict';
  const WEB = (window.ANTAM_ERRLOG || {}).web || document.title;
  const seen = new Set(); let n = 0, dbp = null;
  const p2 = x => String(x).padStart(2, '0');
  const stamp = () => { const d = new Date(); return { day: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`, at: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}` }; };
  const DB_CODES = ['unavailable', 'resource_exhausted', 'quota_exceeded', 'revoked', 'capability_disabled', 'transform_error'];
  function who() {
    try {
      const n1 = window.ANTAM_NICK && window.ANTAM_NICK.name; if (n1) return n1;
      const keys = ['dh_me', 'kho.user', 'user']; for (const k of keys) { const v = localStorage.getItem(k); if (v) return String(JSON.parse(v) || '').slice(0, 60); }
    } catch (e) { /* bỏ qua */ }
    return '';
  }
  async function log(msg, src) {
    msg = String(msg || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (!msg || seen.has(msg) || n >= 15) return;
    seen.add(msg); n++;
    try {
      dbp = dbp || (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
      const db = await dbp; if (!db) return;
      const { day, at } = stamp(), id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      let bo = ''; try { bo = localStorage.getItem('antam.app') || ''; } catch (e) { /* bỏ qua */ }
      const rec = { at, web: WEB, bo_phan: bo, who: who(), msg, src: String(src || '').trim().slice(0, 160), view: String(location.hash || '').slice(0, 60) };
      const ref = db.doc('errlog/' + day);
      try { await ref.update({ e: { [id]: rec } }); }
      catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (s.exists) await ref.update({ e: { [id]: rec } }); else await ref.set({ day, e: { [id]: rec } }); } }
    } catch (e) { /* không ghi được lỗi thì thôi, không làm phiền người dùng */ }
  }
  const isDbErr = e => e && typeof e === 'object' && DB_CODES.includes(e.code);
  window.addEventListener('error', ev => {
    if (!ev || !ev.message || /^Script error\.?$/.test(ev.message) || /ResizeObserver loop/.test(ev.message)) return;
    log(ev.message, (ev.filename ? ev.filename.split('/').pop() : '') + (ev.lineno ? ':' + ev.lineno + ':' + (ev.colno || 0) : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev && ev.reason; if (!r) return;
    if (r && r.code === 'declined') return; // người dùng bấm Không khi tải file
    log((r.code ? '[' + r.code + '] ' : '') + (r.message || String(r)), r.stack ? String(r.stack).split('\n')[1] || '' : '');
  });
  const ce = console.error.bind(console);
  console.error = function () {
    ce.apply(console, arguments);
    const a = Array.from(arguments), e = a.find(x => x instanceof Error || isDbErr(x));
    if (e && (isDbErr(e) || e instanceof TypeError || e instanceof ReferenceError || e instanceof SyntaxError)) log((e.code ? '[' + e.code + '] ' : '') + (e.message || String(e)), e.stack ? String(e.stack).split('\n')[1] || '' : 'console.error');
  };
  window.antamLogError = log; // web gọi thêm khi muốn ghi một lỗi đã bắt
})();
</script>

<script>window.NICK_GATE = {"site": "qtm", "title": "Quỹ tiền mặt An Tâm", "slot": "#gate-slot"};</script>
<style id="nick-gate-css">
/* Khóa trang bằng nick + mật khẩu: chưa đăng nhập thì ẩn toàn bộ trang, chỉ hiện ô đăng nhập */
html.ng-locked body > *:not([id^="ng-"]):not(script):not(style):not(link):not(title):not(meta) { display: none !important; }
#ng-gate { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; overflow: auto; background: var(--bg, #f2f4f1); color: var(--fg, var(--ink, #18211d));
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#ng-gate[hidden], #ng-panel[hidden] { display: none !important; }
.ng-card { width: min(420px, 100%); background: var(--surface, #fff); border: 1px solid var(--line, #dce2dc); border-radius: 14px; padding: 22px; display: grid; gap: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .08); }
.ng-card h1 { margin: 0; font-size: 1.35em; line-height: 1.25; }
.ng-card p { margin: 0; color: var(--muted, #5b6862); font-size: .92em; }
.ng-f { display: grid; gap: 4px; font-size: .9em; color: var(--muted, #5b6862); }
.ng-f input, .ng-f select { font: inherit; color: var(--fg, var(--ink, #18211d)); border: 1px solid var(--line, #dce2dc); background: var(--surface, #fff); border-radius: 8px; padding: 9px 11px; min-width: 0; width: 100%; }

<script id="nick-gate">
(function () {

  window.ANTAM_NICK = null;

  const gate = document.createElement('div'); gate.id = 'ng-gate'; document.body.appendChild(gate);
  const panel = document.createElement('div'); panel.id = 'ng-panel'; panel.hidden = true; document.body.appendChild(panel);

  function current() {

    if (gate.dataset.state === state && state === 'form') return; // đang gõ: giữ nguyên ô đăng nhập

      : state === 'loading' ? '<p>Đang tải…</p>'

      if (!ok) { await new Promise(r => setTimeout(r, 600)); err.textContent = 'Sai nick hoặc mật khẩu.'; btn.disabled = false; btn.textContent = 'Đăng nhập'; pw.select(); return; }
      sess.set({ id: hit[0], sig: hit[1].pw.slice(0, 24), iat: Date.now(), exp: Date.now() + DAYS * 864e5 });
      try { localStorage.setItem('ng-' + SITE + '-last', hit[1].user); } catch (x) { /* trình duyệt chặn lưu */ }

  function drawSlot() {

  function openPanel() { panel.hidden = false; drawPanel(); }
  function drawPanel() {

    const me = G.me, list = Object.entries(G.acc).filter(([, a]) => a).sort((x, y) => norm(x[1].user) < norm(y[1].user) ? -1 : 1);
    const mine = me ? `<div class="ng-row"><div class="ng-grow"><b>${esc(me.name || me.user)}</b> <span style="color:var(--muted,#5b6862)">· nick ${esc(me.user)}</span></div><button class="ng-btn" type="button" id="ng-out">Đăng xuất</button></div>`

    const mgr = G.admin ? `<hr style="border:0;border-top:1px solid var(--line,#dce2dc);margin:4px 0">

      ${edit ? `<form id="ng-edit" class="ng-grid" novalidate style="background:var(--raise,var(--sunk,#f7f9f6));padding:12px;border-radius:10px">

          <label class="ng-f">Họ tên<input id="ng-e-name" value="${esc(edit.name)}" maxlength="60"></label>

        const dup = Object.entries(G.acc).some(([id, a]) => a && id !== edit.id && norm(a.user) === norm(user));
        const bad = !norm(user) ? 'Nhập nick (chữ, số, dấu chấm, gạch dưới).' : dup ? 'Nick này đã có người dùng.' : (!edit.id || pw) && pw.length < 4 ? 'Mật khẩu cần ít nhất 4 ký tự.' : '';

})();

const DIG = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
function read3(n, full) {
  const h = Math.floor(n / 100), t = Math.floor(n / 10) % 10, u = n % 10, out = [];
  if (full || h) out.push(DIG[h] + ' trăm');
  if (t > 1) { out.push(DIG[t] + ' mươi'); if (u === 1) out.push('mốt'); else if (u === 5) out.push('lăm'); else if (u === 4) out.push('tư'); else if (u) out.push(DIG[u]); }

  else if (u) { if (full || h) out.push('lẻ'); out.push(DIG[u]); }

  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'], groups = [];
  while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }

    parts.push(read3(g, i < groups.length - 1) + units[i]);

function balances(upTo) { // tồn từng quỹ (mọi bộ phận)
  const res = {};
  for (const q of cfg().quy) res[q.id] = Number(q.sodu_dau) || 0;
  for (const p of allPhieuAll()) {
    if (!live(p) || !(p.quy in res)) continue;
    const q = cfg().quy.find(x => x.id === p.quy);
    if (q && q.ngay_dau && p.ngay < q.ngay_dau) continue;
    if (upTo && p.ngay > upTo) continue;
    res[p.quy] += p.loai === 'thu' ? p.tien : -p.tien;
  }
  return res;
}

async function shrink(file) {
  if (!/^image\//.test(file.type) || file.type === 'image/svg+xml') return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
    return b && b.size < file.size ? b : file;
  } catch (e) { return file; }
}

  tin.oninput = () => { const v = parseMoney(tin.value); const pos = tin.value.length - tin.selectionStart; tin.value = v ? fmt(v) : ''; const np = Math.max(0, tin.value.length - pos); tin.setSelectionRange(np, np); words(); };
  $('#pf-anh', el).onclick = e => {
    const d = e.target.closest('[data-del]'); if (d) { e.stopPropagation(); anh.splice(+d.dataset.del, 1); drawAnh(); return; }
    const b = e.target.closest('button[data-i]'); if (b) lightbox('/_blob/' + anh[+b.dataset.i]);
  };
  $('#pf-file', el).onchange = async e => {
    const files = Array.from(e.target.files || []); e.target.value = '';
    for (const f of files) {
      $('#pf-up', el).textContent = 'Đang tải ảnh lên…';
      try { const r = await S.assets.upload(await shrink(f)); anh.push(r.id); drawAnh(); $('#pf-up', el).textContent = ''; }
      catch (err) { $('#pf-up', el).textContent = 'Không tải được ảnh: ' + (err.message || err.code || 'lỗi'); }
    }
  };
  $('#pf', el).onsubmit = async e => {
    e.preventDefault();
    const err = $('#pf-err', el); err.hidden = true;
    const ngay = $('#pf-ngay', el).value, tien = parseMoney(tin.value), dt = $('#pf-dt', el).value.trim(), nd = $('#pf-nd', el).value.trim();
    const nc = { ten: $('#pf-ncc', el).value.trim(), mst: $('#pf-mst', el).value.trim(), sdt: $('#pf-sdt', el).value.trim(), dia_chi: $('#pf-dc', el).value.trim() };
    let hdv = null;
    let bad = !/^\d{4}-\d{2}-\d{2}$/.test(ngay) ? 'Chọn ngày lập phiếu.' : !tien ? 'Nhập số tiền.' : !nd ? 'Ghi lý do / nội dung của phiếu.'
      : nc.mst && !/^\d{10}(-?\d{3})?$/.test(nc.mst) ? 'Mã số thuế gồm 10 chữ số (chi nhánh: 10 số, gạch ngang, 3 số).' : '';
    if (!bad && p.loai === 'chi') { try { hdv = readHd(); } catch (x) { bad = x.message; } }
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    const rec = Object.assign({}, p, { ngay, quy: $('#pf-quy', el).value, dm: $('#pf-dm', el).value, tien, doi_tuong: dt, noidung: nd, chungtu: $('#pf-ct', el).value.trim(), anh, ncc: nc, hd: hdv });
    if (edit) Object.assign(rec, { sua_boi: S.me.id, sua_nick: nickName(), sua_luc: nowStr() }); else Object.assign(rec, { tao_boi: S.me.id, tao_nick: nickName(), tao_luc: nowStr(), huy: null });
    const btn = $('#pf-save', el); btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      await savePhieu(rec, edit ? orig : null);
      closeDlg();
      toast(`Đã lưu ${rec.loai === 'thu' ? 'phiếu thu' : 'phiếu chi'} ${rec.so} – ${money(rec.tien)}` + (needsApproval(rec) ? '. Phiếu đang chờ duyệt.' : '.'));
    } catch (x) { btn.disabled = false; btn.textContent = edit ? 'Lưu thay đổi' : 'Lưu phiếu'; writeFailed(x); }
  };
}

function canChange(p) { return canWrite() && !p.huy && (S.me.canEdit || (p.tao_boi === S.me.id && !(approvalOf(p) || {}).ok)); }

        ${p.loai === 'chi' ? `<dt>Hóa đơn</dt><dd>${hdPill(p) || esc(HD[hdOf(p)])}${hdOf(p) === 'co' ? ` Số <b class="num">${esc(p.hd.so)}</b>${p.hd.ky_hieu ? ' · ký hiệu ' + esc(p.hd.ky_hieu) : ''}${p.hd.ngay ? ' · ngày ' + vnDate(p.hd.ngay) : ''}${p.hd.thue ? ` · thuế GTGT <span class="num">${fmt(p.hd.thue)}</span> đ` : ''}` : ''}</dd>` : ''}

}

  const defTo = (all.find(q => q.bp !== S.bp) || all.find(q => q.id !== from[0].id)).id;
  const opt = (list, sel) => list.map(q => `<option value="${esc(q.id)}"${q.id === sel ? ' selected' : ''}>${esc(q.ten)} · ${esc(BP[q.bp])}</option>`).join('');
  const el = openDlg('', `
    <header><h2>Chuyển tiền giữa các quỹ</h2><button class="btn ghost sm" type="button" data-x>Đóng</button></header>
    <form class="body" id="cq" novalidate>
      <p class="small muted" style="margin:0">Lập cùng lúc <b>phiếu chi</b> ở quỹ chuyển đi và <b>phiếu thu</b> ở quỹ nhận. Tiền chỉ đổi chỗ nên không tính vào thu – chi của công ty.</p>
      <div class="f2">
        <label class="field"><span>Từ quỹ</span><select id="cq-from">${opt(from, from[0].id)}</select></label>
        <label class="field"><span>Đến quỹ</span><select id="cq-to">${opt(all, defTo)}</select></label>
      </div>

        <label class="field amount"><span>Số tiền (đồng)</span><input type="text" inputmode="numeric" id="cq-tien" placeholder="0" autocomplete="off"></label>
      </div>
      <div class="words" id="cq-words"></div>
      <div class="f2">
        <label class="field"><span>Người nộp (bên chuyển)</span><input type="text" id="cq-nop" maxlength="120" value="${esc(nickName())}" autocomplete="off"></label>
        <label class="field"><span>Người nhận (bên nhận)</span><input type="text" id="cq-nhan" maxlength="120" autocomplete="off"></label>
      </div>
      <label class="field"><span>Nội dung</span><input type="text" id="cq-nd" maxlength="300" autocomplete="off"></label>
      <p class="err" id="cq-err" hidden></p>
    </form>
    <footer><button class="btn" type="button" data-x>Hủy bỏ</button><button class="btn pri" type="submit" form="cq" id="cq-save">Lập phiếu chuyển tiền</button></footer>`);
  $$('[data-x]', el).forEach(b => b.onclick = closeDlg);
  const t = $('#cq-tien', el), nd = $('#cq-nd', el);
  const defNd = () => { const a = quyOf($('#cq-from', el).value), b = quyOf($('#cq-to', el).value); return a && b ? (a.bp === 'kt' && b.bp === 'tq' ? 'Kế toán bán hàng nộp tiền hàng về thủ quỹ' : `Chuyển tiền từ ${a.ten} sang ${b.ten}`) : ''; };
  let auto = defNd(); nd.value = auto;
  const resync = () => { if (nd.value === auto) { auto = defNd(); nd.value = auto; } };
  $('#cq-from', el).onchange = resync; $('#cq-to', el).onchange = resync;
  t.oninput = () => { const v = parseMoney(t.value); t.value = v ? fmt(v) : ''; $('#cq-words', el).textContent = v ? 'Viết bằng chữ: ' + docSo(v) : ''; };
  $('#cq', el).onsubmit = async e => {
    e.preventDefault();
    const err = $('#cq-err', el), f = $('#cq-from', el).value, to = $('#cq-to', el).value, ngay = $('#cq-ngay', el).value, tien = parseMoney(t.value);
    const bad = f === to ? 'Quỹ chuyển đi và quỹ nhận phải khác nhau.' : !/^\d{4}-\d{2}-\d{2}$/.test(ngay) ? 'Chọn ngày.' : !tien ? 'Nhập số tiền.' : !nd.value.trim() ? 'Ghi nội dung.' : '';
    if (bad) { err.textContent = bad; err.hidden = false; return; }
    const id1 = 'p' + uid(), id2 = 'p' + uid(), meta = { tao_boi: S.me.id, tao_nick: nickName(), tao_luc: nowStr(), huy: null, ngay, tien, dm: DM_CHUYEN, noidung: nd.value.trim(), chungtu: '', anh: [], ncc: null, hd: null };
    const nop = $('#cq-nop', el).value.trim(), nhan = $('#cq-nhan', el).value.trim();
    const pc = Object.assign({ loai: 'chi', quy: f, doi_tuong: nhan, chuyen: { cap: id2, quy: to } }, meta);
    const pt = Object.assign({ loai: 'thu', quy: to, doi_tuong: nop, chuyen: { cap: id1, quy: f } }, meta);
    const btn = $('#cq-save', el); btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      await withLock(async () => {
        const ym = ymOf(ngay), snap = await S.db.doc('thang/' + ym).get(), fresh = { v: Object.assign({}, snap.exists ? snap.data().v : {}) };
        pc.so = nextNo('chi', ngay, fresh, bpOf(f)); fresh.v[id1] = pc;
        pt.so = nextNo('thu', ngay, fresh, bpOf(to));
        await mergeMonth(ym, { [id1]: pc, [id2]: pt });
      });
      closeDlg(); toast(`Đã chuyển ${money(tien)}: ${pc.so} (${quyName(f)}) → ${pt.so} (${quyName(to)}).`);
    } catch (x) { btn.disabled = false; btn.textContent = 'Lập phiếu chuyển tiền'; writeFailed(x); }
  };
}

function bindKiemQuy() {
  const upd = () => {
    const book = balances()[kqDraft.quy] || 0, real = DENOMS.reduce((a, d) => a + d * (Number(kqDraft.n[d]) || 0), 0), diff = real - book;
    $('#k-real').textContent = money(real);
    const kd = $('#k-diff'); kd.textContent = (diff >= 0 ? '+' : '−') + money(Math.abs(diff)); kd.className = 'money ' + (diff ? 'c-chi' : 'c-thu');
    $('#k-note').textContent = !real ? 'Nhập số tờ từng mệnh giá' : !diff ? 'Khớp sổ quỹ' : diff > 0 ? 'Thừa so với sổ' : 'Thiếu so với sổ';
    return { book, real, diff };
  };
  DENOMS.forEach(d => { const i = $('#k-' + d); i.oninput = () => { kqDraft.n[d] = Math.max(0, Math.floor(Number(i.value) || 0)); $('#k-s-' + d).textContent = kqDraft.n[d] ? fmt(d * kqDraft.n[d]) : ''; upd(); }; });
  const kq = $('#k-quy'); if (kq) kq.onchange = () => { kqDraft.quy = kq.value; render(); };
  $('#k-tp').oninput = e => { kqDraft.thanhphan = e.target.value; };
  $('#k-gc').oninput = e => { kqDraft.ghichu = e.target.value; };
  const sv = $('#k-save'); if (sv) sv.onclick = async () => {

    const ym = today().slice(0, 7), id = 'k' + uid(), rec = { ngay: today(), luc: nowStr(), quy: kqDraft.quy, so_sach: book, thuc_te: real, chenh: diff,
      to: Object.fromEntries(DENOMS.filter(d => kqDraft.n[d]).map(d => [d, kqDraft.n[d]])), thanhphan: kqDraft.thanhphan.trim(), ghichu: kqDraft.ghichu.trim(), boi: S.me.id, nick: nickName() };
    sv.disabled = true;

      if (snap.exists) await ref.update({ k: { [id]: rec } }); else await ref.set({ k: { [id]: rec } });
      kqDraft = null; render(); toast('Đã lưu biên bản kiểm quỹ' + (diff ? ` – chênh lệch ${diff > 0 ? '+' : '−'}${money(Math.abs(diff))}` : ' – khớp sổ quỹ.'));
    } catch (x) { sv.disabled = false; writeFailed(x); }
  };
}

function tongData() {
  const { from, to } = S.tg, qs = cfg().quy, ps = allPhieuAll().filter(p => live(p) && p.ngay >= from && p.ngay <= to && quyOf(p.quy));
  const rows = qs.map(q => {
    const l = ps.filter(p => p.quy === q.id && (!q.ngay_dau || p.ngay >= q.ngay_dau)), sum = f => l.filter(f).reduce((a, p) => a + p.tien, 0);
    const r = { q, dau: openingBefore(from, q.id, qs), thu: sum(p => p.loai === 'thu' && !p.chuyen), chi: sum(p => p.loai === 'chi' && !p.chuyen), vao: sum(p => p.loai === 'thu' && p.chuyen), ra: sum(p => p.loai === 'chi' && p.chuyen) };
    r.cuoi = r.dau + r.thu - r.chi + r.vao - r.ra; return r;
  });
  const add = list => list.reduce((a, r) => { for (const k of ['dau', 'thu', 'chi', 'vao', 'ra', 'cuoi']) a[k] += r[k]; return a; }, { dau: 0, thu: 0, chi: 0, vao: 0, ra: 0, cuoi: 0 });
  // tồn cuối từng ngày theo bộ phận
  const days = []; for (let d = new Date(from + 'T00:00'); isoDay(d) <= to && days.length < 92; d.setDate(d.getDate() + 1)) days.push(isoDay(d));
  const run = Object.fromEntries(BPS.map(k => [k, add(rows.filter(r => r.q.bp === k)).dau]));
  const daily = days.map(day => {
    const l = ps.filter(p => p.ngay === day && (!quyOf(p.quy).ngay_dau || p.ngay >= quyOf(p.quy).ngay_dau)), o = { day, thu: 0, chi: 0, n: l.length };
    for (const p of l) { const k = bpOf(p.quy), v = p.loai === 'thu' ? p.tien : -p.tien; run[k] += v; if (!p.chuyen) { if (p.loai === 'thu') o.thu += p.tien; else o.chi += p.tien; } }
    for (const k of BPS) o[k] = run[k];
    o.tong = BPS.reduce((a, k) => a + run[k], 0); return o;
  });
  return { rows, add, daily, ps, cq: ps.filter(p => p.chuyen && p.loai === 'chi') };
}

    for (const d of daily) L.push([vnDate(d.day), d.thu, d.chi, ...BPS.map(k => d[k]), d.tong]);
    const { ps } = tongData(); L.push([], ['Loại', 'Khoản mục', ...BPS.map(k => BP[k]), 'Cả công ty']);
    for (const loai of ['thu', 'chi']) { const m = {}; for (const p of ps.filter(x => real(x) && x.loai === loai)) { const r = m[p.dm] = m[p.dm] || Object.fromEntries(BPS.map(k => [k, 0])); r[bpOf(p.quy)] += p.tien; }
      for (const [dm, r] of Object.entries(m)) L.push([loai === 'thu' ? 'Thu' : 'Chi', dm, ...BPS.map(k => r[k]), BPS.reduce((a, k) => a + r[k], 0)]); }
    S.downloads.save({ filename: `tong-tien-mat-${S.tg.from}_${S.tg.to}.csv`, data: new Blob(['\ufeff' + L.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' }) })
      .then(r => { if (r && r.status === 'saved') toast('Đã tải báo cáo tổng tiền mặt.'); }).catch(e => { if (e && e.code !== 'declined') toast('Không tải được: ' + (e.message || e.code), true); });
  };
}

let cfgDraft = null;
function viewCaiDat() {
  const adm = S.me.canEdit && canWrite();
  if (!cfgDraft) cfgDraft = JSON.parse(JSON.stringify(cfg()));
  const c = cfgDraft, dis = adm ? '' : ' disabled';
  return `
  ${adm ? '' : '<div class="banner">Chỉ chủ trang và người được mời quyền Editor mới sửa được cài đặt. Bạn đang xem.</div>'}
  <section class="card"><header><h2>Quỹ và số dư đầu kỳ</h2><span class="small muted">Tồn quỹ = số dư đầu kỳ + thu − chi, tính từ ngày bắt đầu</span></header>
    <div class="tw"><table><thead><tr><th>Tên quỹ</th><th>Bộ phận giữ tiền</th><th class="r">Số dư đầu kỳ (đ)</th><th>Từ ngày</th><th></th></tr></thead><tbody>
    ${c.quy.map((q, i) => `<tr><td><input type="text" id="q-ten-${i}" value="${esc(q.ten)}" maxlength="60"${dis}></td>
      <td><select id="q-bp-${i}"${dis}>${BPS.map(k => `<option value="${k}"${q.bp === k ? ' selected' : ''}>${BP[k]}</option>`).join('')}</select></td>
      <td><input type="text" inputmode="numeric" id="q-sd-${i}" value="${fmt(q.sodu_dau)}" style="text-align:right;font-family:var(--f-num)"${dis}></td>
      <td><input type="date" id="q-nd-${i}" value="${esc(q.ngay_dau)}"${dis}></td>
      <td>${adm && c.quy.length > 1 && !allPhieuAll().some(p => p.quy === q.id) ? `<button class="btn sm danger" type="button" data-rmq="${i}">Bỏ</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>
    ${adm ? '<button class="btn sm" type="button" id="q-add" style="margin-top:10px">+ Thêm quỹ (VD: quỹ xưởng, tiền gửi ngân hàng)</button>' : ''}
  </section>
  <section class="grid g-2">
    <div class="card"><header><h2>Khoản mục thu · Thủ quỹ</h2><span class="small muted">Mỗi dòng một khoản</span></header><textarea id="c-thu" rows="7"${dis}>${esc(c.dm_thu.join('\n'))}</textarea></div>
    <div class="card"><header><h2>Khoản mục chi · Thủ quỹ</h2><span class="small muted">Mỗi dòng một khoản</span></header><textarea id="c-chi" rows="7"${dis}>${esc(c.dm_chi.join('\n'))}</textarea></div>
    <div class="card"><header><h2>Khoản mục thu · Kế toán bán hàng</h2><span class="small muted">Mỗi dòng một khoản</span></header><textarea id="c-thu-kt" rows="5"${dis}>${esc(c.dm_thu_kt.join('\n'))}</textarea></div>
    <div class="card"><header><h2>Khoản mục chi · Kế toán bán hàng</h2><span class="small muted">Nộp tiền về thủ quỹ: dùng nút ⇄ Chuyển tiền</span></header><textarea id="c-chi-kt" rows="5"${dis}>${esc(c.dm_chi_kt.join('\n'))}</textarea></div>
  </section>
  <section class="card"><header><h2>Phân quyền theo nick</h2><span class="small muted">Nick nào nhập sổ của bộ phận nào</span></header>
    ${Object.keys(S.accs).length ? `<div class="tw"><table><thead><tr><th>Nick</th><th>Họ tên</th>${BPS.map(k => `<th>${BP[k]}</th>`).join('')}<th>Xem tổng công ty</th></tr></thead><tbody>
      ${Object.entries(S.accs).sort((x, y) => x[1].user < y[1].user ? -1 : 1).map(([id, a]) => { const r = c.phan_quyen[id] || { tq: true, kt: true, tong: true };
        return `<tr${a.active === false ? ' class="huy"' : ''}><td><b>${esc(a.user)}</b></td><td>${esc(a.name)}</td>${[...BPS, 'tong'].map(k => `<td><input type="checkbox" data-pq="${esc(id)}" data-k="${k}"${r[k] ? ' checked' : ''}${dis} aria-label="${esc(a.user)} – ${k === 'tong' ? 'xem tổng công ty' : BP[k]}"></td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty small">Chưa có nick nào. Tạo nick ở nút tài khoản (👤) trên đầu trang.</div>'}
    <p class="small muted" style="margin:10px 0 0">Nick chỉ thấy và nhập sổ của bộ phận được tích. "Xem tổng công ty" mở thêm mục Tổng tiền mặt công ty. Chủ trang và người có quyền Editor luôn xem và nhập được tất cả.</p>
  </section>
  <section class="card"><header><h2>Duyệt phiếu chi</h2></header>
    <label class="field" style="max-width:20rem"><span>Phiếu chi từ số tiền này cần duyệt (0 = không cần duyệt)</span><input type="text" inputmode="numeric" id="c-ng" value="${fmt(c.nguong)}" style="text-align:right;font-family:var(--f-num)"${dis}></label>
    <p class="small muted" style="margin:10px 0 0">Ai được mời vào trang với quyền <b>Contributor</b> lập được phiếu, sửa hoặc hủy phiếu của chính mình khi chưa duyệt. Chủ trang và người có quyền <b>Editor</b> duyệt phiếu, sửa mọi phiếu và đổi cài đặt. Người chỉ có quyền xem thì chỉ xem.</p>
  </section>
  ${adm ? '<div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" type="button" id="c-reset">Bỏ thay đổi</button><button class="btn pri" type="button" id="c-save">Lưu cài đặt</button></div>' : ''}`;
}
function bindCaiDat() {
  const c = cfgDraft;
  c.quy.forEach((q, i) => {
    $('#q-ten-' + i).oninput = e => { q.ten = e.target.value; };
    $('#q-bp-' + i).onchange = e => { q.bp = e.target.value; };
    const sd = $('#q-sd-' + i); sd.oninput = () => { q.sodu_dau = parseMoney(sd.value); sd.value = fmt(q.sodu_dau); };
    $('#q-nd-' + i).onchange = e => { q.ngay_dau = e.target.value; };
  });
  $$('[data-rmq]').forEach(b => b.onclick = () => { c.quy.splice(+b.dataset.rmq, 1); render(); });
  const add = $('#q-add'); if (add) add.onclick = () => { c.quy.push({ id: 'q' + uid(), ten: 'Quỹ mới', bp: 'tq', sodu_dau: 0, ngay_dau: today() }); render(); };
  const lines = s => [...new Set(s.split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 60);
  $('#c-thu').oninput = e => { c.dm_thu = lines(e.target.value); };
  $('#c-chi').oninput = e => { c.dm_chi = lines(e.target.value); };
  $('#c-thu-kt').oninput = e => { c.dm_thu_kt = lines(e.target.value); };
  $('#c-chi-kt').oninput = e => { c.dm_chi_kt = lines(e.target.value); };
  $$('[data-pq]').forEach(x => x.onchange = () => { const id = x.dataset.pq; c.phan_quyen = Object.assign({}, c.phan_quyen); c.phan_quyen[id] = Object.assign({ tq: true, kt: true, tong: true }, c.phan_quyen[id], { [x.dataset.k]: x.checked }); });
  const ng = $('#c-ng'); ng.oninput = () => { c.nguong = parseMoney(ng.value); ng.value = fmt(c.nguong); };
  const rs = $('#c-reset'); if (rs) rs.onclick = () => { cfgDraft = null; render(); };
  const sv = $('#c-save'); if (sv) sv.onclick = async () => {
    if (c.quy.some(q => !q.ten.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(q.ngay_dau))) { toast('Mỗi quỹ cần có tên và ngày bắt đầu.', true); return; }
    if (!c.dm_thu.length || !c.dm_chi.length || !c.dm_thu_kt.length || !c.dm_chi_kt.length) { toast('Mỗi bộ phận cần ít nhất một khoản mục thu và một khoản mục chi.', true); return; }
    sv.disabled = true;
    try { await S.db.doc('cfg/main').set(Object.assign({}, c, { sua_boi: S.me.id, sua_luc: nowStr() })); cfgDraft = null; toast('Đã lưu cài đặt.'); }
    catch (x) { sv.disabled = false; writeFailed(x); }
  };
}

// ---------- điều hướng ----------
const VIEWS = { 'tong-quan': [viewTongQuan], 'so-quy': [viewSoQuy, bindSoQuy], 'bao-cao': [viewBaoCao, () => { const s = $('#r-ym'); if (s) s.onchange = () => { S.rep.ym = s.value; render(); }; }], 'kiem-quy': [viewKiemQuy, bindKiemQuy], tong: [viewTong, bindTong], 'tong-ngay': [viewTong, bindTong], 'tong-km': [viewTong, bindTong], 'tong-cq': [viewTong, bindTong], 'cai-dat': [viewCaiDat, bindCaiDat] };
function render() {
  fixBp();
  if (isBC(S.view) && !canTong()) S.view = 'tong-quan';
  if (!bpAllowed().length && !isBC(S.view) && S.view !== 'cai-dat' && canTong()) S.view = 'tong'; // nick chỉ được xem tổng
  headerBal();
  const noBp = !bpAllowed().length && !isBC(S.view) && S.view !== 'cai-dat';
  const [v0, bind] = VIEWS[S.view] || VIEWS['tong-quan'];
  const v = noBp ? () => '<div class="card empty">Nick của bạn chưa được phân sổ của bộ phận nào. Nhờ quản lý vào Cài đặt → Phân quyền theo nick.</div>' : v0;
  const main = $('#view');
  if (!S.db) {
    main.innerHTML = '<div class="card empty">Trang chưa kết nối được kho dữ liệu. Hãy đăng nhập claude.ai và mở lại link do chủ trang gửi.</div>';
  } else {
    const focus = document.activeElement && document.activeElement.id, sel = focus && document.activeElement.selectionStart;
    main.innerHTML = (S.readonly ? '<div class="banner">Bạn đang có quyền <b>chỉ xem</b> nên không lập hoặc sửa phiếu được. Cần nhập liệu: nhờ chủ trang mời bằng email với quyền <b>Contributor</b>.</div>' : '') + v();
    if (bind && !noBp) bind();
    if (focus && $('#' + focus) && focus !== 'f-q') { const el = $('#' + focus); el.focus(); try { if (sel != null && el.setSelectionRange) el.setSelectionRange(sel, sel); } catch (e) { /* ô không hỗ trợ chọn */ } }
  }
  $$('#tabs a, #tabs-bc a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + S.view ? 'page' : 'false'));
}
document.addEventListener('click', e => { if (e.target.closest('[data-hdcho]')) { Object.assign(S.f, { hd: 'cho', from: today().slice(0, 8) + '01', to: today() }); return; } const r = e.target.closest('[data-p]'); if (r && !e.target.closest('.dlg')) phieuView(r.dataset.p); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-p]')) { e.preventDefault(); phieuView(e.target.dataset.p); } });
function route() { const h = location.hash.slice(1); S.view = VIEWS[h] ? h : 'tong-quan'; if (S.view !== 'cai-dat') cfgDraft = null; store.set('qtm.view', S.view); store.set(isBC(S.view) ? 'qtm.bcview' : 'qtm.soview', S.view); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
matchMedia('(max-width: 640px)').addEventListener('change', () => { if (S.view === 'so-quy' || isBC(S.view)) render(); });
$('#b-thu').onclick = () => phieuForm('thu');
$('#b-chi').onclick = () => phieuForm('chi');
$('#b-cq').onclick = () => chuyenForm();
window.addEventListener('antam-nick', () => { if (S.db) rerender(); });

// ---------- khởi động ----------
let rt = 0; const rerender = () => { clearTimeout(rt); rt = setTimeout(render, 60); };
(async function boot() {
  if (!location.hash) { const v = store.get('qtm.view'); if (v && VIEWS[v]) S.view = v; } else route();
  render();
  const c = window.claude;
  if (!c || !c.use) { render(); return; }
  const [db, user, assets, downloads] = await Promise.all(['db', 'user', 'assets', 'downloads'].map(n => c.use(n).catch(() => null)));
  Object.assign(S, { db, user, assets, downloads });
  if (user) {
    try { S.me.id = await user.id(); } catch (e) { /* chưa đăng nhập */ }
    try { S.me.canEdit = !!(await user.canEdit()); } catch (e) { /* không rõ */ }
    try { const w = await user.can('data.write'); S.me.write = w === null ? null : !!w; if (w === false) S.readonly = true; } catch (e) { /* không rõ */ }
  }
  if (!db) { render(); return; }
  db.doc('cfg/main').onSnapshot(s => { S.cfg = s.exists ? Object.assign({}, DEFAULT_CFG, s.data()) : null; S.cfgVer = s.exists; S.loaded.cfg = true; rerender(); }, () => {});
  db.collection('thang').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.months = m; S.loaded.thang = true;
    resolveNames(allPhieu().map(p => p.tao_boi)); if (!dlgEl) rerender(); else headerBal(); }, () => { S.loaded.thang = true; rerender(); });
  db.doc('auth/accounts').onSnapshot(s => { const a = (s.exists && s.data().a) || {}; S.accs = Object.fromEntries(Object.entries(a).filter(([, x]) => x).map(([id, x]) => [id, { user: x.user, name: x.name, active: x.active }])); if (S.view === 'cai-dat') rerender(); }, () => {});
  db.collection('duyet').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.duyet = m; if (!dlgEl) rerender(); }, () => {});
  db.collection('kiemquy').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.kq = m;
    resolveNames(Object.values(m).flatMap(x => Object.values((x && x.k) || {}).map(k => k && k.boi))); if (S.view !== 'kiem-quy') rerender(); }, () => {});
  render();
})();
})();
</script>
