    if (!/^[a-z0-9._-]{2,30}$/.test(nick)) throw new ApiError(400, 'Tên đăng nhập (nick) 2–30 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch');
    if (Object.entries(all).some(([k, d]) => normNick(d.nick) === nick && k !== id)) throw new ApiError(409, `Nick ${nick} đã có người dùng`);
    const old = all[id] || {};
    const rec = { nick, name: text(data.name) || nick, phone: text(data.phone), routes: (data.routes || []).map(c => text(c).replace(/\s+/g, '')).filter(Boolean),
      active: data.active !== false, salt: old.salt || '', pin: old.pin || '' };
    const pin = text(data.pin);
    if (pin) {
      if (!/^\d{4,8}$/.test(pin)) throw new ApiError(400, 'Mã PIN gồm 4–8 chữ số');
      rec.salt = randHex(8); rec.pin = await pinHash(rec.salt, pin);
    }
    if (!rec.pin) throw new ApiError(400, 'Cần đặt mã PIN cho tài khoản mới');
    await mergeInto(ref.settings(), { s: { drivers: { [id]: rec } } }, { s: {} });
    st.settings = deepMerge(clone(st.settings || {}), { drivers: { [id]: rec } });
    await log('Lưu tài khoản giao hàng', nick, pin && old.pin ? 'đổi PIN' : '', 'TP');
    return publicDriver(id, rec);
  }

  /* ---------------------------------------------------------- định mức NVL & lệnh sản xuất (kho NVL) */
  // Định mức: kho/NVL/meta/bom {b: {mã thành phẩm (kho TP): {name, unit, lines: [{c: mã NVL, q: lượng cho 1 ĐVT thành phẩm}], note, src, updated_at}|null}}
  // Lệnh sản xuất: kho/NVL/docs/<id> {kind: 'lsx', date, title, data: {no, tp, tp_name, tp_unit, qty, mode, lines: [{c, per, need}], voucher_id, voucher_no, extra: [mã phiếu xuất bổ sung]}}
  // Lập lệnh = tự lập phiếu xuất NVL (PXK) theo định mức × số lượng; NVL thiếu tồn thì chỉ xuất phần còn tồn (hoặc xuất đủ nếu chọn).
  const r6 = x => Math.round(x * 1e6) / 1e6;
  const bomList = () => live(st.bom).map(([code, b]) => Object.assign({ code }, b)).sort((a, b) => a.code.localeCompare(b.code));
  async function tpProducts() {
    let p = st.products.TP;
    if (!p || !Object.keys(p).length) {
      if (!st.tpCache) { try { st.tpCache = (docData(await ref.products('TP').get()) || {}).p || {}; } catch (e) { throw dbError(e); } }
      p = st.tpCache;
    }
    return live(p).map(([code, x]) => ({ code, name: x.name || code, unit: x.unit || '', grp: x.grp || '', active: x.active !== 0 }))
      .sort((a, b) => a.code.localeCompare(b.code));
  }
  async function bomApi(method, arg, body) {
    if (method === 'GET') return bomList();
    if (method === 'POST') {
      const code = text(body.code);
      if (!code) throw new ApiError(400, 'Chọn thành phẩm');
      const lines = [];
      (body.lines || []).forEach((l, i) => {
        const c = text(l.c);
        if (!c) return;
        const q = num(l.q);
        if (!(q > 0)) throw new ApiError(400, `Dòng ${i + 1}: định mức phải lớn hơn 0`);
        if (lines.some(x => x.c === c)) throw new ApiError(400, `NVL ${c} bị lặp – gộp thành 1 dòng`);
        lines.push({ c, q: r6(q) });
      });
      if (!lines.length) throw new ApiError(400, 'Định mức chưa có NVL nào');
      const rec = { name: text(body.name) || code, unit: text(body.unit), lines, note: text(body.note), src: text(body.src) || 'Sửa trên web', updated_at: nowStr() };
      await mergeInto(ref.bom(), { b: { [code]: rec } }, { b: {} });
      st.bom = Object.assign({}, st.bom, { [code]: rec });
      await log('Lưu định mức NVL', code, `${lines.length} NVL`, 'NVL');
      return { ok: true };
    }
    if (method === 'DELETE' && arg) {
      await mergeInto(ref.bom(), { b: { [arg]: null } }, { b: {} });
      st.bom = Object.assign({}, st.bom, { [arg]: null });
      await log('Xóa định mức NVL', arg, '', 'NVL');
      return { ok: true };
    }
    throw new ApiError(404, 'Không có chức năng này');
  }
  // NVL cần cho qty thành phẩm, so với tồn kho NVL đến hết ngày d
  function lsxPlan(code, qty, d, exclude) {
    const b = (st.bom || {})[code];
    if (!b) throw new ApiError(400, `Thành phẩm ${code} chưa có định mức NVL – khai báo ở Sản xuất › Định mức NVL`);
    const pm = productMap('NVL'), stock = stockMap('NVL', { until: d, exclude });
    const rows = (b.lines || []).map(l => {
      const p = pm[l.c] || null, per = num(l.q), need = r6(per * qty), have = r6(stock[l.c] || 0), after = r6(have - need);
      const min = p && p.min_qty !== null && p.min_qty !== undefined ? p.min_qty : null;
      const warn = !p ? 'Chưa có mã trong kho NVL' : after < -1e-9 ? 'Thiếu' : min !== null && after < min - 1e-9 ? 'Dưới tồn tối thiểu' : '';
      return { c: l.c, name: p ? p.name : '(không có trong danh mục NVL)', unit: p ? p.unit : '', per, need, have, after, min, price: p ? p.price || 0 : 0,
        warn, missing: !p, short: r6(Math.max(0, need - Math.max(0, have))) };
    });
    return { code, name: b.name || code, unit: b.unit || '', note: b.note || '', qty, rows };
  }
  const lsxDocs = () => live(st.docs.NVL).filter(([, x]) => x.kind === 'lsx');
  function lsxNextNo(d) {
    const head = `LSX-${d.slice(8, 10)}${d.slice(5, 7)}-`;
    let seq = 0;
    for (const [, x] of lsxDocs()) {
      const s = text((x.data || {}).no);
      if ((x.date || '').slice(0, 4) === d.slice(0, 4) && s.startsWith(head)) seq = Math.max(seq, parseInt(s.slice(head.length), 10) || 0);
    }
    return head + z(seq + 1);
  }
  // các phiếu xuất NVL của lệnh (phiếu đã xóa tay thì bỏ qua) và lượng đã xuất theo mã
  function lsxIssued(x) {
    const ids = [x.voucher_id].concat(x.extra || []).filter(Boolean);
    const vs = ids.map(id => voucherById('NVL', id)).filter(Boolean);
    const got = {};
    vs.forEach(v => v.lines.forEach(l => { got[l.product_code] = r6((got[l.product_code] || 0) + l.qty); }));
    return { vs: vs.map(v => ({ id: v.id, no: v.no, date: v.date })), got };
  }
  async function lsxIssue(no, plan, d, body, me, wantOf) {
    const lines = plan.rows.filter(r => !r.missing).map(r => {
      const want = wantOf(r);
      return { product_code: r.c, qty: body.mode === 'full' ? want : r6(Math.min(want, Math.max(0, r.have))), price: r.price, note: '' };
    }).filter(l => l.qty > 1e-9);
    if (!lines.length) return null;
    const wd = settings().warehouses.NVL;
    const vid = await saveVoucher('NVL', { type: 'X', date: d, from_party: wd.name, to_party: text(body.to_party) || 'Xưởng', giver: text(body.giver), receiver: text(body.receiver),
      reason: text(body.reason) || `Xuất NVL sản xuất theo ${no}: ${plan.name} × ${fmtq(plan.qty)} ${plan.unit}`, doc_ref: no, note: text(body.note), lines }, null, me);
    return voucherById('NVL', vid);
  }
  async function lsxCreate(id, d, plan, body, me, auto) {
    const no = lsxNextNo(d);
    if (auto) body = Object.assign({}, body, { mode: 'full', reason: `Xuất NVL sản xuất theo ${no} (tự lập theo phiếu nhập TP ${auto.src.join(', ')}): ${plan.name} × ${fmtq(plan.qty)} ${plan.unit}` });
    const v = await lsxIssue(no, plan, d, body, me, r => r.need);
    const rec = { kind: 'lsx', date: d, title: `${no} · ${plan.name} × ${fmtq(plan.qty)} ${plan.unit}`, created_at: nowStr(), updated_at: nowStr(),
      data: { no, tp: plan.code, tp_name: plan.name, tp_unit: plan.unit, qty: plan.qty, mode: body.mode === 'full' ? 'full' : 'part', giver: text(body.giver), receiver: text(body.receiver),
        note: text(body.note), lines: plan.rows.map(r => ({ c: r.c, per: r.per, need: r.need })), voucher_id: v ? v.id : '', voucher_no: v ? v.no : '', extra: [],
        auto: auto ? { src: auto.src } : null, adj: {}, check: null } };
    await write(() => ref.doc('NVL', id).set(rec));
    st.docs.NVL = Object.assign({}, st.docs.NVL, { [id]: rec });
    const short = plan.rows.filter(r => r.warn === 'Thiếu').length;
    await log(auto ? 'Tự lập lệnh sản xuất' : 'Lập lệnh sản xuất', no, `${plan.name} × ${fmtq(plan.qty)} ${plan.unit}${auto ? ' (theo phiếu nhập TP ' + auto.src.join(', ') + ')' : ''} – ${v ? 'xuất NVL ' + v.no : 'chưa xuất được NVL'}${short ? ` – ${short} NVL thiếu tồn` : ''}`, 'NVL');
    return { id, no, voucher_no: v ? v.no : '' };
  }
  // Ghi lại phiếu xuất NVL chính của lệnh theo các dòng [{c, qty}] (sửa tay / số lượng thành phẩm đổi) rồi lưu lệnh
  async function lsxSaveLines(id, cur, nd, lines, me, reason) {
    const pm = productMap('NVL');
    const vl = lines.filter(l => l.qty > 1e-9 && pm[l.c]).map(l => ({ product_code: l.c, qty: r6(l.qty), price: pm[l.c].price || 0, note: '' }));
    const old = nd.voucher_id && voucherById('NVL', nd.voucher_id);
    if (old && !vl.length) { await deleteVoucher(old.id, me); nd.voucher_id = ''; nd.voucher_no = ''; }
    else if (old) {
      const full = voucherFull(old.id);
      await saveVoucher('NVL', Object.assign({}, full, { date: cur.date, reason: reason || full.reason, lines: vl }), old.id, me);
    } else if (vl.length) {
      const wd = settings().warehouses.NVL;
      const vid = await saveVoucher('NVL', { type: 'X', date: cur.date, from_party: wd.name, to_party: 'Xưởng', reason: reason || `Xuất NVL sản xuất theo ${nd.no}`, doc_ref: nd.no, lines: vl }, null, me);
      nd.voucher_id = vid; nd.voucher_no = voucherById('NVL', vid).no;
    }
    const rec = Object.assign({}, cur, { title: `${nd.no} · ${nd.tp_name} × ${fmtq(nd.qty)} ${nd.tp_unit}`, data: nd, updated_at: nowStr() });
    await write(() => ref.doc('NVL', id).set(rec));

  async function lsxRemove(id, me) {
    const x = (st.docs.NVL || {})[id];
    if (!x || x.kind !== 'lsx') throw new ApiError(404, 'Không tìm thấy lệnh sản xuất');
    const D = x.data || {};
    for (const vid of [D.voucher_id].concat(D.extra || []).filter(Boolean)) if (voucherById('NVL', vid)) await deleteVoucher(vid, me);
    await write(() => ref.doc('NVL', id).delete());
    const m = Object.assign({}, st.docs.NVL); delete m[id]; st.docs.NVL = m;
    return D;
  }
  /* ---- lệnh sản xuất tự lập: mỗi ngày, mỗi thành phẩm có định mức = tổng số lượng các phiếu nhập kho TP từ Xưởng (bên giao "Xưởng"
     hoặc lý do có "sản xuất"); phiếu nhập theo lệnh lập tay (Chứng từ = số lệnh) không tính. Sửa / xóa phiếu nhập TP thì lệnh tự cập nhật. */
  const lsxCfg = () => Object.assign({ on: true, from: '2026-10-24', reviewers: [] }, settings().lsx_auto || {});
  const canReview = me => !me || !me[0] || !!(staffPerms(me[1]).has('duyet') || (lsxCfg().reviewers || []).map(normNick).includes(normNick(me[1].user)));
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const isProdIn = v => v.type === 'N' && (/xuong/.test(fold(v.from_party)) || /san xuat/.test(fold(v.reason)));
  const autoId = (d, code) => `lsxa-${d}-${String(code).replace(/[^A-Za-z0-9_-]/g, '_')}`;
  function tpReceipts(d) {
    const manual = new Set(lsxDocs().filter(([, x]) => !(x.data || {}).auto).map(([, x]) => text((x.data || {}).no)));
    const sum = {}, src = {}, nobom = {};
    for (const v of posted('TP')) {
      if (v.date !== d || !isProdIn(v) || (v.doc_ref && manual.has(text(v.doc_ref)))) continue;
      for (const l of v.lines) {
        const c = l.product_code;
        if (!(l.qty > 0)) continue;
        if (!(st.bom || {})[c]) { nobom[c] = r6((nobom[c] || 0) + l.qty); continue; }
        sum[c] = r6((sum[c] || 0) + l.qty);
        src[c] = src[c] || [];
        if (!src[c].includes(v.no)) src[c].push(v.no);
      }
    }
    return { sum, src, nobom };
  }
  const autoReason = (no, src, plan) => `Xuất NVL sản xuất theo ${no} (tự lập theo phiếu nhập TP ${src.join(', ')}): ${plan.name} × ${fmtq(plan.qty)} ${plan.unit}`;
  async function lsxAutoSync(dates, me) {
    const cfg = lsxCfg();
    const out = { created: [], updated: [], removed: [], nobom: {}, errors: [] };
    if (!cfg.on || VIEW) return out;
    await Promise.all([liveWh('TP'), liveWh('NVL')]);
    for (const d of [...new Set(dates)].filter(x => validDateOk(x) && x >= cfg.from).sort()) {
      const { sum, src, nobom } = tpReceipts(d);
      Object.entries(nobom).forEach(([c, q]) => { out.nobom[c] = r6((out.nobom[c] || 0) + q); });
      const codes = new Set(Object.keys(sum));
      lsxDocs().forEach(([, x]) => { if (x.date === d && (x.data || {}).auto) codes.add(x.data.tp); });
      for (const code of codes) {
        try {
          const id = autoId(d, code), cur = (st.docs.NVL || {})[id], qty = r6(sum[code] || 0), srcs = (src[code] || []).slice().sort();
          if (!cur) {
            if (qty > 0) out.created.push((await lsxCreate(id, d, lsxPlan(code, qty, d), {}, me, { src: srcs })).no);
            continue;
          }
          const D = clone(cur.data || {});
          if (qty <= 0) { await lsxRemove(id, me); out.removed.push(D.no); continue; }
          if (r6(D.qty) === qty) {
            if (JSON.stringify((D.auto || {}).src || []) !== JSON.stringify(srcs)) {
              D.auto = { src: srcs };
              const rec = Object.assign({}, cur, { data: D, updated_at: nowStr() });
              await write(() => ref.doc('NVL', id).set(rec));
              st.docs.NVL = Object.assign({}, st.docs.NVL, { [id]: rec });
            }
            continue;
          }
          // số lượng thành phẩm đổi: tính lại NVL theo định mức hiện tại, bỏ phần đã sửa tay, chờ kiểm tra lại
          const plan = lsxPlan(code, qty, d, D.voucher_id);
          Object.assign(D, { qty, tp_name: plan.name, tp_unit: plan.unit, lines: plan.rows.map(r => ({ c: r.c, per: r.per, need: r.need })), auto: { src: srcs }, adj: {},
            recheck: D.check || Object.keys(D.adj || {}).length ? `Số lượng thành phẩm đổi ${fmtq(cur.data.qty)} → ${fmtq(qty)} sau khi đã kiểm tra / sửa – NVL đã tính lại theo định mức` : (D.recheck || ''), check: null });
          await lsxSaveLines(id, cur, D, plan.rows.filter(r => !r.missing).map(r => ({ c: r.c, qty: r.need })), me, autoReason(D.no, srcs, plan));
          out.updated.push(D.no);
        } catch (e) { out.errors.push(`${d} ${code}: ${e.message}`); }

  async function lsxAutoApi(method, q, body, me) {

        D.edit = { by: who, at: nowStr() };

      if (body.note !== undefined) D.review_note = text(body.note).slice(0, 500);
      if (body.check !== undefined) { D.check = body.check ? { by: who, at: nowStr() } : null; if (body.check) D.recheck = ''; }
      if (lines) await lsxSaveLines(arg, x, D, lines, me, null);
      else {
        const rec = Object.assign({}, x, { data: D, updated_at: nowStr() });
        await write(() => ref.doc('NVL', arg).set(rec));

      }
      await log(lines ? 'Sửa NVL lệnh sản xuất' : body.check ? 'Xác nhận đã kiểm tra lệnh sản xuất' : 'Bỏ xác nhận kiểm tra lệnh sản xuất', D.no,
        lines ? Object.entries(D.adj).map(([c, qv]) => `${c}: ${fmtq(qv)}`).join(', ') || 'về đúng định mức' : text(body.note), 'NVL');

  /* ---------------------------------------------------------- bộ định tuyến API (giống server.py) */
  async function handle(method, fullPath, body, opts = {}) {
    const [pathPart, qs] = fullPath.split('?');
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    const parts = pathPart.replace(/^\/+|\/+$/g, '').split('/');
    const res = parts[0], arg = parts[1] ? decodeURIComponent(parts[1]) : null;
    const wh = q.wh || st.wh;
    if (!WAREHOUSES.includes(wh)) throw new ApiError(400, 'Kho không hợp lệ: ' + wh);
    if (res === 'gh') return ghApi(method, arg, q, body || {}, opts.token || '');
    if (res === 'admin') return adminApi(method, arg, body || {});
    if (res === 'staff') return staffApi(method, arg, body || {}, opts.token || '');
    // đã có tài khoản nhân viên: người chưa đăng nhập được coi như nhân viên thường (phiếu điều chỉnh phải chờ duyệt)
    const hasStaff = live(settings().staff_accounts).length > 0;
    const me = hasStaff ? (staffMe(opts.token || '') || ['', {}]) : null;
    // phân quyền (khi web kho dùng tài khoản nhân viên): ghi vào kho nào cần quyền kho đó
    if (me && method !== 'GET' && q.auto !== '1' && ['vouchers', 'products', 'routes', 'plans', 'docs', 'review'].includes(res)) must(me, 'kho' + wh, 'làm việc với ' + (wh === 'TP' ? 'kho thành phẩm' : 'kho nguyên vật liệu'));
    if (res === 'giao-sync') return giaoSync(method, q, body || {}, arg);
    if (res === 'dh-inbox') return dhInbox(method, body || {});
    if (res === 'drivers') {
      if (method === 'GET') return Object.entries(drivers()).map(([k, d]) => publicDriver(k, d));
      must(me, 'taixe', 'quản lý tài khoản giao hàng');
      if (method === 'POST') return saveDriver(body || {});
      if (method === 'DELETE' && arg) {
        const d = drivers()[arg];
        await mergeInto(ref.settings(), { s: { drivers: { [arg]: null } } }, { s: {} });
        st.settings = deepMerge(clone(st.settings || {}), { drivers: { [arg]: null } });
        await log('Xóa tài khoản giao hàng', (d && d.nick) || arg, '', 'TP');
        return { ok: true };
      }
    }
    if (res === 'gps') { if (method !== 'GET') must(me, 'taixe', 'quản lý tài khoản giao hàng'); return gpsApi(method, arg, body || {}); }
    if (res === 'deliveries' && method === 'GET') return deliveriesOf(validDate(q.date));
    if (res === 'locations' && method === 'GET') return locationsAll();
    if (res === 'tracks' && method === 'GET') return tracksOf(validDate(q.date));
    if (res === 'bom') { if (method !== 'GET') must(me, 'sanxuat', 'sửa định mức NVL'); return bomApi(method, arg, body || {}); }
    if (res === 'tp-products' && method === 'GET') return tpProducts();
    if (res === 'lsx-auto') return lsxAutoApi(method, q, body || {}, me);
    if (!st.days[wh] && !VIEW && res !== 'meta' && res !== 'settings' && res !== 'routes') throw new ApiError(400, 'Chưa tải dữ liệu kho ' + wh);
    if (res === 'lsx') {
      if (method !== 'GET' && !canReview(me)) must(me, 'sanxuat', 'lập / sửa lệnh sản xuất');
      if (!st.days.NVL) throw new ApiError(400, 'Hãy chuyển sang Kho nguyên vật liệu để làm lệnh sản xuất');
      return lsxApi(method, arg, q, body || {}, me);
    }

    if (res === 'meta' && method === 'GET') {
      const s = settings();
      const people = new Set(s.staff || []), parties = new Set(s.warehouses[wh].parties || []);
      for (const v of vouchers(wh)) {
        [v.giver, v.receiver].forEach(x => { if (x && x.trim()) people.add(x.trim()); });
        [v.from_party, v.to_party].forEach(x => { if (x && x.trim()) parties.add(x.trim()); });
      }

      const sortVi = a => [...a].sort((x, y) => x.toLowerCase().localeCompare(y.toLowerCase(), 'vi'));
      const drv = drivers();
      delete s.drivers; delete s.admin; delete s.staff_accounts;
      return {
        wh, settings: s, warehouse: s.warehouses[wh], products: products(wh),
        drivers: Object.entries(drv).map(([k, d]) => publicDriver(k, d)),
        routes: live(st.routes).map(([id, r]) => Object.assign({ id }, r)).sort((a, b) => (a.sort || 0) - (b.sort || 0)),
        people: sortVi(people), parties: sortVi(parties),
        counts: Object.fromEntries(WAREHOUSES.map(w => [w, st.days[w] ? vouchers(w).length : 0])),

    if (res === 'settings' && method === 'PUT') {

      }
      await write(() => ref.settings().set({ s: next }));
      st.settings = next;
      await log('Sửa cài đặt', '', Object.keys(body || {}));
      return { ok: true };
    }

    if (res === 'products') {
      if (method !== 'GET') must(me, 'hang', 'sửa danh mục mặt hàng');

        const code = text(d.code).toUpperCase().replace(/\s/g, '');

        const orig = text(d.original_code);

        const exists = c => !!cur[c];
        const rec = { name: text(d.name), unit: text(d.unit), grp: text(d.grp), price: num(d.price), supplier: text(d.supplier), note: text(d.note),

            }
            for (const [ym, doc] of Object.entries(st.plans[wh] || {})) {
              const ch = {};
              for (const [id, r] of live(doc.p)) if (r.product_code === orig) ch[id] = Object.assign({}, r, { product_code: code });
              if (Object.keys(ch).length) { await mergeInto(ref.planMonth(wh, ym), { p: ch }, { ym }); Object.entries(ch).forEach(([id, r]) => applyLocalPlan(wh, ym, id, r)); }
            }
          }
          await log('Sửa mặt hàng', code, '', wh);
        } else {
          if (exists(code)) throw new ApiError(409, `Mã ${code} đã tồn tại`);
          rec.sort = Math.max(0, ...live(cur).map(([, p]) => p.sort || 0)) + 1;
          await mergeInto(ref.products(wh), { p: { [code]: rec } }, {});
          st.products[wh] = Object.assign({}, cur, { [code]: rec });
          await log('Thêm mặt hàng', code, '', wh);
        }
        return { ok: true, code };
      }
      if (method === 'DELETE' && arg) {
        let used = 0;
        vouchers(wh).forEach(v => v.lines.forEach(l => { if (l.product_code === arg) used++; }));
        used += planRows(wh).filter(r => r.product_code === arg).length;
        if (used) throw new ApiError(409, `Mã ${arg} đã có ${used} dòng trong sổ/kế hoạch – không xóa được (có thể bỏ chọn 'Đang dùng')`);
        await mergeInto(ref.products(wh), { p: { [arg]: null } }, {});
        st.products[wh] = Object.assign({}, st.products[wh], { [arg]: null });
        await log('Xóa mặt hàng', arg, '', wh);
        return { ok: true };
      }
    }

    if (res === 'routes') {
      if (method !== 'GET') must(me, 'tuyen', 'sửa tuyến / nơi nhận');
      if (method === 'POST') {
        const d = body || {};
        const name = text(d.name), code = text(d.code).replace(/\s/g, '');
        if (!name || !code) throw new ApiError(400, 'Cần nhập Tên tuyến và Mã tuyến');
        const id = d.id || newId('r');
        const sort = d.id && st.routes[id] ? st.routes[id].sort : Math.max(0, ...live(st.routes).map(([, r]) => r.sort || 0)) + 1;
        const rec = { name, code, note: text(d.note), sort };
        await mergeInto(ref.routes(), { r: { [id]: rec } }, {});

      }

        await mergeInto(ref.routes(), { r: { [arg]: null } }, {});

      if (method === 'GET' && arg) return voucherFull(arg);
      if (method === 'GET') {
        const qq = (q.q || '').trim().toLowerCase();
        const pm = productMap(wh);
        const st_ = ['pending', 'rejected'].includes(q.status) ? q.status : ''; // việc cần duyệt: mọi ngày
        const list = vouchers(wh).filter(v => (st_ ? v.status === st_ : (!q.from || v.date >= q.from) && (!q.to || v.date <= q.to)) && (!TYPE_PREFIX[q.type] || v.type === q.type) &&
          (!qq || like(qq, v.no, v.reason, v.route, v.giver, v.receiver, v.to_party) || v.lines.some(l => like(qq, l.product_code, (pm[l.product_code] || {}).name, l.note))));
        list.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.type < b.type ? -1 : a.type > b.type ? 1 : a.no < b.no ? 1 : a.no > b.no ? -1 : 0));
        return list.slice(0, parseInt(q.limit || '1000', 10)).map(voucherSummaryRow);
      }
      // phiếu kho TP thay đổi → lệnh sản xuất tự lập của ngày đó tự cập nhật
      if (method === 'POST') {
        const out = voucherFull(await saveVoucher(wh, body || {}, null, me));
        if (out.wh === 'TP') out.lsx_auto = await lsxAutoSafe([out.date], me);
        return out;
      }
      if (method === 'PUT' && arg) {
        const old = voucherFull(arg);
        const out = voucherFull(await saveVoucher(wh, body || {}, arg, me));
        if (out.wh === 'TP') out.lsx_auto = await lsxAutoSafe([old.date, out.date], me);
        return out;
      }
      if (method === 'DELETE' && arg) {
        const old = voucherFull(arg);
        await deleteVoucher(arg, me);
        return { ok: true, lsx_auto: old.wh === 'TP' ? await lsxAutoSafe([old.date], me) : null };
      }
    }
    if (res === 'notices') return noticesApi(method, arg, body || {}, me);
    if (res === 'review' && method === 'POST' && arg) return reviewVoucher(arg, !!(body || {}).ok, (body || {}).note, me);
    if (res === 'pending' && method === 'GET') {
      const n = s_ => vouchers(wh).filter(v => v.status === s_).length;
      return { count: n('pending'), rejected: n('rejected') };
    }

    if (res === 'lines' && method === 'GET') {
      const pm = productMap(wh);
      const out = [];
      const list = posted(wh).filter(v => (!q.from || v.date >= q.from) && (!q.to || v.date <= q.to) && (!TYPE_PREFIX[q.type] || v.type === q.type));
      for (let i = list.length - 1; i >= 0 && out.length < 5000; i--) {
        const v = list[i];
        for (const l of v.lines) {
          if (q.code && l.product_code !== q.code) continue;
          const p = pm[l.product_code] || {};
          out.push({ voucher_id: v.id, no: v.no, date: v.date, type: v.type, from_party: v.from_party, to_party: v.to_party, giver: v.giver,
            receiver: v.receiver, reason: v.reason, product_code: l.product_code, name: p.name || null, unit: p.unit || null, qty: l.qty, price: l.price, note: l.note });
        }
      }
      return out;
    }

    if (res === 'report') {
      if (arg === 'nxt') return reportNxt(wh, validDate(q.from, 'Từ ngày'), validDate(q.to, 'Đến ngày'));
      if (arg === 'stock') return stockMap(wh, { until: q.date ? validDate(q.date) : null, exclude: q.exclude || null });
      if (arg === 'card') return stockCard(wh, q.code || '', validDate(q.from, 'Từ ngày'), validDate(q.to, 'Đến ngày'));
    }

    if (res === 'plans') {
      if (method !== 'GET') must(me, 'kehoach', 'sửa kế hoạch mua');
      if (method === 'GET') return planRows(wh, q.from, q.to);
      if (method === 'POST') {
        const d = body || {};
        const code = text(d.product_code);
        if (!(st.products[wh] || {})[code]) throw new ApiError(400, 'Chưa chọn mặt hàng (hoặc mã không có trong danh mục kho này)');
        const row = { date: validDate(d.date, 'Ngày đặt'), dept: text(d.dept), product_code: code, qty: num(d.qty), price: num(d.price),
          need_date: text(d.need_date) ? validDate(d.need_date, 'Ngày cần hàng') : '', proposer: text(d.proposer), note: text(d.note), updated_at: nowStr() };
        const ym = row.date.slice(0, 7);
        const old = d.id ? findPlan(wh, d.id) : null;
        const id = d.id || newId('p');
        row.created_at = old ? old.row.created_at : row.updated_at;
        if (old && old.ym !== ym) { await mergeInto(ref.planMonth(wh, old.ym), { p: { [id]: null } }, { ym: old.ym }); applyLocalPlan(wh, old.ym, id, null); }
        await mergeInto(ref.planMonth(wh, ym), { p: { [id]: row } }, { ym });
        applyLocalPlan(wh, ym, id, row);
        await log(old ? 'Sửa kế hoạch mua' : 'Thêm kế hoạch mua', `${code} x ${fmtq(row.qty)}`, '', wh);
        return { ok: true };
      }
      if (method === 'DELETE' && arg) {
        const old = findPlan(wh, arg);
        if (old) { await mergeInto(ref.planMonth(wh, old.ym), { p: { [arg]: null } }, { ym: old.ym }); applyLocalPlan(wh, old.ym, arg, null); }
        await log('Xóa kế hoạch mua', arg, '', wh);
        return { ok: true };
      }
    }

    if (res === 'docs') {
      if (method !== 'GET') {
        let kind = text((body || {}).kind);
        if (!kind && arg) for (const w of WAREHOUSES) { const d = (st.docs[w] || {})[arg]; if (d) kind = d.kind; }
        const dp = DOC_PERM[kind]; if (dp && !(q.auto === '1' && kind === 'routing')) must(me, dp[0], dp[1]);
      }
      if (method === 'GET' && arg) {
        for (const w of WAREHOUSES) { const d = (st.docs[w] || {})[arg]; if (d) return Object.assign({ id: arg, wh: w }, clone(d)); }
        throw new ApiError(404, 'Không tìm thấy');
      }
      if (method === 'GET') {
        return Object.entries(st.docs[wh] || {}).filter(([, d]) => d.kind === q.kind)
          .map(([id, d]) => ({ id, wh, kind: d.kind, date: d.date, title: d.title, created_at: d.created_at, updated_at: d.updated_at }))
          .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.created_at || '') < (b.created_at || '') ? 1 : -1));
      }
      if (method === 'POST' || method === 'PUT') {
        const d = body || {};
        if (!['stocktake', 'handover', 'kebab', 'routeorders', 'routing'].includes(text(d.kind))) throw new ApiError(400, 'Loại biên bản không hợp lệ');
        const id = method === 'PUT' && arg ? arg : newId('d');
        const old = (st.docs[wh] || {})[id];
        const rec = { kind: d.kind, date: validDate(d.date), title: text(d.title), data: d.data || {}, created_at: old ? old.created_at : nowStr(), updated_at: nowStr() };
        if (JSON.stringify(rec).length > 240000) throw new ApiError(413, 'Biên bản quá lớn để lưu');
        await write(() => ref.doc(wh, id).set(rec));
        st.docs[wh] = Object.assign({}, st.docs[wh], { [id]: rec });
        await log(old ? 'Sửa biên bản' : 'Lưu biên bản', `${d.kind} ${rec.date}`, '', wh);
        return { ok: true, id };
      }
      if (method === 'DELETE' && arg) {
        await write(() => ref.doc(wh, arg).delete());
        const m = Object.assign({}, st.docs[wh]); delete m[arg]; st.docs[wh] = m;
        await log('Xóa biên bản', arg, '', wh);
        return { ok: true };
      }
    }

    if (res === 'log' && method === 'GET') {
      must(me, 'lichsu', 'xem lịch sử thao tác');
      if (VIEW) return [];
      const snap = await ref.logs().orderBy('date', 'desc').limit(31).get();
      const out = [];
      snap.docs.forEach(d => live((d.data() || {}).e).forEach(([id, e]) => out.push(Object.assign({ id }, e))));
      return out.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0)).slice(0, 500);
    }

    if (res === 'import-backup' && method === 'POST') {
      must(me, 'caidat', 'nhập dữ liệu');
      const snap = body || {};
      if (snap.format !== 'kho-antam-backup' || !snap.warehouses) throw new ApiError(400, "File không đúng: hãy dùng file 'Tải dữ liệu' (.json) của web Kho An Tâm");
      const summary = {};
      if (snap.settings && Object.keys(snap.settings).length) { await write(() => ref.settings().set({ s: snap.settings })); st.settings = snap.settings; }
      await write(() => ref.routes().set({ r: snap.routes || {} })); st.routes = snap.routes || {};
      if (snap.bom) { await write(() => ref.bom().set({ b: snap.bom })); st.bom = snap.bom; }
      if (snap.deliveries) {
        const oldG = (await ref.giaoAll().limit(1000).get()).docs.map(x => x.id);
        for (const id of oldG) if (!snap.deliveries[id]) await write(() => ref.giao(id).delete());
        for (const [id, doc] of Object.entries(snap.deliveries)) if (doc) await write(() => ref.giao(id).set(doc));
      }
      if (snap.locations) await write(() => ref.vitri().set({ v: snap.locations.v || {} }));
      for (const w of WAREHOUSES) {
        const d = snap.warehouses[w];
        if (!d) continue;
        // đọc mới danh sách tài liệu hiện có để xóa cả những ngày/tháng chưa tải vào bộ nhớ
        const asIds = s => s.docs.map(x => x.id);
        const [oldDays, oldDocs, oldPlans] = await Promise.all([ref.days(w).limit(1000).get(), ref.docs(w).limit(1000).get(), ref.plans(w).limit(1000).get()]).then(r => r.map(asIds));
        await write(() => ref.products(w).set({ p: d.products || {} }));
        for (const id of oldDays) if (!(d.days || {})[id]) await write(() => ref.day(w, id).delete());
        for (const [id, doc] of Object.entries(d.days || {})) await write(() => ref.day(w, id).set(doc));
        for (const id of oldDocs) if (!(d.docs || {})[id]) await write(() => ref.doc(w, id).delete());
        for (const [id, doc] of Object.entries(d.docs || {})) await write(() => ref.doc(w, id).set(doc));
        for (const id of oldPlans) if (!(d.plans || {})[id]) await write(() => ref.planMonth(w, id).delete());
        for (const [id, doc] of Object.entries(d.plans || {})) await write(() => ref.planMonth(w, id).set(doc));
        st.products[w] = d.products || {}; st.days[w] = clone(d.days || {}); st.docs[w] = clone(d.docs || {}); st.plans[w] = clone(d.plans || {}); bump(w);
        summary[w] = { 'Phiếu': vouchers(w).length };
      }
      await log('Nhập file dữ liệu .json', '', summary);
      return summary;
    }

    // đọc 1 sheet của file Excel (Phân tuyến: danh sách khách theo ngày)
    if (res === 'sheet-rows' && method === 'POST') {
      if (!body || !body.byteLength) throw new ApiError(400, 'Chưa chọn file');
      if (!window.XLSX) throw new ApiError(500, 'Chưa tải được thư viện đọc Excel, hãy tải lại trang.');
      const data = new Uint8Array(body);
      let names;
      try { names = window.XLSX.read(data, { type: 'array', bookSheets: true }).SheetNames; } catch (e) {
        throw new ApiError(400, 'File không phải định dạng .xlsx (hãy lưu lại file bằng Excel dạng .xlsx)');
      }
      const name = names.includes(q.sheet) ? q.sheet : names[names.length - 1];
      if (!name) return { sheets: [], sheet: null, rows: [] };
      const ws = window.XLSX.read(data, { type: 'array', sheets: name, cellDates: true }).Sheets[name];
      const rows = ws ? window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true }) : [];
      const z = n => String(n).padStart(2, '0');
      return { sheets: names, sheet: name, rows: rows.map(r => r.map(v => (v instanceof Date ? `${z(v.getDate())}/${z(v.getMonth() + 1)}/${v.getFullYear()}` : v))) };
    }

    if (res === 'import' && method === 'POST') {
      if (!body || !body.byteLength) throw new ApiError(400, 'Chưa chọn file');
      const opts = {};
      ['products', 'routes', 'ledger', 'plans'].forEach(k => { opts[k] = (q[k] || '1') === '1'; });
      opts.force = q.force === '1';
      return importExcel(wh, body, opts);
    }

    if (res === 'export' && method === 'GET') {
      if (arg === 'lines.csv') return exportCsv(wh, q.from, q.to);
      if (arg === 'backup') return await exportBackup();
    }
    throw new ApiError(404, 'Không có chức năng này');
  }

  return {
    init, setWh, handle,
    get ready() { return !!st.ready; },
    photoUrl,
    set who(v) { st.who = v; },
    get myName() { return st.myName || ''; },
    get canWrite() { return VIEW ? false : st.canWrite; },
    get isView() { return VIEW; },
    get snapshotAt() { return st.snapshotAt || ''; },
    get skeletonReset() { return SKELETON_RESET; },
    khovanPush,
    async canEditPage() { try { return !!(st.user && await st.user.canEdit()); } catch (e) { return false; } },
    checkSnapshot(text) {
      let snap;
      try { snap = JSON.parse(text); } catch (e) { throw new Error('File không đọc được (không phải file dữ liệu tải từ web chính).'); }
      if (!snap || snap.format !== 'kho-antam-backup' || !snap.warehouses || !snap.warehouses.TP || !snap.warehouses.NVL) {
        throw new Error('File không đúng: hãy dùng file "Tải dữ liệu" ở mục Cài đặt & dữ liệu của web chính.');
      }
      return snap;
    },
    onRemote(fn) { st.onRemote = fn; },
    // trang gộp: báo ngay khi web Đóng hàng gửi đơn mới (khoout/index đổi)
    watchDh(fn) { if (!HOP || VIEW || !st.db) return; let first = true; st.globalSubs.push(st.db.doc('khoout/index').onSnapshot(() => { if (first) { first = false; return; } fn(); }, () => {})); },
    // chế độ người giao: tải sẵn các bảng phân tuyến (để tự nhận đơn web Đóng hàng cũng chạy được ở điện thoại người giao)
    prepGiao() { return ensureGiaoData(); },
    get hop() { return HOP; },
  };
})();

'use strict';
/* Web giao hàng An Tâm – mỗi người giao hàng 1 tài khoản (nick + mã PIN, tạo ở web kho › Tài khoản giao hàng).
   Sau khi đăng nhập: chọn ngày, thấy các tuyến kho đã sắp cho mình ở mục Phân tuyến giao hàng (khách, địa chỉ,
   SĐT, số lượng từng loại bánh), đánh dấu Đã giao / Không giao được kèm ảnh chụp + vị trí lúc giao,
   lưu vị trí chính xác của khách để lần sau chỉ đường – web kho thấy ngay kết quả.
   Bản chạy máy chủ: trang /giao-hang gọi /api/gh/…; bản online: chạy trong trang Kho An Tâm, gọi Backend.handle. */
const GiaoHang = (() => {
  const ONLINE = !!window.ANTAM_ONLINE;
  const WEEKDAY = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const FAIL_REASONS = ['Khách vắng nhà', 'Khách hẹn giao lại', 'Khách không nhận', 'Sai địa chỉ / SĐT', 'Hết hàng trên xe'];
  const st = { token: '', driver: null, date: '', data: null, days: [], filter: 'all', search: '', panel: null, busy: 0, root: null, onExit: null, timer: null };

  /* ---------------------------------------------------------- tiện ích */
  const $ = (sel, root = st.root) => root.querySelector(sel);
  const $$ = (sel, root = st.root) => Array.from(root.querySelectorAll(sel));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem('gh.' + key));
      if (val === null) localStorage.removeItem('gh.' + key); else localStorage.setItem('gh.' + key, JSON.stringify(val));
    } catch (e) { return null; }
    return undefined;
  }
  const noAccent = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const matches = (q, hay) => { const h = noAccent(hay); return noAccent(q).split(/\s+/).filter(Boolean).every(t => h.includes(t)); };
  const fmt = n => Number(n).toLocaleString('vi-VN', { maximumFractionDigits: 3 });
  const z = n => String(n).padStart(2, '0');
  const isoDate = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
  const vnDate = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
  const dayLabel = iso => {
    const t = isoDate();
    const rel = iso === t ? 'Hôm nay' : iso === addDays(t, 1) ? 'Ngày mai' : iso === addDays(t, -1) ? 'Hôm qua' : WEEKDAY[new Date(iso + 'T00:00:00').getDay()];
    return `${rel}, ${vnDate(iso)}`;
  };
  // Mã khách để ghi kết quả giao (giống server.py cust_key): mã CRM, không có thì mã đầu tên khách, không có nữa thì tên
  const custKey = r => String(r.key || '').trim() || String(r.crm || '').trim() || String(r.code || '').trim() || String(r.cust || '').trim();
  function toast(msg, err) {
    const box = $('#gh-toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'gh-toast' + (err ? ' err' : '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), err ? 5000 : 2500);
  }

  async function call(method, path, body) {
    if (ONLINE) {
      try { return await Backend.handle(method, '/gh/' + path, body, { token: st.token }); } catch (e) {
        const err = new Error(e.message || String(e)); err.status = e.status; throw err;
      }
    }
    const opt = { method, headers: { 'X-GH-Token': st.token } };
    if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
    let res;
    try { res = await fetch('/api/gh/' + path, opt); } catch (e) { throw new Error('Mất kết nối tới web kho – kiểm tra wifi/mạng rồi bấm ↻.'); }
    let data = null;
    try { data = await res.json(); } catch (e) { /* trống */ }
    if (!res.ok) { const err = new Error((data && data.error) || ('Lỗi ' + res.status)); err.status = res.status; throw err; }
    return data;
  }
  async function guard(fn) {
    st.busy++;
    try { return await fn(); } catch (e) {
      if (e.status === 401 && st.token) { logout(e.message); return undefined; }
      toast(e.message, true); return undefined;
    } finally { st.busy--; }
  }

  /* ---------------------------------------------------------- đăng nhập */
  function drawLogin(msg) {
    stopTimer();
    st.root.innerHTML = `<div class="gh-login">
      <div class="gh-logo">🚚</div><h1>Giao hàng An Tâm</h1>
      <p class="gh-muted">Đăng nhập bằng nick và mã PIN do kho cấp để xem tuyến giao của bạn.</p>
      <form id="gh-login-form" autocomplete="on">
        <label>Nick<input id="gh-nick" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(store('nick') || '')}" required></label>
        <label>Mã PIN<input id="gh-pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
        <button class="gh-btn primary big" type="submit">Đăng nhập</button>
        <p class="gh-err" id="gh-login-err">${esc(msg || '')}</p>
      </form>
      ${st.onExit ? `<button class="gh-btn ghost" id="gh-exit">${esc(st.exitLabel)}</button>` : ''}
    </div><div id="gh-toasts" class="gh-toasts"></div>`;
    const nick = $('#gh-nick'), pin = $('#gh-pin');
    (nick.value ? pin : nick).focus();
    $('#gh-login-form').onsubmit = async e => {
      e.preventDefault();
      const btn = $('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
      try {
        const res = await call('POST', 'login', { nick: nick.value, pin: pin.value });
        st.token = res.token; st.driver = res.driver;
        store('token', st.token); store('driver', st.driver); store('nick', res.driver.nick);
        st.date = isoDate();
        await showMain();
      } catch (err) {
        $('#gh-login-err').textContent = err.message;
        btn.disabled = false; btn.textContent = 'Đăng nhập';
      }
    };
    if (st.onExit) $('#gh-exit').onclick = () => exit();
  }
  function logout(msg) {
    trkStop();
    st.token = ''; st.driver = null; st.data = null;
    store('token', null); store('driver', null);
    drawLogin(msg);
  }
  function exit() { stopTimer(); trkStop(); if (st.onExit) st.onExit(); }

  /* ---------------------------------------------------------- màn hình chính */
  async function showMain() {
    st.root.innerHTML = `<header class="gh-top">
        <div class="gh-who"><span class="gh-avatar">🚚</span><div><b id="gh-name"></b><div class="gh-sub">Giao hàng An Tâm</div></div></div>
        <div class="gh-top-actions"><button class="gh-btn sm" id="gh-reload" title="Tải lại">↻</button>
        <button class="gh-btn sm" id="gh-logout">Đăng xuất</button>${st.onExit && st.exitInHeader ? '<button class="gh-btn sm ghost" id="gh-exit">Web kho</button>' : ''}</div>
      </header>
      <nav class="gh-datebar">
        <button class="gh-btn sm" id="gh-prev" aria-label="Ngày trước">◀</button>
        <label class="gh-date"><span id="gh-day-label"></span><input type="date" id="gh-date"></label>
        <button class="gh-btn sm" id="gh-next" aria-label="Ngày sau">▶</button>
        <button class="gh-btn sm" id="gh-today">Hôm nay</button>
      </nav>
      <main id="gh-main" class="gh-main"><p class="gh-muted">Đang tải…</p></main>

      ${st.gpsBlocked ? '' : `<button class="gh-btn" data-act="loc-gps" data-key="${esc(key)}">📍 Dùng vị trí hiện tại (đang đứng tại khách)</button>`}

      el.innerHTML = `<div class="gh-dialog-box"><p>Chưa có ảnh giao hàng. Vẫn xác nhận đã giao?</p>
        <div class="gh-actions"><button class="gh-btn" data-no>Quay lại chụp ảnh</button><button class="gh-btn ok" data-yes>Vẫn xác nhận</button></div></div>`;
      st.root.appendChild(el);
      const done = v => { el.remove(); resolve(v); };
      el.querySelector('[data-no]').onclick = () => done(false);
      el.querySelector('[data-yes]').onclick = () => done(true);
    });
  }
  async function submit(key, rec) {
    const date = st.date;
    const ok = await guard(() => call('POST', 'deliver', Object.assign({ date, key }, rec)));
    if (!ok || date !== st.date) return false;
    const m = Object.assign({}, st.data.deliveries);
    if (rec.status) m[key] = { status: rec.status, note: rec.note || '', at: nowStr(), photos: rec.photos || [], gps: rec.gps || null }; else delete m[key];
    st.data.deliveries = m;
    const day = st.days.find(x => x.date === date);
    if (day) day.done = Object.values(m).filter(x => x.status === 'ok').length;
    return true;
  }
  async function saveLocation(key, g, quiet) {
    const res = await guard(() => call('POST', 'location', Object.assign({ date: st.date, key }, g)));
    if (!res) return;
    st.data.locations = Object.assign({}, st.data.locations, { [key]: res.location || g });
    if (st.panel && st.panel.mode === 'loc' && st.panel.key === key) st.panel = null;
    toast('Đã lưu vị trí khách' + (quiet ? '' : accText(g)));
    if (!quiet) redraw();
  }
  async function fetchGps(p) {
    p.gpsState = 'wait'; p.gpsErr = ''; redraw();
    try { p.gps = await getGps(); } catch (e) { p.gpsErr = e.message; }
    p.gpsState = '';
    if (st.panel === p) redraw();
  }
  // Định vị tự động: chỉ chạy được khi trình duyệt cho phép (bản chạy máy qua https). Trang trên claude.ai bị chặn –
  // lần đầu bị từ chối thì nhớ lại (st.gpsBlocked) để hiện ngay cách dán tọa độ từ Google Maps.
  function getGps() {
    const blocked = msg => { st.gpsBlocked = true; store('gpsBlocked', true); return new Error(msg); };
    return new Promise((resolve, reject) => {
      if (!window.isSecureContext) return reject(blocked('Trang này không đọc được định vị – lấy tọa độ ở Google Maps rồi dán vào'));
      if (!navigator.geolocation) return reject(blocked('Điện thoại / trình duyệt không hỗ trợ định vị – lấy tọa độ ở Google Maps rồi dán vào'));
      navigator.geolocation.getCurrentPosition(
        pos => { st.gpsBlocked = false; store('gpsBlocked', null); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }); },
        e => reject(e.code === 1 ? blocked(ONLINE ? 'Trang trên claude.ai không được đọc định vị điện thoại – lấy tọa độ ở Google Maps rồi dán vào'
          : 'Chưa cho phép định vị – bật quyền Vị trí cho trình duyệt, hoặc lấy tọa độ ở Google Maps rồi dán vào')
          : new Error(e.code === 3 ? 'Lấy vị trí quá lâu – thử lại, hoặc dán tọa độ từ Google Maps' : 'Không lấy được vị trí – dán tọa độ từ Google Maps')),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    });
  }
  // vị trí dán vào: tọa độ (kể cả trong link dài) hoặc link chia sẻ Google Maps (maps.app.goo.gl, goo.gl/maps, google.com/maps)
  const mapsLink = s => (String(s || '').match(/https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|(?:www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)[^\s"'<>]*/i) || [''])[0];
  function parseLoc(s) {
    const g = parseCoords(s);
    if (g) return g;
    const url = mapsLink(s);
    return url ? { url } : null;
  }
  // "10.88, 106.59", link Google Maps (…!3d10.88!4d106.59…, …@10.88,106.59…, …?q=10.88,106.59)
  function parseCoords(s) {
    const t = String(s || '');
    const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /(-?\d{1,2}\.\d{2,})\s*[,; ]\s*(-?\d{1,3}\.\d{2,})/];
    for (const re of pats) {
      const m = t.match(re);
      if (m) { const lat = +m[1], lng = +m[2]; if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng, acc: null }; }
    }
    return null;
  }

  /* ---------------------------------------------------------- chia sẻ hành trình */
  // Bật chia sẻ: trong lúc web mở, điện thoại gửi vị trí theo thời gian thực (watchPosition) – kho xem đường đi ở mục Hành trình.
  // Ghi 1 điểm khi đi được ≥ 25 m (cách điểm trước ≥ 20 giây) hoặc đứng yên mỗi 5 phút; gửi về mỗi phút.
  // Trang trên claude.ai không đọc được định vị: gửi link "Chia sẻ vị trí" của Google Maps – kho bấm là thấy xe đang ở đâu.
  const trk = { on: false, date: '', watch: null, buf: [], last: null, fix: null, err: '', wait: false, timer: null, lock: null, sending: false, live: false, info: null };
  const secOf = (date, ts) => Math.round((ts - new Date(date + 'T00:00:00').getTime()) / 1000);
  const hm = sec => `${z(Math.floor(sec / 3600) % 24)}:${z(Math.floor(sec / 60) % 60)}`;
  function meters(a, b) {
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b[1] - a[1]), dLng = r(b[2] - a[2]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[1])) * Math.cos(r(b[1])) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function trkStart(resume) {
    trk.err = '';
    if (!window.isSecureContext || !navigator.geolocation) {
      st.gpsBlocked = true; store('gpsBlocked', true);
      return drawTrk(); // thẻ đã hướng dẫn gửi link Chia sẻ vị trí của Google Maps
    }
    trk.on = true; trk.date = isoDate(); trk.last = null; trk.wait = true;
    store('trk', { date: trk.date });
    trk.watch = navigator.geolocation.watchPosition(onFix, onFixErr, { enableHighAccuracy: true, maximumAge: 15000, timeout: 60000 });
    clearInterval(trk.timer);
    trk.timer = setInterval(trkFlush, 60000);
    keepAwake();
    if (!resume || !(trk.info && trk.info.on)) call('POST', 'track', { date: trk.date, on: true }).then(r => { trk.info = Object.assign({}, trk.info, r); }).catch(() => {});
    drawTrk();
  }
  function onFix(pos) {
    if (!trk.on) return;
    const c = pos.coords, now = isoDate();
    if (now !== trk.date) { trkFlush(); trk.date = now; trk.last = null; store('trk', { date: now }); } // qua ngày mới
    const p = [secOf(trk.date, pos.timestamp || Date.now()), Math.round(c.latitude * 1e5) / 1e5, Math.round(c.longitude * 1e5) / 1e5, Math.round(c.accuracy || 0)];
    trk.fix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, ts: Date.now() };
    trk.wait = false; trk.err = '';
    const L = trk.last;
    if (L && c.accuracy > 150) return drawTrkStatus(); // tín hiệu yếu: bỏ qua
    if (!L || (p[0] - L[0] >= 20 && meters(L, p) >= Math.max(25, c.accuracy || 0)) || p[0] - L[0] >= 300 || p[0] < L[0]) {
      trk.buf.push(p); trk.last = p;
      if (trk.buf.length >= 30) trkFlush();
    }
    drawTrkStatus();
  }
  function onFixErr(e) {
    if (e.code === 1) {
      trkStop(true);
      st.gpsBlocked = true; store('gpsBlocked', true);
      trk.err = ONLINE ? '' : 'Chưa cho phép định vị – bật quyền Vị trí cho trình duyệt rồi bấm Thử bật GPS lại, hoặc gửi link Chia sẻ vị trí của Google Maps.';
      return drawTrk();
    }
    trk.wait = true; drawTrkStatus(); // mất tín hiệu GPS tạm thời: vẫn chờ
  }
  async function trkFlush(extra) {
    if (trk.sending || !st.token || (!trk.buf.length && !extra)) return;
    const pts = trk.buf.splice(0), date = trk.date || isoDate();
    trk.sending = true;
    try {
      const r = await call('POST', 'track', Object.assign({ date, pts }, extra));
      trk.info = Object.assign({}, trk.info, r, { last: pts[pts.length - 1] || (trk.info || {}).last });
      trk.err = '';
    } catch (e) {
      if (pts.length) trk.buf = pts.concat(trk.buf).slice(-1500); // giữ lại gửi lần sau
      if (e.status === 401) { trk.sending = false; return logout(e.message); }
      trk.err = 'Chưa gửi được vị trí (mất mạng?) – web sẽ tự gửi lại.';
    } finally { trk.sending = false; }
    drawTrkStatus();
  }
  // tắt chia sẻ (đăng xuất / thoát / bấm Dừng): gửi nốt các điểm còn lại
  function trkStop(keepFlag) {
    if (!trk.on) return;
    trk.on = false;
    if (trk.watch != null) navigator.geolocation.clearWatch(trk.watch);
    trk.watch = null; clearInterval(trk.timer); trk.timer = null;
    if (trk.lock) { trk.lock.release().catch(() => {}); trk.lock = null; }
    if (!keepFlag) store('trk', null);
    const pts = trk.buf.splice(0);
    if (st.token) call('POST', 'track', { date: trk.date, pts, on: false }).then(r => { trk.info = Object.assign({}, trk.info, r); drawTrkStatus(); }).catch(() => {});
  }
  // giữ màn hình sáng khi đang chia sẻ (trình duyệt cho phép thì mới được)
  async function keepAwake() {
    if (!trk.on || trk.lock || document.hidden || !('wakeLock' in navigator)) return;
    try { trk.lock = await navigator.wakeLock.request('screen'); trk.lock.addEventListener('release', () => { trk.lock = null; }); } catch (e) { trk.lock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (!trk.on) return; if (document.hidden) trkFlush(); else keepAwake(); });
  window.addEventListener('pagehide', () => { if (trk.on) trkFlush(); });

  function trkStatusText() {
    const I = trk.info || {}, n = Math.max(I.n || 0, 0) + trk.buf.length;
    if (trk.on) {
      if (trk.wait && !trk.fix) return 'Đang bật GPS, chờ vị trí…';
      const at = trk.fix ? `${z(new Date(trk.fix.ts).getHours())}:${z(new Date(trk.fix.ts).getMinutes())}` : '';
      return `Đang chia sẻ · ${n} điểm${at ? ' · vị trí lúc ' + at : ''}${trk.buf.length ? ` · ${trk.buf.length} điểm chờ gửi` : ''}${trk.wait ? ' · đang chờ tín hiệu GPS' : ''}`;
    }
    return n ? `Đang tắt · hôm nay đã ghi ${n} điểm${I.last ? ', lần cuối ' + hm(I.last[0]) : ''}` : 'Đang tắt';
  }
  function trkCard() {
    if (st.date !== isoDate()) return '';
    const I = trk.info || {};
    const steps = `<ol class="gh-steps"><li>Mở app <b>Google Maps</b> → bấm <b>ảnh đại diện</b> (góc trên bên phải) → <b>Chia sẻ vị trí</b></li>
      <li>Chọn thời gian <b>Cho đến khi bạn tắt</b> → chọn <b>Sao chép</b> (hoặc Chia sẻ qua đường liên kết)</li><li>Quay lại đây, dán link vào ô dưới – web tự gửi cho kho</li></ol>`;
    return `<section class="gh-card gh-trk ${trk.on ? 'on' : ''}" id="gh-trk">
      <div class="gh-trk-head"><h3>🛰 Chia sẻ hành trình</h3><span class="gh-trk-st" id="gh-trk-st">${esc(trkStatusText())}</span></div>
      ${I.gps && !trk.on ? `<a class="gh-btn primary big" href="${esc(I.gps)}" target="_blank" rel="noopener">🛰 Mở GPS An Tâm (đọc GPS điện thoại)</a>
        <p class="gh-muted gh-small">Trang GPS riêng của bạn: bấm <b>▶ Bật GPS</b>, điện thoại hỏi quyền <b>Vị trí</b> → <b>Cho phép</b>. Để trang đó mở trong lúc đi giao
        (màn hình sáng) – kho thấy đường đi của bạn. Vẫn bấm <b>Đã giao</b> ở trang này như bình thường.</p>` : ''}
      ${trk.on ? `<button class="gh-btn danger" data-trk="stop">■ Dừng chia sẻ</button>
        <p class="gh-muted gh-small">Giữ web này mở trên điện thoại trong lúc giao (nên để màn hình sáng) – kho thấy đường đi và vị trí của bạn.</p>`
      : st.gpsBlocked && I.gps ? ''
      : st.gpsBlocked ? `<p class="gh-muted gh-small">Trang này chưa đọc được định vị điện thoại. Gửi <b>link Chia sẻ vị trí</b> của Google Maps để kho thấy bạn đang ở đâu;
        đường đi trong ngày ghi theo thứ tự các khách bạn bấm <b>Đã giao</b>. <button class="gh-linkbtn" data-trk="start">Thử bật GPS lại</button></p>`
      : `<button class="gh-btn primary" data-trk="start">▶ Bật chia sẻ hành trình</button>
        <p class="gh-muted gh-small">Bật lúc bắt đầu đi giao, tắt khi xong – điện thoại sẽ hỏi quyền <b>Vị trí</b>, bấm <b>Cho phép</b>.</p>`}
      ${trk.err ? `<p class="gh-red gh-small" id="gh-trk-err">${esc(trk.err)}</p>` : ''}
      <div class="gh-locline">${I.live ? `<span class="gh-badge ok">🔗 Đã gửi link vị trí trực tiếp</span>
        <a class="gh-link" href="${esc(I.live)}" target="_blank" rel="noopener">xem</a>
        <button class="gh-linkbtn" data-trk="live">Đổi link</button><button class="gh-linkbtn" data-trk="unlive">Bỏ link</button>`
      : trk.live ? '' : '<button class="gh-linkbtn" data-trk="live">🔗 Gửi link vị trí trực tiếp Google Maps</button>'}</div>
      ${trk.live ? `<div class="gh-panel"><div class="gh-panel-title">🔗 Link vị trí trực tiếp (Google Maps)</div>${steps}
        <input class="gh-input" data-live autocomplete="off" placeholder="Dán link chia sẻ vị trí (maps.app.goo.gl/…)">
        <div class="gh-actions"><button class="gh-btn ok" data-trk="live-save">Gửi cho kho</button><button class="gh-btn" data-trk="live-cancel">Hủy</button></div></div>` : ''}
    </section>`;
  }
  function drawTrk() {
    const el = $('#gh-trk');
    if (!el) return;
    el.outerHTML = trkCard();
    bindTrk();
  }
  function drawTrkStatus() {
    const el = $('#gh-trk-st');
    if (el) el.textContent = trkStatusText();
    const er = $('#gh-trk-err');
    if (er && !trk.err) er.remove(); else if (trk.err && !er && $('#gh-trk')) drawTrk();
  }
  async function sendLive(url) {
    const r = await guard(() => call('POST', 'track', { date: isoDate(), live: url }));
    if (!r) return;
    trk.info = Object.assign({}, trk.info, r); trk.live = false;
    toast(url ? 'Đã gửi link vị trí trực tiếp cho kho' : 'Đã bỏ link vị trí trực tiếp');
    drawTrk();
  }
  function bindTrk() {
    const box = $('#gh-trk');
    if (!box) return;
    $$('[data-trk]', box).forEach(b => b.onclick = () => {
      const a = b.dataset.trk;
      if (a === 'start') { st.gpsBlocked = false; store('gpsBlocked', null); trkStart(); }
      else if (a === 'stop') { trkStop(); drawTrk(); toast('Đã tắt chia sẻ hành trình'); }
      else if (a === 'live') { trk.live = true; drawTrk(); const i = $('[data-live]'); if (i) i.focus({ preventScroll: true }); }
      else if (a === 'live-cancel') { trk.live = false; drawTrk(); }
      else if (a === 'unlive') sendLive('');
      else if (a === 'live-save') {
        const url = mapsLink(($('[data-live]') || {}).value);
        if (!url) { toast('Chưa nhận ra link. Trong Google Maps bấm Chia sẻ vị trí → Sao chép rồi dán vào ô.', true); return; }
        sendLive(url);
      }
    });
    const inp = $('[data-live]', box);
    if (inp) inp.oninput = e => { const url = mapsLink(inp.value); if (url && e.inputType === 'insertFromPaste') sendLive(url); };
  }

  /* ---------------------------------------------------------- ảnh giao hàng */
  async function photoSrc(ref) {
    if (ONLINE) { try { return await Backend.photoUrl(ref); } catch (e) { return ''; } }
    return '/api/gh/photo?ref=' + encodeURIComponent(ref) + '&t=' + encodeURIComponent(st.token);
  }
  function viewPhoto(src) {
    const el = document.createElement('div');
    el.className = 'gh-dialog gh-viewer';
    el.innerHTML = `<img src="${esc(src)}" alt="Ảnh giao hàng"><button class="gh-btn">Đóng</button>`;
    el.onclick = () => el.remove();
    st.root.appendChild(el);
  }
  // Thu nhỏ ảnh chụp (≤1280px, JPEG) và ghi giờ chụp + khách lên góc ảnh
  async function compress(file, label) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Không đọc được ảnh ' + (file.name || ''))); i.src = url; });
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const fs = Math.max(14, Math.round(c.width / 40));
      ctx.font = `bold ${fs}px sans-serif`;
      const text = `${nowStr().slice(0, 16)} · ${label}`.slice(0, 80);
      const w = ctx.measureText(text).width;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, c.height - fs * 1.8, w + fs, fs * 1.8);
      ctx.fillStyle = '#fff'; ctx.fillText(text, fs / 2, c.height - fs * 0.55);
      let q = 0.72, out = c.toDataURL('image/jpeg', q);
      while (out.length > 600000 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  async function uploadPhotos(key, files) {
    const r = rowByKey(key) || {};
    const label = [r.crm || r.code, r.name || r.cust].filter(Boolean).join(' ');
    const refs = [];
    for (const f of Array.from(files || []).slice(0, 6)) {
      const ref = await guard(async () => (await call('POST', 'photo', { date: st.date, key, data: await compress(f, label) })).ref);
      if (ref) refs.push(ref);
    }
    return refs;
  }
  async function pickPhotos(key, files) {
    const p = st.panel;
    if (!p || p.key !== key || !files || !files.length) return;
    p.uploading = true; redraw();
    const refs = await uploadPhotos(key, files);
    p.uploading = false;
    p.photos = p.photos.concat(refs).slice(0, 6);
    if (st.panel === p) redraw();
  }
  async function addPhotos(key, files) {
    const s = (st.data.deliveries || {})[key];
    if (!s || !files || !files.length) return;
    toast('Đang gửi ảnh…');
    const refs = await uploadPhotos(key, files);
    if (!refs.length) return;
    if (await submit(key, { status: s.status, note: s.note, photos: (s.photos || []).concat(refs).slice(0, 6), gps: s.gps })) { toast('Đã thêm ảnh'); keepDraw(); }
  }
  function nowStr() { const d = new Date(); return `${isoDate(d)} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }

  /* ---------------------------------------------------------- khởi động */
  // root: phần tử chứa web giao hàng; onExit: (bản online) quay về web kho
  async function start(root, opts = {}) {
    st.root = root; st.onExit = opts.onExit || null;
    st.gpsBlocked = !!store('gpsBlocked');
    st.exitLabel = opts.exitLabel || '← Về web kho'; st.exitInHeader = opts.exitInHeader !== false;
    document.body.classList.add('gh-mode');
    document.title = 'Giao hàng An Tâm';
    st.token = store('token') || ''; st.driver = store('driver') || null;
    st.date = isoDate();
    if (st.token) await showMain(); else drawLogin();
  }
  function onRemoteChange() { if (st.token && $('#gh-main') && !st.busy && !st.panel) loadDay(true); }
  return { start, onRemoteChange, stop: () => { stopTimer(); trkStop(); } };
})();

'use strict';

// Đọc Sheet GPS An Tâm (chỉ khi Sheet đổi) rồi gộp vào hành trình. ask: người dùng bấm nút → được hỏi quyền Google Drive
async function gpsPull(ask) {
  if (!GPS_HERE || gpsPull.busy) return null;
  gpsPull.busy = true;
  try {
    const mcp = await claude.use('mcp');
    if (!mcp) return (gpsPull.last = { err: 'Trang này chưa dùng được Google Drive.' });
    if (!ask) {
      const perm = await claude.use('permissions');
      const stt = perm ? await perm.state('mcp:' + GPS_DRIVE).catch(() => 'unavailable') : 'unavailable';
      if (stt !== 'granted') return (gpsPull.last = { err: stt === 'denied' ? GPS_ERR.not_in_manifest : 'Bấm Đọc GPS ngay (lần đầu claude.ai hỏi cho phép dùng Google Drive).', wait: true });
    }
    const meta = (await mcp.callTool(GPS_DRIVE, 'get_file_metadata', { fileId: GPS_SHEET, excludeContentSnippets: true }, { cache: false })).payload || {};
    if (!ask && meta.modifiedTime && meta.modifiedTime === gpsPull.mod) return (gpsPull.last = Object.assign({}, gpsPull.last, { err: '', at: Date.now() }));
    const dl = (await mcp.callTool(GPS_DRIVE, 'download_file_content', { fileId: GPS_SHEET, exportMimeType: 'text/csv' }, { cache: false })).payload || {};
    const csv = new TextDecoder().decode(Uint8Array.from(atob(String(dl.content || '')), c => c.charCodeAt(0)));
    const [head, ...rows] = tableFromText(csv.replace(/^\ufeff/, ''));
    const col = k => (head || []).indexOf(k);
    const out = rows.filter(r => r[col('ma')]).map(r => ({ tok: r[col('ma')], upd: r[col('cap_nhat')], on: r[col('bat')], diem: r[col('diem')] }));
    const res = await api('POST', '/gps/sync', { mod: meta.modifiedTime || '', rows: out });
    gpsPull.mod = meta.modifiedTime;
    return (gpsPull.last = { err: '', at: Date.now(), added: res.added, total: (gpsPull.last && gpsPull.last.total || 0) + res.added });
  } catch (e) {
    return (gpsPull.last = { err: GPS_ERR[e && e.code] || ('Chưa đọc được GPS: ' + ((e && (e.code || e.message)) || e) + ' – thử lại sau.') });
  } finally { gpsPull.busy = false; }
}

function noAccent(s) {

function fmt(n, dec = 3) {

}

function parseNum(v) {
  if (v === null || v === undefined) return null;
  let s = String(v).trim().replace(/\s/g, '');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}
function isoDate(d = new Date()) {

}

async function api(method, path, body) {
  if (ONLINE) {
    Backend.who = S.user || '';
    try { return await Backend.handle(method, path, body, { token: S.staffToken }); } catch (e) { throw new Error(e.message || String(e)); }
  }
  const opt = { method, headers: { 'X-User': encodeURIComponent(S.user || ''), 'X-Wh': S.wh, 'X-Staff-Token': S.staffToken || '' } };
  if (body !== undefined) {
    if (body instanceof ArrayBuffer) { opt.body = body; opt.headers['Content-Type'] = 'application/octet-stream'; }
    else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  }
  const res = await fetch('/api' + path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) { /* trống */ }
  if (res.status === 401 && S.account && !path.startsWith('/staff')) { showStaffLogin('Phiên đăng nhập đã hết hạn – hãy đăng nhập lại.'); }
  if (!res.ok) throw new Error((data && data.error) || ('Lỗi ' + res.status));
  return data;
}

/* Đọc số tiền bằng chữ */
const CS = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
function read3(n, full) {
  const tr = Math.floor(n / 100), ch = Math.floor((n % 100) / 10), dv = n % 10, s = [];
  if (full || tr > 0) s.push(CS[tr] + ' trăm');
  if (ch > 1) {
    s.push(CS[ch] + ' mươi');
    if (dv === 1) s.push('mốt'); else if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(CS[dv]);
  } else if (ch === 1) {
    s.push('mười');
    if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(CS[dv]);
  } else if (dv > 0) {
    if (full || tr > 0) s.push('lẻ');
    s.push(CS[dv]);
  }
  return s.join(' ');
}
function docSo(num) {
  let n = Math.round(Math.abs(Number(num) || 0));
  if (n === 0) return 'Không đồng';
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const groups = [];
  while (n > 0) { groups.push(n % 1000); n = Math.floor(n / 1000); }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    parts.push(read3(groups[i], i < groups.length - 1) + units[i]);
  }
  const s = parts.join(' ') + ' đồng';
  return (num < 0 ? 'Âm ' : '') + s.charAt(0).toUpperCase() + s.slice(1);
}

function openModal({ title, body, saveText = 'Lưu', onSave, wide, onClose }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" ${wide ? 'style="width:min(960px,100%)"' : ''}><h3>${esc(title)}</h3><div class="m-body">${body}</div>
    <div class="actions"><button class="btn" data-x>Đóng</button>${onSave ? `<button class="btn primary" data-save>${esc(saveText)}</button>` : ''}</div></div>`;
  document.body.appendChild(back);
  const close = () => { back.remove(); if (onClose) onClose(); };
  back.addEventListener('click', e => { if (e.target === back) close(); });
  $('[data-x]', back).onclick = close;
  if (onSave) $('[data-save]', back).onclick = async () => { if (await guard(() => onSave(back))) close(); };
  const first = $('input, select, textarea', back);
  if (first) first.focus();
  return { root: back, close };
}

// Hộp xác nhận ngay trong trang (trang online không cho dùng confirm() của trình duyệt)
function ask(message, okText = 'Đồng ý') {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" style="width:min(480px,100%)" role="dialog" aria-modal="true"><p style="margin:0 0 4px;font-size:15px">${esc(message)}</p>
      <div class="actions"><button class="btn" data-no>Hủy</button><button class="btn primary" data-yes>${esc(okText)}</button></div></div>`;
    document.body.appendChild(back);
    const done = v => { back.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    $('[data-no]', back).onclick = () => done(false);
    $('[data-yes]', back).onclick = () => done(true);
    back.addEventListener('click', e => { if (e.target === back) done(false); });
    $('[data-yes]', back).focus();
  });
}

function productCombo(code, onPick, { placeholder = 'Gõ mã hoặc tên hàng (không dấu cũng được)…', includeInactive = false } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'combo';
  const input = document.createElement('input');
  input.placeholder = placeholder;
  input.autocomplete = 'off';
  const label = c => { const p = productByCode(c); return p ? `${p.code} | ${p.name}` : (c || ''); };
  input.value = label(code);
  wrap.appendChild(input);
  let list = null, items = [], idx = 0, current = code || '';
  const pool = () => (includeInactive ? S.meta.products : activeProducts());
  function close() { if (list) { list.remove(); list = null; } }
  function open() {
    const q = input.value.includes(' | ') && input.value === label(current) ? '' : input.value;
    items = pool().filter(p => !q || matches(q, p.code + ' ' + p.name)).slice(0, 60);
    idx = 0;
    if (!list) { list = document.createElement('div'); list.className = 'combo-list'; wrap.appendChild(list); }
    list.innerHTML = items.length
      ? items.map((p, i) => `<div class="combo-item${i === idx ? ' on' : ''}" data-i="${i}"><span class="c-code">${esc(p.code)}</span><span>${esc(p.name)}</span><span class="c-unit">${esc(p.unit)}</span></div>`).join('')
      : '<div class="combo-empty">Không tìm thấy – thêm mã mới ở Danh mục › Mặt hàng</div>';
    $$('.combo-item', list).forEach(el => el.addEventListener('mousedown', e => { e.preventDefault(); pick(items[+el.dataset.i]); }));
  }
  function highlight() {
    if (!list) return;
    $$('.combo-item', list).forEach((el, i) => el.classList.toggle('on', i === idx));
    const on = $('.combo-item.on', list); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  function pick(p) {
    close();
    current = p ? p.code : '';
    input.value = label(current);
    onPick(p || null);
  }
  input.addEventListener('focus', () => { input.select(); open(); });
  input.addEventListener('input', open);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!list) open(); idx = Math.min(idx + 1, items.length - 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); highlight(); }
    else if (e.key === 'Enter') { if (list && items[idx]) { e.preventDefault(); pick(items[idx]); } }
    else if (e.key === 'Escape') { close(); input.value = label(current); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      if (!list) return;
      const exact = pool().find(p => p.code.toLowerCase() === input.value.trim().toLowerCase());
      if (exact) pick(exact); else { close(); input.value = label(current); }
    }, 120);
  });
  wrap.focusInput = () => input.focus();
  return wrap;
}

function setPrintContent(html, orientation) {
  $('#page-style').textContent = html ? pageCss(orientation) : '';
  $('#print-root').innerHTML = html || '';
  document.body.classList.toggle('has-print', !!html);
}
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function printHtml(html, orientation = 'portrait', filename = 'ban-in-kho') {
  if (!ONLINE) {
    setPrintContent(html, orientation);
    setTimeout(() => window.print(), 60);
    return;
  }
  // Trang trên claude.ai không được tự mở hộp thoại In: chuẩn bị sẵn bản in, người dùng bấm Ctrl+P / ⌘+P
  setPrintContent(html, orientation);
  const safe = String(filename).replace(/[^\w.\- ]+/g, '-').replace(/-+/g, '-') || 'ban-in-kho';
  const m = openModal({
    title: 'Xem trước bản in', wide: true, saveText: '⬇ Tải file để in',
    onClose: () => setPrintContent(''),
    body: `<div class="callout" style="margin:0 0 12px">Để in ngay: bấm <kbd>${IS_MAC ? '⌘' : 'Ctrl'}</kbd> + <kbd>P</kbd> trên bàn phím
      (điện thoại: menu trình duyệt → In / Chia sẻ → In). Hộp thoại In chỉ in phiếu bên dưới.
      <span class="small muted">Nếu máy không in được theo cách này, bấm <b>Tải file để in</b>.</span></div>
      <div class="print-preview ${orientation}">${html}</div>`,
    onSave: async () => {
      const dl = await claude.use('downloads');
      if (!dl) throw new Error('Trang này chưa được phép tải file xuống. Hãy mở trang trên claude.ai.');
      try { await dl.save({ filename: safe + '.html', data: printableFile(html, orientation, safe) }); }
      catch (e) { if (e && e.code === 'declined') return false; throw new Error('Không tải được file: ' + (e && e.message ? e.message : e)); }
      toast('Đã tải file ' + safe + '.html – mở file để in');
      return true;
    },
  });
  return m;
}
async function saveTextFile(filename, data) {
  if (!ONLINE) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return;
  }
  const dl = ONLINE ? await claude.use('downloads') : null;
  if (!dl) throw new Error('Không tải file được trong trang này.');
  try { await dl.save({ filename, data }); toast('Đã tải ' + filename); }
  catch (e) { if (!(e && e.code === 'declined')) throw new Error('Không tải được file: ' + (e && e.message ? e.message : e)); }
}

// Điều hướng: bản chạy máy chủ dùng #/đường-dẫn trên thanh địa chỉ; bản online giữ đường dẫn trong trang.
let currentHash = ONLINE ? '#/' : location.hash;
const getHash = () => (ONLINE ? currentHash : location.hash);
function setHashSilently(h) {
  if (ONLINE) currentHash = h;
  else { history.replaceState(null, '', h); currentHash = location.hash; }
}
function parseHash() {
  const h = getHash().replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  return { path: path.replace(/\/$/, ''), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
async function render() {
  const { path, q } = parseHash();
  document.body.classList.remove('nav-open');
  applyPerms();
  if (S.account && !can('kho' + S.wh)) { const other = S.wh === 'TP' ? 'NVL' : 'TP'; if (can('kho' + other)) return switchWh(other); }
  $$('#nav a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active', r === '' ? path === '' : (path === r || (path.startsWith(r + '/') && r !== 'phieu') || (r === 'phieu' && /^phieu\/(?!moi$)[\w-]+$/.test(path))));
  });
  const main = $('#main');
  if (!routeOk(path)) { main.innerHTML = '<div class="callout warn">Tài khoản của bạn chưa được cấp quyền vào mục này – nhờ Quản lý phân quyền ở mục <b>Tài khoản nhân viên</b>.</div>'; return; }
  main.innerHTML = '<p class="muted">Đang tải…</p>';
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) {
      try { await fn(main, m, q); } catch (e) { main.innerHTML = `<div class="callout warn">${esc(e.message)}</div>`; }
      return;
    }
  }
  main.innerHTML = '<p>Không có trang này.</p>';
}
if (ONLINE) {
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.defaultPrevented || e.button !== 0) return;
    e.preventDefault();
    go(a.getAttribute('href'));
  });
} else {
  window.addEventListener('hashchange', async () => {
    if (S.skipDirty) { S.skipDirty = false; return; }
    if (S.dirty) {
      const target = location.hash;
      S.skipDirty = true; location.hash = currentHash;
      if (!(await ask('Có thay đổi chưa lưu. Vẫn rời trang này?'))) return;
      S.dirty = false; location.hash = target; return;
    }
    currentHash = location.hash; render();
  });
  window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
}
async function go(hash, opts = {}) {
  if (!ONLINE) { if (opts.force) S.dirty = false; if (location.hash === hash) render(); else location.hash = hash; return; }
  if (S.dirty && !opts.force && !(await ask('Có thay đổi chưa lưu. Vẫn rời trang này?'))) return;
  S.dirty = false; currentHash = hash;
  window.scrollTo(0, 0);
  render();
}

// Gói tồn kho cho Kho vận An Tâm: cập nhật sau mỗi lần tải lại số liệu (gộp nhiều lần lưu liên tiếp thành 1 lần ghi)
// (gửi cả kho TP lẫn kho NVL; trang đang mở thì gửi lại mỗi 10 phút để số tồn theo kịp phiếu người khác lập)
function khovanSoon() {
  clearTimeout(khovanSoon.t);
  khovanSoon.t = setTimeout(() => Backend.khovanPush().catch(e => console.warn('khovan', e)), 15000);
  if (!khovanSoon.iv) khovanSoon.iv = setInterval(() => { if (!document.hidden) khovanSoon(); }, 600000);
}
async function switchWh(wh, keepPage) {
  if (wh === S.wh) return;
  if (S.dirty && !(await ask('Có thay đổi chưa lưu. Vẫn chuyển kho?'))) return;
  S.dirty = false;
  S.wh = wh; store('wh', wh);
  if (ONLINE) { $('#main').innerHTML = '<p class="muted">Đang tải dữ liệu kho…</p>'; await Backend.setWh(wh); }
  await loadMeta();
  toast('Đang làm việc: ' + S.meta.warehouse.name);
  if (keepPage) return;
  const { path } = parseHash();
  const only = { 'tuyen': 'TP', 'phan-tuyen': 'TP', 'giao-hang-tk': 'TP', 'kh-ngay': 'NVL', 'kh-tuan': 'NVL', 'kh-thang': 'NVL', 'lsx': 'NVL', 'dinh-muc': 'NVL' }[path.split('/')[0]];
  if (/\/(?!moi$)[\w-]+$/.test(path) || (only && only !== wh)) go('#/', { force: true }); else render();
}
