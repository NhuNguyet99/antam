<style id="app-css">
/* Bố cục: thanh trên (tên + các mục) cố định, nội dung từng mục bên dưới; bảng rộng cuộn ngang trong khung riêng. */
:root {
  --bg: #f4f6f3; --panel: #ffffff; --ink: #1d2a24; --ink-2: #4c5c54; --muted: #7b8a82; --line: #dfe5e0; --line-2: #eef2ef;
  --accent: #0f6e5a; --accent-ink: #ffffff; --accent-soft: #e2f1ec; --crust: #b86a1d; --crust-soft: #f8ecdd;
  --good: #1f7a46; --good-soft: #e1f3e7; --bad: #b4232c; --bad-soft: #fbe5e6; --warn: #8a5a00; --warn-soft: #fbf0d6;
  --input: #ffffff; --hover: #f1f6f3; --shadow: 0 8px 28px rgba(20, 40, 30, .14);
  --hit: #fff6c7; --hit-bar: #e0a400; --mark: #ffd84d;
  /* màu nhóm sản phẩm: đậm (vạch, chữ tiêu đề) / nhạt (nền cột) */
  --g-thuong: #a8650f; --g-thuong-s: #fdf3e2; --g-dacbiet: #4f7a1f; --g-dacbiet-s: #eef6e3; --g-tuoi: #1f6fa8; --g-tuoi-s: #e5f1fa;
  --g-kebab: #b23a2e; --g-kebab-s: #fcebe8; --g-thit: #6c4bb0; --g-thit-s: #f1ecfb; --g-khac: #5c6a64; --g-khac-s: #eef1ef;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --panel: #18211c; --ink: #e5ece8; --ink-2: #b4c2ba; --muted: #869890; --line: #2c3a33; --line-2: #212c26;
    --accent: #3fb594; --accent-ink: #08130f; --accent-soft: #19362d; --crust: #e0a25e; --crust-soft: #3a2b1a;
    --good: #5fcf8e; --good-soft: #17331f; --bad: #ff8a8f; --bad-soft: #3d1c1f; --warn: #f0c062; --warn-soft: #382c12;
    --input: #121a16; --hover: #1f2b25; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --hit: #3a3213; --hit-bar: #f0c040; --mark: #806410;
    --g-thuong: #f0b45e; --g-thuong-s: #2e2414; --g-dacbiet: #9fd067; --g-dacbiet-s: #1e2a14; --g-tuoi: #7cc0f0; --g-tuoi-s: #142634;
    --g-kebab: #f39488; --g-kebab-s: #33191a; --g-thit: #b9a0f2; --g-thit-s: #241d36; --g-khac: #aab8b1; --g-khac-s: #212a26;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --panel: #18211c; --ink: #e5ece8; --ink-2: #b4c2ba; --muted: #869890; --line: #2c3a33; --line-2: #212c26;
  --accent: #3fb594; --accent-ink: #08130f; --accent-soft: #19362d; --crust: #e0a25e; --crust-soft: #3a2b1a;
  --good: #5fcf8e; --good-soft: #17331f; --bad: #ff8a8f; --bad-soft: #3d1c1f; --warn: #f0c062; --warn-soft: #382c12;
  --input: #121a16; --hover: #1f2b25; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --hit: #3a3213; --hit-bar: #f0c040; --mark: #806410;
    --g-thuong: #f0b45e; --g-thuong-s: #2e2414; --g-dacbiet: #9fd067; --g-dacbiet-s: #1e2a14; --g-tuoi: #7cc0f0; --g-tuoi-s: #142634;
    --g-kebab: #f39488; --g-kebab-s: #33191a; --g-thit: #b9a0f2; --g-thit-s: #241d36; --g-khac: #aab8b1; --g-khac-s: #212a26;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 21.5px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 600; }
.num, td.n, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* thanh trên */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--crust); color: #fff; display: grid; place-items: center; font-size: 14.5px; letter-spacing: .02em; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.tabs button { border: 0; background: none; padding: 7px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabs button:hover { background: var(--hover); }
.perm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 16px; margin-top: 4px; }
.perm-grid fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px 8px; margin: 0; display: grid; gap: 4px; }
.perm-grid legend { font-size: 14.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px; }
.gh-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.gh-stats > div { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; background: var(--panel); }
.gh-stats .v { font-family: var(--f-num); font-size: 29px; font-weight: 700; }
.gh-stats .k { font-size: 14.5px; color: var(--ink-2); }
.gh-stats .ok .v { color: var(--good); } .gh-stats .bad .v { color: var(--bad); } .gh-stats .wait .v { color: var(--muted); }
.gh-bar { height: 8px; border-radius: 999px; background: var(--line-2); overflow: hidden; display: flex; }
.gh-bar i { display: block; height: 100%; } .gh-bar .ok { background: var(--good); } .gh-bar .bad { background: var(--bad); }
.gh-grp { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.gh-grp > .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; background: var(--line-2); }
.gh-grp > .hd .gh-bar { flex: 1; min-width: 120px; max-width: 260px; }
.gh-grp table { width: 100%; }
.gh-phs { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; vertical-align: middle; cursor: zoom-in; margin-left: 4px; }
.gh-ph { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--line-2); }
.gh-big { display: grid; gap: 10px; }
.gh-big img { max-width: 100%; max-height: 75vh; display: block; margin: 0 auto; border-radius: 8px; }
.gh-st { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.gh-st.ok { background: var(--good-soft); color: var(--good); } .gh-st.fail { background: var(--bad-soft); color: var(--bad); } .gh-st.wait { background: var(--line-2); color: var(--muted); }
tr[data-cid*="~"] td.cust { box-shadow: inset 3px 0 0 var(--warn); }
.pill.xord { font-size: 13px; }
.tnlab { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 14.5px; white-space: nowrap; color: var(--muted); }
.tnlab input { margin: 0; }
.tnlab.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.rtchip.tnchip { border-color: var(--warn); color: var(--warn); }
.rtchip.tnchip.on { background: var(--warn); color: var(--panel); }
.ro-note { margin: 0; padding: 6px 10px; border-radius: var(--r); background: var(--line-2); color: var(--ink-2); font-size: 15.5px; }
.orders input.q:disabled, .orders select:disabled { opacity: .75; cursor: default; }
.perm-list { font-size: 14.5px; color: var(--ink-2); max-width: 420px; }
body.locked #tabs, body.locked #me-btn, body.locked #sync { visibility: hidden; }
.login { max-width: 380px; margin: 8vh auto; display: grid; gap: 12px; }
.login h2 { margin: 0; }
.login .err { color: var(--bad); min-height: 1.2em; margin: 0; font-size: 16px; }
.pill.ql { background: var(--accent-soft); color: var(--accent); }
.pill.nhap { background: var(--line-2); color: var(--ink-2); }
.pill.dp { background: var(--warn-soft); color: var(--warn); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.me-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.sync { font-size: 14.5px; color: var(--muted); white-space: nowrap; }
.sync.busy { color: var(--warn); }
.sync.err { color: var(--bad); }

main { padding-block: 18px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.grow { flex: 1; }
.field { display: grid; gap: 4px; font-size: 14.5px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea, input.in, select.in {
  border: 1px solid var(--line); background: var(--input); border-radius: 6px; padding: 7px 9px; font-size: 17px; color: var(--ink); min-width: 0;
}
.field textarea { resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { padding: 4px 9px; font-size: 15.5px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hint { color: var(--muted); font-size: 15px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.off { background: var(--line-2); color: var(--muted); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.box { background: var(--crust-soft); color: var(--crust); }

/* ngày */
.daybar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.daybar .date-big { font-size: 24px; font-weight: 700; }
.daybar .dow { color: var(--muted); }
.need { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.need > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); }
.need .k { font-size: 14.5px; color: var(--muted); }
.need .v { font-family: var(--f-num); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.need > .box .v { color: var(--crust); }

/* bảng */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
th { font-size: 14.5px; color: var(--ink-2); font-weight: 600; background: var(--panel); position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
tr.grp td { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }
tbody tr:hover td { background: var(--hover); }
tbody tr.grp:hover td { background: var(--accent-soft); }
/* bảng nhập đơn cuộn trong khung riêng để dòng tiêu đề nhóm / sản phẩm luôn hiện */
.tw.otw { max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); overflow: auto; }
/* dòng tóm tắt + chế độ mở to bảng */
.t1sum td, .t1sum th { white-space: nowrap; }
.t1sum tr.tot td { border-top: 2px solid var(--line); background: var(--warn-soft); }
.t1sum th.p, .t1sum th.gh { position: static; }
.t1sum td.pc { font-family: var(--f-num); font-weight: 600; color: var(--gc); }
.t1t .cust .sub.mono { font-family: var(--f-num); }
.t1t td.pc[data-out], .t1t tr.t1tot td.pc { font-family: var(--f-num); font-weight: 600; color: var(--gc); }
.t1t td.pc[data-out=le] { font-family: var(--f-body); font-weight: 500; font-size: 15px; }
.t1t thead th[rowspan], .t1sum thead th[rowspan] { vertical-align: bottom; }
.t1t tr.t1tot td { background: var(--warn-soft); font-family: var(--f-num); font-weight: 700; color: var(--bad); }
.t1t tr.t1tot td.cust { font-family: var(--f-body); color: var(--ink); }
.t1t tr.t1tot td.cust .sub { color: var(--ink-2); font-weight: 500; }
.t1t tr.t1sub td { background: var(--line-2); font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.t1t input.t1gc { width: 150px; font-size: 15px; padding: 4px 6px; }
.t1t .t1note { min-width: 170px; max-width: 280px; }
.t1t .t1note .sub { font-size: 14.5px; color: var(--crust); margin-bottom: 3px; }
.t1t td[data-out=le], .t1t .t1tot td.small { white-space: nowrap; }
.t1t .t1ht { white-space: nowrap; }
.t1flt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border-radius: 6px; background: var(--hit); font-size: 15.5px; }
.kho-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; }
.kho-st { color: var(--muted); }
.kho-st.ok { color: var(--good); font-weight: 600; }
.kho-st.wait { color: var(--warn); }
.rtchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rtchip { border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--f-body); }
.rtchip b { font-family: var(--f-num); color: var(--accent); margin-left: 2px; }
.rtchip:hover { background: var(--hover); }
.rtchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rtchip.on b { color: inherit; }
.rtchip.none { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.rtchip.none b { color: var(--bad); }
.rtchip.none.on { background: var(--bad); color: #fff; } .rtchip.none.on b { color: #fff; }
.orders select.rt-sel { width: 92px; }
.orders select.rt-none { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.orders tr.grp.rt-none td { background: var(--bad-soft); color: var(--bad); }
.colpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.colpick fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 8px; margin: 0; display: grid; gap: 4px; }
.colpick legend { font-size: 14.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px; }
.colpick label { display: flex; gap: 6px; align-items: center; font-size: 15.5px; cursor: pointer; }
.prs { display: grid; gap: 10px; }
.prs2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.prs2 fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; margin: 0; display: grid; gap: 6px; }
.prs2 legend { font-size: 14.5px; font-weight: 700; color: var(--ink-2); padding: 0 4px; text-transform: uppercase; letter-spacing: .03em; }
.prs2 .pr-foot { grid-column: 1 / -1; align-items: center; }

  const list = dayOrders(dayR).concat(t1), tui = {}, cai = {}, t1q = new Set();

  for (const { o, c, t1: is1 } of list) {
    if (is1) Object.keys(o.q).forEach(pid => t1q.add(pid)); else { const pk = payKey(o.tt); pay[pk || 'none']++; }
    for (const [pid, n] of Object.entries(o.q || {})) if (num(n) > 0) tui[pid] = (tui[pid] || 0) + num(n);
    bill += o.bill != null && o.bill !== '' ? num(o.bill) : (c.bill == null ? 1 : num(c.bill));
  }
  let tacos = 0, kebab = 0;
  for (const p of S.cfg.products) {
    const n = ((tui[p.id] || 0) + num((tuyen || {})[p.id])) * perOf(p);
    cai[p.id] = n;
    const g = groupOf(p);
    if (['thuong', 'dacbiet', 'tuoi'].includes(g)) tacos += n; else if (g === 'kebab') kebab += n;

  const tuyenTxt = S.cfg.products.filter(p => num((tuyen || {})[p.id]) > 0)

function dayTotals(dayR, t1 = []) {
  const need = { tui: 0, tuiK: 0, giay: 0, nho: 0, chung: 0, dai: 0, cay: 0 }, prod = {}, size = { 22: 0, 25: 0, 28: 0, 31: 0, K: 0 };
  const list = dayOrders(dayR).concat(t1);
  for (const { o, c } of list) {
    const p = packing(o.q, packOf(o, c));
    for (const k in need) need[k] += p[k];
    for (const [pid, n] of Object.entries(o.q || {})) if (num(n) > 0) prod[pid] = (prod[pid] || 0) + num(n);

/* ================================================================ TÀI KHOẢN NHÂN VIÊN

// danh sách quyền (tích chọn riêng cho từng tài khoản); mục = tab có cùng mã

  ['Điều phối', [['tuyen', 'Đổi tuyến của đơn / khách'], ['quytac', 'Sửa quy tắc chia tuyến'], ['nguoigiao', 'Chọn người giao từng tuyến'], ['gui', 'Gửi ngay sang Giao hàng & Kho']]],

    ['cd', 'Định mức & cài đặt'], ['acc', 'Quản lý tài khoản & phân quyền']]],
];
const PERM_KEYS = PERMS.flatMap(([, l]) => l.map(x => x[0]));

const VIEWS = ['don', 't123', 'in', 'khach', 'gh', 'tk', 'cd', 'nhap', 'acc'];

const PRESET = { nhap: ['don', 'donNhap', 't123', 't123Nhap', 'in', 'khach', 'gh', 'tk', 'cd'], dp: ['don', 't123', 'in', 'khach', 'gh', 'tk', 'tuyen', 'quytac', 'nguoigiao', 'gui'], ql: PERM_KEYS };
const PERM_V = 4; // bản 1: 'don' / 't123' gồm cả nhập đơn; bản 2: chưa có 'gh' (theo dõi giao hàng – cấp cho mọi người); bản 3: Nhập liệu chưa có 'cd'
document.head.insertAdjacentHTML('beforeend', `<style>${PERM_KEYS.map(k => `body.no-p-${k} .p-${k}`).join(',')} { display: none !important; }</style>`);
const SESSION_DAYS = 30;
const newSess = (id, pw) => ({ id, sig: pw.slice(0, 24), iat: Date.now(), exp: Date.now() + SESSION_DAYS * 864e5 });
const hasAcc = () => Object.values(S.tk).some(a => a && a.active !== false);
const authReady = () => S.tkLoaded;
const needLogin = () => hasAcc() && !S.acc;
const ROLES = [['nhap', 'Nhập liệu'], ['dp', 'Điều phối'], ['ql', 'Quản lý']];
const roleOf = a => (ROLES.some(r => r[0] === (a && a.role)) ? a.role : 'nhap');
const roleName = a => ROLES.find(r => r[0] === roleOf(a))[1];
const rolePill = a => `<span class="pill ${roleOf(a)}">${roleName(a)}${custom(a) ? ' · tùy chỉnh' : ''}</span>`;
// quyền của 1 tài khoản: danh sách tích riêng (perm), chưa có thì theo mẫu của vai trò
function permsOf(a) {
  if (!Array.isArray(a && a.perm)) return new Set(PRESET[roleOf(a)]);
  const p = new Set(a.perm.filter(k => PERM_KEYS.includes(k)));
  if ((a.pv || 1) < 2) { if (p.has('don')) p.add('donNhap'); if (p.has('t123')) p.add('t123Nhap'); }
  if ((a.pv || 1) < 3) p.add('gh');
  if ((a.pv || 1) < 4 && roleOf(a) === 'nhap') p.add('cd'); // Nhập liệu được sửa Định mức & cài đặt
  return p;
}
const custom = a => { const p = permsOf(a), d = new Set(PRESET[roleOf(a)]); return p.size !== d.size || [...p].some(k => !d.has(k)); };
function can(k) { if (!hasAcc()) return true; return !!S.acc && permsOf(S.acc).has(k); }
function need(k, what) { if (can(k)) return true; toast(`Tài khoản của bạn chưa được cấp quyền ${what || PERM_LAB[k]} – nhờ quản lý phân quyền.`, true); return false; }
const isQL = () => can('acc');

async function pwHash(salt, pw) {

/* ---------------- sửa thông tin khách ngay trên bảng: bấm vào tên / CRM / SĐT → ô sửa nhỏ cạnh dòng, Enter hoặc bấm ra ngoài là lưu */
const CPOP_F = { crm: 'Mã CRM', name: 'Khách hàng – địa chỉ', phone: 'SĐT', note: 'Ghi chú / chành xe', q: 'Khu vực / quận' };
let cpopOpen = null;
// anchor: ô bảng; c: khách hiện tại; fields: các trường; focus: trường đặt con trỏ; save(vals đã đổi) ; more(): mở form đầy đủ
function custPop({ anchor, c, fields, focus, save, more, title }) {
  if (!need('khach', 'sửa thông tin khách')) return;
  if (S.readOnly) { toast('Bạn đang chỉ có quyền xem – không sửa được khách.', true); return; }
  if (cpopOpen) cpopOpen.close(true);
  const el = document.createElement('div'); el.className = 'cpop'; el.setAttribute('role', 'dialog');
  const inp = k => k === 'name' ? `<textarea data-f="name" rows="2">${esc(c.name || '')}</textarea>`
    : `<input data-f="${k}" value="${esc(c[k] || '')}" ${k === 'q' ? 'list="dl-cpop-area"' : ''} ${k === 'phone' ? 'inputmode="tel"' : ''} autocomplete="off">`;
  const f = k => `<label class="field">${CPOP_F[k]}${inp(k)}</label>`;
  const short = fields.filter(k => ['crm', 'phone', 'q'].includes(k));
  el.innerHTML = `<div class="ttl">✎ ${esc(title || 'Sửa thông tin khách')}</div>
    ${fields.includes('name') ? f('name') : ''}
    <div class="two">${short.map(f).join('')}</div>
    ${fields.includes('note') ? f('note') : ''}
    <datalist id="dl-cpop-area">${fields.includes('q') ? areas().map(a => `<option value="${esc(a)}">`).join('') : ''}</datalist>
    <div class="acts"><button class="btn sm pri" data-save>Lưu</button><button class="btn sm" data-cancel>Hủy</button><span class="sp"></span>
      ${more ? '<button class="btn sm ghost" data-more>Thêm thông tin…</button>' : ''}</div>
    <div class="small muted">Enter để lưu · Esc để hủy · bấm ra ngoài cũng tự lưu</div>`;
  document.body.appendChild(el);
  const place = () => {
    if (!anchor.isConnected) return;
    const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(8, r.left), innerWidth - w - 8), y = r.bottom + 4;
    if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 4);
    el.style.left = x + 'px'; el.style.top = y + 'px';
  };
  place();
  let done = false;
  const vals = () => Object.fromEntries($$('[data-f]', el).map(i => [i.dataset.f, i.value.replace(/\s+/g, ' ').trim()]));
  async function close(doSave) {
    if (done) return; done = true;
    document.removeEventListener('mousedown', outside, true); removeEventListener('scroll', place, true); removeEventListener('resize', place);
    el.remove(); if (cpopOpen === api) cpopOpen = null;
    if (!doSave) return;
    const v = vals(), ch = Object.fromEntries(Object.entries(v).filter(([k, x]) => x !== String(c[k] || '').trim()));
    if (!Object.keys(ch).length) return;
    if ('name' in ch && !ch.name) { toast('Tên khách không được để trống – chưa lưu', true); return; }
    await guard(async () => { await save(ch); toast('Đã lưu khách ' + (ch.name || c.name)); });
  }
  const api = { close };
  cpopOpen = api;
  const outside = e => { if (!el.contains(e.target)) close(true); };
  setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  addEventListener('scroll', place, true); addEventListener('resize', place);
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(false); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); close(true); }
  });
  $('[data-save]', el).onclick = () => close(true);
  $('[data-cancel]', el).onclick = () => close(false);
  if (more) $('[data-more]', el).onclick = () => { close(true); more(); };
  const t = $(`[data-f="${focus || fields[0]}"]`, el) || $('[data-f]', el);
  t.focus(); if (t.setSelectionRange) t.setSelectionRange(t.value.length, t.value.length);
}

/* ---------------- cập nhật thông tin khách theo danh sách khách hàng MISA (khớp theo mã CRM) */
// tiêu đề cột của file MISA (Danh mục › Khách hàng › Xuất khẩu), không dấu, bỏ ký tự (*)
const MH = s => norm(s).replace(/[^a-z0-9 /]/g, ' ').replace(/\s+/g, ' ').trim();
const MISA_COLS = {
  code: h => (/^ma\b/.test(h) && !/thue|so thue|ngan hang|nhom|buu|vung|tinh|quan|huyen|xa|nhan vien/.test(h)) || h.includes('crm'),
  name: h => /^(ten( khach hang| doi tuong| kh| khach)?|khach hang|ho (va )?ten)$/.test(h),
  addr: h => h.startsWith('dia chi') && !/email|thu dien tu|hoa don/.test(h),
  phone: h => /(dien thoai|di dong|^sdt|^so dt|^dt\b)/.test(h) && !/fax|ban|nguoi lien he/.test(h),
  area: h => /^(quan ?\/ ?huyen|quan huyen|quan|khu vuc|vung)$/.test(h),
};
const MISA_LAB = { code: 'Mã CRM', name: 'Tên khách hàng', addr: 'Địa chỉ', phone: 'Điện thoại', area: 'Khu vực / quận' };
// mã CRM của khách trên web: ô CRM, chưa có thì mã đứng đầu tên ("K1972 - Thanh Nhàn - …")
const leadCode = name => { const m = String(name || '').match(/^\s*([A-Za-z]{1,4}\d{2,})\s*(?:[-–:.,]|\s)/); return m ? m[1] : ''; };
function misaParse(table) {
  const hi = table.findIndex((r, i) => i < 30 && r.some(c => MISA_COLS.code(MH(c))) && r.some(c => MISA_COLS.name(MH(c))));
  if (hi < 0) throw new Error('Không thấy dòng tiêu đề – cần có cột mã khách hàng (Mã khách hàng / Mã CRM) và cột Tên khách hàng. Hãy chọn cả bảng: Ctrl+A rồi Ctrl+C.');
  const head = table[hi].map(c => String(c || '').replace(/\s+/g, ' ').trim()), h = head.map(MH);
  const cand = k => h.map((x, i) => (x && MISA_COLS[k](x) ? i : -1)).filter(i => i >= 0);
  const rows = table.slice(hi + 1).filter(r => r.some(c => String(c || '').trim()));
  // cột mã: cột trùng nhiều mã CRM của web nhất (MISA có thể có cả Mã khách hàng lẫn Mã CRM riêng)
  const webCodes = new Set(misaWebList().flatMap(x => x.codes.map(keyOf)));
  const hits = i => rows.reduce((n, r) => n + (webCodes.has(keyOf(r[i])) ? 1 : 0), 0);
  const codes = cand('code').sort((a, b) => hits(b) - hits(a) || a - b);
  const col = { code: codes[0], name: cand('name')[0], addr: cand('addr')[0], area: cand('area')[0] };
  const ph = cand('phone').sort((a, b) => (/di dong/.test(h[b]) ? 1 : 0) - (/di dong/.test(h[a]) ? 1 : 0));
  col.phone = ph[0];
  return { head, rows, col, phones: ph };
}
// tất cả khách trên web có thể khớp: Đơn hàng ngày + Tuyến kebab 123 (mã = ô CRM và mã đứng đầu tên)
function misaWebList() {
  const out = [], add = (kind, id, c) => { const codes = [c.crm, leadCode(c.name)].filter(Boolean); if (codes.length) out.push({ kind, id, c, codes }); };
  for (const c of Object.values(S.cust)) add('d', c.id, c);
  for (const [id, c] of Object.entries(S.t1.cust || {})) if (c) add('t', id, c);
  return out;
}
// tên mới từ MISA, giữ mã đứng đầu tên cũ (VD "KH00152 - ") và ghi chú trong ngoặc của tên cũ (VD "(CN NGHỈ)")
function misaName(old, ten, keep) {
  if (!keep) return ten;
  const lead = leadCode(old), n = norm(ten);
  const notes = (String(old || '').match(/\([^()]{2,}\)/g) || []).filter(x => !n.includes(norm(x)));

}

// so danh sách MISA với khách trên web: [{key, kind, id, code, rec (bản ghi mới), ch: [[trường, cũ, mới]]}]
function misaDiff(p, o) {
  const g = (r, i) => (i == null || r[i] == null ? '' : String(r[i]).replace(/\s+/g, ' ').trim());
  const by = {}; let dup = 0;
  for (const r of p.rows) {
    const k = keyOf(g(r, p.col.code));
    if (!k) continue;
    if (by[k]) { dup++; continue; }
    const ten = g(r, p.col.name), dc = g(r, p.col.addr);
    const phone = g(r, p.col.phone) || p.phones.map(i => g(r, i)).find(Boolean) || '';
    by[k] = { code: g(r, p.col.code), ten, dc, phone, area: g(r, p.col.area).toUpperCase() };
  }
  const web = misaWebList().filter(x => o[x.kind]);
  const seen = new Set(), list = [];
  let same = 0, noMisa = 0;
  for (const x of web) {
    const hit = x.codes.find(k => by[keyOf(k)]), mr = hit && by[keyOf(hit)];
    if (!mr) { noMisa++; continue; }
    seen.add(keyOf(hit));
    const c = x.c, rec = {}, ch = [];
    const put = (f, lab, v, same) => { const a = String(c[f] || '').replace(/\s+/g, ' ').trim(); if (v && a !== v && !(same && same(a, v))) { rec[f] = v; ch.push([lab, c[f] || '', v]); } };
    if (!c.crm) put('crm', 'Mã CRM', mr.code);
    const ten = o.nameMode === 'ten-dc' && mr.dc && !norm(mr.ten).includes(norm(mr.dc)) ? `${mr.ten} - ${mr.dc}` : mr.ten;
    if (o.name && mr.ten) put('name', x.kind === 'd' ? 'Khách hàng – địa chỉ' : 'Tên khách hàng', misaName(c.name, ten, o.keep));
    if (o.phone) put('phone', 'SĐT', mr.phone, (a, b) => a.replace(/\D/g, '') === b.replace(/\D/g, '')); // chỉ khác dấu cách / chấm
    if (o.area && x.kind === 'd') put('q', 'Khu vực', mr.area);
    if (ch.length) list.push({ key: x.kind + ':' + x.id, kind: x.kind, id: x.id, code: mr.code, rec, ch }); else same++;
  }
  list.sort((a, b) => a.code.localeCompare(b.code, 'vi', { numeric: true }));
  return { list, same, noMisa, dup, misa: Object.keys(by).length, match: list.length + same, miss: Object.values(by).filter(v => !seen.has(keyOf(v.code))).map(v => v.code) };
}
async function misaApply(st) {
  const sel = (st.list || []).filter(x => !st.off.has(x.key));
  if (!sel.length) throw new Error('Chưa chọn khách nào để cập nhật');
  const shards = {}, t1 = {};
  for (const x of sel) {
    if (x.kind === 'd') {
      const c = Object.assign({}, S.cust[x.id], x.rec); S.cust[x.id] = c;
      const { id, ...rest } = c; (shards[shardOf(x.id)] = shards[shardOf(x.id)] || {})[x.id] = rest;
    } else {
      const c = Object.assign({}, S.t1.cust[x.id], x.rec); S.t1.cust[x.id] = c; t1[x.id] = c;
    }
  }
  await Promise.all(Object.entries(shards).map(([k, c]) => mergeInto('khach/' + k, { c }, { c: {} }))
    .concat(Object.keys(t1).length ? [mergeInto('tuyen123/khach', { c: t1 }, { c: {} })] : []));
  toast(`Đã cập nhật ${sel.length} khách theo MISA`);
  render();
  return true;
}

function statsOf(days) {

      const p = packing(o.q, packOf(o, c));

      st.orders++; pd.orders++; st.banh += banh; pd.banh += banh; st.kebab += sz.K; pd.kebab += sz.K;
      for (const [pid, n] of Object.entries(o.q || {})) {
        if (!(num(n) > 0)) continue;
        st.prod[pid] = (st.prod[pid] || 0) + num(n); pd.prod[pid] = (pd.prod[pid] || 0) + num(n);
        st.prodOrders[pid] = (st.prodOrders[pid] || 0) + 1;
        (st.prodCust[pid] = st.prodCust[pid] || new Set()).add(cid); (st.prodDays[pid] = st.prodDays[pid] || new Set()).add(d);
      }
      const add = (m, k, b) => { k = k || '(trống)'; const x = m[k] = m[k] || { orders: 0, banh: 0, kebab: 0 }; x.orders++; x.banh += b; x.kebab += sz.K; };
      add(st.area, c.q, banh); add(st.tao, o.tao, banh); add(st.tx, o.tx, banh); add(st.pay, o.tt, banh);
      const cu = st.cust[cid] = st.cust[cid] || { c, orders: 0, banh: 0, kebab: 0, last: '' };
      cu.orders++; cu.banh += banh; cu.kebab += sz.K; if (d > cu.last) cu.last = d;

  return st;
}

    if (i % every === 0) s += `<text class="ax" x="${x0 + w / 2}" y="${H - 8}" text-anchor="middle">${vnShort(x.d)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const tip = $('.tip', el), svg = $('svg', el);
  const show = i => {
    const x = data[i]; $$('.bar', el).forEach(b => b.classList.toggle('dim', b.dataset.i !== String(i)));
    tip.hidden = false; tip.innerHTML = `${dow(x.d)} ${vn(x.d)}<br><b>${fmt(x.v)}</b> ${esc(unit)}`;
    const box = svg.getBoundingClientRect(), sc = box.width / W;

    tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.width - tip.offsetWidth) + 'px';

function tableFromHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tb = doc.querySelector('table'); if (!tb) return null;
  const out = [], carry = [];
  $$('tr', tb).forEach((tr, ri) => {
    const row = []; let ci = 0;
    const fill = () => { while (carry[ci] && carry[ci].left > 0) { row[ci] = carry[ci].v; carry[ci].left--; ci++; } };
    fill();
    $$('td,th', tr).forEach(td => {
      fill();
      const v = (td.innerText != null ? td.innerText : td.textContent).replace(/ /g, ' ').trim();
      const cs = +td.getAttribute('colspan') || 1, rs = +td.getAttribute('rowspan') || 1;
      for (let k = 0; k < cs; k++) { row[ci] = v; if (rs > 1) carry[ci] = { v, left: rs - 1 }; ci++; }
      fill();
    });
    out.push(row.map(x => (x == null ? '' : x)));
  });
  return out;
}
function tableFromText(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') { q = true; continue; }
    if (ch === '\t') { row.push(cell); cell = ''; continue; }
    if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

  const snap = await S.db.collection('t123').where('date', '<', d).orderBy('date', 'desc').limit(1).get().catch(e => { throw dbErr(e); });
  if (!snap.docs.length) throw new Error('Chưa có ngày nào trước ' + vn(d) + ' để chép.');
  const prev = snap.docs[0].data(), has = live(S.t1.day && S.t1.day.r).some(([, o]) => t1Qty(o) > 0);
  if (has && !(await confirmBox(`Ngày ${vn(d)} đã có số lượng. Chép số của ngày ${vn(prev.date)} vào các khách CHƯA có số?`, 'Chép'))) return;
  const patch = {};
  for (const [cid, o] of live(prev.r)) {
    if (!S.t1.cust[cid] || t1Qty(t1Order(cid)) > 0 || !(t1Qty(o) > 0)) continue;
    patch[cid] = { q: Object.fromEntries(T123_P.map(([k]) => [k, t1V(o, k)]).filter(([, v]) => v)), at: nowStr(), by: S.me || '' };
  }
  if (!Object.keys(patch).length) return toast('Không có gì để chép');
  await mergeInto('t123/' + d, { r: patch }, { date: d }); khoOutLater('t123', d);
  toast(`Đã chép ${Object.keys(patch).length} khách từ ngày ${vn(prev.date)}`);
}

function t1Rows() {
  const out = [['', 'HỖ TRỢ', 'CRM', 'TÊN KHÁCH HÀNG', 'SDT', 'Tình trạng hoạt động'].concat(T123_P.map(([, l]) => l)).concat(['Số Túi 50', 'Túi lẻ', 'GHI CHÚ', 'GHI CHÚ NGÀY'])];
  const list = t1List();
  for (const [g, name] of T123_GROUPS) {
    const rows = list.filter(c => c.g === g); if (!rows.length) continue;
    const s = t1Sum(rows);
    out.push([name.toUpperCase(), '', '', 'TỔNG BÁNH ' + name.toUpperCase(), '', 'HOẠT ĐỘNG'].concat(T123_P.map(([k]) => s.q[k])).concat([s.full, '', '', '']));
    out.push(['', '', '', 'DOANH THU', '', 'HOẠT ĐỘNG', s.dt]);
    for (const c of rows) { const o = t1Order(c.id), b = t1Bags(o); out.push(['', c.ht ? 'HỖ TRỢ' : '', c.crm, c.name, c.phone, t1Status(o)].concat(T123_P.map(([k]) => t1V(o, k) || '')).concat([b.full, b.le ? '1 túi ' + b.le : '', c.note || '', o.gc || ''])); }
  }
  const all = t1Sum(list);
  out.push(['', '', '', '', '', 'TỔNG'].concat(T123_P.map(([k]) => all.q[k])).concat([all.full, '', 'Doanh thu ' + all.dt, '']));
  return out;
}
// dán sheet "2-KHÁCH TUYẾN 123" (tab 1 ngày): danh sách khách + số lượng
function parseT123(table) {
  const hi = table.findIndex((r, i) => i < 15 && r.some(c => HK(c) === 'crm') && r.some(c => HK(c).startsWith('ten khach')));
  if (hi < 0) throw new Error('Không thấy dòng tiêu đề (cần cột CRM và "Tên khách hàng"). Chọn cả sheet: Ctrl+A rồi Ctrl+C.');
  const h = table[hi].map(HK), find = f => h.findIndex(f);
  const col = { crm: find(x => x === 'crm'), name: find(x => x.startsWith('ten khach')), phone: find(x => x === 'sdt' || x.includes('dien thoai')), note: find(x => x.startsWith('ghi chu')) };
  const pc = Object.fromEntries(T123_P.map(([k, l]) => [k, find(x => keyOf(x) === keyOf(l))]));
  const body = table.slice(hi + 1), g = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).replace(/\r/g, '').replace(/\s+/g, ' ').trim() : '');
  const colOf = re => { let best = -1, bn = 0; for (let i = 0; i < 30; i++) { const n = body.filter(r => re.test(norm(r[i]))).length; if (n > bn) { bn = n; best = i; } } return best; };
  const stCol = colOf(/^(hoat dong|nghi)$/), htCol = colOf(/^ho tro$/);
  const rows = []; let grp = '', sub = '', lastA = '';
  const grpOf = t => (t.includes('chieu') || t.includes('toi') ? 'chieu' : (t.match(/(\d)/) || [])[1] ? 't' + t.match(/(\d)/)[1] : '');
  for (const r of body) {
    const a = g(r, 0) || lastA; lastA = a;
    const name = g(r, col.name), nn = norm(name);
    if (nn.startsWith('tong banh tuyen')) { grp = grpOf(nn) || grp; sub = ''; continue; }
    if (!name || nn.startsWith('doanh thu') || nn === 'tong' || /^[\d.,\s]+$/.test(name)) continue;
    if (!grp) grp = grpOf(norm(a)) || 't1';
    sub = norm(a).startsWith('chieu') && !norm(a).startsWith('chieu ') ? '' : norm(a).match(/^chieu .*giao/) ? a.replace(/^chiều/i, 'Chiều –').trim() : sub;
    const q = {}; for (const [k] of T123_P) { const raw = r[pc[k]]; const n = num(String(raw == null ? '' : raw).replace(/[^\d.,]/g, '')); if (pc[k] >= 0 && n > 0) q[k] = n; }
    let phone = g(r, col.phone), note = g(r, col.note);
    if (phone && !/\d{3}/.test(phone)) { note = [phone, note].filter(Boolean).join(' · '); phone = ''; }
    const st = stCol >= 0 ? (norm(r[stCol]).startsWith('hoat') ? 'HOẠT ĐỘNG' : norm(r[stCol]) === 'nghi' ? 'NGHỈ' : '') : '';
    rows.push({ g: grp, sub, crm: g(r, col.crm).replace(/\s+/g, '').toUpperCase(), name, phone, note, ht: htCol >= 0 && norm(r[htCol]) === 'ho tro', st, q });
  }
  // dòng trùng hệt nhau (cùng tên, cùng tuyến) chỉ lấy 1
  const seen = new Set(); return rows.filter(r => { const k = r.g + '|' + keyOf(r.name); if (seen.has(k)) return false; seen.add(k); return true; });
}
function t1Import() {
  if (!need('nhap', 'nhập danh sách Tuyến 123 từ sheet')) return;
  const m = modal({
    title: 'Cập nhật tuyến 123 từ Google Sheet', ok: 'Cập nhật', wide: true,
    body: `<ol class="steps"><li>Mở sheet <b>2-KHÁCH TUYẾN 123</b>, chọn tab ngày cần lấy.</li><li>Bấm một ô, <b>Ctrl+A</b> rồi <b>Ctrl+C</b>.</li><li>Bấm vào ô dưới và <b>Ctrl+V</b>.</li></ol>
      <textarea id="t1i-text" rows="4" style="width:100%;margin-top:8px" placeholder="Dán ở đây…"></textarea><div id="t1i-res" class="hint" style="margin-top:8px"></div>
      <div class="fgrid" style="margin-top:8px">
        <label class="field" style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="t1i-rep"> Thay toàn bộ danh sách khách bằng sheet (xóa khách không còn trong sheet)</label>
        <label class="field" style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="t1i-q" checked> Lấy cả số lượng vào ngày</label>
        <label class="field">Ngày<input type="date" id="t1i-date" value="${S.date}"></label></div>`,
    onOk: async root => {
      if (!parsed) throw new Error('Chưa dán dữ liệu');
      const replace = $('#t1i-rep', root).checked;
      const key = r => r.g + '|' + keyOf(r.name);
      const byKey = {}; for (const [id, c] of Object.entries(S.t1.cust)) if (c) { byKey[t1G(c) + '|' + keyOf(c.name)] = id; byKey['*' + keyOf(c.name)] = byKey['*' + keyOf(c.name)] || id; }
      const next = {}, idOf = {}; let nNew = 0, s = 0;
      for (const r of parsed) {
        s += 10; let id = byKey[key(r)] || byKey['*' + keyOf(r.name)];
        if (!id || next[id]) { id = rid('t'); nNew++; }
        idOf[key(r)] = id;
        next[id] = Object.assign({}, replace ? {} : S.t1.cust[id] || {}, { g: r.g, sub: r.sub, crm: r.crm, name: r.name, phone: r.phone, note: r.note, ht: r.ht, s });
      }
      if (replace) await setDoc('tuyen123/khach', { c: next }); else await mergeInto('tuyen123/khach', { c: next }, { c: {} });
      S.t1.cust = replace ? next : Object.assign({}, S.t1.cust, next);
      if ($('#t1i-q', root).checked) {
        const d = $('#t1i-date', root).value; if (!d) throw new Error('Chọn ngày');
        const r = {};
        for (const x of parsed) {
          const auto = Object.keys(x.q).length ? 'HOẠT ĐỘNG' : 'NGHỈ';
          if (Object.keys(x.q).length || (x.st && x.st !== auto)) r[idOf[key(x)]] = Object.assign({ q: x.q, at: nowStr() }, x.st && x.st !== auto ? { st: x.st } : {});
        }
        await setDoc('t123/' + d, { date: d, r }); khoOutLater('t123', d);
      }
      toast(`Đã cập nhật ${parsed.length} khách tuyến 123 (${nNew} khách mới)`); render(); return true;
    },
  });
  let parsed = null;
  const ta = $('#t1i-text', m.root);
  ta.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    const html = cd.getData('text/html'), txt = cd.getData('text/plain');
    const t = (html && tableFromHtml(html)) || (txt ? tableFromText(txt) : null);
    if (!t) return;
    e.preventDefault();
    try {
      parsed = parseT123(t);
      ta.value = `(Đã dán ${t.length} dòng)`;
      const cnt = T123_GROUPS.map(([g, n]) => `${n}: ${parsed.filter(r => r.g === g).length}`).join(' · ');
      $('#t1i-res', m.root).textContent = `Đọc được ${parsed.length} khách (${cnt}), ${parsed.filter(r => Object.keys(r.q).length).length} khách có số lượng.`;
    } catch (err) { parsed = null; $('#t1i-res', m.root).textContent = err.message; }
  });
}

      $('[data-del]', tr).onclick = async () => { if (await confirmBox(`Xóa sản phẩm "${p.name}"? Số lượng đã nhập của sản phẩm này sẽ không còn hiện.`, 'Xóa', true)) { c.products.splice(+tr.dataset.i, 1); draw(); saveProds(); } };
    });
    // kéo thả: thả lên nửa trên của dòng → chèn trước, nửa dưới → chèn sau; gần mép khung thì tự cuộn
    const dragRow = (e, tr) => {
      if (e.button) return;
      e.preventDefault();
      const rows = $$('tr[data-i]', main), from = +tr.dataset.i, box = $('.prods', main);
      let to = from, scroll = 0, y = e.clientY;
      tr.classList.add('dragging'); document.body.classList.add('drag-on');
      const mark = () => {
        rows.forEach(r => r.classList.remove('drop-before', 'drop-after'));
        let k = rows.findIndex(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
        if (k < 0) k = rows.length;
        to = k > from ? k - 1 : k;
        if (to !== from) (k < rows.length ? rows[k].classList.add('drop-before') : rows[rows.length - 1].classList.add('drop-after'));
      };
      const tick = () => { if (!scroll) return; window.scrollBy(0, scroll); mark(); requestAnimationFrame(tick); };
      const move = ev => {
        y = ev.clientY; mark();
        const v = window.innerHeight, was = scroll;
        scroll = y < 60 ? -12 : y > v - 60 ? 12 : 0;
        if (scroll && !was) requestAnimationFrame(tick);
      };
      const up = () => {
        scroll = 0; document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        document.body.classList.remove('drag-on');
        if (to === from) { tr.classList.remove('dragging'); rows.forEach(r => r.classList.remove('drop-before', 'drop-after')); return; }
        const [it] = c.products.splice(from, 1); c.products.splice(to, 0, it);
        const sx = box ? box.scrollLeft : 0; draw(); saveProds();
        const nb = $('.prods', main); if (nb) nb.scrollLeft = sx;
        const nr = $(`tr[data-i="${to}"]`, main); if (nr) { nr.classList.add('dragging'); setTimeout(() => nr.classList.remove('dragging'), 700); }
      };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    };
    $('#s-addp').onclick = () => { const p = P('Sản phẩm mới', '', ''); p.id = rid('p'); c.products.push(p); draw(); saveProds(); };
    $('#s-routes').onclick = editRoutes;
    $('#s-words').oninput = e => { c.thungWords = e.target.value; dirty(); };
    $('#s-pay').oninput = e => { c.pay = e.target.value.split(',').map(x => x.trim()).filter(Boolean); dirty(); };
    $('#s-reset').onclick = () => { c.caps = JSON.parse(JSON.stringify(DEFAULT_CFG.caps)); draw(); dirty(); };
    $('#s-save').onclick = () => guard(async () => {
      if (c.products.some(p => !p.name.trim())) throw new Error('Có sản phẩm chưa có tên');
      S.cfg = c; await setDoc('cfg/main', cfgDoc()); toast('Đã lưu cài đặt'); render();
    });
  };
  draw();
}

    staff_accounts: {}, // tài khoản nhân viên web kho {id: {user, name, admin, active, salt, pw}}

    lsx_auto: { on: true, from: '2026-10-24', reviewers: ['hoaithu'] },

  const st = {
    db: null, user: null, uid: '', wh: 'TP', ready: {},
    settings: {}, routes: {}, products: {}, days: {}, docs: {}, plans: {}, bom: {},
    ver: {}, vcache: {}, globalSubs: [], whSubs: [], lastLocal: 0, onRemote: null, loaded: false,
  };

  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  const clone = o => JSON.parse(JSON.stringify(o));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const z = n => String(n).padStart(2, '0');
  function nowStr() { const d = new Date(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; }
  const today = () => nowStr().slice(0, 10);
  const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return `${t.getFullYear()}-${z(t.getMonth() + 1)}-${z(t.getDate())}`; };
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const text = v => (v === null || v === undefined ? '' : String(v).trim());
  function num(v, dflt = 0) {
    if (v === null || v === undefined || v === '') return dflt;
    if (typeof v === 'number') return v;
    let s = String(v).trim().replace(/\s/g, '');
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(',', '.');
    const n = Number(s);
    if (isNaN(n)) throw new ApiError(400, 'Giá trị số không hợp lệ: ' + v);
    return n;
  }
  const safeNum = (v, d = 0) => { try { return num(v, d); } catch (e) { return d; } };
  function validDate(v, field = 'Ngày') {
    const s = text(v);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || isNaN(new Date(s + 'T00:00:00'))) throw new ApiError(400, `${field} không hợp lệ: ${s || '(trống)'}`);
    return s;
  }
  const fmtq = x => (Math.round((x + 0) * 1e6) / 1e6).toString();
  const live = obj => Object.entries(obj || {}).filter(([, v]) => v !== null && v !== undefined);
  function deepMerge(target, patch) {
    for (const [k, v] of Object.entries(patch)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) deepMerge(target[k], v);
      else target[k] = clone(v === undefined ? null : v);
    }
    return target;
  }

  /* ---------------------------------------------------------- kho dữ liệu */
  const READONLY_MSG = 'Đây là trang chỉ xem. Muốn nhập hoặc sửa phiếu, hãy dùng web chính (cần được mời).';
  const dbx = () => { if (VIEW || !st.db) throw new ApiError(403, VIEW ? READONLY_MSG : 'Chưa kết nối dữ liệu.'); return st.db; };
  const ref = {
    settings: () => dbx().doc('config/settings'),
    routes: () => dbx().doc('config/routes'),
    products: wh => dbx().doc(`kho/${wh}/meta/products`),
    bom: () => dbx().doc('kho/NVL/meta/bom'),
    days: wh => dbx().collection(`kho/${wh}/days`),
    day: (wh, d) => dbx().doc(`kho/${wh}/days/${d}`),
    docs: wh => dbx().collection(`kho/${wh}/docs`),
    doc: (wh, id) => dbx().doc(`kho/${wh}/docs/${id}`),
    plans: wh => dbx().collection(`kho/${wh}/plans`),
    planMonth: (wh, ym) => dbx().doc(`kho/${wh}/plans/${ym}`),
    giao: d => dbx().doc(`kho/TP/giao/${d}`),
    giaoAll: () => dbx().collection('kho/TP/giao'),
    vitri: () => dbx().doc('kho/TP/meta/vitri'),
    track: (d, id) => dbx().doc(`kho/TP/hanhtrinh/${d}-${id}`),
    anh: id => dbx().doc(`kho/TP/anh/${id}`),
    gps: () => dbx().doc('config/gps'),
    logs: () => dbx().collection('log'),
    logDay: d => dbx().doc('log/' + d),
    notice: sid => dbx().doc('notice/' + sid), // thông báo cho từng tài khoản nhân viên
  };
  function dbError(e) {
    const code = e && e.code;
    if (code === 'invalid_argument') return new ApiError(403, 'Không lưu được: bạn đang chỉ có quyền xem trang này. Nhờ chủ trang mời bằng email với quyền Contributor (nhập liệu, không sửa code; không có Contributor thì Editor); nếu đã được mời, nhờ chủ trang tắt chia sẻ "Anyone with the link" rồi tải lại trang.');
    if (code === 'quota_exceeded') return new ApiError(507, 'Kho dữ liệu đã đầy: ' + (e.message || ''));

  async function write(fn) {
    if (VIEW) throw new ApiError(403, READONLY_MSG);

      throw dbError(e);
    } finally { st.lastLocal = Date.now(); }
  }
  // Gộp một phần vào tài liệu (tạo mới nếu chưa có, có khóa ngắn để 2 người tạo cùng lúc không đè nhau)
  async function mergeInto(r, patch, base) {
    await write(async () => {
      try { await r.update(patch); return; } catch (e) { if (!e || e.code !== 'invalid_argument') throw e; }
      const snap = await r.get();
      if (snap.exists) { await r.update(patch); return; }
      const lease = await r.acquire({ holder: st.uid || newId('h'), ttlMs: 3000 });
      if (!lease.acquired) { await sleep(800); await r.update(patch); return; }
      const again = await r.get();
      if (again.exists) await r.update(patch);
      else await r.set(deepMerge(clone(base || {}), patch));
    });
  }

  function bump(wh) { st.ver[wh] = (st.ver[wh] || 0) + 1; }
  function remote() {
    if (st.loaded && Date.now() - st.lastLocal > 4000 && st.onRemote) st.onRemote();
  }
  function snapKey(snap) {
    if (snap.docs) return JSON.stringify(snap.docs.map(d => [d.id, d.data()]));
    return JSON.stringify(snap.exists ? snap.data() : null);
  }
  function subscribe(list, query, onData, key) {
    return new Promise(resolve => {
      let first = true, last = null;
      const unsub = query.onSnapshot(snap => {
        const k = snapKey(snap);
        if (k === last) return; // lần giao lại không đổi gì (bản nháp từ bộ nhớ đệm → bản chính thức)
        last = k;
        onData(snap);
        if (first) { first = false; resolve(); } else if (!(snap.metadata && snap.metadata.hasPendingWrites)) remote();
      }, err => {
        console.warn('db subscription', key, err);
        if (first) { first = false; resolve(); }
      });
      list.push(unsub);
      setTimeout(() => { if (first) { first = false; resolve(); } }, 15000);
    });
  }
  function docData(snap) { return snap.exists ? snap.data() : null; }

  function loadSnapshot(snap) {
    st.settings = snap.settings || {}; st.routes = snap.routes || {}; st.bom = snap.bom || {};
    for (const w of WAREHOUSES) {
      const d = (snap.warehouses || {})[w] || {};

  }
  // gọi nhiều lần được (web giao hàng → web kho): chỉ kết nối 1 lần
  function init() {
    if (!st.initP) st.initP = doInit().then(() => { st.ready = true; }, e => { st.initP = null; throw e; });

  }
  async function doInit() {
    if (VIEW) {
      const el = document.getElementById('antam-snapshot');

    }
    if (!window.claude || !window.claude.use) throw new Error('Trang này cần mở trên claude.ai để dùng dữ liệu chung.');
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db) throw new Error('Không mở được kho dữ liệu chung. Hãy đăng nhập claude.ai rồi tải lại trang.');
    st.db = db; st.user = user;
    if (user) {
      try { st.uid = (await user.id()) || ''; } catch (e) { st.uid = ''; }
      try { const me = await user.me(); st.myName = (me && me.name) || ''; } catch (e) { st.myName = ''; }
      try { st.canWrite = await user.can('data.write'); } catch (e) { st.canWrite = null; }
    }
    await Promise.all([
      subscribe(st.globalSubs, ref.settings(), s => { st.settings = (docData(s) || {}).s || {}; }, 'settings'),
      subscribe(st.globalSubs, ref.routes(), s => { st.routes = (docData(s) || {}).r || {}; }, 'routes'),
      subscribe(st.globalSubs, ref.bom(), s => { st.bom = (docData(s) || {}).b || {}; }, 'bom'),
    ]);
  }
  async function setWh(wh) {
    if (VIEW) { st.wh = wh; st.loaded = true; return; }
    st.wh = wh;
    st.loaded = false;
    await liveWh(wh);
    st.loaded = true;
  }
  // Dữ liệu từng kho: theo dõi trực tiếp, mở 1 lần và giữ (lệnh sản xuất tự lập cần cả phiếu kho TP lẫn kho NVL)
  function liveWh(wh) {
    st.whLive = st.whLive || {};
    if (VIEW) return Promise.resolve();
    if (!st.whLive[wh]) st.whLive[wh] = Promise.all([
      subscribe(st.whSubs, ref.products(wh), s => { st.products[wh] = (docData(s) || {}).p || {}; }, 'products'),
      subscribe(st.whSubs, ref.days(wh).orderBy('date', 'desc').limit(1000), s => {
        const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); st.days[wh] = m; bump(wh);
      }, 'days'),
      subscribe(st.whSubs, ref.docs(wh).orderBy('date', 'desc').limit(500), s => {
        const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); st.docs[wh] = m;
      }, 'docs'),
      subscribe(st.whSubs, ref.plans(wh).orderBy('ym', 'desc').limit(240), s => {
        const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); st.plans[wh] = m;
      }, 'plans'),
    ]).catch(e => { st.whLive[wh] = null; throw e; });
    return st.whLive[wh];
  }

  /* ---------------------------------------------------------- cài đặt */
  function settings() {
    const s = Object.assign(clone(DEFAULT_SETTINGS), clone(st.settings || {}));
    const whs = s.warehouses || {};
    for (const code of WAREHOUSES) whs[code] = Object.assign(clone(DEFAULT_WAREHOUSES[code]), whs[code] || {});
    s.warehouses = whs;
    return s;
  }
  async function log(action, target, detail, wh) {
    const d = today();
    const id = newId('l');
    const entry = { at: nowStr(), who: st.who || '', action, target: wh ? `[${wh}] ${target}` : target,
      detail: typeof detail === 'string' ? detail : JSON.stringify(detail || '') };
    try { await mergeInto(ref.logDay(d), { e: { [id]: entry } }, { date: d }); } catch (e) { console.warn('log', e); }
  }

  /* ---------------------------------------------------------- dữ liệu đọc */
  function products(wh) {
    return live(st.products[wh]).map(([code, p]) => Object.assign({ unit: '', grp: '', price: 0, supplier: '', note: '', opening_qty: 0, min_qty: null, active: 1, sort: 0 }, p, { code }))
      .sort((a, b) => (a.sort || 0) - (b.sort || 0) || a.code.localeCompare(b.code));
  }
  const productMap = wh => Object.fromEntries(products(wh).map(p => [p.code, p]));
  function vouchers(wh) {
    const c = st.vcache[wh];
    if (c && c.ver === st.ver[wh]) return c.list;
    const list = [];
    for (const [day, doc] of Object.entries(st.days[wh] || {})) {
      for (const [id, v] of live(doc && doc.v)) {
        list.push(Object.assign({}, v, { id, wh, date: v.date || day,
          lines: (v.lines || []).map((l, i) => ({ line_no: i + 1, product_code: l.c, qty: l.q || 0, price: l.p || 0, note: l.n || '' })) }));
      }
    }
    list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created_at || '') < (b.created_at || '') ? -1 : (a.created_at || '') > (b.created_at || '') ? 1 : a.id < b.id ? -1 : 1));
    st.vcache[wh] = { ver: st.ver[wh], list, byId: Object.fromEntries(list.map(v => [v.id, v])) };
    return list;
  }
  const voucherById = (wh, id) => { vouchers(wh); return st.vcache[wh].byId[id]; };

  function nextNumber(wh, type, d, routeCode, excludeId) {
    const prefix = TYPE_PREFIX[type];
    const ddmm = d.slice(8, 10) + d.slice(5, 7);
    const head = `${prefix}-${ddmm}-`;
    let seq = 0;
    for (const v of vouchers(wh)) {
      if (v.type !== type || v.date.slice(0, 4) !== d.slice(0, 4) || v.id === excludeId) continue;
      const s = String(v.no).replace(/\s/g, '').toUpperCase();
      if (!s.startsWith(head)) continue;
      const m = s.slice(head.length).match(/^(\d+)/);
      if (m) seq = Math.max(seq, parseInt(m[1], 10));
    }
    let no = `${prefix}-${ddmm}-${z(seq + 1)}`;
    if (type === 'X') { const c = String(routeCode || '').replace(/\s/g, ''); if (c) no += '-' + c; }
    return no;
  }
  const sign = v => (v.type === 'X' ? -1 : 1);
  // phiếu điều chỉnh chờ duyệt / bị từ chối chưa tính vào tồn kho
  const posted = wh => vouchers(wh).filter(v => !v.status);
  function stockMap(wh, { until, before, exclude } = {}) {
    const res = {};
    products(wh).forEach(p => { res[p.code] = p.opening_qty || 0; });
    for (const v of posted(wh)) {
      if (until && v.date > until) continue;
      if (before && v.date >= before) continue;
      if (exclude && v.id === exclude) continue;
      for (const l of v.lines) res[l.product_code] = (res[l.product_code] || 0) + sign(v) * l.qty;
    }
    return res;
  }
  function reportNxt(wh, from, to) {
    const opening = stockMap(wh, { before: from });
    const per = {};
    for (const v of posted(wh)) {
      if (v.date < from || v.date > to) continue;
      for (const l of v.lines) {
        const p = per[l.product_code] = per[l.product_code] || { N: 0, X: 0, D: 0, n: 0 };
        p[v.type] += l.qty; p.n++;
      }
    }
    const list = products(wh);
    const known = new Set(list.map(p => p.code));
    Object.keys(per).filter(c => !known.has(c)).sort().forEach(code => list.push({ code, name: '(không có trong danh mục)', unit: '', grp: '', price: 0, opening_qty: 0, min_qty: null }));
    return list.map(p => {
      const m = per[p.code] || { N: 0, X: 0, D: 0, n: 0 };
      const op = opening[p.code] || 0;
      const close = op + m.N - m.X + m.D;
      let warn = '';
      if (close < -1e-9) warn = 'Tồn âm';
      else if (p.min_qty !== null && p.min_qty !== undefined && close < p.min_qty) warn = 'Dưới tồn tối thiểu';
      return { code: p.code, name: p.name, unit: p.unit, grp: p.grp, opening_qty: p.opening_qty || 0, min_qty: p.min_qty === undefined ? null : p.min_qty,

    });
  }
  // Gói tồn kho cho Kho vận An Tâm: Nhập – Xuất – Tồn hôm nay của cả 2 kho (TP và NVL; kho chưa mở thì tải ngầm), mã đang dùng hoặc còn tồn / có phát sinh
  // rows: [mã, tên, ĐVT, nhóm, tồn đầu ngày, nhập, xuất, điều chỉnh, tồn cuối, tồn tối thiểu, cảnh báo]
  async function khovanPush() {
    if (VIEW || !st.db || st.canWrite === false) return null;

    for (const wh of WAREHOUSES) {
      try { await liveWh(wh); } catch (e) { continue; }

      const active = new Set(products(wh).filter(p => p.active !== 0).map(p => p.code));
      const rows = reportNxt(wh, d, d).filter(r => active.has(r.code) || Math.abs(r.close) > 1e-9 || r.moved)
        .map(r => [r.code, r.name, r.unit, r.grp, r6_(r.open), r6_(r.in), r6_(r.out), r6_(r.adj), r6_(r.close), r.min_qty, r.warn]);
      patch[wh] = { at, date: d, name: (settings().warehouses[wh] || {}).name || wh, rows, pending: vouchers(wh).filter(v => v.status === 'pending').length };
      out[wh] = rows.length;

    await mergeInto(dbx().doc('khovan/kho'), patch, {});

  }
  function stockCard(wh, code, from, to) {
    const opening = stockMap(wh, { before: from })[code] || 0;
    let bal = opening;
    const lines = [];
    for (const v of posted(wh)) {
      if (v.date < from || v.date > to) continue;
      for (const l of v.lines) {
        if (l.product_code !== code) continue;
        bal += sign(v) * l.qty;
        lines.push({ voucher_id: v.id, no: v.no, date: v.date, type: v.type, from_party: v.from_party, to_party: v.to_party, reason: v.reason, qty: l.qty, note: l.note, balance: bal });

    out.lines.forEach(l => { const p = pm[l.product_code]; l.name = p ? p.name : null; l.unit = p ? p.unit : null; });
    if (v.type === 'D') {

  function voucherSummaryRow(v) {

      total_amount: v.lines.reduce((a, l) => a + l.qty * l.price, 0) });
  }
  const like = (q, ...vals) => vals.some(x => String(x || '').toLowerCase().includes(q));

  /* ---------------------------------------------------------- phiếu (ghi) */
  function storeVoucher(v) {
    return { no: v.no, type: v.type, date: v.date, route: v.route || '', from_party: v.from_party || '', to_party: v.to_party || '',
      giver: v.giver || '', receiver: v.receiver || '', reason: v.reason || '', bill_count: v.bill_count || '', doc_ref: v.doc_ref || '',
      note: v.note || '', created_at: v.created_at || nowStr(), updated_at: nowStr(),
      ...Object.fromEntries(APPROVAL_COLS.map(k => [k, v[k] || ''])),
      lines: v.lines.map(l => ({ c: l.product_code, q: l.qty, p: l.price || 0, n: l.note || '' })) };
  }
  function applyLocalVoucher(wh, date, id, stored) {
    st.days[wh] = st.days[wh] || {};
    const doc = st.days[wh][date] = Object.assign({ date, v: {} }, st.days[wh][date] || {});
    doc.v = Object.assign({}, doc.v, { [id]: stored });
    bump(wh);
  }
  // Duyệt phiếu điều chỉnh (giống server.py): me = [id, tài khoản] đang đăng nhập; null khi chưa dùng tài khoản nhân viên
  const APPROVAL_COLS = ['status', 'created_by', 'approved_by', 'approved_at', 'review_note', 'created_by_id'];

  // (Quản lý = tất cả; nhân viên = tất cả trừ duyệt phiếu điều chỉnh và quản lý tài khoản)
  const STAFF_PERMS = ['khoTP', 'khoNVL', 'pN', 'pX', 'pD', 'xoa', 'duyet', 'phieu', 'baocao', 'kiemke', 'bangiao', 'kehoach', 'sanxuat', 'phantuyen', 'taixe', 'hang', 'tuyen', 'caidat', 'lichsu', 'taikhoan'];
  const STAFF_NV = STAFF_PERMS.filter(k => k !== 'duyet' && k !== 'taikhoan');
  const staffPerms = a => new Set(Array.isArray(a && a.perm) ? a.perm.filter(k => STAFF_PERMS.includes(k)) : a && a.admin ? STAFF_PERMS : STAFF_NV);
  const may = (me, k) => !me || staffPerms(me[1]).has(k);
  function must(me, k, what) { if (!may(me, k)) throw new ApiError(403, `Tài khoản của bạn chưa được cấp quyền ${what} – nhờ Quản lý phân quyền ở mục Tài khoản nhân viên.`); }
  const DOC_PERM = { stocktake: ['kiemke', 'lưu biên bản kiểm kê'], handover: ['bangiao', 'lưu biên bản bàn giao'], routing: ['phantuyen', 'lưu phân tuyến giao hàng'] };
  const lockedFor = (v, me) => v.type === 'D' && !v.status && me && !may(me, 'duyet');
  function approvalOf(old, type, me) {
    const cur = Object.fromEntries(APPROVAL_COLS.map(k => [k, (old && old[k]) || '']));

    if (!old) Object.assign(cur, { created_by: st.who || '', created_by_id: me ? me[0] : '' });
    if (type !== 'D' || !me) return Object.assign(cur, { status: '', review_note: '' });
    if (may(me, 'duyet')) {
      if (!old) Object.assign(cur, { approved_by: st.who || '', approved_at: nowStr() }); // người có quyền duyệt tự lập: duyệt luôn
      return cur;
    }
    return Object.assign(cur, { status: 'pending', approved_by: '', approved_at: '' }); // nhân viên lập / sửa: gửi (lại) Quản lý duyệt
  }
  async function reviewVoucher(id, ok, note, me) {
    if (!me || !may(me, 'duyet')) throw new ApiError(403, 'Tài khoản của bạn chưa được cấp quyền duyệt phiếu điều chỉnh');

    note = text(note).slice(0, 300);

    stored.updated_at = v.updated_at || stored.updated_at;
    await mergeInto(ref.day(v.wh, v.date), { v: { [id]: stored } }, { date: v.date });
    applyLocalVoucher(v.wh, v.date, id, stored);
    await log(ok ? 'Duyệt phiếu điều chỉnh' : 'Từ chối phiếu điều chỉnh', v.no, note, v.wh);
    // báo cho người lập phiếu (phiếu lập trước khi có created_by_id: tìm theo tên)
    const to = v.created_by_id || (live(settings().staff_accounts).find(([, a]) => v.created_by && a.name === v.created_by) || [''])[0];
    if (to && to !== me[0]) {
      const msg = ok ? `✔ Phiếu điều chỉnh ${v.no} đã được ${st.who || 'Quản lý'} duyệt – đã tính vào tồn kho.`
        : `✖ Phiếu điều chỉnh ${v.no} bị ${st.who || 'Quản lý'} từ chối: ${note}. Hãy sửa lại rồi Lưu & gửi duyệt lại.`;
      try { await addNotice(to, { at: nowStr(), text: msg, link: '#/phieu/' + id, wh: v.wh, ok, read: false }); } catch (e) { console.warn('notice', e); }
    }

  }
  async function addNotice(to, rec) {
    const old = docData(await ref.notice(to).get()) || {};
    const keep = live(old.n).sort((a, b) => (a[1].at < b[1].at ? 1 : -1)).slice(49).map(([k]) => [k, null]); // giữ 50 thông báo gần nhất
    await mergeInto(ref.notice(to), { n: Object.assign(Object.fromEntries(keep), { [newId('n')]: rec }) }, {});
  }
  async function noticesApi(method, action, body, me) {
    if (!me || !me[0]) return { unread: 0, list: [] };
    const all = live((docData(await ref.notice(me[0]).get()) || {}).n);
    if (method === 'POST' && action === 'read') {
      const ids = (body.ids || []).map(String);
      const patch = Object.fromEntries(all.filter(([k, n]) => !n.read && (!ids.length || ids.includes(k))).map(([k, n]) => [k, Object.assign({}, n, { read: true })]));
      if (Object.keys(patch).length) await mergeInto(ref.notice(me[0]), { n: patch }, {});

    }
    const list = all.map(([id, n]) => Object.assign({ id }, n)).sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 50);

  async function saveVoucher(wh, data, vid, me) {

    let old = null;
    if (vid) {
      for (const w of WAREHOUSES) { if (st.days[w]) { old = voucherById(w, vid); if (old) { wh = w; break; } } }

  async function deleteVoucher(id, me) {

  /* ---------------------------------------------------------- nhập Excel (SheetJS) */
  class DateVal { constructor(iso) { this.iso = iso; } }
  function readWorkbook(buf) {
    if (!window.XLSX) throw new ApiError(500, 'Chưa tải được thư viện đọc Excel, hãy tải lại trang.');
    let wb;
    try { wb = window.XLSX.read(new Uint8Array(buf), { type: 'array', cellNF: true, cellDates: false, cellFormula: false }); } catch (e) {
      throw new ApiError(400, 'File không phải định dạng .xlsx (hãy lưu lại file bằng Excel dạng .xlsx)');
    }
    const out = {};
    wb.SheetNames.forEach(name => {
      const ws = wb.Sheets[name];
      const range = ws['!ref'] ? window.XLSX.utils.decode_range(ws['!ref']) : { e: { r: 0 } };
      out[name] = {
        maxRow: range.e.r + 1,
        get(a) {
          const c = ws[a];
          if (!c || c.t === 'e' || c.t === 'z') return null;
          if (c.t === 'n' && c.z && window.XLSX.SSF.is_date(c.z)) {
            const dt = new Date(Date.UTC(1899, 11, 30) + Math.round(c.v * 86400000));
            return new DateVal(dt.toISOString().slice(0, 10));
          }
          if (c.t === 'd') return new DateVal(new Date(c.v).toISOString().slice(0, 10));
          return c.v === '' ? null : c.v;
        },
      };
    });
    return out;
  }
  function detectWarehouse(wb) {
    for (const [name, cell] of [['Sổ Nhập Xuất', 'A1'], ['Phiếu Nhập Xuất', 'A2'], ['Phiếu Điều chỉnh', 'A2']]) {
      const sh = wb[name];
      if (!sh) continue;
      const hay = text(sh.get(cell)).toUpperCase();
      if (hay.includes('NGUYÊN VẬT LIỆU')) return 'NVL';
      if (hay.includes('THÀNH PHẨM')) return 'TP';
    }
    return null;
  }
  async function importExcel(wh, buf, opts) {

    }
    const sheet = n => { const k = Object.keys(wb).find(x => x.trim().toLowerCase() === n.toLowerCase()); return k ? wb[k] : null; };
    const party = v => { const s = text(v); return wh === 'TP' && s === OLD_TP_NAME ? TP_NAME : s; };
    const summary = {};
    const prods = clone(st.products[wh] || {});
    let prodChanged = false;
    const ensureProduct = (code, name, unit) => {
      if (!prods[code]) { prods[code] = { name: name || code, unit: unit || '', grp: '', price: 0, supplier: '', note: '', opening_qty: 0, min_qty: null, active: 1, sort: 9000 + Object.keys(prods).length }; prodChanged = true; }
    };
    const cat = sheet('Danh mục hàng'), nxt = sheet('Nhập Xuất Tồn');
    const opening = {};
    if (nxt) for (let r = 6; r < 2000; r++) { const c = text(nxt.get('B' + r)); if (c) opening[c] = [nxt.get('F' + r), nxt.get('G' + r)]; }
    if (cat && opts.products) {

  /* ---------------------------------------------------------- web giao hàng (mỗi người giao 1 nick + mã PIN) */

    }
    const pos = c => { const i = order.indexOf(c.toLowerCase()); return i < 0 ? 999 : i; };

  async function deliveriesOf(d) {

  function cleanGps(v) {

  const MAPS_URL = /^https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|(?:www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)[^\s"'<>]*$/i;

  // Ảnh giao hàng: ưu tiên kho ảnh của trang (assets), không được thì lưu ảnh (đã thu nhỏ) vào dữ liệu chung
  async function savePhoto(d, key, dataUrl) {

    if (!m) throw new ApiError(400, 'Ảnh không hợp lệ (cần ảnh JPEG)');

    try { assets = await window.claude.use('assets'); } catch (e) { assets = null; }
    if (assets) {
      try {
        const bin = atob(m[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const res = await assets.upload(new Blob([bytes], { type: 'image/jpeg' }), { type: 'image/jpeg' });
        return 'a:' + res.id;
      } catch (e) {
        if (e && e.code === 'rate_limited') throw new ApiError(429, 'Gửi ảnh quá nhanh, hãy thử lại sau vài giây.');
        if (e && e.code === 'quota_or_state') throw new ApiError(507, 'Kho ảnh của trang đã đầy – báo kho xóa bớt ảnh cũ.');

  const photoCache = {};

  const PHOTO_REF = /^[ad]:[A-Za-z0-9_-]{4,64}$/;
  // Hành trình giao hàng: điện thoại người giao gửi từng đợt điểm GPS [giây tính từ 0h, lat, lng, độ chính xác m]
  const TRACK_MAX = 4000;

    let pts = Array.from(m.values()).sort((a, b) => a[0] - b[0]);
    while (pts.length > TRACK_MAX) pts = pts.filter((p, i) => i % 2 === 0 || i === pts.length - 1); // quá dài: bỏ bớt 1/2 điểm
    const rec = { date: d, driver: id, name: me.name || me.nick || '', pts, live: old.live || '', liveAt: old.liveAt || '', on: !!old.on, at: nowStr() };

  // GPS An Tâm: trang claude.ai không được đọc định vị điện thoại, nên người giao mở trang GPS riêng (Google Apps Script, có https)
  // bằng link có mã ngẫu nhiên của mình; trang đó ghi điểm GPS vào Google Sheet; trang này đọc Sheet qua Google Drive của người xem
  // (static/app.js gpsPull) rồi gửi các dòng vào đây: đổi mã → người giao và gộp vào hành trình.
  // Cột diem: các lần gửi cách nhau "|", mỗi lần R<giây nhận>:<giây unix>,<vĩ×1e5>,<kinh×1e5>,<±m>;<+giây>,<+vĩ>,<+kinh>,<±m>… (gps-an-tam/Code.gs)
  function gpsDecode(cell) {
    const out = [];
    text(cell).split('|').forEach(batch => {
      const m = /^R\d+:(.*)$/.exec(batch);
      if (!m) return;
      let prev = null;
      m[1].split(';').forEach(part => {
        const v = part.split(',').map(Number);
        if (v.length !== 4 || v.some(x => !Number.isInteger(x))) { prev = null; return; }
        const p = prev ? [prev[0] + v[0], prev[1] + v[1], prev[2] + v[2], v[3]] : v;

      });
    });
    return out;
  }
  const VN_SEC = 7 * 3600;
  const vnDay = sec => new Date((sec + VN_SEC) * 1000).toISOString().slice(0, 10);
  async function gpsCfg() { try { return docData(await ref.gps().get()) || {}; } catch (e) { throw dbError(e); } }
  const gpsLink = (url, tok, name) => (url && tok ? `${url}${url.includes('?') ? '&' : '?'}t=${tok}&n=${encodeURIComponent(name || '')}` : '');
  const gpsTokOf = (g, id) => (live(g.t).find(([, x]) => x.id === id) || [''])[0];
  async function gpsApi(method, action, body) {

      const links = {};

    if (action === 'sync') {

    // tạo / sửa / xóa: tài khoản Quản lý; lần đầu (chưa có tài khoản nào) ai cũng tạo được tài khoản Quản lý đầu tiên

    if (n && !(me && may(me, 'taikhoan'))) throw new ApiError(403, 'Chỉ tài khoản có quyền quản lý tài khoản mới tạo / sửa / xóa / phân quyền tài khoản');
    if (method === 'POST') {
      const id = text(body.id) || newId('s');
      const user = normNick(body.user);
      if (!/^[a-z0-9._-]{2,30}$/.test(user)) throw new ApiError(400, 'Tên đăng nhập 2–30 ký tự, chỉ gồm chữ không dấu, số, dấu chấm, gạch');
      if (Object.entries(accounts).some(([k, a]) => normNick(a.user) === user && k !== id)) throw new ApiError(409, `Tên đăng nhập ${user} đã có người dùng`);
      const old = accounts[id] || {};
      const rec = { user, name: text(body.name) || user, admin: !!body.admin || !n, active: body.active !== false, salt: old.salt || '', pw: old.pw || '' };
      // phân quyền: danh sách quyền tích chọn; tài khoản đầu tiên có tất cả
      if (Array.isArray(body.perm)) rec.perm = body.perm.map(text).filter(k => STAFF_PERMS.includes(k));
      else if (Array.isArray(old.perm)) rec.perm = old.perm;
      if (!n) rec.perm = STAFF_PERMS.slice();
      if (rec.perm) rec.admin = rec.perm.includes('taikhoan');
      const pw = text(body.password);
      if (pw) {
        if (pw.length < 4 || pw.length > 40) throw new ApiError(400, 'Mật khẩu 4–40 ký tự');
        rec.salt = randHex(8); rec.pw = await pinHash(rec.salt, pw);
      }
      if (!rec.pw) throw new ApiError(400, 'Cần đặt mật khẩu cho tài khoản mới');
      if (me && id === me[0] && (!staffPerms(rec).has('taikhoan') || !rec.active)) throw new ApiError(400, 'Không tự bỏ quyền quản lý tài khoản hoặc tự khóa tài khoản đang đăng nhập');
      await put(id, rec);
      if (!n) st.who = rec.name; // tài khoản đầu tiên: người tạo chính là người này
      await log('Lưu tài khoản nhân viên', user, [pw && old.pw ? 'đổi mật khẩu' : '', 'quyền: ' + [...staffPerms(rec)].join(', ')].filter(Boolean).join(' · '));
      const out = { account: pub(id, rec) };
      if (!n) out.token = tokenOf(id, rec); // tài khoản đầu tiên: đăng nhập luôn
      return out;
    }
    if (method === 'DELETE' && action) {
      if (me && action === me[0]) throw new ApiError(400, 'Không tự xóa tài khoản đang đăng nhập');
      const a = accounts[action];
      await mergeInto(ref.settings(), { s: { staff_accounts: { [action]: null } } }, { s: {} });
      st.settings = deepMerge(clone(st.settings || {}), { staff_accounts: { [action]: null } });
      await log('Xóa tài khoản nhân viên', (a && a.user) || action, '');

    throw new ApiError(404, 'Không có chức năng này');
  }
  // Mật khẩu quản lý của web Giao hàng An Tâm: người giao (Contributor của trang) không vào được phần quản lý.
  // Kiểm tra ở trình duyệt – là khóa giao diện, không thay được phân quyền của claude.ai.
  async function adminApi(method, action, body) {
    const a = settings().admin || {};
    const tok = () => (a.pin ? 'adm.' + a.pin.slice(0, 24) : '');
    const isOwner = async () => { try { return !!(st.user && await st.user.isOwner()); } catch (e) { return false; } };
    if (method === 'GET') return { set: !!a.pin, owner: await isOwner() };
    if (action === 'check') return { ok: !!a.pin && text(body.token) === tok() };
    if (action === 'login') {
      if (!a.pin) throw new ApiError(400, 'Chưa đặt mật khẩu quản lý – chủ trang mở trang này để đặt.');
      if ((await pinHash(a.salt || '', text(body.pin))) !== a.pin) { await sleep(500); throw new ApiError(401, 'Sai mật khẩu quản lý'); }
      return { token: tok() };
    }
    if (action === 'set') {
      if (!(a.pin ? text(body.token) === tok() : await isOwner())) throw new ApiError(403, 'Chỉ chủ trang (lần đầu) hoặc người đang quản lý mới đặt được mật khẩu quản lý.');
      const pin = text(body.pin);
      if (pin.length < 4 || pin.length > 40) throw new ApiError(400, 'Mật khẩu quản lý 4–40 ký tự');
      const rec = { salt: randHex(8) };
      rec.pin = await pinHash(rec.salt, pin);
      await mergeInto(ref.settings(), { s: { admin: rec } }, { s: {} });
      st.settings = deepMerge(clone(st.settings || {}), { admin: rec });
      await log('Đặt mật khẩu quản lý web giao hàng', '', '');
      return { token: 'adm.' + rec.pin.slice(0, 24) };

  }
  async function saveDriver(data) {
    const all = drivers();
    const id = text(data.id) || newId('g');
