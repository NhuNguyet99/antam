<title>Chấm công An Tâm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: thanh trên cùng (tên web · menu), vùng chính bên dưới; mục Máy chấm công là màn hình đặt ở cửa, cắm máy đọc mã QR */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --raise: #f7f9f6; --fg: #18211d; --muted: #5b6862; --line: #dce2dc;
  --accent: #1c6b5a; --accent-fg: #ffffff; --accent-soft: #e0eee8;
  --crit: #b42318; --crit-soft: #fbe8e5; --warn: #9a5b06; --warn-soft: #fbefd9; --ok: #2b7a3d; --ok-soft: #e3f1e5; --info: #3f5a91; --info-soft: #e7ebf5;
  --qr-ink: #0f1a16; --qr-paper: #ffffff;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Roboto Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201d; --raise: #1f2723; --fg: #e3eae6; --muted: #98a59f; --line: #2b3531;
  --accent: #5cbfa3; --accent-fg: #0d1a16; --accent-soft: #1b332d;
  --crit: #f08a7e; --crit-soft: #3a1f1c; --warn: #e5b05c; --warn-soft: #352916; --ok: #7cc98a; --ok-soft: #1b3120; --info: #a6b6e6; --info-soft: #222a40;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --raise: #1f2723; --fg: #e3eae6; --muted: #98a59f; --line: #2b3531;
  --accent: #5cbfa3; --accent-fg: #0d1a16; --accent-soft: #1b332d;
  --crit: #f08a7e; --crit-soft: #3a1f1c; --warn: #e5b05c; --warn-soft: #352916; --ok: #7cc98a; --ok-soft: #1b3120; --info: #a6b6e6; --info-soft: #222a40;
  color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); align-self: center; }
.nav { display: flex; gap: 4px; flex: 1 1 auto; overflow-x: auto; min-width: 0; }
.nav button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; color: var(--fg); }
.nav button:hover { background: var(--raise); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.main { padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; align-content: start; }
.main > * { min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.head .sub { color: var(--muted); font-size: 15.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--raise); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { padding: 4px 10px; font-size: 15px; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .nav button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=month], input:not([type]), select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pill { display: inline-block; font-size: 14px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; background: var(--raise); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--info-soft); color: var(--info); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.kpi .l { font-size: 14px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 14px; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tbl.tall { max-height: 640px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { position: sticky; top: 0; background: var(--surface); font-size: 13.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
tfoot td { font-weight: 700; background: var(--raise); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.banner { border-radius: var(--r); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--info-soft); }
.banner.warn { background: var(--warn-soft); }
.banner.crit { background: var(--crit-soft); }
.banner.ok { background: var(--ok-soft); }
/* Màn hình nhân viên */
.clock { font-family: var(--f-mono); font-weight: 600; font-size: 44px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.slot { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; background: var(--raise); }
.slot.on { border-style: solid; background: var(--surface); }
.slot .l { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.slot .t { font-family: var(--f-mono); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.code-in { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .25em; font-size: 22px; width: 9.5em; text-align: center; }
/* Kết quả quét */
#done { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(10, 16, 14, .45); padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.done-card { width: min(420px, 100%); background: var(--surface); border-radius: 16px; padding: 24px 20px; display: grid; gap: 10px; justify-items: center; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.done-mark { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; font-weight: 700; background: var(--raise); color: var(--muted); }
.done-mark.ok { background: var(--ok-soft); color: var(--ok); }
.done-mark.crit { background: var(--crit-soft); color: var(--crit); }
.done-time { font-family: var(--f-mono); font-size: 40px; font-weight: 600; }
/* Máy QR */
.kiosk { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .kiosk { grid-template-columns: minmax(0, 1fr); } }
.qr-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.qr-paper { background: var(--qr-paper); border-radius: 12px; padding: 14px; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; }
.qr-paper svg { display: block; width: 100%; height: 100%; }
.qr-code { font-family: var(--f-mono); font-size: 30px; font-weight: 600; letter-spacing: .3em; }
.bar { width: min(100%, 460px); height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.feed { display: grid; gap: 0; }
.feed > div { display: flex; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.feed .t { font-family: var(--f-mono); font-variant-numeric: tabular-nums; width: 3.4em; }
.feed .n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
body.kiosk-full .top { display: none; }
body.kiosk-full .main { max-width: none; }
/* Bảng công tháng */
.month td, .month th { padding: 5px 6px; font-size: 14px; }
.month td.d { text-align: center; font-variant-numeric: tabular-nums; min-width: 2.6em; }
.month td.d.late { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.month td.d.half { background: var(--info-soft); color: var(--info); }
.month td.d.off { color: var(--muted); }
.month td.d.io { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.25; min-width: 3.6em; }
.month th.we, .month td.we { background: var(--raise); }
.month td.name { position: sticky; left: 0; background: var(--surface); z-index: 1; font-weight: 600; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; width: min(380px, calc(100% - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 15.5px; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
/* Máy chấm công */
.scan-box { gap: 16px; }
.hit { border-radius: 14px; padding: 28px 20px; display: grid; gap: 8px; justify-items: center; text-align: center; min-height: 230px; align-content: center; background: var(--raise); border: 1px solid var(--line); }
.hit.ok { background: var(--ok-soft); border-color: var(--ok); }
.hit.dup { background: var(--info-soft); border-color: var(--info); }
.hit.bad { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); }
.hit-l { font-size: 26px; font-weight: 700; }
.hit-n { font-size: 34px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.hit-t { font-size: 30px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.hit-t .pill { font-size: 20px; padding: 2px 14px; }
button.hit { width: 100%; font: inherit; color: inherit; cursor: pointer; }
.hit.tap.idle { background: var(--accent-soft); border: 2px dashed var(--accent); }
.hit.tap.idle .hit-l { color: var(--accent); }
.hit.tap:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn.big { font-size: 20px; padding: 12px 28px; }
.scan-in input { flex: 1 1 14em; font-family: var(--f-mono); }
.scan-in input::placeholder { font-family: var(--f-body); }
.mini-qr svg { display: block; width: 44px; height: 44px; border-radius: 4px; }
.cellx { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.face-th { max-width: none; flex: none; width: 40px; height: 40px; border-radius: 8px; object-fit: cover; display: inline-block; vertical-align: middle; background: var(--raise); }
.hit-img { width: 104px; height: 104px; border-radius: 14px; object-fit: cover; border: 3px solid var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.samples { display: flex; flex-wrap: wrap; gap: 10px; }
.sample { position: relative; }
.sample img { width: 88px; height: 88px; border-radius: 10px; object-fit: cover; display: block; }
.sample button { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1; }
details summary { cursor: pointer; }
/* Khung in thẻ: xem trước trang A4 trên màn hình; khi bấm Ctrl+P chỉ in các trang thẻ */
#printDlg { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow: auto; display: grid; grid-template-rows: auto 1fr; }
.pd-bar { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pd-bar kbd { font-family: var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--raise); }
.pd-pages { display: grid; gap: 16px; justify-content: center; padding: 20px 16px 40px; overflow-x: auto; }
.pc-page { width: 210mm; height: 297mm; background: #fff; color: #000; box-shadow: 0 2px 12px rgba(0, 0, 0, .18); display: grid; grid-template-columns: repeat(2, 85.6mm); grid-auto-rows: 54mm; gap: 3mm 6mm; justify-content: center; align-content: center; font-family: Arial, "Be Vietnam Pro", sans-serif; }
.pc-card { border: 0.3mm dashed #999; border-radius: 3mm; padding: 3mm 3.5mm; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: 2mm; overflow: hidden; background: #fff; }
.pc-top { display: flex; justify-content: space-between; font-size: 3.1mm; border-bottom: 0.45mm solid #1c6b5a; padding-bottom: 1mm; color: #1c6b5a; font-weight: 700; }
.pc-body { display: grid; grid-template-columns: 38mm 1fr; gap: 3mm; align-items: center; }
.pc-qr svg { width: 38mm; height: 38mm; display: block; }
.pc-info { font-size: 3.2mm; display: grid; gap: 1mm; color: #333; }
.pc-name { font-size: 4.4mm; font-weight: 700; line-height: 1.2; color: #000; }
.pc-ma { font-family: "Roboto Mono", Consolas, monospace; font-size: 3.5mm; letter-spacing: .3mm; margin-top: 2mm; color: #000; }
@media print {
  @page { size: A4; margin: 0; }
  html, body { background: #fff !important; height: auto; }
  body > *:not(#printDlg) { display: none !important; }
  #printDlg { position: static; overflow: visible; background: #fff; display: block; }
  .pd-bar { display: none !important; }
  .pd-pages { display: block; padding: 0; }
  .pc-page { box-shadow: none; break-after: page; page-break-after: always; }
  .pc-page:last-child { break-after: auto; page-break-after: auto; }
}
</style>

<script>window.ANTAM_ERRLOG = {"web": "Chấm công"};</script>
<script id="antam-errlog">
/* Ghi lỗi trang vào kho dữ liệu của web: errlog/<ngày> {e: {mã: {at, web, bo_phan, who, msg, src, view}}}.
   Agent "Báo cáo lỗi An Tâm" đọc 2 lần mỗi ngày. Chỉ ghi lỗi chưa bắt được, promise bị từ chối và lỗi kho dữ liệu; tối đa 15 lỗi mỗi lần mở trang. */
(function () {
  'use strict';
  const WEB = (window.ANTAM_ERRLOG || {}).web || document.title;
  const seen = new Set(); let n = 0, dbp = null;
  const p2 = x => String(x).padStart(2, '0');
  const stamp = () => { const d = new Date(); return { day: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`, at: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}` }; };
  const DB_CODES = ['unavailable', 'resource_exhausted', 'quota_exceeded', 'revoked', 'capability_disabled', 'transform_error'];
  function who() {
    try {
      const n1 = window.ANTAM_NICK && window.ANTAM_NICK.name; if (n1) return n1;
      const keys = ['dh_me', 'kho.user', 'user']; for (const k of keys) { const v = localStorage.getItem(k); if (v) return String(JSON.parse(v) || '').slice(0, 60); }
    } catch (e) { /* bỏ qua */ }
    return '';
  }
  async function log(msg, src) {
    msg = String(msg || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (!msg || seen.has(msg) || n >= 15) return;
    seen.add(msg); n++;
    try {
      dbp = dbp || (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
      const db = await dbp; if (!db) return;
      const { day, at } = stamp(), id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      let bo = ''; try { bo = localStorage.getItem('antam.app') || ''; } catch (e) { /* bỏ qua */ }
      const rec = { at, web: WEB, bo_phan: bo, who: who(), msg, src: String(src || '').trim().slice(0, 160), view: String(location.hash || '').slice(0, 60) };
      const ref = db.doc('errlog/' + day);
      try { await ref.update({ e: { [id]: rec } }); }
      catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (s.exists) await ref.update({ e: { [id]: rec } }); else await ref.set({ day, e: { [id]: rec } }); } }
    } catch (e) { /* không ghi được lỗi thì thôi, không làm phiền người dùng */ }
  }
  const isDbErr = e => e && typeof e === 'object' && DB_CODES.includes(e.code);
  window.addEventListener('error', ev => {
    if (!ev || !ev.message || /^Script error\.?$/.test(ev.message) || /ResizeObserver loop/.test(ev.message)) return;
    log(ev.message, (ev.filename ? ev.filename.split('/').pop() : '') + (ev.lineno ? ':' + ev.lineno + ':' + (ev.colno || 0) : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev && ev.reason; if (!r) return;
    if (r && r.code === 'declined') return; // người dùng bấm Không khi tải file
    log((r.code ? '[' + r.code + '] ' : '') + (r.message || String(r)), r.stack ? String(r.stack).split('\n')[1] || '' : '');
  });
  const ce = console.error.bind(console);
  console.error = function () {
    ce.apply(console, arguments);
    const a = Array.from(arguments), e = a.find(x => x instanceof Error || isDbErr(x));
    if (e && (isDbErr(e) || e instanceof TypeError || e instanceof ReferenceError || e instanceof SyntaxError)) log((e.code ? '[' + e.code + '] ' : '') + (e.message || String(e)), e.stack ? String(e.stack).split('\n')[1] || '' : 'console.error');
  };
  window.antamLogError = log; // web gọi thêm khi muốn ghi một lỗi đã bắt
})();
</script>

    el.disabled = false; el.textContent = 'Không in được? Tải PDF';
  }
  else if (a === 'nvAdd') { S.f.edit = { ten: '', bp: '', ca: cfg().ca[0].id }; S.f.sureCard = false; render(); const i = $('#eTen'); if (i) i.focus(); }
  else if (a === 'nvEdit') { S.f.edit = Object.assign({ id: arg }, S.nv[arg]); S.f.sureCard = false; render(); window.scrollTo(0, 0); }
  else if (a === 'nvCancel') { S.f.edit = null; render(); }
  else if (a === 'newCard') {
    if (!S.f.sureCard) { S.f.sureCard = true; render(); return; }
    S.f.sureCard = false; const rec = Object.assign({}, S.nv[arg], { ma: newMa(), at: Date.now() });
    try { await saveNv(arg, rec); S.f.edit = Object.assign({ id: arg }, rec); toast('Đã cấp thẻ mới cho ' + rec.ten + '. bấm In thẻ để in lại.'); } catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'bulkAdd') {
    const lines = ($('#bulk').value || '').split('\n').map(s => s.trim()).filter(Boolean); if (!lines.length) { toast('Dán danh sách, mỗi dòng một người.'); return; }
    const c = cfg(), ref = S.db.doc(DP.nv);
    try {
      const s = await ref.get(), cur = clone((s.exists && s.data().a) || {}); let n = 0;
      for (const l of lines) { const [ten, bp, caT] = l.split('|').map(x => (x || '').trim()); if (!ten) continue; const ca = c.ca.find(x => x.ten.toLowerCase() === (caT || '').toLowerCase()) || c.ca[0]; const id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); cur[id] = { ten, bp: bp || '', ca: ca.id, ma: newMa(cur), on: true, at: Date.now() }; n++; }
      await ref.set({ a: cur, at: Date.now() }); S.f.bulk = ''; toast('Đã thêm ' + n + ' nhân viên.'); render();
    } catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'manual') {
    const u = $('#mU').value, d = $('#mD').value, t = $('#mT').value, note = $('#mN').value.trim();
    S.f.mU = u; S.f.mD = d; S.f.mT = t; S.f.mN = note;
    if (!u || !d || !t) { toast('Chọn nhân viên, ngày và giờ.'); return; }
    if (!note) { toast('Ghi lý do chấm tay.'); return; }
    const ms = at(d, t), id = d.replace(/-/g, '') + '-' + u + '-tay' + Date.now().toString(36);
    try { await S.db.doc('cc/' + d.slice(0, 7) + '/p/' + id).set({ d, u, at: ms, src: 'tay', note }); S.f.mT = ''; S.f.mN = ''; toast('Đã thêm lượt chấm tay ' + hm(ms) + ' cho ' + nameOf(u) + '.'); render(); }
    catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'void') {
    if (S.f.sure !== arg) { S.f.sure = arg; render(); return; }
    S.f.sure = ''; const p = S.all.p[arg]; if (!p) return;
    try { await S.db.doc('cc/' + p.d.slice(0, 7) + '/p/' + arg).update({ huy: 'Hủy lúc ' + hm(Date.now()) + ' ' + dm(isoOf(new Date())) }); toast('Đã hủy lượt chấm.'); }
    catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'saveTre') saveSet({ tre: Math.max(0, Math.min(120, +$('#sTre').value || 0)) }, 'Đã lưu.');
  else if (a === 'caAdd') { const e2 = readCa(); e2.push({ id: 'ca' + Date.now().toString(36), ten: 'Ca mới', vao: '08:00', ra: '17:00' }); S.f.ca = e2; render(); }
  else if (a === 'caDel') { const e2 = readCa(), x = e2[+arg]; if (staff(true).some(s => s.ca === x.id)) { toast('Còn nhân viên thuộc ' + x.ten + '. Chuyển họ sang ca khác trước.'); return; } e2.splice(+arg, 1); S.f.ca = e2; render(); }
  else if (a === 'caSave') { const e2 = readCa(); if (e2.some(x => !x.ten.trim() || !x.vao || !x.ra)) { toast('Mỗi ca cần tên, giờ vào và giờ ra.'); return; } await saveSet({ ca: e2 }, 'Đã lưu ca làm việc.'); S.f.ca = null; render(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'nvForm') return; e.preventDefault();
  const ed = S.f.edit, ten = $('#eTen').value.trim(); if (!ten) { toast('Nhập họ tên.'); return; }
  const id = ed.id || 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const rec = { ten, bp: $('#eBp').value.trim(), ca: $('#eCa').value, ma: ed.ma || newMa(), on: ed.id ? $('#eOn').checked : true, at: Date.now() };
  try { await saveNv(id, rec); S.f.edit = null; toast(ed.id ? 'Đã lưu ' + ten + '.' : 'Đã thêm ' + ten + '. Mã thẻ ' + fmtMa(rec.ma) + '.'); render(); }
  catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'snap') { const f = el.files[0]; el.value = ''; if (DEV.mode === 'face' && S.view === 'may') facePunch(f); else readPhoto(f); }
  else if (el.id === 'enrollIn') { const fs = [...el.files]; el.value = ''; enrollAdd(fs); }
  else if (el.id === 'bDate') { S.f.d = el.value || isoOf(new Date()); render(); }
  else if (el.id === 'bMonth') { S.f.m = el.value || isoOf(new Date()).slice(0, 7); render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'bulk') S.f.bulk = e.target.value; });
// Máy đọc mã gõ số rồi Enter vào ô #scan (ô luôn được giữ tiêu điểm ở mục Máy chấm công)
document.addEventListener('keydown', e => {
  if (e.target.id === 'scan' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value; e.target.value = ''; if (!S.f.armed) { S.f.armed = true; keepAwake(true); } scanCode(v, 'the'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#printDlg').hidden) { $('#printDlg').hidden = true; $('#printDlg').innerHTML = ''; } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.f.full) { S.f.full = false; render(); } });
window.addEventListener('hashchange', () => { route(); render(); });
setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = hm(Date.now());
  if (S.view === 'may') { if (S.f.armed) keepAwake(true); if (S.last && S.last.t && Date.now() - S.last.t > 12000 && Date.now() - S.last.t < 13100) render(); focusScan(); } else keepAwake(false);
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.view === 'may' && S.f.armed) { wake = null; keepAwake(true); } });

/* ============ Khởi động ============ */
(async function init() {
  route(); render();
  const c = window.claude;
  const [db, user] = c && c.use ? await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]) : [null, null];
  S.db = db; S.user = user;
  if (user) { try { S.admin = !!(await user.canEdit()); } catch (e) { S.admin = false; } }
  if (db && S.admin) {
    db.doc(DP.set).onSnapshot(s => { S.set = s.exists ? s.data() : null; bump(); }, dbErr);
    db.doc(DP.nv).onSnapshot(s => { S.nv = (s.exists && s.data().a) || {}; S.nvLoaded = true; bump(); }, dbErr);
    db.collection(DP.fc).onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); S.fc = m; bump(); }, dbErr);
  }
  S.ready = true; render();
})();
</script>
