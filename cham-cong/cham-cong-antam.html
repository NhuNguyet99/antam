<title>Chấm công An Tâm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: thanh trên cùng (tên web · menu · tài khoản), vùng chính bên dưới; điện thoại nhân viên là màn chính, máy QR là màn hình lớn đặt ở cửa */

  --accent: #1c6b5a; --accent-fg: #ffffff; --accent-soft: #e0eee8;
  --crit: #b42318; --crit-soft: #fbe8e5; --warn: #9a5b06; --warn-soft: #fbefd9; --ok: #2b7a3d; --ok-soft: #e3f1e5; --info: #3f5a91; --info-soft: #e7ebf5;
  --qr-ink: #0f1a16; --qr-paper: #ffffff;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Roboto Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201d; --raise: #1f2723; --fg: #e3eae6; --muted: #98a59f; --line: #2b3531;
  --accent: #5cbfa3; --accent-fg: #0d1a16; --accent-soft: #1b332d;
  --crit: #f08a7e; --crit-soft: #3a1f1c; --warn: #e5b05c; --warn-soft: #352916; --ok: #7cc98a; --ok-soft: #1b3120; --info: #a6b6e6; --info-soft: #222a40;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --raise: #1f2723; --fg: #e3eae6; --muted: #98a59f; --line: #2b3531;
  --accent: #5cbfa3; --accent-fg: #0d1a16; --accent-soft: #1b332d;
  --crit: #f08a7e; --crit-soft: #3a1f1c; --warn: #e5b05c; --warn-soft: #352916; --ok: #7cc98a; --ok-soft: #1b3120; --info: #a6b6e6; --info-soft: #222a40;
  color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }

p { margin: 0; }

.muted { color: var(--muted); }

.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); align-self: center; }
.nav { display: flex; gap: 4px; flex: 1 1 auto; overflow-x: auto; min-width: 0; }
.nav button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; color: var(--fg); }

.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.main { padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; align-content: start; }
.main > * { min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; }

label.f { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=month], input:not([type]), select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }

.done-card { width: min(420px, 100%); background: var(--surface); border-radius: 16px; padding: 24px 20px; display: grid; gap: 10px; justify-items: center; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }

/* Máy QR */
.kiosk { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .kiosk { grid-template-columns: minmax(0, 1fr); } }
.qr-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.qr-paper { background: var(--qr-paper); border-radius: 12px; padding: 14px; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; }
.qr-paper svg { display: block; width: 100%; height: 100%; }
.qr-code { font-family: var(--f-mono); font-size: 30px; font-weight: 600; letter-spacing: .3em; }
.bar { width: min(100%, 460px); height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.feed { display: grid; gap: 0; }
.feed > div { display: flex; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); }

/* Bảng công tháng */
.month td, .month th { padding: 5px 6px; font-size: 14px; }
.month td.d { text-align: center; font-variant-numeric: tabular-nums; min-width: 2.6em; }
.month td.d.late { background: var(--warn-soft); color: var(--warn); font-weight: 600; }

<script>window.ANTAM_ERRLOG = {"web": "Chấm công"};</script>
<script id="antam-errlog">
/* Ghi lỗi trang vào kho dữ liệu của web: errlog/<ngày> {e: {mã: {at, web, bo_phan, who, msg, src, view}}}.
   Agent "Báo cáo lỗi An Tâm" đọc 2 lần mỗi ngày. Chỉ ghi lỗi chưa bắt được, promise bị từ chối và lỗi kho dữ liệu; tối đa 15 lỗi mỗi lần mở trang. */
(function () {
  'use strict';
  const WEB = (window.ANTAM_ERRLOG || {}).web || document.title;
  const seen = new Set(); let n = 0, dbp = null;
  const p2 = x => String(x).padStart(2, '0');
  const stamp = () => { const d = new Date(); return { day: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`, at: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}` }; };
  const DB_CODES = ['unavailable', 'resource_exhausted', 'quota_exceeded', 'revoked', 'capability_disabled', 'transform_error'];
  function who() {
    try {
      const n1 = window.ANTAM_NICK && window.ANTAM_NICK.name; if (n1) return n1;
      const keys = ['dh_me', 'kho.user', 'user']; for (const k of keys) { const v = localStorage.getItem(k); if (v) return String(JSON.parse(v) || '').slice(0, 60); }
    } catch (e) { /* bỏ qua */ }
    return '';
  }
  async function log(msg, src) {
    msg = String(msg || '').replace(/\s+/g, ' ').trim().slice(0, 300);
    if (!msg || seen.has(msg) || n >= 15) return;
    seen.add(msg); n++;
    try {
      dbp = dbp || (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
      const db = await dbp; if (!db) return;
      const { day, at } = stamp(), id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      let bo = ''; try { bo = localStorage.getItem('antam.app') || ''; } catch (e) { /* bỏ qua */ }
      const rec = { at, web: WEB, bo_phan: bo, who: who(), msg, src: String(src || '').trim().slice(0, 160), view: String(location.hash || '').slice(0, 60) };
      const ref = db.doc('errlog/' + day);
      try { await ref.update({ e: { [id]: rec } }); }
      catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (s.exists) await ref.update({ e: { [id]: rec } }); else await ref.set({ day, e: { [id]: rec } }); } }
    } catch (e) { /* không ghi được lỗi thì thôi, không làm phiền người dùng */ }
  }
  const isDbErr = e => e && typeof e === 'object' && DB_CODES.includes(e.code);
  window.addEventListener('error', ev => {
    if (!ev || !ev.message || /^Script error\.?$/.test(ev.message) || /ResizeObserver loop/.test(ev.message)) return;
    log(ev.message, (ev.filename ? ev.filename.split('/').pop() : '') + (ev.lineno ? ':' + ev.lineno + ':' + (ev.colno || 0) : ''));
  });
  window.addEventListener('unhandledrejection', ev => {
    const r = ev && ev.reason; if (!r) return;
    if (r && r.code === 'declined') return; // người dùng bấm Không khi tải file
    log((r.code ? '[' + r.code + '] ' : '') + (r.message || String(r)), r.stack ? String(r.stack).split('\n')[1] || '' : '');
  });
  const ce = console.error.bind(console);
  console.error = function () {
    ce.apply(console, arguments);
    const a = Array.from(arguments), e = a.find(x => x instanceof Error || isDbErr(x));
    if (e && (isDbErr(e) || e instanceof TypeError || e instanceof ReferenceError || e instanceof SyntaxError)) log((e.code ? '[' + e.code + '] ' : '') + (e.message || String(e)), e.stack ? String(e.stack).split('\n')[1] || '' : 'console.error');
  };
  window.antamLogError = log; // web gọi thêm khi muốn ghi một lỗi đã bắt
})();
</script>

<script id="nick-gate">
(function () {
  'use strict';
  const C = window.NICK_GATE || {}, SITE = C.site || 'site', TITLE = C.title || document.title;
  const KEY = 'ng-' + SITE + '-sess', DAYS = 30, root = document.documentElement;
  root.classList.add('ng-locked');
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/[^a-z0-9._-]/g, '');
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  // mật khẩu băm PBKDF2 (ai được mời vào trang cũng đọc được danh sách tài khoản – không lưu mật khẩu gốc)
  async function hash(salt, pw) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
  }
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sess = { get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }, set(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) { /* trình duyệt chặn lưu */ } } };
  const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const G = { db: null, user: null, owner: false, admin: false, acc: {}, ep: 0, loaded: false, nodb: false, me: null };
  window.ANTAM_NICK = null;

  const gate = document.createElement('div'); gate.id = 'ng-gate'; document.body.appendChild(gate);
  const panel = document.createElement('div'); panel.id = 'ng-panel'; panel.hidden = true; document.body.appendChild(panel);

  function current() {
    const s = sess.get(), a = s && G.acc[s.id];
    return a && a.active !== false && a.pw && s.sig === a.pw.slice(0, 24) && s.exp > Date.now() && (s.iat || 0) >= (G.ep || 0) ? Object.assign({ id: s.id }, a) : null;
  }
  function apply() {
    if (!G.loaded) { drawGate(); return; }
    const me = current();
    if (sess.get() && !me) sess.set(null);
    G.me = me;
    window.ANTAM_NICK = me ? { id: me.id, user: me.user, name: me.name || me.user } : G.owner ? { id: 'owner', user: '', name: 'Chủ trang' } : null;
    const open = !!(me || G.owner);
    root.classList.toggle('ng-locked', !open); gate.hidden = open;
    if (!open) drawGate();
    drawSlot();
    window.dispatchEvent(new Event('antam-nick'));
  }
  function drawGate() {
    const hasAcc = Object.values(G.acc).some(a => a && a.active !== false);
    const state = G.nodb ? 'nodb' : !G.loaded ? 'loading' : hasAcc ? 'form' : 'empty';
    if (gate.dataset.state === state && state === 'form') return; // đang gõ: giữ nguyên ô đăng nhập
    gate.dataset.state = state;
    const body = state === 'nodb' ? '<p>Trang cần mở trên claude.ai khi đã đăng nhập, bằng link chủ trang gửi.</p>'
      : state === 'loading' ? '<p>Đang tải…</p>'
      : state === 'empty' ? '<p>Trang chưa có tài khoản nào. Chủ trang mở trang để tạo tài khoản đăng nhập cho nhân viên.</p>'
      : `<p>Đăng nhập bằng nick và mật khẩu do quản lý cấp.</p>
        <label class="ng-f">Nick<input id="ng-user" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(localStorage.getItem('ng-' + SITE + '-last') || '')}"></label>
        <label class="ng-f">Mật khẩu<input id="ng-pw" type="password" autocomplete="current-password"></label>
        <button class="ng-btn pri" type="submit">Đăng nhập</button><div class="ng-err" id="ng-err" role="alert"></div>
        <p>Quên mật khẩu: nhờ quản lý đặt lại.</p>`;
    gate.innerHTML = `<form class="ng-card" id="ng-form" novalidate><h1>${esc(TITLE)}</h1>${body}</form>`;
    const f = $('#ng-form', gate), u = $('#ng-user', gate), pw = $('#ng-pw', gate);
    if (u) (u.value ? pw : u).focus();
    f.onsubmit = async e => {
      e.preventDefault(); if (!u) return;
      const btn = $('button[type=submit]', f), err = $('#ng-err', f);
      btn.disabled = true; btn.textContent = 'Đang đăng nhập…'; err.textContent = '';
      const hit = Object.entries(G.acc).find(([, a]) => a && a.active !== false && norm(a.user) === norm(u.value));
      const ok = hit && (await hash(hit[1].salt, pw.value)) === hit[1].pw;
      if (!ok) { await new Promise(r => setTimeout(r, 600)); err.textContent = 'Sai nick hoặc mật khẩu.'; btn.disabled = false; btn.textContent = 'Đăng nhập'; pw.select(); return; }
      sess.set({ id: hit[0], sig: hit[1].pw.slice(0, 24), iat: Date.now(), exp: Date.now() + DAYS * 864e5 });
      try { localStorage.setItem('ng-' + SITE + '-last', hit[1].user); } catch (x) { /* trình duyệt chặn lưu */ }
      gate.dataset.state = ''; apply();
    };
  }
  function drawSlot() {
    let host = C.slot && $(C.slot);
    if (!host) { host = $('#ng-fixed') || Object.assign(document.createElement('div'), { id: 'ng-fixed' }); if (!host.parentNode) document.body.appendChild(host); }
    const who = window.ANTAM_NICK;
    host.innerHTML = who ? `<button type="button" class="ng-me" title="Tài khoản đăng nhập">👤 ${esc(who.name)}</button>` : '';
    const b = $('.ng-me', host); if (b) b.onclick = openPanel;
  }

  // ---------- tài khoản của tôi / quản lý tài khoản ----------
  let edit = null;
  function closePanel() { panel.hidden = true; panel.innerHTML = ''; edit = null; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });
  panel.addEventListener('mousedown', e => { if (e.target === panel) closePanel(); });
  function openPanel() { panel.hidden = false; drawPanel(); }
  function drawPanel() {
    if (panel.hidden) return;
    const me = G.me, list = Object.entries(G.acc).filter(([, a]) => a).sort((x, y) => norm(x[1].user) < norm(y[1].user) ? -1 : 1);
    const mine = me ? `<div class="ng-row"><div class="ng-grow"><b>${esc(me.name || me.user)}</b> <span style="color:var(--muted,#5b6862)">· nick ${esc(me.user)}</span></div><button class="ng-btn" type="button" id="ng-out">Đăng xuất</button></div>`
      : `<p>Bạn là <b>chủ trang</b>: vào trang không cần đăng nhập và quản lý được tài khoản.</p>`;
    const mgr = G.admin ? `<hr style="border:0;border-top:1px solid var(--line,#dce2dc);margin:4px 0">
      <div class="ng-row"><h2 class="ng-grow" style="margin:0;font-size:1.1em">Tài khoản đăng nhập</h2><button class="ng-btn sm" type="button" id="ng-add">+ Thêm tài khoản</button><button class="ng-btn sm" type="button" id="ng-epoch" title="Bắt mọi người đăng nhập lại">Đăng xuất tất cả máy</button></div>
      ${edit ? `<form id="ng-edit" class="ng-grid" novalidate style="background:var(--raise,var(--sunk,#f7f9f6));padding:12px;border-radius:10px">
          <label class="ng-f">Nick<input id="ng-e-user" value="${esc(edit.user)}" autocapitalize="none" spellcheck="false" maxlength="40"></label>
          <label class="ng-f">Họ tên<input id="ng-e-name" value="${esc(edit.name)}" maxlength="60"></label>
          <label class="ng-f">${edit.id ? 'Mật khẩu mới (để trống = giữ nguyên)' : 'Mật khẩu (ít nhất 4 ký tự)'}<input id="ng-e-pw" type="text" autocomplete="new-password"></label>
          <label class="ng-chk"><input type="checkbox" id="ng-e-on"${edit.active !== false ? ' checked' : ''}> Đang dùng (bỏ tích = khóa tài khoản)</label>
          <div class="ng-row" style="grid-column:1/-1"><button class="ng-btn pri" type="submit">Lưu tài khoản</button><button class="ng-btn" type="button" id="ng-e-x">Hủy</button><span class="ng-err" id="ng-e-err"></span></div>
        </form>` : ''}
      <div class="ng-tbl"><table><thead><tr><th>Nick</th><th>Họ tên</th><th>Trạng thái</th><th>Sửa lúc</th><th></th></tr></thead><tbody>
        ${list.length ? list.map(([id, a]) => `<tr class="${a.active === false ? 'off' : ''}"><td><b>${esc(a.user)}</b></td><td>${esc(a.name)}</td><td>${a.active === false ? 'Đã khóa' : 'Đang dùng'}</td><td>${esc(a.at || '')}</td><td><button class="ng-btn sm" type="button" data-ng-edit="${esc(id)}">Sửa</button></td></tr>`).join('')
          : '<tr><td colspan="5" style="color:var(--muted,#5b6862)">Chưa có tài khoản nào. Bấm “+ Thêm tài khoản”.</td></tr>'}
      </tbody></table></div>
      <p>Mỗi người một nick. Khóa tài khoản hoặc đổi mật khẩu thì máy đang đăng nhập bằng nick đó bị đăng xuất ngay.</p>` : '';
    panel.innerHTML = `<div class="ng-card" role="dialog" aria-modal="true"><div class="ng-row"><h1 class="ng-grow">Tài khoản · ${esc(TITLE)}</h1><button class="ng-btn sm" type="button" id="ng-x">Đóng</button></div>${mine}${mgr}</div>`;
    $('#ng-x', panel).onclick = closePanel;
    const out = $('#ng-out', panel); if (out) out.onclick = () => { sess.set(null); closePanel(); apply(); };
    const add = $('#ng-add', panel); if (add) add.onclick = () => { edit = { id: '', user: '', name: '', active: true }; drawPanel(); const i = $('#ng-e-user', panel); if (i) i.focus(); };
    panel.querySelectorAll('[data-ng-edit]').forEach(b => b.onclick = () => { const a = G.acc[b.dataset.ngEdit]; edit = Object.assign({ id: b.dataset.ngEdit }, a); drawPanel(); });
    const ep = $('#ng-epoch', panel); if (ep) ep.onclick = async () => {
      if (ep.dataset.sure !== '1') { ep.dataset.sure = '1'; ep.textContent = 'Bấm lần nữa để đăng xuất tất cả'; return; }
      try { await save(null, null, Date.now()); ep.textContent = 'Đã đăng xuất tất cả máy'; } catch (e) { ep.textContent = 'Không lưu được: ' + (e.message || e.code); }
    };
    const f = $('#ng-edit', panel); if (f) {
      $('#ng-e-x', panel).onclick = () => { edit = null; drawPanel(); };
      f.onsubmit = async e => {
        e.preventDefault();
        const err = $('#ng-e-err', panel), user = $('#ng-e-user', panel).value.trim(), name = $('#ng-e-name', panel).value.trim(), pw = $('#ng-e-pw', panel).value, on = $('#ng-e-on', panel).checked;
        const dup = Object.entries(G.acc).some(([id, a]) => a && id !== edit.id && norm(a.user) === norm(user));
        const bad = !norm(user) ? 'Nhập nick (chữ, số, dấu chấm, gạch dưới).' : dup ? 'Nick này đã có người dùng.' : (!edit.id || pw) && pw.length < 4 ? 'Mật khẩu cần ít nhất 4 ký tự.' : '';
        if (bad) { err.textContent = bad; return; }
        const id = edit.id || rid('a'), old = G.acc[id] || {};
        const rec = { user: norm(user), name, active: on, at: nowStr(), salt: old.salt || '', pw: old.pw || '' };
        if (pw) { rec.salt = rid('s'); rec.pw = await hash(rec.salt, pw); }
        try { await save(id, rec); edit = null; drawPanel(); } catch (x) { err.textContent = 'Không lưu được: ' + (x.message || x.code) + (x.code === 'invalid_argument' ? ' (chỉ chủ trang / Editor sửa được tài khoản)' : ''); }
      };
    }
  }
  async function save(id, rec, ep) {
    const ref = G.db.doc('auth/accounts'), s = await ref.get(), cur = s.exists ? s.data() : { a: {} };
    const next = { a: Object.assign({}, cur.a || {}), ep: cur.ep || 0 };
    if (id) next.a[id] = rec;
    if (ep) next.ep = ep;
    await ref.set(next);
  }

  // ---------- khởi động ----------
  (async function boot() {
    drawGate();
    const c = window.claude;
    const [db, user] = c && c.use ? await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]) : [null, null];
    G.db = db; G.user = user;
    if (!db) { G.nodb = true; G.loaded = true; gate.dataset.state = ''; drawGate(); return; }
    if (user) {
      try { G.owner = !!(await user.isOwner()); } catch (e) { /* không rõ */ }
      try { G.admin = !!(await user.canEdit()); } catch (e) { /* không rõ */ }
    }
    db.doc('auth/accounts').onSnapshot(s => {
      const d = s.exists ? s.data() : {};
      G.acc = d.a || {}; G.ep = d.ep || 0; G.loaded = true;
      apply(); drawPanel();
    }, () => { G.loaded = true; apply(); });
  })();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ============ Dữ liệu (kho dữ liệu chung của trang) ============
   set/app            {link, ca: [{id, ten, vao, ra}], tre, p, gan: {mã tài khoản: mã ca}}  – cài đặt (quản lý sửa)
   cfg/secret         {k}  – khóa sinh mã QR, chỉ quản lý đọc được
   cc/<yyyy-mm>/p/<id> {d, u, nm, at, ts, tc, src, note, by}  – một lượt quét (nhân viên ghi)
   ccv/<yyyy-mm>/v/<id> {st, t, why, u, d, vAt, lech}  – kết quả xác nhận (chỉ máy QR / quản lý ghi)
   auth/accounts      tài khoản nick (khối đăng nhập dùng chung An Tâm)
   Mã QR = link trang + "#cc-<số khung giờ>-<mã 6 ký tự>", mã đổi theo chu kỳ p giây (HMAC từ khóa bí mật). */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); };
const hm = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hms = ms => { const d = new Date(ms); return hm(ms) + ':' + pad(d.getSeconds()); };
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const dmy = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const DOW = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const nextMonth = m => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7), 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const daysIn = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
const at = (iso, t) => { const d = parseISO(iso); const [h, mi] = String(t || '00:00').split(':').map(Number); d.setHours(h || 0, mi || 0, 0, 0); return d.getTime(); };
const ls = { get(k, d) { try { const v = localStorage.getItem('cc.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('cc.' + k, JSON.stringify(v)); } catch (e) { /* trình duyệt chặn lưu */ } } };
const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const DEF = { link: '', p: 30, tre: 10, gan: {}, ca: [{ id: 'hc', ten: 'Hành chính', vao: '08:00', ra: '17:00' }, { id: 'ngay', ten: 'Ca ngày', vao: '07:00', ra: '19:00' }, { id: 'dem', ten: 'Ca đêm', vao: '19:00', ra: '07:00' }] };
const VIEWS = [['cham', 'Chấm công', 0], ['qr', 'Máy QR', 1], ['bang-cong', 'Bảng công', 1], ['cai-dat', 'Cài đặt', 1]];

const S = {
  db: null, user: null, admin: false, ready: false, set: null, acc: {}, secret: null, view: 'cham', f: {},
  mine: { m: '', p: {}, v: {}, subs: [] }, all: { m: '', p: {}, v: {}, subs: [], known: null, seen: {} }, pending: null, last: null, verifying: new Set(), codes: new Map(),
};
const cfg = () => { const s = S.set || {}; return { link: s.link || '', p: +s.p || DEF.p, tre: s.tre == null ? DEF.tre : +s.tre, gan: s.gan || {}, ca: (s.ca && s.ca.length ? s.ca : DEF.ca) }; };
const me = () => window.ANTAM_NICK;
const staff = () => Object.entries(S.acc).filter(([, a]) => a && a.active !== false).map(([id, a]) => ({ id, user: a.user, name: a.name || a.user })).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
const nameOf = id => { const a = S.acc[id]; return a ? (a.name || a.user) : 'Tài khoản đã xóa'; };
const caOf = id => { const c = cfg(); return c.ca.find(x => x.id === c.gan[id]) || c.ca[0]; };

/* ============ Mã chấm công ============ */
async function hmacCode(slot) {
  if (!S.secret) return null;
  const key = S.secret + '|' + slot; if (S.codes.has(key)) return S.codes.get(key);
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(S.secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const b = new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode('cc:' + slot)));
  let c = ''; for (let i = 0; i < 6; i++) c += ALPH[b[i] % ALPH.length];
  if (S.codes.size > 2000) S.codes.clear();
  S.codes.set(key, c); return c;
}
const parseHash = h => { const m = String(h || '').match(/^#?cc-([0-9a-z]+)-([0-9a-z]{6})$/i); return m ? { ts: parseInt(m[1], 36), tc: m[2].toUpperCase() } : null; };
// Xác nhận một lượt quét (máy QR hoặc trang quản lý đang mở)
async function judge(p, seen) {
  if (p.src === 'tay') return { st: 'tay', t: p.at };
  const P = cfg().p * 1000, ref = seen || p.at, cur = Math.floor(ref / P);
  let slot = null;
  if (p.ts != null && Number.isFinite(p.ts)) { if (await hmacCode(p.ts) === p.tc) slot = p.ts; }
  else { for (let s = cur + 1; s >= cur - 8 && slot == null; s--) if (await hmacCode(s) === p.tc) slot = s; if (slot == null) for (let s = cur - 9; s >= cur - 240 && slot == null; s--) if (await hmacCode(s) === p.tc) slot = s; }
  if (slot == null) return { st: 'sai', why: 'Mã không đúng' };
  const age = ref - slot * P;
  if (age > 150000 || age < -45000) return { st: 'het', why: 'Mã đã hết hạn (quét sau ' + Math.round(age / 60000) + ' phút)' };
  const lech = !!seen && Math.abs(seen - p.at) > 180000;
  return { st: 'ok', t: lech ? seen : p.at, lech };
}
async function verifyAll() {
  if (!S.admin || !S.secret || !S.db) return;
  const A = S.all;
  for (const [id, p] of Object.entries(A.p)) {
    if (A.v[id] || S.verifying.has(id)) continue;
    S.verifying.add(id);
    try {
      const r = await judge(p, A.seen[id]);
      const m = p.d.slice(0, 7);
      await S.db.doc('ccv/' + m + '/v/' + id).set(Object.assign({ u: p.u, d: p.d, vAt: Date.now() }, r));
    } catch (e) { S.verifying.delete(id); console.warn(e); }
  }
}

/* ============ Đọc dữ liệu ============ */
function subMine(m) {
  const u = me(); if (!S.db || !u || u.id === 'owner') return;
  if (S.mine.m === m + '|' + u.id) return;
  S.mine.subs.forEach(f => { try { f(); } catch (e) { /* bỏ qua */ } });
  S.mine = { m: m + '|' + u.id, p: {}, v: {}, subs: [] };
  [m, nextMonth(m)].forEach(mm => {
    S.mine.subs.push(S.db.collection('cc/' + mm + '/p').where('u', '==', u.id).onSnapshot(q => { q.docs.forEach(d => { S.mine.p[d.id] = d.data(); }); bump(); }, dbErr));
    S.mine.subs.push(S.db.collection('ccv/' + mm + '/v').where('u', '==', u.id).onSnapshot(q => { q.docs.forEach(d => { S.mine.v[d.id] = d.data(); }); bump(); }, dbErr));
  });
}
function subAll(m) {
  if (!S.db || !S.admin || S.all.m === m) return;
  S.all.subs.forEach(f => { try { f(); } catch (e) { /* bỏ qua */ } });
  const A = S.all = { m, p: {}, v: {}, subs: [], known: {}, seen: {} };
  [m, nextMonth(m)].forEach(mm => {
    let first = true;
    A.subs.push(S.db.collection('cc/' + mm + '/p').onSnapshot(q => {
      const now = Date.now(), ids = new Set();
      q.docs.forEach(d => { ids.add(d.id); if (!first && !(d.id in A.p)) A.seen[d.id] = now; A.p[d.id] = d.data(); });
      Object.keys(A.p).forEach(id => { if (A.p[id].d.slice(0, 7) === mm && !ids.has(id)) delete A.p[id]; });
      first = false; bump(); verifyAll();
    }, dbErr));
    A.subs.push(S.db.collection('ccv/' + mm + '/v').onSnapshot(q => { q.docs.forEach(d => { A.v[d.id] = d.data(); }); bump(); }, dbErr));
  });
}
function dbErr(e) { console.error(e); }

/* ============ Tính công ============ */
// Gán lượt quét hợp lệ vào ngày công theo ca của từng người (ca đêm: giờ ra sáng hôm sau tính cho ngày hôm trước)

function workDays(P, V, filterU) {
  const out = {}, c = cfg();

    const v = V[id]; if (!v || !(v.st === 'ok' || v.st === 'tay')) continue;
    if (filterU && p.u !== filterU) continue;
    const t = v.t || p.at, ca = caOf(p.u), d0 = isoOf(new Date(t));
    let D = d0; for (const cand of [d0, addDays(d0, -1)]) { const w = shiftWin(cand, ca); if (t >= w.from && t <= w.to) { D = cand; break; } }
    const k = p.u + '|' + D; (out[k] = out[k] || { u: p.u, D, ca, ts: [] }).ts.push(t);

  Object.values(out).forEach(r => {
    r.ts.sort((a, b) => a - b); const w = shiftWin(r.D, r.ca);
    r.vao = r.ts[0]; const last = r.ts[r.ts.length - 1]; r.ra = r.ts.length > 1 && last - r.vao >= 30 * 6e4 ? last : null;
    r.gio = r.ra ? (r.ra - r.vao) / 36e5 : 0;

}

  : v.st === 'tay' ? '<span class="pill info">Chấm tay</span>' : v.st === 'huy' ? '<span class="pill">Đã hủy</span>' : '<span class="pill crit">' + (v.st === 'het' ? 'Hết hạn' : 'Mã sai') + '</span>';

  const now = Date.now(), m = isoOf(new Date()).slice(0, 7), sel = S.f.mm || m;
  subMine(sel);

    '<p class="small muted">Mã QR tự đổi mỗi ' + cfg().p + ' giây nên phải quét tại chỗ. Nếu camera không mở được link, dùng một trong hai cách dưới.</p>' +

/* ---- Chấm công ---- */
async function punch(ts, tc, src) {
  const u = me();
  if (!u || u.id === 'owner') { showDone('crit', 'Chưa đăng nhập nick', 'Đăng nhập bằng nick của bạn rồi quét lại mã.'); return; }
  const recent = Object.values(S.mine.p).filter(p => p.u === u.id);
  if (recent.some(p => p.tc === tc && (ts == null || p.ts === ts))) { showDone('', 'Mã này đã quét rồi', 'Bạn đã chấm công bằng mã này. Mỗi mã chỉ tính một lần.'); return; }
  const last = recent.sort((a, b) => b.at - a.at)[0];
  if (last && Date.now() - last.at < 60000) { showDone('', 'Bạn vừa chấm công', 'Lượt trước lúc ' + hms(last.at) + '. Đợi 1 phút nếu muốn quét lại.'); return; }
  const t = Date.now(), d = isoOf(new Date(t)), id = d.replace(/-/g, '') + '-' + u.id + '-' + t.toString(36);
  const rec = { d, u: u.id, nm: u.name, at: t, ts: ts == null ? null : ts, tc, src };
  showDone('', 'Đang ghi…', '');
  try {
    await S.db.doc('cc/' + d.slice(0, 7) + '/p/' + id).set(rec);
    S.mine.p[id] = rec; S.last = { id, at: t };
    showDone('wait', hm(t), 'Đã ghi giờ chấm công. Đang chờ máy QR xác nhận…');
  } catch (e) {
    showDone('crit', 'Chưa ghi được', e && e.code === 'invalid_argument' ? 'Tài khoản claude.ai của máy này chưa có quyền ghi. Nhờ quản lý chia sẻ trang với quyền Contributor.' : 'Lỗi kết nối: ' + ((e && e.message) || 'không rõ') + '. Thử quét lại.');
  }
}
function showDone(kind, big, msg) {
  const host = $('#done'); host.hidden = false; host.dataset.kind = kind;
  const mark = kind === 'ok' ? '✓' : kind === 'crit' ? '!' : kind === 'wait' ? '…' : 'i';
  host.innerHTML = '<div class="done-card" role="dialog" aria-modal="true" aria-live="assertive"><div class="done-mark ' + (kind === 'ok' ? 'ok' : kind === 'crit' ? 'crit' : '') + '">' + mark + '</div>' +
    (/^\d\d:\d\d$/.test(big) ? '<div class="done-time">' + esc(big) + '</div>' : '<h2>' + esc(big) + '</h2>') + '<p class="muted">' + esc(msg) + '</p><button class="btn pri" data-act="closeDone">Xong</button></div>';
}
function watchLast() {
  const L = S.last; if (!L) return;
  const v = S.mine.v[L.id], host = $('#done'); if (!v || host.hidden || host.dataset.kind !== 'wait') return;
  if (v.st === 'ok') showDone('ok', hm(v.t || L.at), 'Đã xác nhận. ' + (todayLabel(L.id)));
  else showDone('crit', v.st === 'het' ? 'Mã đã hết hạn' : 'Mã không hợp lệ', (v.why || '') + '. Quét lại mã đang hiện trên máy QR.');
  S.last = null;
}
function todayLabel(id) { const u = me(); if (!u) return ''; const wd = workDays(S.mine.p, S.mine.v, u.id), r = Object.values(wd).find(x => x.ts.includes((S.mine.v[id] || {}).t || (S.mine.p[id] || {}).at)); return r ? (r.ts.length === 1 ? 'Giờ vào ' + hm(r.vao) + '.' : 'Giờ ra ' + hm(r.ts[r.ts.length - 1]) + ' · đã làm ' + fmtH((r.ts[r.ts.length - 1] - r.vao) / 36e5) + '.') : ''; }

  S.view = 'cham'; subMine(isoOf(new Date()).slice(0, 7));

async function readPhoto(file) {
  if (!file) return;
  if (!window.jsQR) { toast('Chưa tải xong bộ đọc mã QR. Đợi vài giây rồi thử lại.'); return; }
  showDone('', 'Đang đọc mã…', '');
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, c.width, c.height);
    const img = g.getImageData(0, 0, c.width, c.height), r = window.jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    const t = r && parseHash((r.data.match(/#cc-[0-9a-z]+-[0-9a-z]{6}/i) || [''])[0]);
    if (!t) { showDone('crit', 'Không đọc được mã', 'Chụp gần hơn, đủ sáng, để mã QR nằm trọn trong ảnh.'); return; }
    punch(t.ts, t.tc, 'anh');
  } catch (e) { showDone('crit', 'Không đọc được ảnh', (e && e.message) || ''); }
}

let qrSlot = -1;
async function drawQr() {
  const box = $('#qrPaper'); if (!box || !S.secret) return;
  const c = cfg(), P = c.p * 1000, now = Date.now(), slot = Math.floor(now / P);
  const bar = $('#qrBar'); if (bar) bar.style.width = Math.max(0, 100 - ((now % P) / P) * 100) + '%';
  if (slot === qrSlot && box.firstChild) return;
  qrSlot = slot;
  const code = await hmacCode(slot), url = (c.link || 'https://claude.ai/').split('#')[0] + '#cc-' + slot.toString(36) + '-' + code.toLowerCase();
  if (!window.qrcode) { box.innerHTML = '<p class="muted">Đang tải bộ tạo mã QR…</p>'; qrSlot = -1; return; }
  const q = window.qrcode(0, 'M'); q.addData(url); q.make();

  box.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#ffffff"/><path d="' + d + '" fill="#0f1a16"/></svg>';
  const ce = $('#qrCode'); if (ce) ce.textContent = code;
}
let wake = null;

  const wd = workDays(S.all.p, S.all.v), list = staff(), now = Date.now();
  const rows = list.map(s => { const r = wd[s.id + '|' + D], ca = caOf(s.id), w = shiftWin(D, ca); return { s, r, ca, w }; });
  const st = x => x.r ? (x.r.ra ? '<span class="pill ok">Đã về</span>' : '<span class="pill info">Đang làm</span>') : now > x.w.a + cfg().tre * 6e4 && now < x.w.b ? '<span class="pill crit">Chưa chấm</span>' : '<span class="pill">Chưa chấm</span>';
  const n = rows.filter(x => x.r).length, late = rows.filter(x => x.r && x.r.muonX).length;
  return '<div class="kpis">' + kpi('Đã chấm công', n + '/' + list.length, 'người') + kpi('Đi muộn', late, 'quá ' + cfg().tre + ' phút') + kpi('Chưa chấm', list.length - n, '') + '</div>' +
    (list.length ? '<div class="tbl"><table><thead><tr><th>Nhân viên</th><th>Ca</th><th>Vào</th><th>Ra</th><th class="n">Giờ làm</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody>' +
      rows.map(x => '<tr><td><b>' + esc(x.s.name) + '</b> <span class="muted small">' + esc(x.s.user) + '</span></td><td>' + esc(x.ca.ten) + ' <span class="muted small">' + esc(x.ca.vao) + '–' + esc(x.ca.ra) + '</span></td><td class="mono">' + (x.r ? hm(x.r.vao) : '') + '</td><td class="mono">' + (x.r && x.r.ra ? hm(x.r.ra) : '') + '</td><td class="n">' + (x.r && x.r.gio ? (Math.round(x.r.gio * 10) / 10).toLocaleString('vi-VN') : '') + '</td><td>' + st(x) + '</td><td>' + (x.r && x.r.muonX ? '<span class="pill warn">Muộn ' + x.r.muon + '′</span> ' : '') + (x.r && x.r.somX ? '<span class="pill warn">Về sớm ' + x.r.som + '′</span>' : '') + '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="card"><div class="empty"><h2>Chưa có nhân viên</h2><p>Tạo nick cho từng nhân viên ở nút tài khoản góc trên bên phải. Mỗi nick là một người trong bảng công.</p></div></div>');
}
function monthData(m) {
  const wd = workDays(S.all.p, S.all.v), list = staff(), n = daysIn(m);
  return list.map(s => {
    const days = []; let cong = 0, gio = 0, muon = 0, phut = 0, thieu = 0;
    for (let i = 1; i <= n; i++) { const D = m + '-' + pad(i), r = wd[s.id + '|' + D]; days.push(r || null); if (r) { cong += r.ra ? 1 : 0.5; gio += r.gio; if (r.muonX) { muon++; phut += r.muon; } if (!r.ra) thieu++; } }
    return { s, days, cong, gio, muon, phut, thieu };
  });
}
function bMonth(m) {
  const data = monthData(m), n = daysIn(m), we = i => [0, 6].includes(new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, i).getDay());
  const cell = (r, i) => { const c = we(i) ? ' we' : ''; if (!r) return '<td class="d off' + c + '">·</td>'; const t = r.ra ? (Math.round(r.gio * 10) / 10).toLocaleString('vi-VN') : 'V'; return '<td class="d' + (r.muonX ? ' late' : !r.ra ? ' half' : '') + c + '" title="' + dm(r.D) + ': vào ' + hm(r.vao) + (r.ra ? ', ra ' + hm(r.ra) : ', chưa có giờ ra') + (r.muonX ? ', muộn ' + r.muon + ' phút' : '') + '">' + t + '</td>'; };
  return '<p class="small muted">Ô ghi số giờ làm. <span class="pill warn">vàng</span> đi muộn, <span class="pill info">V</span> chỉ có giờ vào (tính nửa công). Rê chuột vào ô để xem giờ vào, ra.</p>' +
    (data.length ? '<div class="tbl tall"><table class="month"><thead><tr><th>Nhân viên</th>' + Array.from({ length: n }, (_, k) => '<th class="c' + (we(k + 1) ? ' we' : '') + '">' + (k + 1) + '<br><span style="font-weight:400">' + DOW[new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, k + 1).getDay()] + '</span></th>').join('') + '<th class="n">Công</th><th class="n">Giờ</th><th class="n">Muộn</th></tr></thead><tbody>' +
      data.map(x => '<tr><td class="name">' + esc(x.s.name) + '</td>' + x.days.map((r, k) => cell(r, k + 1)).join('') + '<td class="n"><b>' + String(x.cong).replace('.', ',') + '</b></td><td class="n">' + (Math.round(x.gio * 10) / 10).toLocaleString('vi-VN') + '</td><td class="n">' + (x.muon ? x.muon + ' (' + x.phut + '′)' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Chưa có nhân viên.</div>');
}
function bScans(D) {
  const list = Object.entries(S.all.p).filter(([, p]) => p.d === D).sort((a, b) => b[1].at - a[1].at), f = S.f, sl = staff();
  return '<div class="card"><h2>Chấm công tay</h2><p class="small muted">Dùng khi nhân viên quên quét hoặc điện thoại hỏng. Lượt chấm tay ghi rõ người nhập.</p>' +
    '<div class="row"><label class="f">Nhân viên<select id="mU">' + sl.map(s => '<option value="' + esc(s.id) + '"' + (f.mU === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></label><label class="f">Ngày<input type="date" id="mD" value="' + (f.mD || D) + '"></label><label class="f">Giờ<input type="time" id="mT" value="' + (f.mT || '') + '"></label><label class="f grow">Lý do<input id="mN" value="' + esc(f.mN || '') + '" placeholder="Ví dụ: quên quét lúc về"></label><button class="btn pri" data-act="manual" style="align-self:flex-end">Thêm</button></div></div>' +
    (list.length ? '<div class="tbl tall"><table><thead><tr><th>Giờ</th><th>Nhân viên</th><th>Cách</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead><tbody>' +
      list.map(([id, p]) => { const v = S.all.v[id]; return '<tr><td class="mono">' + hms(v && v.t || p.at) + '</td><td>' + esc(nameOf(p.u) || p.nm) + '</td><td>' + esc(SRC[p.src] || p.src) + '</td><td>' + stPill(v) + '</td><td class="small">' + esc([v && v.why, p.note, p.by ? 'nhập bởi ' + p.by : ''].filter(Boolean).join(' · ')) + '</td><td>' + (v && v.st !== 'huy' ? '<button class="btn sm danger" data-act="void" data-arg="' + esc(id) + '">' + (f.sure === id ? 'Bấm lần nữa để hủy' : 'Hủy lượt') + '</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">Không có lượt quét nào ngày ' + dmy(D) + '.</div>');
}

/* ---- Cài đặt ---- */
function vSet() {
  if (!S.admin) return '<div class="banner warn"><span>Chỉ quản lý sửa được cài đặt.</span></div>';
  const c = cfg(), e = S.f.ca || c.ca.map(x => Object.assign({}, x)); S.f.ca = e;
  return '<div class="head"><div><h1>Cài đặt</h1><div class="sub">Link trang, ca làm việc và ca của từng nhân viên</div></div></div>' +
    '<div class="grid2"><div class="card"><h2>Link trang</h2><p class="small muted">Mã QR mở link này. Lấy ở nút Chia sẻ › Sao chép link của trang. Trang cần chia sẻ cho nhân viên với quyền Contributor để ghi được giờ chấm công.</p>' +
    '<label class="f">Link<input id="sLink" value="' + esc(c.link) + '" placeholder="https://claude.ai/artifact/…"></label>' +
    '<div class="row"><label class="f">Cho phép trễ (phút)<input type="number" id="sTre" min="0" max="120" value="' + c.tre + '"></label><label class="f">Mã QR đổi sau (giây)<input type="number" id="sP" min="15" max="300" value="' + c.p + '"></label></div>' +
    '<div class="row"><button class="btn pri" data-act="saveGen">Lưu</button></div></div>' +
    '<div class="card"><h2>Ca làm việc</h2><div class="tbl"><table><thead><tr><th>Tên ca</th><th>Vào</th><th>Ra</th><th></th></tr></thead><tbody>' +
    e.map((x, i) => '<tr><td><input id="caT' + i + '" value="' + esc(x.ten) + '" style="width:9em"></td><td><input type="time" id="caV' + i + '" value="' + esc(x.vao) + '"></td><td><input type="time" id="caR' + i + '" value="' + esc(x.ra) + '"></td><td>' + (e.length > 1 ? '<button class="btn sm danger" data-act="caDel" data-arg="' + i + '">Xóa</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="small muted">Giờ ra nhỏ hơn giờ vào là ca qua đêm: giờ ra sáng hôm sau tính cho ngày bắt đầu ca.</p><div class="row"><button class="btn" data-act="caAdd">+ Thêm ca</button><button class="btn pri" data-act="caSave">Lưu ca</button></div></div></div>' +
    '<div class="card"><div class="row"><h2 class="grow">Nhân viên và ca</h2><button class="btn" data-act="accounts">Thêm / sửa nick nhân viên</button></div>' +
    (staff().length ? '<div class="tbl"><table><thead><tr><th>Nhân viên</th><th>Nick</th><th>Ca</th></tr></thead><tbody>' + staff().map(s => '<tr><td><b>' + esc(s.name) + '</b></td><td class="mono">' + esc(s.user) + '</td><td><select data-gan="' + esc(s.id) + '" aria-label="Ca của ' + esc(s.name) + '">' + c.ca.map(x => '<option value="' + esc(x.id) + '"' + (caOf(s.id).id === x.id ? ' selected' : '') + '>' + esc(x.ten) + ' ' + esc(x.vao) + '–' + esc(x.ra) + '</option>').join('') + '</select></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty">Chưa có nick nào. Bấm “Thêm / sửa nick nhân viên”, mỗi nhân viên một nick và mật khẩu.</div>') + '</div>' +
    '<div class="card"><h2>Khóa mã QR</h2><p class="small muted">Đổi khóa khi nghi có người làm giả mã. Các mã cũ hết hiệu lực ngay; lượt quét đã xác nhận giữ nguyên.</p><div class="row"><button class="btn danger" data-act="newKey">' + (S.f.sureKey ? 'Bấm lần nữa để đổi khóa' : 'Đổi khóa mã QR') + '</button></div></div>';
}
function readCa() { const e = S.f.ca || []; return e.map((x, i) => ({ id: x.id, ten: ($('#caT' + i) || {}).value || x.ten, vao: ($('#caV' + i) || {}).value || x.vao, ra: ($('#caR' + i) || {}).value || x.ra })); }
async function saveSet(patch, msg) {
  try { const ref = S.db.doc('set/app'), s = await ref.get(); if (s.exists) await ref.update(patch); else await ref.set(Object.assign({}, DEF, patch)); toast(msg); }
  catch (e) { toast('Chưa lưu được: ' + ((e && e.message) || 'lỗi kết nối')); }
}
async function ensureSecret() {
  if (!S.admin || S.secret) return;
  try {
    const ref = S.db.doc('cfg/secret'), s = await ref.get();
    if (s.exists && s.data().k) { S.secret = s.data().k; }
    else { const b = crypto.getRandomValues(new Uint8Array(32)); S.secret = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join(''); await ref.set({ k: S.secret, at: Date.now() }); }
    bump(); verifyAll();
  } catch (e) { console.warn(e); }
}

/* ---- Xuất Excel ---- */
async function exportX() {
  if (!window.XLSX) { toast('Chưa tải xong bộ tạo Excel.'); return; }
  const dl = await window.claude?.use?.('downloads'); if (!dl) { toast('Trang này chưa được phép tải file xuống.'); return; }
  const f = S.f, m = f.tab === 'thang' ? f.m : (f.d || isoOf(new Date())).slice(0, 7), wb = XLSX.utils.book_new();
  const add = (t, rows) => { const ws = XLSX.utils.aoa_to_sheet(rows); XLSX.utils.book_append_sheet(wb, ws, t); };
  const data = monthData(m), n = daysIn(m);
  add('Bảng công ' + m.slice(5) + '-' + m.slice(0, 4), [['Nhân viên', 'Nick', ...Array.from({ length: n }, (_, k) => k + 1), 'Ngày công', 'Tổng giờ', 'Số lần muộn', 'Phút muộn', 'Thiếu giờ ra']].concat(
    data.map(x => [x.s.name, x.s.user, ...x.days.map(r => r ? (r.ra ? Math.round(r.gio * 10) / 10 : 'V') : ''), x.cong, Math.round(x.gio * 10) / 10, x.muon, x.phut, x.thieu])));
  const det = []; data.forEach(x => x.days.forEach(r => { if (r) det.push([x.s.name, dmy(r.D), r.ca.ten, hm(r.vao), r.ra ? hm(r.ra) : '', Math.round(r.gio * 100) / 100, r.muonX ? r.muon : 0, r.somX ? r.som : 0]); }));
  add('Chi tiết', [['Nhân viên', 'Ngày', 'Ca', 'Giờ vào', 'Giờ ra', 'Giờ làm', 'Muộn (phút)', 'Về sớm (phút)']].concat(det));
  add('Lượt quét', [['Ngày', 'Giờ', 'Nhân viên', 'Cách', 'Trạng thái', 'Ghi chú']].concat(Object.entries(S.all.p).filter(([, p]) => p.d.slice(0, 7) === m).sort((a, b) => a[1].at - b[1].at).map(([id, p]) => { const v = S.all.v[id] || {}; return [dmy(p.d), hms(v.t || p.at), nameOf(p.u) || p.nm, SRC[p.src] || p.src, ({ ok: 'Hợp lệ', tay: 'Chấm tay', huy: 'Đã hủy', het: 'Hết hạn', sai: 'Mã sai' })[v.st] || 'Chưa xác nhận', [v.why, p.note].filter(Boolean).join(' · ')]; })));
  try { const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); await dl.save({ filename: 'Bang_cong_' + m + '.xlsx', data: new Blob([out]) }); }
  catch (e) { if (e && e.code !== 'declined') toast('Không tải được file: ' + (e.message || e.code)); }
}

function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4500); }

/* ============ Sự kiện ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  if (a === 'go') go(arg);
  else if (a === 'closeDone') { $('#done').hidden = true; $('#done').innerHTML = ''; }
  else if (a === 'snap') $('#snap').click();
  else if (a === 'typed') { const v = ($('#codeIn').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v.length !== 6) { toast('Nhập đủ 6 ký tự đang hiện dưới mã QR.'); return; } S.f.code = ''; punch(null, v, 'ma'); }
  else if (a === 'full') { S.f.full = !S.f.full; try { if (S.f.full) await document.documentElement.requestFullscreen(); else if (document.fullscreenElement) await document.exitFullscreen(); } catch (x) { /* máy không hỗ trợ */ } render(); }
  else if (a === 'tab') { S.f.tab = arg; render(); }
  else if (a === 'exportX') exportX();
  else if (a === 'manual') {
    const u = $('#mU').value, d = $('#mD').value, t = $('#mT').value, note = $('#mN').value.trim();
    S.f.mU = u; S.f.mD = d; S.f.mT = t; S.f.mN = note;
    if (!u || !d || !t) { toast('Chọn nhân viên, ngày và giờ.'); return; }
    if (!note) { toast('Ghi lý do chấm tay.'); return; }
    const ms = at(d, t), id = d.replace(/-/g, '') + '-' + u + '-tay' + Date.now().toString(36), by = (me() && me().name) || 'Quản lý';
    try {
      await S.db.doc('cc/' + d.slice(0, 7) + '/p/' + id).set({ d, u, nm: nameOf(u), at: ms, ts: null, tc: '', src: 'tay', note, by });
      await S.db.doc('ccv/' + d.slice(0, 7) + '/v/' + id).set({ st: 'tay', t: ms, u, d, vAt: Date.now(), why: '' });
      S.f.mT = ''; S.f.mN = ''; toast('Đã thêm lượt chấm tay ' + hm(ms) + ' cho ' + nameOf(u) + '.'); render();
    } catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'void') {
    if (S.f.sure !== arg) { S.f.sure = arg; render(); return; }
    S.f.sure = ''; const p = S.all.p[arg]; if (!p) return;
    try { await S.db.doc('ccv/' + p.d.slice(0, 7) + '/v/' + arg).set(Object.assign({}, S.all.v[arg] || { u: p.u, d: p.d }, { st: 'huy', why: 'Hủy bởi ' + ((me() && me().name) || 'quản lý'), vAt: Date.now() })); toast('Đã hủy lượt quét.'); }
    catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
  else if (a === 'saveGen') { const link = $('#sLink').value.trim(); if (link && !/^https:\/\/claude\.ai\//.test(link)) { toast('Link phải bắt đầu bằng https://claude.ai/'); return; } saveSet({ link: link.split('#')[0], tre: Math.max(0, +$('#sTre').value || 0), p: Math.min(300, Math.max(15, +$('#sP').value || 30)) }, 'Đã lưu cài đặt.'); }
  else if (a === 'caAdd') { const e2 = readCa(); e2.push({ id: 'ca' + Date.now().toString(36), ten: 'Ca mới', vao: '08:00', ra: '17:00' }); S.f.ca = e2; render(); }
  else if (a === 'caDel') { const e2 = readCa(); const x = e2[+arg]; if (Object.values(cfg().gan).includes(x.id)) { toast('Còn nhân viên thuộc ' + x.ten + '. Chuyển họ sang ca khác trước.'); return; } e2.splice(+arg, 1); S.f.ca = e2; render(); }
  else if (a === 'caSave') { const e2 = readCa(); if (e2.some(x => !x.ten.trim() || !x.vao || !x.ra)) { toast('Mỗi ca cần tên, giờ vào và giờ ra.'); return; } await saveSet({ ca: e2 }, 'Đã lưu ca làm việc.'); S.f.ca = null; render(); }
  else if (a === 'accounts') { const b = document.querySelector('.ng-me'); if (b) b.click(); else toast('Mở bằng nút tài khoản góc trên bên phải.'); }
  else if (a === 'newKey') {
    if (!S.f.sureKey) { S.f.sureKey = true; render(); return; }
    S.f.sureKey = false; const b = crypto.getRandomValues(new Uint8Array(32)), k = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');
    try { await S.db.doc('cfg/secret').set({ k, at: Date.now() }); S.secret = k; S.codes.clear(); qrSlot = -1; toast('Đã đổi khóa mã QR.'); render(); } catch (x) { toast('Chưa lưu được: ' + ((x && x.message) || 'lỗi kết nối')); }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'snap') { readPhoto(el.files[0]); el.value = ''; }
  else if (el.id === 'myMonth') { S.f.mm = el.value || isoOf(new Date()).slice(0, 7); render(); }
  else if (el.id === 'bDate') { S.f.d = el.value || isoOf(new Date()); render(); }
  else if (el.id === 'bMonth') { S.f.m = el.value || isoOf(new Date()).slice(0, 7); render(); }
  else if (el.dataset.gan) { const gan = Object.assign({}, cfg().gan, { [el.dataset.gan]: el.value }); saveSet({ gan }, 'Đã đổi ca cho ' + nameOf(el.dataset.gan) + '.'); }
});
document.addEventListener('input', e => { if (e.target.id === 'codeIn') S.f.code = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'codeIn') { const b = document.querySelector('[data-act="typed"]'); if (b) b.click(); } if (e.key === 'Escape' && !$('#done').hidden) { $('#done').hidden = true; } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.f.full) { S.f.full = false; render(); } });
window.addEventListener('hashchange', () => { const t = parseHash(location.hash); if (t) { S.pending = t; handlePending(); return; } route(); render(); });
window.addEventListener('antam-nick', () => { S.mine.m = ''; render(); handlePending(); });
setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = hm(Date.now());
  if (S.view === 'qr') { drawQr(); keepAwake(true); } else keepAwake(false);
  watchLast();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.view === 'qr') { wake = null; keepAwake(true); } });

/* ============ Khởi động ============ */
(async function init() {
  { const t = parseHash(location.hash); if (t) S.pending = t; else route(); }
  render();
  const c = window.claude;
  const [db, user] = c && c.use ? await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]) : [null, null];
  S.db = db; S.user = user;
  if (user) { try { S.admin = !!(await user.canEdit()); } catch (e) { S.admin = false; } }
  if (db) {
    db.doc('set/app').onSnapshot(s => { S.set = s.exists ? s.data() : null; bump(); }, dbErr);
    db.doc('auth/accounts').onSnapshot(s => { S.acc = (s.exists && s.data().a) || {}; bump(); }, dbErr);
    ensureSecret();
  }
  S.ready = true; route();
  if (S.pending) S.view = 'cham';
  render(); handlePending();
})();
</script>
