<title>Đóng hàng An Tâm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="app-css">
/* Bố cục: thanh trên (tên + các mục) cố định, nội dung từng mục bên dưới; bảng rộng cuộn ngang trong khung riêng. */
:root {
  --bg: #f4f6f3; --panel: #ffffff; --ink: #1d2a24; --ink-2: #4c5c54; --muted: #7b8a82; --line: #dfe5e0; --line-2: #eef2ef;
  --accent: #0f6e5a; --accent-ink: #ffffff; --accent-soft: #e2f1ec; --crust: #b86a1d; --crust-soft: #f8ecdd;
  --good: #1f7a46; --good-soft: #e1f3e7; --bad: #b4232c; --bad-soft: #fbe5e6; --warn: #8a5a00; --warn-soft: #fbf0d6;
  --input: #ffffff; --hover: #f1f6f3; --shadow: 0 8px 28px rgba(20, 40, 30, .14);
  --hit: #fff6c7; --hit-bar: #e0a400; --mark: #ffd84d;
  /* màu nhóm sản phẩm: đậm (vạch, chữ tiêu đề) / nhạt (nền cột) */
  --g-thuong: #a8650f; --g-thuong-s: #fdf3e2; --g-dacbiet: #4f7a1f; --g-dacbiet-s: #eef6e3; --g-tuoi: #1f6fa8; --g-tuoi-s: #e5f1fa;
  --g-kebab: #b23a2e; --g-kebab-s: #fcebe8; --g-thit: #6c4bb0; --g-thit-s: #f1ecfb; --g-khac: #5c6a64; --g-khac-s: #eef1ef;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --panel: #18211c; --ink: #e5ece8; --ink-2: #b4c2ba; --muted: #869890; --line: #2c3a33; --line-2: #212c26;
    --accent: #3fb594; --accent-ink: #08130f; --accent-soft: #19362d; --crust: #e0a25e; --crust-soft: #3a2b1a;
    --good: #5fcf8e; --good-soft: #17331f; --bad: #ff8a8f; --bad-soft: #3d1c1f; --warn: #f0c062; --warn-soft: #382c12;
    --input: #121a16; --hover: #1f2b25; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --hit: #3a3213; --hit-bar: #f0c040; --mark: #806410;
    --g-thuong: #f0b45e; --g-thuong-s: #2e2414; --g-dacbiet: #9fd067; --g-dacbiet-s: #1e2a14; --g-tuoi: #7cc0f0; --g-tuoi-s: #142634;
    --g-kebab: #f39488; --g-kebab-s: #33191a; --g-thit: #b9a0f2; --g-thit-s: #241d36; --g-khac: #aab8b1; --g-khac-s: #212a26;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --panel: #18211c; --ink: #e5ece8; --ink-2: #b4c2ba; --muted: #869890; --line: #2c3a33; --line-2: #212c26;
  --accent: #3fb594; --accent-ink: #08130f; --accent-soft: #19362d; --crust: #e0a25e; --crust-soft: #3a2b1a;
  --good: #5fcf8e; --good-soft: #17331f; --bad: #ff8a8f; --bad-soft: #3d1c1f; --warn: #f0c062; --warn-soft: #382c12;
  --input: #121a16; --hover: #1f2b25; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --hit: #3a3213; --hit-bar: #f0c040; --mark: #806410;
    --g-thuong: #f0b45e; --g-thuong-s: #2e2414; --g-dacbiet: #9fd067; --g-dacbiet-s: #1e2a14; --g-tuoi: #7cc0f0; --g-tuoi-s: #142634;
    --g-kebab: #f39488; --g-kebab-s: #33191a; --g-thit: #b9a0f2; --g-thit-s: #241d36; --g-khac: #aab8b1; --g-khac-s: #212a26;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
.num, td.n, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* thanh trên */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--crust); color: #fff; display: grid; place-items: center; font-size: 12px; letter-spacing: .02em; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.tabs button { border: 0; background: none; padding: 7px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabs button:hover { background: var(--hover); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.me-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync.busy { color: var(--warn); }
.sync.err { color: var(--bad); }

main { padding-block: 18px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.grow { flex: 1; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea, input.in, select.in {
  border: 1px solid var(--line); background: var(--input); border-radius: 6px; padding: 7px 9px; font-size: 14px; color: var(--ink); min-width: 0;
}
.field textarea { resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.off { background: var(--line-2); color: var(--muted); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.box { background: var(--crust-soft); color: var(--crust); }

/* ngày */
.daybar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.daybar .date-big { font-size: 20px; font-weight: 700; }
.daybar .dow { color: var(--muted); }
.need { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.need > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); }
.need .k { font-size: 12px; color: var(--muted); }
.need .v { font-family: var(--f-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.need > .box .v { color: var(--crust); }

/* bảng */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: var(--panel); position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: right; }
tr.grp td { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; letter-spacing: .03em; text-transform: uppercase; }
tbody tr:hover td { background: var(--hover); }
tbody tr.grp:hover td { background: var(--accent-soft); }
/* bảng nhập đơn cuộn trong khung riêng để dòng tiêu đề nhóm / sản phẩm luôn hiện */
.tw.otw { max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); overflow: auto; }
/* dòng tóm tắt + chế độ mở to bảng */
.t1sum td, .t1sum th { white-space: nowrap; }
.t1sum tr.tot td { border-top: 2px solid var(--line); background: var(--warn-soft); }
.t1sum th.p, .t1sum th.gh { position: static; }
.t1sum td.pc { font-family: var(--f-num); font-weight: 600; color: var(--gc); }
.t1t .cust .sub.mono { font-family: var(--f-num); }
.t1t td.pc[data-out], .t1t tr.t1tot td.pc { font-family: var(--f-num); font-weight: 600; color: var(--gc); }
.t1t td.pc[data-out=le] { font-family: var(--f-body); font-weight: 500; font-size: 12.5px; }
.t1t thead th[rowspan], .t1sum thead th[rowspan] { vertical-align: bottom; }
.t1t tr.t1tot td { background: var(--warn-soft); font-family: var(--f-num); font-weight: 700; color: var(--bad); }
.t1t tr.t1tot td.cust { font-family: var(--f-body); color: var(--ink); }
.t1t tr.t1tot td.cust .sub { color: var(--ink-2); font-weight: 500; }
.t1t tr.t1sub td { background: var(--line-2); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.t1t input.t1gc { width: 150px; font-size: 12.5px; padding: 4px 6px; }
.t1t .t1note { min-width: 170px; max-width: 280px; }
.t1t .t1note .sub { font-size: 12px; color: var(--crust); margin-bottom: 3px; }
.t1t td[data-out=le], .t1t .t1tot td.small { white-space: nowrap; }
.t1t .t1ht { white-space: nowrap; }
.t1flt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border-radius: 6px; background: var(--hit); font-size: 13px; }
.prs { display: grid; gap: 10px; }
.prs label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.prs label input { margin-top: 3px; }
.prs .hint { display: block; margin-top: 2px; }
table.t1p { margin-bottom: 4px; }
.t1p th, .t1p td { border: 1px solid var(--line); padding: 4px 6px; white-space: normal; }
.t1p th { position: static; background: var(--line-2); }
.t1p tr.tot td { background: var(--warn-soft); font-weight: 700; }
.htlab { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; }
.htlab.on { color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px 2px 4px; }
.mini { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--ink-2); }
.mini b { font-family: var(--f-num); font-size: 16px; color: var(--ink); }
.mini .pchip b { font-size: 13px; color: inherit; }
body.tbl-max .top { display: none; }
body.tbl-max main { padding-block: 8px 12px; gap: 8px; }
body.tbl-max #d-head { padding: 8px 12px; gap: 6px; }
body.tbl-max #d-rep-wrap { display: none !important; }
body.tbl-max #d-mini { display: flex !important; }
body.tbl-max .daybar .date-big { font-size: 16px; }
body.tbl-max main > .row .field { font-size: 0; gap: 0; }
body.tbl-max main > .row .field input, body.tbl-max main > .row .field select, body.tbl-max main > .row .seg { font-size: 13px; }
body.tbl-max main > .row .field input, body.tbl-max main > .row .field select { padding: 5px 8px; }
body.tbl-max .tw.otw { max-height: calc(100vh - 160px); max-height: calc(100dvh - 160px); }
body.tbl-max #d-table > .hint { display: none; }
.orders td { vertical-align: middle; }
.orders .cust { min-width: 230px; max-width: 340px; }
.orders .cust b { font-weight: 600; }
.orders .cust .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 330px; }
.orders .stick { position: sticky; left: 0; background: var(--panel); z-index: 1; box-shadow: 1px 0 0 var(--line-2); }
.orders .s-crm { width: 76px; min-width: 76px; max-width: 76px; font-family: var(--f-num); font-weight: 600; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orders .cust.stick, .orders th.s-cust { left: 76px; }
.orders tr.has-order td.s-crm { color: var(--accent); }
.orders .grp-l { position: sticky; left: 8px; }
/* dòng lọc theo cột */
.orders tr.flt th { background: var(--line-2); padding: 4px 6px; font-weight: 500; }
.orders tr.flt th.pf { background: var(--gs); }
.flt-sel { width: 100%; min-width: 64px; font-size: 12px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--input); color: var(--muted); }
.flt-sel.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
/* cột tích thanh toán */
.p-ctt { --pc: var(--bad); --pcs: var(--bad-soft); } .p-dtt { --pc: var(--good); --pcs: var(--good-soft); }
.p-ht { --pc: var(--warn); --pcs: var(--warn-soft); } .p-tm { --pc: var(--g-tuoi); --pcs: var(--g-tuoi-s); } .p-none { --pc: var(--muted); --pcs: var(--line-2); }
.orders select.pay-sel { min-width: 104px; color: var(--muted); }
.orders select.pay-sel.pay-on { background: var(--pc); border-color: var(--pc); color: var(--accent-ink); font-weight: 700; }
.orders select.pay-sel option { background: var(--input); color: var(--ink); font-weight: 400; }
.paychips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { border-radius: 999px; padding: 4px 12px; background: var(--pcs); color: var(--pc); font-weight: 600; font-size: 13px; }
.pchip b { font-family: var(--f-num); margin-left: 4px; }
/* ô tình trạng: xanh khi HOẠT ĐỘNG */
.orders select.st-sel { color: var(--muted); }
.orders select.st-sel.st-on { background: var(--good); border-color: var(--good); color: var(--accent-ink); font-weight: 700; }
.orders select.st-sel option { background: var(--input); color: var(--ink); font-weight: 400; }
/* báo cáo ngày (như các dòng tổng cuối sheet) */
.rep { display: grid; gap: 12px; }
.rep-big { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.rep-big > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
.rep-big .v { font-family: var(--f-num); font-size: 30px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.rep-big .k { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
.rep-big .hot { background: var(--warn-soft); border-color: var(--hit-bar); }
.rep-big .hot .v { color: var(--bad); }
.rept th.rl, .rept td.rl { min-width: 128px; width: 128px; font-weight: 700; white-space: nowrap; }
.rept td.pc { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.rept tr.r-tui td.pc { color: var(--bad); font-weight: 600; }
.rept tr.r-cai td { font-weight: 700; border-top: 2px solid var(--line); }
.rept tr.r-tuyen td.rl { color: var(--crust); }
.rept input.q { width: 56px; }
.zero { color: var(--muted) !important; font-weight: 400 !important; }
.rep h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
/* dòng khớp ô tìm kiếm */
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
tr.hit > td:not(.pc), tbody tr.hit:hover > td:not(.pc) { background: var(--hit); }
tr.hit > td:first-child { box-shadow: inset 4px 0 0 var(--hit-bar); }
.orders th.stick { z-index: 3; }
.orders tbody tr:hover td.stick { background: var(--hover); }
.orders input.q { width: 52px; text-align: right; border: 1px solid var(--line); background: var(--input); border-radius: 5px; padding: 4px 6px; font-family: var(--f-num); font-size: 13px; }
.orders input.q.has { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.orders select.in { padding: 4px 6px; font-size: 13px; }
.orders th.p { min-width: 64px; max-width: 92px; font-size: 12px; line-height: 1.25; white-space: normal; text-align: center; font-weight: 700; color: var(--gc); background: var(--gs); top: 30px; }
.orders thead tr:first-child th { height: 30px; }
.orders th.gh { text-align: center; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--gc); background: var(--gs); border-top: 3px solid var(--gc); white-space: nowrap; }
.orders td.pc { background: var(--gs); text-align: center; }
.orders tbody tr:hover td.pc { background: var(--gs); filter: brightness(.97); }
.orders .gstart { border-left: 2px solid var(--gc); }
.orders td.pc input.q.has { border-color: var(--gc); background: var(--panel); color: var(--gc); }
.g-thuong { --gc: var(--g-thuong); --gs: var(--g-thuong-s); } .g-dacbiet { --gc: var(--g-dacbiet); --gs: var(--g-dacbiet-s); }
.g-tuoi { --gc: var(--g-tuoi); --gs: var(--g-tuoi-s); } .g-kebab { --gc: var(--g-kebab); --gs: var(--g-kebab-s); }
.g-thit { --gc: var(--g-thit); --gs: var(--g-thit-s); } .g-khac { --gc: var(--g-khac); --gs: var(--g-khac-s); }
.qsec { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; background: var(--gs); border-left: 3px solid var(--gc); }
.qsec h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--gc); }
.qsec .qgrid label { background: var(--panel); }
.gdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gc); margin-right: 5px; }
.orders tr.has-order td.cust b { color: var(--accent); }
.pack { white-space: nowrap; font-size: 12.5px; font-weight: 600; color: var(--crust); }
.more { text-align: center; padding: 10px; }

/* thống kê */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--f-num); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-num); }
.chart .gl { stroke: var(--line-2); stroke-width: 1; }
.chart .base { stroke: var(--line); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .bar.dim { opacity: .35; }
.chart .hit { fill: transparent; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; white-space: nowrap; z-index: 5; }
.tip b { font-family: var(--f-num); }
.bar-cell { position: relative; }

async function guard(fn) { try { return await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); return null; } }
function modal({ title, body, ok = 'Lưu', onOk, wide, danger, onClose }) {
  const back = document.createElement('div'); back.className = 'modal-back';

  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };

}

const SHORT = { '22 CM': '22 cm', '25 CM': '25 cm', '28 CM': '28 cm', '31 CM': '31 cm', '25CM BÁNH THAN TRE': '25 cm than tre', '22CM KHÔNG HƯƠNG': '22 cm không hương',

/* ================================================================ dữ liệu (db của trang) */
const S = {
  db: null, user: null, myId: '', me: store('me') || '', view: store('view') || 'don', date: today(),
  cfg: JSON.parse(JSON.stringify(DEFAULT_CFG)), cust: {}, shards: {}, day: null, dayUnsub: null,
  loaded: { cfg: false, cust: 0 }, filter: Object.assign({ q: '', area: '', mode: 'co', allCols: false }, store('filter') || {}),
};
const SHARDS = 8;
const shardOf = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 'k' + (h % SHARDS); };
const live = o => Object.entries(o || {}).filter(([, v]) => v != null);
const queues = {};
const HOLDER = rid('h'); // mã của tab này khi giữ khóa tạo tài liệu
function serial(path, fn) { const p = (queues[path] || Promise.resolve()).catch(() => {}).then(fn); queues[path] = p; return p; }
let pendingWrites = 0;
function setSync() {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync' + (pendingWrites ? ' busy' : '');
  el.textContent = !S.db ? '' : pendingWrites ? 'Đang lưu…' : 'Đã lưu';
}
function dbErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return new Error(S.readOnly ? 'Bạn đang chỉ có quyền xem trang này – nhờ chủ trang mời bằng email với quyền Editor để nhập liệu.'
    : 'Không lưu được (' + (e.message || 'invalid_argument') + '). Tải lại trang rồi thử lại; nếu vẫn lỗi, chụp màn hình gửi người làm web.');
  if (c === 'quota_exceeded') return new Error('Kho dữ liệu của trang đã đầy: ' + (e.message || ''));
  if (c === 'resource_exhausted') return new Error('Thao tác quá nhanh, thử lại sau vài giây.');
  if (c === 'revoked') return new Error('Bạn không còn quyền truy cập trang này.');
  return e instanceof Error ? e : new Error((e && e.message) || 'Lỗi lưu dữ liệu');
}
// ghi gộp vào 1 tài liệu (tạo mới nếu chưa có); mỗi tài liệu ghi lần lượt
function mergeInto(path, patch, base) {
  pendingWrites++; setSync();
  return serial(path, async () => {
    const ref = S.db.doc(path);
    try {
      try { await ref.update(patch); return; } catch (e) { if (!e || e.code !== 'invalid_argument') throw e; }
      const snap = await ref.get();
      if (snap.exists) { await ref.update(patch); return; }
      // tài liệu chưa có (VD ngày mới): giữ khóa ngắn rồi tạo; acquire bắt buộc có holder
      const lease = await ref.acquire({ holder: HOLDER, ttlMs: 3000 });
      if (!lease.acquired) { await sleep(800); await ref.update(patch); return; }
      const again = await ref.get();
      if (again.exists) await ref.update(patch); else await ref.set(Object.assign({}, base || {}, patch));
    } catch (e) { throw dbErr(e); }
  }).finally(() => { pendingWrites--; setSync(); });
}
function setDoc(path, data) {
  pendingWrites++; setSync();
  return serial(path, () => S.db.doc(path).set(data).catch(e => { throw dbErr(e); })).finally(() => { pendingWrites--; setSync(); });
}

const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Hết thời gian chờ ' + what)), ms))]);

}

  }).catch(e => console.warn('user', e));

  catch (e) { return showFatal('Không tải được danh sách khách', errText(dbErr(e))); }
  db.collection('khach').onSnapshot(snap => { applyCust(snap); refresh(); }, e => toast('Danh sách khách: ' + dbErr(e).message, true));
  watchDay(S.date);
  // khách tuyến kebab 123
  db.doc('tuyen123/khach').onSnapshot(sn => {

window.addEventListener('error', e => { if (e && e.message) toast('Lỗi: ' + e.message, true); });

function watchDay(d) {
  if (S.dayUnsub) S.dayUnsub();
  S.day = null; S.date = d;
  S.dayUnsub = S.db.doc('ngay/' + d).onSnapshot(s => {
    const data = s.exists ? s.data() : { date: d, r: {} };
    // giữ các ô đang gõ dở trên máy này
    const mine = S.day && S.day.date === d ? S.localRows || {} : {};
    S.day = { date: d, r: Object.assign({}, data.r || {}), tuyen: Object.assign({}, data.tuyen || {}, S.localTuyen || {}) };
    for (const [cid, rec] of Object.entries(mine)) S.day.r[cid] = deepMerge(JSON.parse(JSON.stringify(S.day.r[cid] || {})), rec);
    refresh(true);

}

function autoPack(c) {
  const words = String(S.cfg.thungWords || '').split(',').map(w => w.normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim()).filter(Boolean);
  // khu vực "CHÀNH XE…", "BÀ TÁM", "GỬI TÀU…" hoặc ghi chú; so cả dấu ("chành" khác "Bình Chánh")

const packOf = (o, c) => (o && o.pk) || (c && c.pk) || autoPack(c);
function sizeTotals(q) {
  const t = { 22: 0, 25: 0, 28: 0, 31: 0, K: 0 };
  for (const p of S.cfg.products) { const n = num((q || {})[p.id]); if (n > 0 && p.size && p.size in t) t[p.size] += n; }
  return t;
}
const qtyTotal = q => Object.values(q || {}).reduce((a, n) => a + (num(n) > 0 ? num(n) : 0), 0);
// Túi đen: mỗi bánh chiếm 1/định mức, cộng lại làm tròn lên; kebab túi riêng.
// Thùng: chọn thùng nhỏ nhất đủ chứa (giấy → nhỏ → chung → đại); vượt thùng đại thì thêm thùng; kebab đóng cây.
function packing(q, pk) {
  const caps = S.cfg.caps, t = sizeTotals(q), E = 1e-9;
  const res = { tui: 0, tuiK: 0, giay: 0, nho: 0, chung: 0, dai: 0, cay: 0 };
  const hs = box => SIZES.reduce((a, s) => a + (t[s] ? t[s] / ((caps[box] || {})[s] || NaN) : 0), 0);
  const banh = SIZES.some(s => t[s] > 0);
  const fits = v => !isNaN(v) && v <= 1 + E;
  if (isTui(pk)) {
    if (banh) { const h = hs('tui'); res.tui = isNaN(h) ? 0 : Math.ceil(h - E); }
    if (t.K) res.tuiK = Math.ceil(t.K / (caps.tui.K || 50) - E);
  } else {
    if (banh) {
      const order = BOXES.map(b => b[0]);
      const fit = order.find(b => fits(hs(b)));
      if (fit) res[fit] = 1;
      else {
        const hd = hs('dai');
        if (!isNaN(hd)) {
          const full = Math.floor(hd + E); res.dai = full;
          const r = hd - full;
          if (r > E) { const f = r / hd; const lb = order.find(b => fits(hs(b) * f)) || 'dai'; res[lb] += 1; }

}

const packLabel = r => LABEL_ORDER.filter(k => r[k]).map(k => `${r[k]} ${NEED.find(x => x[0] === k)[1]}`).join(' + ');
function orderOf(cid) { return (S.day && S.day.r[cid]) || null; }

const PAYS = [['ctt', 'CTT', 'Chưa TT', 'Chưa thanh toán'], ['dtt', 'ĐTT', 'ĐÃ TT', 'Đã thanh toán'], ['ht', 'Hỗ trợ', 'HỖ TRỢ', 'Hỗ trợ'], ['tm', 'Tiền mặt', 'TIỀN MẶT', 'Tiền mặt']];
// ô chọn thanh toán (như ô Tình trạng): tô màu theo lựa chọn
function paySelect(tt) {
  const k = payKey(tt), extra = tt && !k ? `<option selected>${esc(tt)}</option>` : '';
  return `<select class="in pay-sel${k ? ' p-' + k + ' pay-on' : ''}" data-k="tt" aria-label="Thanh toán"><option value="">—</option>`
    + PAYS.map(([key, l, v, full]) => `<option value="${esc(v)}" ${key === k ? 'selected' : ''} title="${esc(full)}">${esc(l)}</option>`).join('') + extra + '</select>';
}
const payKey = tt => { const n = norm(tt); if (!n) return ''; const hit = PAYS.find(([, , v]) => norm(v) === n) || PAYS.find(([, l]) => norm(l) === n); return hit ? hit[0] : ''; };
// Báo cáo ngày như cuối sheet: TỔNG TÚI (đơn), BÁNH TUYẾN, TỔNG CÁI = (túi + bánh tuyến) × cái/túi, TACOS, KEBAB, BILL
function dayReport(dayR, tuyen) {
  const list = dayOrders(dayR), tui = {}, cai = {};
  let bill = 0;
  const pay = { ctt: 0, dtt: 0, ht: 0, tm: 0, none: 0 };
  for (const { o, c } of list) {
    const pk = payKey(o.tt); pay[pk || 'none']++;
    for (const [pid, n] of Object.entries(o.q || {})) if (num(n) > 0) tui[pid] = (tui[pid] || 0) + num(n);
    bill += o.bill != null && o.bill !== '' ? num(o.bill) : (c.bill == null ? 1 : num(c.bill));
  }
  let tacos = 0, kebab = 0;
  for (const p of S.cfg.products) {
    const n = ((tui[p.id] || 0) + num((tuyen || {})[p.id])) * perOf(p);
    cai[p.id] = n;
    const g = groupOf(p);
    if (['thuong', 'dacbiet', 'tuoi'].includes(g)) tacos += n; else if (g === 'kebab') kebab += n;
  }
  const tuyenTxt = S.cfg.products.filter(p => num((tuyen || {})[p.id]) > 0)
    .map(p => (perOf(p) > 1 ? `${fmt(tuyen[p.id])} túi ${prodLabel(p)} = ${fmt(num(tuyen[p.id]) * perOf(p))} cái` : `${fmt(tuyen[p.id])} cái ${prodLabel(p)}`)).join(' · ');
  return { tui, cai, tacos, kebab, bill, count: list.length, tuyenTxt, pay };
}
function dayTotals(dayR) {
  const need = { tui: 0, tuiK: 0, giay: 0, nho: 0, chung: 0, dai: 0, cay: 0 }, prod = {}, size = { 22: 0, 25: 0, 28: 0, 31: 0, K: 0 };
  const list = dayOrders(dayR);
  for (const { o, c } of list) {
    const p = packing(o.q, packOf(o, c));
    for (const k in need) need[k] += p[k];
    for (const [pid, n] of Object.entries(o.q || {})) if (num(n) > 0) prod[pid] = (prod[pid] || 0) + num(n);
    const st = sizeTotals(o.q); for (const k in size) size[k] += st[k];

}

function statsOf(days) {
  const st = { orders: 0, banh: 0, kebab: 0, need: { tui: 0, tuiK: 0, giay: 0, nho: 0, chung: 0, dai: 0, cay: 0 }, perDay: {}, prod: {}, prodOrders: {}, prodCust: {}, prodDays: {}, area: {}, tao: {}, tx: {}, pay: {}, cust: {}, debt: 0 };
  for (const [d, r] of Object.entries(days)) {
    const pd = st.perDay[d] = { orders: 0, banh: 0, kebab: 0, prod: {} };
    for (const { cid, o, c } of dayOrders(r)) {
      const sz = sizeTotals(o.q), banh = SIZES.reduce((a, s) => a + sz[s], 0);
      const p = packing(o.q, packOf(o, c));
      for (const k in st.need) st.need[k] += p[k];
      st.orders++; pd.orders++; st.banh += banh; pd.banh += banh; st.kebab += sz.K; pd.kebab += sz.K;
      for (const [pid, n] of Object.entries(o.q || {})) {
        if (!(num(n) > 0)) continue;
        st.prod[pid] = (st.prod[pid] || 0) + num(n); pd.prod[pid] = (pd.prod[pid] || 0) + num(n);
        st.prodOrders[pid] = (st.prodOrders[pid] || 0) + 1;
        (st.prodCust[pid] = st.prodCust[pid] || new Set()).add(cid); (st.prodDays[pid] = st.prodDays[pid] || new Set()).add(d);
      }
      const add = (m, k, b) => { k = k || '(trống)'; const x = m[k] = m[k] || { orders: 0, banh: 0, kebab: 0 }; x.orders++; x.banh += b; x.kebab += sz.K; };
      add(st.area, c.q, banh); add(st.tao, o.tao, banh); add(st.tx, o.tx, banh); add(st.pay, o.tt, banh);
      const cu = st.cust[cid] = st.cust[cid] || { c, orders: 0, banh: 0, kebab: 0, last: '' };
      cu.orders++; cu.banh += banh; cu.kebab += sz.K; if (d > cu.last) cu.last = d;
      st.debt += num(o.cn);
    }
  }
  return st;
}

function drawBars(el, data, unit) {

  const max = Math.max(1, ...data.map(x => x.v));
  const step = Math.pow(10, Math.floor(Math.log10(max))); const nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(m => max / m <= 5) || step * 10;
  const top = Math.ceil(max / nice) * nice;

  s += ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('');
  data.forEach((x, i) => {

    if (h > 0) { const rr = Math.min(4, w / 2, h); s += `<path class="bar" data-i="${i}" d="M${x0},${y(0)} V${y(x.v) + rr} Q${x0},${y(x.v)} ${x0 + rr},${y(x.v)} H${x0 + w - rr} Q${x0 + w},${y(x.v)} ${x0 + w},${y(x.v) + rr} V${y(0)} Z"/>`; }
    if (i % every === 0) s += `<text class="ax" x="${x0 + w / 2}" y="${H - 8}" text-anchor="middle">${vnShort(x.d)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const tip = $('.tip', el), svg = $('svg', el);
  const show = i => {
    const x = data[i]; $$('.bar', el).forEach(b => b.classList.toggle('dim', b.dataset.i !== String(i)));
    tip.hidden = false; tip.innerHTML = `${dow(x.d)} ${vn(x.d)}<br><b>${fmt(x.v)}</b> ${esc(unit)}`;
    const box = svg.getBoundingClientRect(), sc = box.width / W;
    const cx = (L + (i + 0.5) * bw) * sc;
    tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.width - tip.offsetWidth) + 'px';
    tip.style.top = Math.max(0, y(x.v) * sc - tip.offsetHeight - 8) + 'px';

}

function tableFromHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const tb = doc.querySelector('table'); if (!tb) return null;
  const out = [], carry = [];
  $$('tr', tb).forEach((tr, ri) => {
    const row = []; let ci = 0;
    const fill = () => { while (carry[ci] && carry[ci].left > 0) { row[ci] = carry[ci].v; carry[ci].left--; ci++; } };
    fill();
    $$('td,th', tr).forEach(td => {
      fill();
      const v = (td.innerText != null ? td.innerText : td.textContent).replace(/ /g, ' ').trim();
      const cs = +td.getAttribute('colspan') || 1, rs = +td.getAttribute('rowspan') || 1;
      for (let k = 0; k < cs; k++) { row[ci] = v; if (rs > 1) carry[ci] = { v, left: rs - 1 }; ci++; }
      fill();
    });
    out.push(row.map(x => (x == null ? '' : x)));
  });
  return out;
}
function tableFromText(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') { q = true; continue; }
    if (ch === '\t') { row.push(cell); cell = ''; continue; }
    if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

    const a = g(r, 0) || lastA; lastA = a;
    const name = g(r, col.name), nn = norm(name);
    if (nn.startsWith('tong banh tuyen')) { grp = grpOf(nn) || grp; sub = ''; continue; }
    if (!name || nn.startsWith('doanh thu') || nn === 'tong' || /^[\d.,\s]+$/.test(name)) continue;
    if (!grp) grp = grpOf(norm(a)) || 't1';
    sub = norm(a).startsWith('chieu') && !norm(a).startsWith('chieu ') ? '' : norm(a).match(/^chieu .*giao/) ? a.replace(/^chiều/i, 'Chiều –').trim() : sub;
    const q = {}; for (const [k] of T123_P) { const raw = r[pc[k]]; const n = num(String(raw == null ? '' : raw).replace(/[^\d.,]/g, '')); if (pc[k] >= 0 && n > 0) q[k] = n; }
    let phone = g(r, col.phone), note = g(r, col.note);
    if (phone && !/\d{3}/.test(phone)) { note = [phone, note].filter(Boolean).join(' · '); phone = ''; }
    const st = stCol >= 0 ? (norm(r[stCol]).startsWith('hoat') ? 'HOẠT ĐỘNG' : norm(r[stCol]) === 'nghi' ? 'NGHỈ' : '') : '';
    rows.push({ g: grp, sub, crm: g(r, col.crm).replace(/\s+/g, '').toUpperCase(), name, phone, note, ht: htCol >= 0 && norm(r[htCol]) === 'ho tro', st, q });
  }
  // dòng trùng hệt nhau (cùng tên, cùng tuyến) chỉ lấy 1
  const seen = new Set(); return rows.filter(r => { const k = r.g + '|' + keyOf(r.name); if (seen.has(k)) return false; seen.add(k); return true; });
}
function t1Import() {
  const m = modal({
    title: 'Cập nhật tuyến 123 từ Google Sheet', ok: 'Cập nhật', wide: true,
    body: `<ol class="steps"><li>Mở sheet <b>2-KHÁCH TUYẾN 123</b>, chọn tab ngày cần lấy.</li><li>Bấm một ô, <b>Ctrl+A</b> rồi <b>Ctrl+C</b>.</li><li>Bấm vào ô dưới và <b>Ctrl+V</b>.</li></ol>
      <textarea id="t1i-text" rows="4" style="width:100%;margin-top:8px" placeholder="Dán ở đây…"></textarea><div id="t1i-res" class="hint" style="margin-top:8px"></div>
      <div class="fgrid" style="margin-top:8px">
        <label class="field" style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="t1i-rep"> Thay toàn bộ danh sách khách bằng sheet (xóa khách không còn trong sheet)</label>
        <label class="field" style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="t1i-q" checked> Lấy cả số lượng vào ngày</label>
        <label class="field">Ngày<input type="date" id="t1i-date" value="${S.date}"></label></div>`,
    onOk: async root => {
      if (!parsed) throw new Error('Chưa dán dữ liệu');
      const replace = $('#t1i-rep', root).checked;
      const key = r => r.g + '|' + keyOf(r.name);
      const byKey = {}; for (const [id, c] of Object.entries(S.t1.cust)) if (c) { byKey[t1G(c) + '|' + keyOf(c.name)] = id; byKey['*' + keyOf(c.name)] = byKey['*' + keyOf(c.name)] || id; }
      const next = {}, idOf = {}; let nNew = 0, s = 0;
      for (const r of parsed) {
        s += 10; let id = byKey[key(r)] || byKey['*' + keyOf(r.name)];
        if (!id || next[id]) { id = rid('t'); nNew++; }
        idOf[key(r)] = id;
        next[id] = Object.assign({}, replace ? {} : S.t1.cust[id] || {}, { g: r.g, sub: r.sub, crm: r.crm, name: r.name, phone: r.phone, note: r.note, ht: r.ht, s });
      }
      if (replace) await setDoc('tuyen123/khach', { c: next }); else await mergeInto('tuyen123/khach', { c: next }, { c: {} });
      S.t1.cust = replace ? next : Object.assign({}, S.t1.cust, next);
      if ($('#t1i-q', root).checked) {
        const d = $('#t1i-date', root).value; if (!d) throw new Error('Chọn ngày');
        const r = {};
        for (const x of parsed) {
          const auto = Object.keys(x.q).length ? 'HOẠT ĐỘNG' : 'NGHỈ';
          if (Object.keys(x.q).length || (x.st && x.st !== auto)) r[idOf[key(x)]] = Object.assign({ q: x.q, at: nowStr() }, x.st && x.st !== auto ? { st: x.st } : {});
        }
        await setDoc('t123/' + d, { date: d, r });
      }
      toast(`Đã cập nhật ${parsed.length} khách tuyến 123 (${nNew} khách mới)`); render(); return true;
    },
  });
  let parsed = null;
  const ta = $('#t1i-text', m.root);
  ta.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    const html = cd.getData('text/html'), txt = cd.getData('text/plain');
    const t = (html && tableFromHtml(html)) || (txt ? tableFromText(txt) : null);
    if (!t) return;
    e.preventDefault();
    try {
      parsed = parseT123(t);
      ta.value = `(Đã dán ${t.length} dòng)`;
      const cnt = T123_GROUPS.map(([g, n]) => `${n}: ${parsed.filter(r => r.g === g).length}`).join(' · ');
      $('#t1i-res', m.root).textContent = `Đọc được ${parsed.length} khách (${cnt}), ${parsed.filter(r => Object.keys(r.q).length).length} khách có số lượng.`;
    } catch (err) { parsed = null; $('#t1i-res', m.root).textContent = err.message; }
  });
}

/* ================================================================ ĐỊNH MỨC & CÀI ĐẶT */
const cfgDoc = () => ({ caps: S.cfg.caps, products: S.cfg.products, pay: S.cfg.pay, thungWords: S.cfg.thungWords, t123: S.cfg.t123 || {}, at: nowStr() });
function viewSettings(main) {
  const c = JSON.parse(JSON.stringify(S.cfg));
  const capRows = [['tui', 'Túi đen', [...SIZES, 'K']], ['nho', 'Thùng Nhỏ', SIZES], ['chung', 'Thùng Chung', SIZES], ['dai', 'Thùng đại', SIZES], ['giay', 'Thùng giấy', SIZES], ['cay', 'Cây kebab', ['K']]];
  const draw = () => {
    main.innerHTML = `<div class="card" style="display:grid;gap:10px"><h2>Định mức đóng gói</h2>
      <p class="hint">Ô vàng = số bánh tối đa cho 1 túi / 1 thùng / 1 cây. Sửa ở đây thì định mức của mọi đơn tự tính lại.</p>
      <div class="tw caps"><table><thead><tr><th>Bao bì</th>${[...SIZES.map(s => 'Size ' + s), 'Kebab'].map(x => `<th class="n">${x}</th>`).join('')}</tr></thead><tbody>
        ${capRows.map(([k, n, cols]) => `<tr><td>${n}</td>${[...SIZES, 'K'].map(s => `<td class="n">${cols.includes(s) ? `<input data-cap="${k}.${s}" inputmode="numeric" value="${esc((c.caps[k] || {})[s] || '')}">` : ''}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <ul class="hint" style="margin:0;padding-left:18px"><li>Đóng <b>TÚI ĐEN</b> (giao trong TP): bánh đóng túi đen; kebab đóng túi đen riêng.</li>
        <li>Đóng <b>THÙNG</b> (gửi chành / Bà Tám / gửi tàu): chọn thùng nhỏ nhất đủ chứa: Thùng giấy → Nhỏ → Chung → Đại; vượt Thùng đại thì thêm thùng; kebab đóng cây.</li>
        <li>Đơn nhiều size: mỗi bánh chiếm 1/định mức của túi/thùng, cộng lại rồi làm tròn lên.</li></ul>
      <label class="field">Khu vực hoặc ghi chú có các chữ này thì tự chọn đóng THÙNG (cách nhau dấu phẩy)<input id="s-words" value="${esc(c.thungWords)}"></label>
    </div>
    <div class="card" style="display:grid;gap:10px"><h2>Sản phẩm (các cột số lượng)</h2>
      <div class="tw prods"><table><thead><tr><th>Tên đầy đủ (giống tiêu đề cột trong sheet)</th><th>Nhóm (màu cột)</th><th>Tên cột trên bảng</th><th>Cái / túi</th><th>Loại tính đóng gói</th><th>Hiện</th><th></th></tr></thead><tbody>
        ${c.products.map((p, i) => `<tr data-i="${i}"><td><input class="in" data-k="name" value="${esc(p.name)}" style="width:100%;min-width:220px"></td><td><select class="in" data-k="grp"><option value="">Tự (${esc(GROUPS[groupOf(Object.assign({}, p, { grp: '' }))].name)})</option>${Object.entries(GROUPS).map(([k, g]) => `<option value="${k}" ${p.grp === k ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></td>
          <td><input class="in" data-k="short" value="${esc(prodShort(p))}" style="width:150px"></td>
          <td><input class="in" data-k="per" inputmode="numeric" value="${esc(perOf(p))}" style="width:64px;text-align:right" title="TỔNG CÁI = (tổng túi + bánh tuyến) × số này"></td>
          <td><select class="in" data-k="size">${Object.entries(SIZE_LABEL).map(([k, n]) => `<option value="${k}" ${p.size === k ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
          <td><input type="checkbox" data-k="show" ${p.show !== false ? 'checked' : ''}></td>
          <td class="nowrap"><button class="btn sm ghost" data-up ${i ? '' : 'disabled'} aria-label="Lên">↑</button><button class="btn sm ghost" data-down ${i < c.products.length - 1 ? '' : 'disabled'} aria-label="Xuống">↓</button><button class="btn sm ghost danger" data-del aria-label="Xóa">✕</button></td></tr>`).join('')}
      </tbody></table></div>
      <div><button class="btn" id="s-addp">+ Thêm sản phẩm</button></div>
    </div>
    <div class="card" style="display:grid;gap:10px"><h2>Tình trạng thanh toán</h2>
      <label class="field">Các lựa chọn (cách nhau dấu phẩy)<input id="s-pay" value="${esc((c.pay || []).join(', '))}"></label></div>
    <div class="row"><button class="btn pri" id="s-save">Lưu cài đặt</button><button class="btn" id="s-reset">Khôi phục định mức theo sheet</button><span class="hint" id="s-st"></span></div>`;
    const dirty = () => { main.firstElementChild.dataset.dirty = '1'; $('#s-st').textContent = 'Có thay đổi chưa lưu'; };
    $$('[data-cap]', main).forEach(i => i.oninput = () => { const [k, s] = i.dataset.cap.split('.'); c.caps[k] = c.caps[k] || {}; c.caps[k][s] = num(i.value); dirty(); });
    $$('tr[data-i]', main).forEach(tr => {
      const p = c.products[+tr.dataset.i];
      $$('[data-k]', tr).forEach(i => i.oninput = i.onchange = () => { p[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; dirty(); });
      const mv = d => { const i = +tr.dataset.i, j = i + d; [c.products[i], c.products[j]] = [c.products[j], c.products[i]]; draw(); dirty(); };
      $('[data-up]', tr).onclick = () => mv(-1); $('[data-down]', tr).onclick = () => mv(1);
      $('[data-del]', tr).onclick = async () => { if (await confirmBox(`Xóa sản phẩm "${p.name}"? Số lượng đã nhập của sản phẩm này sẽ không còn hiện.`, 'Xóa', true)) { c.products.splice(+tr.dataset.i, 1); draw(); dirty(); } };
    });
    $('#s-addp').onclick = () => { const p = P('Sản phẩm mới', '', ''); p.id = rid('p'); c.products.push(p); draw(); dirty(); };
    $('#s-words').oninput = e => { c.thungWords = e.target.value; dirty(); };
    $('#s-pay').oninput = e => { c.pay = e.target.value.split(',').map(x => x.trim()).filter(Boolean); dirty(); };
    $('#s-reset').onclick = () => { c.caps = JSON.parse(JSON.stringify(DEFAULT_CFG.caps)); draw(); dirty(); };
    $('#s-save').onclick = () => guard(async () => {
      if (c.products.some(p => !p.name.trim())) throw new Error('Có sản phẩm chưa có tên');
      S.cfg = c; await setDoc('cfg/main', cfgDoc()); toast('Đã lưu cài đặt'); render();
    });
  };
  draw();
}

window.addEventListener('beforeunload', e => { if (pendingWrites) { e.preventDefault(); e.returnValue = ''; } });
setView(S.view);
if (window.claude && window.claude.use) boot().catch(e => showFatal('Trang gặp lỗi khi mở', errText(e)));
else showFatal('Hãy mở trang này trên claude.ai', 'Bản lưu về máy không có dữ liệu – mở link claude.ai của trang.');
</script>
