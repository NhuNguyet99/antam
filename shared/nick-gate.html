<style id="nick-gate-css">
/* Khóa trang bằng nick + mật khẩu: chưa đăng nhập thì ẩn toàn bộ trang, chỉ hiện ô đăng nhập */
html.ng-locked body > *:not([id^="ng-"]):not(script):not(style):not(link):not(title):not(meta) { display: none !important; }
#ng-gate { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; overflow: auto; background: var(--bg, #f2f4f1); color: var(--fg, var(--ink, #18211d));
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#ng-gate[hidden], #ng-panel[hidden] { display: none !important; }
.ng-card { width: min(420px, 100%); background: var(--surface, #fff); border: 1px solid var(--line, #dce2dc); border-radius: 14px; padding: 22px; display: grid; gap: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, .08); }
.ng-card h1 { margin: 0; font-size: 1.35em; line-height: 1.25; }
.ng-card p { margin: 0; color: var(--muted, #5b6862); font-size: .92em; }
.ng-f { display: grid; gap: 4px; font-size: .9em; color: var(--muted, #5b6862); }
.ng-f input, .ng-f select { font: inherit; color: var(--fg, var(--ink, #18211d)); border: 1px solid var(--line, #dce2dc); background: var(--surface, #fff); border-radius: 8px; padding: 9px 11px; min-width: 0; width: 100%; }
.ng-btn { font: inherit; border: 1px solid var(--line, #dce2dc); background: var(--surface, #fff); color: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.ng-btn.pri { background: var(--accent, #1c6b5a); border-color: var(--accent, #1c6b5a); color: var(--accent-fg, var(--accent-ink, #fff)); }
.ng-btn.sm { padding: 4px 10px; font-size: .88em; }
.ng-btn:disabled { opacity: .55; cursor: default; }
.ng-err { color: var(--crit, var(--chi, #b42318)); font-size: .9em; min-height: 1.2em; }
.ng-me { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line, #dce2dc); background: var(--surface, #fff); color: inherit; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: .86em; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
#ng-fixed { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 8000; }
#ng-panel { position: fixed; inset: 0; z-index: 9100; background: rgba(10, 16, 14, .42); display: grid; place-items: start center; overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
#ng-panel .ng-card { width: min(680px, 100%); color: var(--fg, var(--ink, #18211d)); }
.ng-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ng-grow { flex: 1 1 auto; }
.ng-tbl { overflow-x: auto; border: 1px solid var(--line, #dce2dc); border-radius: 8px; }
.ng-tbl table { border-collapse: collapse; width: 100%; font-size: .92em; }
.ng-tbl th, .ng-tbl td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--line, #dce2dc); white-space: nowrap; }
.ng-tbl th { font-size: .8em; text-transform: uppercase; letter-spacing: .04em; color: var(--muted, #5b6862); }
.ng-tbl tr.off td { color: var(--muted, #5b6862); }
.ng-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; }
.ng-chk { display: inline-flex; gap: 6px; align-items: center; font-size: .92em; }
</style>
<script id="nick-gate">
(function () {
  'use strict';
  const C = window.NICK_GATE || {}, SITE = C.site || 'site', TITLE = C.title || document.title;
  const KEY = 'ng-' + SITE + '-sess', DAYS = 30, root = document.documentElement;
  root.classList.add('ng-locked');
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/[^a-z0-9._-]/g, '');
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  // mật khẩu băm PBKDF2 (ai được mời vào trang cũng đọc được danh sách tài khoản – không lưu mật khẩu gốc)
  async function hash(salt, pw) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, key, 256));
  }
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sess = { get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }, set(v) { try { if (v) localStorage.setItem(KEY, JSON.stringify(v)); else localStorage.removeItem(KEY); } catch (e) { /* trình duyệt chặn lưu */ } } };
  const nowStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const G = { db: null, user: null, owner: false, admin: false, acc: {}, ep: 0, loaded: false, nodb: false, me: null };
  window.ANTAM_NICK = null;

  const gate = document.createElement('div'); gate.id = 'ng-gate'; document.body.appendChild(gate);
  const panel = document.createElement('div'); panel.id = 'ng-panel'; panel.hidden = true; document.body.appendChild(panel);

  function current() {
    const s = sess.get(), a = s && G.acc[s.id];
    return a && a.active !== false && a.pw && s.sig === a.pw.slice(0, 24) && s.exp > Date.now() && (s.iat || 0) >= (G.ep || 0) ? Object.assign({ id: s.id }, a) : null;
  }
  function apply() {
    if (!G.loaded) { drawGate(); return; }
    const me = current();
    if (sess.get() && !me) sess.set(null);
    G.me = me;
    window.ANTAM_NICK = me ? { id: me.id, user: me.user, name: me.name || me.user } : G.owner ? { id: 'owner', user: '', name: 'Chủ trang' } : null;
    const open = !!(me || G.owner);
    root.classList.toggle('ng-locked', !open); gate.hidden = open;
    if (!open) drawGate();
    drawSlot();
    window.dispatchEvent(new Event('antam-nick'));
  }
  function drawGate() {
    const hasAcc = Object.values(G.acc).some(a => a && a.active !== false);
    const state = G.nodb ? 'nodb' : !G.loaded ? 'loading' : hasAcc ? 'form' : 'empty';
    if (gate.dataset.state === state && state === 'form') return; // đang gõ: giữ nguyên ô đăng nhập
    gate.dataset.state = state;
    const body = state === 'nodb' ? '<p>Trang cần mở trên claude.ai khi đã đăng nhập, bằng link chủ trang gửi.</p>'
      : state === 'loading' ? '<p>Đang tải…</p>'
      : state === 'empty' ? '<p>Trang chưa có tài khoản nào. Chủ trang mở trang để tạo tài khoản đăng nhập cho nhân viên.</p>'
      : `<p>Đăng nhập bằng nick và mật khẩu do quản lý cấp.</p>
        <label class="ng-f">Nick<input id="ng-user" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(localStorage.getItem('ng-' + SITE + '-last') || '')}"></label>
        <label class="ng-f">Mật khẩu<input id="ng-pw" type="password" autocomplete="current-password"></label>
        <button class="ng-btn pri" type="submit">Đăng nhập</button><div class="ng-err" id="ng-err" role="alert"></div>
        <p>Quên mật khẩu: nhờ quản lý đặt lại.</p>`;
    gate.innerHTML = `<form class="ng-card" id="ng-form" novalidate><h1>${esc(TITLE)}</h1>${body}</form>`;
    const f = $('#ng-form', gate), u = $('#ng-user', gate), pw = $('#ng-pw', gate);
    if (u) (u.value ? pw : u).focus();
    f.onsubmit = async e => {
      e.preventDefault(); if (!u) return;
      const btn = $('button[type=submit]', f), err = $('#ng-err', f);
      btn.disabled = true; btn.textContent = 'Đang đăng nhập…'; err.textContent = '';
      const hit = Object.entries(G.acc).find(([, a]) => a && a.active !== false && norm(a.user) === norm(u.value));
      const ok = hit && (await hash(hit[1].salt, pw.value)) === hit[1].pw;
      if (!ok) { await new Promise(r => setTimeout(r, 600)); err.textContent = 'Sai nick hoặc mật khẩu.'; btn.disabled = false; btn.textContent = 'Đăng nhập'; pw.select(); return; }
      sess.set({ id: hit[0], sig: hit[1].pw.slice(0, 24), iat: Date.now(), exp: Date.now() + DAYS * 864e5 });
      try { localStorage.setItem('ng-' + SITE + '-last', hit[1].user); } catch (x) { /* trình duyệt chặn lưu */ }
      gate.dataset.state = ''; apply();
    };
  }
  function drawSlot() {
    let host = C.slot && $(C.slot);
    if (!host) { host = $('#ng-fixed') || Object.assign(document.createElement('div'), { id: 'ng-fixed' }); if (!host.parentNode) document.body.appendChild(host); }
    const who = window.ANTAM_NICK;
    host.innerHTML = who ? `<button type="button" class="ng-me" title="Tài khoản đăng nhập">👤 ${esc(who.name)}</button>` : '';
    const b = $('.ng-me', host); if (b) b.onclick = openPanel;
  }

  // ---------- tài khoản của tôi / quản lý tài khoản ----------
  let edit = null;
  function closePanel() { panel.hidden = true; panel.innerHTML = ''; edit = null; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });
  panel.addEventListener('mousedown', e => { if (e.target === panel) closePanel(); });
  function openPanel() { panel.hidden = false; drawPanel(); }
  function drawPanel() {
    if (panel.hidden) return;
    const me = G.me, list = Object.entries(G.acc).filter(([, a]) => a).sort((x, y) => norm(x[1].user) < norm(y[1].user) ? -1 : 1);
    const mine = me ? `<div class="ng-row"><div class="ng-grow"><b>${esc(me.name || me.user)}</b> <span style="color:var(--muted,#5b6862)">· nick ${esc(me.user)}</span></div><button class="ng-btn" type="button" id="ng-out">Đăng xuất</button></div>`
      : `<p>Bạn là <b>chủ trang</b>: vào trang không cần đăng nhập và quản lý được tài khoản.</p>`;
    const mgr = G.admin ? `<hr style="border:0;border-top:1px solid var(--line,#dce2dc);margin:4px 0">
      <div class="ng-row"><h2 class="ng-grow" style="margin:0;font-size:1.1em">Tài khoản đăng nhập</h2><button class="ng-btn sm" type="button" id="ng-add">+ Thêm tài khoản</button><button class="ng-btn sm" type="button" id="ng-epoch" title="Bắt mọi người đăng nhập lại">Đăng xuất tất cả máy</button></div>
      ${edit ? `<form id="ng-edit" class="ng-grid" novalidate style="background:var(--raise,var(--sunk,#f7f9f6));padding:12px;border-radius:10px">
          <label class="ng-f">Nick<input id="ng-e-user" value="${esc(edit.user)}" autocapitalize="none" spellcheck="false" maxlength="40"></label>
          <label class="ng-f">Họ tên<input id="ng-e-name" value="${esc(edit.name)}" maxlength="60"></label>
          <label class="ng-f">${edit.id ? 'Mật khẩu mới (để trống = giữ nguyên)' : 'Mật khẩu (ít nhất 4 ký tự)'}<input id="ng-e-pw" type="text" autocomplete="new-password"></label>
          <label class="ng-chk"><input type="checkbox" id="ng-e-on"${edit.active !== false ? ' checked' : ''}> Đang dùng (bỏ tích = khóa tài khoản)</label>
          <div class="ng-row" style="grid-column:1/-1"><button class="ng-btn pri" type="submit">Lưu tài khoản</button><button class="ng-btn" type="button" id="ng-e-x">Hủy</button><span class="ng-err" id="ng-e-err"></span></div>
        </form>` : ''}
      <div class="ng-tbl"><table><thead><tr><th>Nick</th><th>Họ tên</th><th>Trạng thái</th><th>Sửa lúc</th><th></th></tr></thead><tbody>
        ${list.length ? list.map(([id, a]) => `<tr class="${a.active === false ? 'off' : ''}"><td><b>${esc(a.user)}</b></td><td>${esc(a.name)}</td><td>${a.active === false ? 'Đã khóa' : 'Đang dùng'}</td><td>${esc(a.at || '')}</td><td><button class="ng-btn sm" type="button" data-ng-edit="${esc(id)}">Sửa</button></td></tr>`).join('')
          : '<tr><td colspan="5" style="color:var(--muted,#5b6862)">Chưa có tài khoản nào. Bấm “+ Thêm tài khoản”.</td></tr>'}
      </tbody></table></div>
      <p>Mỗi người một nick. Khóa tài khoản hoặc đổi mật khẩu thì máy đang đăng nhập bằng nick đó bị đăng xuất ngay.</p>` : '';
    panel.innerHTML = `<div class="ng-card" role="dialog" aria-modal="true"><div class="ng-row"><h1 class="ng-grow">Tài khoản · ${esc(TITLE)}</h1><button class="ng-btn sm" type="button" id="ng-x">Đóng</button></div>${mine}${mgr}</div>`;
    $('#ng-x', panel).onclick = closePanel;
    const out = $('#ng-out', panel); if (out) out.onclick = () => { sess.set(null); closePanel(); apply(); };
    const add = $('#ng-add', panel); if (add) add.onclick = () => { edit = { id: '', user: '', name: '', active: true }; drawPanel(); const i = $('#ng-e-user', panel); if (i) i.focus(); };
    panel.querySelectorAll('[data-ng-edit]').forEach(b => b.onclick = () => { const a = G.acc[b.dataset.ngEdit]; edit = Object.assign({ id: b.dataset.ngEdit }, a); drawPanel(); });
    const ep = $('#ng-epoch', panel); if (ep) ep.onclick = async () => {
      if (ep.dataset.sure !== '1') { ep.dataset.sure = '1'; ep.textContent = 'Bấm lần nữa để đăng xuất tất cả'; return; }
      try { await save(null, null, Date.now()); ep.textContent = 'Đã đăng xuất tất cả máy'; } catch (e) { ep.textContent = 'Không lưu được: ' + (e.message || e.code); }
    };
    const f = $('#ng-edit', panel); if (f) {
      $('#ng-e-x', panel).onclick = () => { edit = null; drawPanel(); };
      f.onsubmit = async e => {
        e.preventDefault();
        const err = $('#ng-e-err', panel), user = $('#ng-e-user', panel).value.trim(), name = $('#ng-e-name', panel).value.trim(), pw = $('#ng-e-pw', panel).value, on = $('#ng-e-on', panel).checked;
        const dup = Object.entries(G.acc).some(([id, a]) => a && id !== edit.id && norm(a.user) === norm(user));
        const bad = !norm(user) ? 'Nhập nick (chữ, số, dấu chấm, gạch dưới).' : dup ? 'Nick này đã có người dùng.' : (!edit.id || pw) && pw.length < 4 ? 'Mật khẩu cần ít nhất 4 ký tự.' : '';
        if (bad) { err.textContent = bad; return; }
        const id = edit.id || rid('a'), old = G.acc[id] || {};
        const rec = { user: norm(user), name, active: on, at: nowStr(), salt: old.salt || '', pw: old.pw || '' };
        if (pw) { rec.salt = rid('s'); rec.pw = await hash(rec.salt, pw); }
        try { await save(id, rec); edit = null; drawPanel(); } catch (x) { err.textContent = 'Không lưu được: ' + (x.message || x.code) + (x.code === 'invalid_argument' ? ' (chỉ chủ trang / Editor sửa được tài khoản)' : ''); }
      };
    }
  }
  async function save(id, rec, ep) {
    const ref = G.db.doc('auth/accounts'), s = await ref.get(), cur = s.exists ? s.data() : { a: {} };
    const next = { a: Object.assign({}, cur.a || {}), ep: cur.ep || 0 };
    if (id) next.a[id] = rec;
    if (ep) next.ep = ep;
    await ref.set(next);
  }

  // ---------- khởi động ----------
  (async function boot() {
    drawGate();
    const c = window.claude;
    const [db, user] = c && c.use ? await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]) : [null, null];
    G.db = db; G.user = user;
    if (!db) { G.nodb = true; G.loaded = true; gate.dataset.state = ''; drawGate(); return; }
    if (user) {
      try { G.owner = !!(await user.isOwner()); } catch (e) { /* không rõ */ }
      try { G.admin = !!(await user.canEdit()); } catch (e) { /* không rõ */ }
    }
    db.doc('auth/accounts').onSnapshot(s => {
      const d = s.exists ? s.data() : {};
      G.acc = d.a || {}; G.ep = d.ep || 0; G.loaded = true;
      apply(); drawPanel();
    }, () => { G.loaded = true; apply(); });
  })();
})();
</script>
